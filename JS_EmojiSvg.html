  var QUICK = new RegExp('[\\u2300-\\u23FF\\u2600-\\u27BF\\u2900-\\u297F\\u2B00-\\u2BFF\\u{1F000}-\\u{1FAFF}]', 'u');

  function svgFor(tok) {
    var base = tok.replace(/️$/, '');
    if (DOT[base]) return '<svg class="ait-emo dot" viewBox="0 0 24 24" style="color:' + DOT[base] + '" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>';
    var k = M[tok] || M[base] || 'other';
    return '<svg class="ait-emo" viewBox="0 0 24 24" aria-hidden="true">' + P[k] + '</svg>';
  }
  var STYLE_ID = 'ait-emo-style';
  var CSS = 'svg.ait-emo{display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.2em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}'
    + 'svg.ait-emo.dot{fill:currentColor;stroke:none;width:.8em;height:.8em;vertical-align:-0.05em}'
    + '.ait-spin-inline{display:inline-block;width:1em;height:1em;margin-right:.5em;vertical-align:-0.15em;border:2px solid rgba(128,128,128,.28);border-top-color:#facc15;border-right-color:#f59e0b;border-radius:50%;animation:aitSpinInline .75s linear infinite;flex-shrink:0;box-sizing:border-box}'
    + '@keyframes aitSpinInline{to{transform:rotate(360deg)}}';
  function ensureStyle() {
    try {
      if (document.getElementById(STYLE_ID)) return;
      var st = document.createElement('style');
      st.id = STYLE_ID;
      st.textContent = CSS;
      (document.head || document.documentElement).appendChild(st);
    } catch (e) {}
  }

  // 拿掉 emoji（放不了 SVG 的地方：placeholder、選單選項、alert/confirm 對話框）
  function stripEmoji(s) {
    RE.lastIndex = 0;
    return String(s).replace(RE, '').replace(/[ \t]{2,}/g, ' ').replace(/^[ \t]+|[ \t]+$/g, '');
  }

  // 讀取中文字自動加旋轉動畫：結尾是「…」或「...」、很短、含讀取類字眼，而且旁邊還沒有任何動畫
  var LOAD_END = /(?:…|\.{2,}|⋯)\s*$/;
  var LOAD_KW = /(?:載入|讀取|撈取|同步|查詢|搜尋|處理|儲存|上傳|下載|計算|分析|取得|匯出|匯入|驗證|傳送|寄送|送出|連線|更新|產生|生成|辨識|準備|等待|檢查|掃描|整理|轉換|建立|登入)/;
  function maybeSpin(tn) {
    var s = tn.nodeValue;
    if (!s) return;
    var t = stripEmoji(s).replace(/\s+/g, ' ').trim();
    var exact = /^(?:載入|讀取|上傳|儲存|同步|查詢|搜尋|傳送|計算|分析)中$/.test(t); // 只有「上傳中」這種短字（沒有刪節號）
    if (!exact) {
      if (t.length < 3 || t.length > 40 || !LOAD_END.test(t) || !LOAD_KW.test(t)) return;
      if (t.indexOf('中') < 0 && t.indexOf('正在') < 0 && !/^(?:載入|讀取|撈取|同步|查詢|搜尋|取得|處理|儲存|上傳|下載|計算|分析|匯出|驗證|傳送|準備|檢查)/.test(t)) return;
    }
    var p = tn.parentNode;
    if (!p || SKIP[p.nodeName]) return;
    // 父層只能有這段文字（和 emoji 圖示），旁邊已經有別的元素（例如自己的 spinner）就不加
    for (var c = p.firstChild; c; c = c.nextSibling) {
      if (c === tn) continue;
      if (c.nodeType === 3) { if (c.nodeValue.trim()) return; continue; }
      if (c.nodeType === 1 && c.classList && c.classList.contains('ait-emo')) continue;
      return;
    }
    var cls = function (el) { return (el && typeof el.className === 'string') ? el.className : ''; };
    if (/spin|loader|loading-dots/i.test(cls(p))) return;
    // 同一個小容器裡（兄弟元素）已經有自己的動畫就不重複加；容器是 body 或很大時不檢查，避免被不相干的動畫誤擋
    var up = p.parentNode;
    if (up && up !== document.body && up.children && up.children.length <= 4) {
      for (var k = up.firstElementChild; k; k = k.nextElementSibling) {
        if (k === p) continue;
        if (/spin|loader/i.test(cls(k)) || (k.querySelector && k.querySelector('[class*="spin"],[class*="Spin"],[class*="loader"],.ait-spin-inline'))) return;
      }
    }
    var sp = document.createElement('span');
    sp.className = 'ait-spin-inline';
    sp.setAttribute('aria-hidden', 'true');
    p.insertBefore(sp, tn);
  }

  function convertNode(tn) {
    var s = tn.nodeValue;
    if (!s) return;
    maybeSpin(tn);
    if (!QUICK.test(s)) return;
    RE.lastIndex = 0;
    if (!RE.test(s)) return;
    RE.lastIndex = 0;
    var frag = document.createDocumentFragment(), last = 0, m, changed = false;
    while ((m = RE.exec(s))) {
      var svg = svgFor(m[0]);
      if (!svg) continue;
      if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      var w = document.createElement('span');
      w.innerHTML = svg;
      frag.appendChild(w.firstChild);
      last = m.index + m[0].length;
      changed = true;
    }
    if (!changed) return;
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    tn.parentNode.replaceChild(frag, tn);
  }

  function fixAttrs(root) {
    try {
      var list = [];
      if (root.nodeType === 1) {
        if (root.hasAttribute('placeholder') || root.hasAttribute('title')) list.push(root);
        if (root.querySelectorAll) Array.prototype.push.apply(list, root.querySelectorAll('[placeholder],[title]'));
      }
      list.forEach(function (el) {
        ['placeholder', 'title'].forEach(function (a) {
          var v = el.getAttribute(a);
          if (v && QUICK.test(v)) { var nv = stripEmoji(v); if (nv !== v) el.setAttribute(a, nv); }
        });
      });
      var opts = [];
      if (root.nodeName === 'OPTION') opts.push(root);
      if (root.querySelectorAll) Array.prototype.push.apply(opts, root.querySelectorAll('option'));
      opts.forEach(function (o) {
        if (QUICK.test(o.textContent)) { var nv = stripEmoji(o.textContent); if (nv !== o.textContent) o.textContent = nv; }
        if (o.label && QUICK.test(o.label)) o.label = stripEmoji(o.label);
      });
    } catch (e) {}
  }

  function walk(root) {
    if (!root) return;
    if (root.nodeType === 3) {
      var pn = root.parentNode;
      if (!pn) return;
      if (pn.nodeName === 'OPTION') { if (QUICK.test(root.nodeValue)) root.nodeValue = stripEmoji(root.nodeValue); return; }
      if (!SKIP[pn.nodeName]) convertNode(root);
      return;
    }
    if (root.nodeType !== 1 || root.namespaceURI === 'http://www.w3.org/2000/svg') return;
    fixAttrs(root);
    if (SKIP[root.nodeName]) return;
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentNode;
        if (!p || SKIP[p.nodeName] || (p.closest && p.closest('svg,[contenteditable="true"]'))) return NodeFilter.FILTER_REJECT;
        var v = n.nodeValue;
        return (QUICK.test(v) || LOAD_END.test(v) || (v.length < 8 && /中\s*$/.test(v))) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    var list = [], n;
    while ((n = w.nextNode())) list.push(n);
    list.forEach(convertNode);
  }
  var pending = [], timer = 0;
  function flush() {
    timer = 0;
    var items = pending; pending = [];
    obs.disconnect();
    try { ensureStyle(); items.forEach(walk); } catch (e) {}
    obs.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['placeholder', 'title'] });
  }
  var obs = new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      if (m.type === 'characterData') pending.push(m.target);
      else if (m.type === 'attributes') pending.push(m.target);
      else m.addedNodes.forEach(function (n) { pending.push(n); });
    });
    if (!timer) timer = setTimeout(flush, 30); // 不用 requestAnimationFrame：分頁在背景時它會暫停，圖示與動畫就轉不出來
  });
  function start() {
    try { ensureStyle(); walk(document.body); } catch (e) {}
    obs.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['placeholder', 'title'] });
  }
  // alert / confirm / prompt 放不了圖示，直接拿掉 emoji
  ['alert', 'confirm', 'prompt'].forEach(function (n) {
    var o = window[n];
    if (typeof o !== 'function') return;
    window[n] = function () {
      var a = Array.prototype.slice.call(arguments);
      if (typeof a[0] === 'string') a[0] = stripEmoji(a[0]);
      return o.apply(window, a);
    };
  });
  window.aitEmojiToSvg = function (root) { ensureStyle(); walk(root || document.body); };
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
