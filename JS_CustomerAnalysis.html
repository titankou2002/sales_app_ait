<script>
/**
 * 📊 客戶分析 — 直接移植睡美人戰情室的客戶卡片
 *
 * 資料來自戰情室的 customer-analysis API（見 CustomerAnalysis.js），
 * 呈現邏輯也是照搬戰情室 index.php 的 renderCustomerCard() 及其輔助函式，
 * 欄位、標籤文字、配色規則全部比照，只把桌機的一整排統計改成手機的三欄網格。
 *
 * ⚠️ YoY 配色刻意沿用戰情室的台股慣例：**成長=紅、衰退=綠**，不要「修正」成西方慣例。
 */

var _caCache = {};
var _caLoading = false;

// 客戶分析已從相簿頁拉出來，成為儀表板上的獨立入口（原到貨明細的位置），
// 所以自己維護「目前業務／目前客戶」，不再依賴相簿頁的 state.currentCustomer。
var _caBiz = '';            // 目前選取的業務
var _caBizList = [];        // 業務名單
var _caCustomerList = [];   // 該業務的客戶清單
var _caCustomer = '';       // 目前分析中的客戶
var _caMode = 'list';       // 'list' | 'detail'

/** 對應戰情室 fmt()：未滿五萬顯示一位小數，否則無條件進位 */
function caFmt(n) {
  n = n || 0;
  var wan = n / 10000;
  return (n < 50000 ? wan.toFixed(1) : Math.ceil(wan)) + '萬';
}

function caEsc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

/** 對應戰情室 HEALTH_INFO */
var CA_HEALTH_INFO = {
  dormant:  { label: '半年+未下單', color: '#ef4444' },
  warning:  { label: '90天未下單', color: '#f5a623' },
  decline:  { label: '業績衰退',   color: '#ef4444' },
  growth:   { label: '成長中',     color: '#22c55e' },
  no_sales: { label: '無銷售記錄', color: 'rgba(255,255,255,0.45)' },
  normal:   { label: '正常',       color: 'rgba(255,255,255,0.45)' }
};

/** 對應戰情室 CAT_COLOR */
var CA_CAT_COLOR = {
  '客訴': '#e5484d', '送樣': '#60a5fa', '帳款': '#f5a623', '版面': '#a78bfa',
  '送貨退貨': '#3ecf8e', '案件': '#f97316', '客情': '#c084fc', '其他': 'rgba(255,255,255,0.45)'
};

/** 對應戰情室 CONTRACT_HEALTH_COLOR */
var CA_CONTRACT_COLOR = {
  '嚴重': '#e5484d', '逾期': '#e5484d', '待續約': '#f5a623', '暫停續約': '#f5a623',
  '已續約': '#3ecf8e', '正常': 'rgba(255,255,255,0.45)'
};

var CA_GRADE_COLOR = { '特': '#ff2a85', 'A': '#22c55e', 'B': '#3b82f6', 'C': 'rgba(255,255,255,0.45)' };

/** 對應戰情室 _daysAgo() */
function caDaysAgo(dateStr) {
  if (!dateStr) return null;
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

/** 對應戰情室 _contractStatus()：逾期→逾期XX月；未逾期→X月後到期 */
function caContractStatus(c) {
  if (c.contractExpiry) {
    var d = new Date(c.contractExpiry);
    if (!isNaN(d.getTime())) {
      var months = Math.round((d.getTime() - Date.now()) / (86400000 * 30.44));
      if (months < 0) return '逾期 ' + Math.abs(months) + ' 月';
      return months + ' 月後到期';
    }
  }
  return c.contractHealth || '';
}

// ─────────────────────────────────────────────────────────

function loadCustomerAnalysis(forceRefresh) {
  var container = document.getElementById('ca-body');
  var customerName = _caCustomer;
  if (!container || !customerName) return;

  // 🔒 第二道防線：客戶分享連結絕不能看到毛利、低毛利成交與合約餘額
  if (state.isClientView) {
    container.innerHTML = '';
    return;
  }

  if (!forceRefresh && _caCache[customerName]) {
    caRender(_caCache[customerName]);
    return;
  }
  if (_caLoading) return;
  _caLoading = true;

  container.innerHTML =
    '<div class="ca-root"><div class="ca-empty">' +
      '<div class="ai-query-spinner"></div>' +
      '<div style="margin-top:16px;">正在向戰情室讀取客戶分析…</div>' +
    '</div></div>';

  google.script.run
    .withSuccessHandler(function (res) {
      _caLoading = false;
      if (res && res.success) _caCache[customerName] = res;
      caRender(res);
    })
    .withFailureHandler(function (err) {
      _caLoading = false;
      container.innerHTML =
        '<div class="ca-root"><div class="ca-empty">' +
          '<div class="ca-empty-icon">⚠️</div><div>讀取失敗</div>' +
          '<div style="margin-top:8px;font-size:11.5px;opacity:0.7;">' + caEsc(err) + '</div>' +
        '</div></div>';
    })
    .getCustomerAnalysisSnapshot(customerName, !!forceRefresh);
}

function caRender(res) {
  var container = document.getElementById('ca-body');
  if (!container) return;

  if (!res || !res.success) {
    var hint = '';
    if (res && res.notFound) {
      hint = '<div style="margin-top:10px;font-size:11.5px;opacity:0.6;">以「' + caEsc(res.lookedFor) +
             '」比對不到。<br>戰情室若沒有這家客戶的銷售紀錄就不會有資料。</div>';
    }
    container.innerHTML =
      '<div class="ca-root"><div class="ca-empty">' +
        '<div class="ca-empty-icon">📭</div><div>' + caEsc((res && res.msg) || '沒有取得資料') + '</div>' + hint +
      '</div></div>';
    return;
  }

  try {
    container.innerHTML = '<div class="ca-root">' + caRenderCard(res.customer) +
      // 明細跟戰情室一樣採點擊展開：這三支 API 在戰情室端要逐一掃銷售報表，
      // 一進頁面就全抓會讓第一次顯示等很久。
      // 常銷商品改成預設就顯示（不再藏在「看完整明細」後面）
      // 常銷商品與遺忘產品：手機上下排、電腦左右並排
      '<div class="ca-two-col">' +
        '<div id="ca-topskus">' + '<div class="ca-card">' +
          '<div class="ca-loading-line"><span class="ai-query-spinner"></span><span>讀取常銷商品…</span></div>' +
          '<div class="ca-skel-row ca-skel-head"></div>' +
          '<div class="ca-skel-row w85"></div><div class="ca-skel-row"></div>' +
          '<div class="ca-skel-row w70"></div><div class="ca-skel-row w85"></div>' +
          '<div class="ca-skel-row w55"></div>' +
        '</div>' + '</div>' +
        '<div id="ca-forgotten">' + '<div class="ca-card">' +
          '<div class="ca-loading-line"><span class="ai-query-spinner"></span><span>比對遺忘產品…</span></div>' +
          '<div class="ca-skel-row ca-skel-head"></div>' +
          '<div class="ca-skel-row w85"></div><div class="ca-skel-row"></div>' +
          '<div class="ca-skel-row w70"></div><div class="ca-skel-row w85"></div>' +
          '<div class="ca-skel-row w55"></div>' +
        '</div>' + '</div>' +
      '</div>' +
      '<div id="ca-should-display"></div>' +
      '<div class="ca-toggle" onclick="caLoadDetail()" id="ca-detail-btn">' +
        '<span>📊 看更多明細（版面陳列牆・互動紀錄）</span><span>▾</span>' +
      '</div>' +
      '<div id="ca-detail"></div>' +
      '<div class="ca-source">數字來源：睡美人戰情室（' + caEsc(res.fetchedAt || '') + ' 讀取）<br>' +
      '與戰情室畫面為同一份計算，數字必然一致</div></div>';
    caLoadBreakdown();
    caLoadSample();
    caLoadNotes();
  } catch (e) {
    // 比照戰情室的做法：渲染出錯要看得到堆疊，不要只留白畫面
    container.innerHTML =
      '<div class="ca-root"><div class="ca-empty">' +
        '<div class="ca-empty-icon">⚠️</div>' +
        '<div style="color:#ef4444">渲染失敗：' + caEsc(e.message) + '</div>' +
        '<pre style="font-size:10px;text-align:left;white-space:pre-wrap;max-height:200px;overflow:auto;opacity:0.6;margin-top:10px">' +
        caEsc(e.stack || '') + '</pre>' +
      '</div></div>';
  }
}

/** 移植自戰情室 renderCustomerCard() */
function caRenderCard(c) {
  var info = CA_HEALTH_INFO[c.health] || { label: c.health || '', color: 'rgba(255,255,255,0.45)' };

  // ⚠️ 台股慣例：成長紅、衰退綠（照搬戰情室，勿改）
  var yoyText, yoyColor;
  if (c.yoyPct === null || c.yoyPct === undefined) { yoyText = '—'; yoyColor = 'var(--wr-text2)'; }
  else if (c.yoyPct > 0) { yoyText = '▲ +' + c.yoyPct + '%'; yoyColor = 'var(--wr-red)'; }
  else if (c.yoyPct < 0) { yoyText = '▼ ' + c.yoyPct + '%'; yoyColor = 'var(--wr-green)'; }
  else { yoyText = '0%'; yoyColor = 'var(--wr-text2)'; }

  var gc = CA_GRADE_COLOR[c.grade] || 'rgba(255,255,255,0.45)';
  var gradeHtml = c.grade
    ? '<span style="background:' + gc + '20;color:' + gc + ';border:1px solid ' + gc +
      '40;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:800">' + caEsc(c.grade) + '</span>'
    : '';

  // 日期與「幾天前」分兩行：擠在同一行在窄格子裡會被折成很醜的兩段
  var dv = caDaysAgo(c.lastVisitDate);
  function twoLine(main, sub) {
    return '<span style="font-size:13px">' + main + '</span>' +
           (sub ? '<div class="ca-stat-sub">' + sub + '</div>' : '');
  }
  var lastOrderText = twoLine(c.lastOrderDate || '無',
    (c.daysSinceLastOrder !== null && c.daysSinceLastOrder !== undefined) ? (c.daysSinceLastOrder + ' 天前') : '');
  var visitText = twoLine(c.lastVisitDate || '無', dv !== null ? (dv + ' 天前') : '');
  var cs = caContractStatus(c);
  var csColor = /逾期/.test(cs) ? 'var(--wr-red)' : '#fff';

  function stat(label, val, color) {
    return '<div class="ca-stat"><div class="ca-stat-label">' + label + '</div>' +
           '<div class="ca-stat-value"' + (color ? ' style="color:' + color + '"' : '') + '>' + val + '</div></div>';
  }

  var html = '<div class="ca-card">';

  // 標題列
  html +=
    '<div class="ca-title">' +
      '<span>' + caEsc(c.name) + '</span>' + gradeHtml +
      '<span style="background:' + info.color + '15;border:1px solid ' + info.color + '30;color:' + info.color +
        ';padding:2px 7px;border-radius:6px;font-size:11px;font-weight:800">' + info.label + '</span>' +
    '</div>' +
    (c.area || c.salesRep
      ? '<div style="font-size:11px;color:var(--wr-text2);margin-top:5px">' +
        caEsc(c.area || '') + (c.salesRep ? ' · ' + caEsc(c.salesRep) : '') + '</div>'
      : '');

  // 統計格（欄位與戰情室完全相同）
  // 可下探的統計格：多一行副標，點擊展開明細（明細內容等 breakdown 回來才填）
  function statDrill(label, val, sub, drill, color) {
    return '<div class="ca-stat ca-stat-drill" onclick="caToggleEl(\'' + drill + '\')">' +
      '<div class="ca-stat-label">' + label + ' <span style="opacity:0.55">▾</span></div>' +
      '<div class="ca-stat-value"' + (color ? ' style="color:' + color + '"' : '') + '>' + val + '</div>' +
      '<div class="ca-stat-sub" id="' + drill + '-sub">' + sub + '</div>' +
    '</div>';
  }

  html +=
    '<div class="ca-stats">' +
      statDrill('當月業績', caFmt(c.thisMonthAmount || 0),
                '<span class="ca-dim">去年同期 讀取中…</span>', 'ca-drill-month') +
      statDrill('年度業績', caFmt(c.thisYearAmount),
                '<span class="ca-dim">近三年平均 讀取中…</span>', 'ca-drill-year') +
      stat('YOY', yoyText, yoyColor) +
      stat('最後下單', lastOrderText) +
      stat('最近到訪', visitText) +
      '<div class="ca-stat ca-stat-drill" onclick="caToggleEl(\'ca-drill-wall\'); caLoadWallDrill();">' +
        '<div class="ca-stat-label">版面數 <span style="opacity:0.55">▾</span></div>' +
        '<div class="ca-stat-value">' + ((c.activeDisplayCount || 0) + ' 版') + '</div>' +
        '<div class="ca-stat-sub"><span class="ca-dim">點看哪些版面有賣</span></div>' +
      '</div>' +
      stat('合約狀況', cs || '—', csColor) +
      stat('交易筆數', (c.saleCount || 0) + ' 筆') +
      stat('歷年累計', caFmt(c.totalAmount)) +
      '<div class="ca-stat" id="ca-sample-stat">' +
        '<div class="ca-stat-label">樣品</div>' +
        '<div class="ca-stat-value muted" style="font-size:13px">讀取中…</div>' +
      '</div>' +
    '</div>' +
    // 三個下探區塊（預設收合，內容由各自的載入流程填入）
    '<div id="ca-drill-month" style="display:none" class="ca-drill"></div>' +
    '<div id="ca-drill-year" style="display:none" class="ca-drill"></div>' +
    '<div id="ca-drill-wall" style="display:none" class="ca-drill">' +
      '<div class="ca-dim" style="padding:8px 0">讀取版面銷售…</div></div>';

  // 年度目標達成率
  if (c.target) {
    var achPct = Math.round(c.thisYearAmount / c.target * 100);
    var achColor = achPct >= 100 ? 'var(--wr-green)' : (achPct >= 70 ? 'var(--wr-gold)' : 'var(--wr-red)');
    html +=
      '<div style="margin-top:12px">' +
        '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--wr-text2);margin-bottom:3px">' +
          '<span>年度目標達成率</span>' +
          '<span style="color:' + achColor + ';font-weight:800">' + achPct + '%' +
            (c.contrib ? '　貢獻度 ' + caEsc(c.contrib) : '') + '</span>' +
        '</div>' +
        '<div style="background:var(--wr-border);border-radius:4px;height:6px">' +
          '<div style="width:' + Math.min(achPct, 100) + '%;background:' + achColor + ';border-radius:4px;height:6px"></div>' +
        '</div>' +
        '<div style="font-size:11px;color:var(--wr-text2);margin-top:2px">目標 ' + caFmt(c.target) +
          '　實績 ' + caFmt(c.thisYearAmount) + '</div>' +
      '</div>';
  }

  // 業績表現（今年 vs 去年同期）
  html += '<div class="ca-section-label">業績表現</div>' + caRenderYoyBar(c);

  if (c.avgMarginPct !== null && c.avgMarginPct !== undefined) {
    var mc = c.avgMarginPct < 10 ? 'var(--wr-red)' : (c.avgMarginPct >= 25 ? 'var(--wr-green)' : '#fff');
    html += '<div style="margin-top:6px;font-size:11px;color:var(--wr-text2)">平均毛利率 ' +
            '<span style="color:' + mc + ';font-weight:800">' + c.avgMarginPct + '%</span></div>';
  }

  html += caRenderLowMarginDeals(c.lowMarginDeals);

  // 版面陳列的 SKU 清單已移除（天數欄位資料有問題且資訊量低），
  // 改由「版面數」統計格下探看哪些版面有賣／沒賣，照片牆仍保留在下方展開明細。

  // 互動紀錄
  html += '<div class="ca-section-label">互動紀錄</div>';
  if (c.lastNote) {
    html += '<div style="margin-top:4px;font-size:12px;color:var(--wr-text2)">最新備註（' +
            caEsc(c.lastNoteDate || '') + '）：' + caEsc(c.lastNote) + '</div>';
  }
  html += caRenderCatBreakdown(c.catCounts);

  // 合約狀態
  if (c.contractHealth) {
    html += '<div class="ca-section-label">合約狀態</div>' + caRenderContractBadge(c);
  }

  html += '</div>';
  return html;
}

/** 移植自戰情室 renderYoyBar() */
function caRenderYoyBar(c) {
  var max = Math.max(c.thisYearAmount, c.lastYearAmount, 1);
  var thisPct = Math.round(c.thisYearAmount / max * 100);
  var lastPct = Math.round(c.lastYearAmount / max * 100);
  function row(label, pct, val, color) {
    return '<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--wr-text2)">' +
      '<span style="width:48px;flex-shrink:0">' + label + '</span>' +
      '<div style="flex:1;background:var(--wr-bg2);border-radius:3px;height:8px;overflow:hidden">' +
        '<div style="width:' + pct + '%;height:100%;background:' + color + '"></div></div>' +
      '<span style="width:52px;text-align:right;flex-shrink:0">' + val + '</span>' +
    '</div>';
  }
  return '<div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">' +
    row('今年', thisPct, caFmt(c.thisYearAmount), 'var(--wr-gold)') +
    row('去年同期', lastPct, caFmt(c.lastYearAmount), 'var(--wr-text2)') +
  '</div>';
}

/** 移植自戰情室 renderCatBreakdown() */
function caRenderCatBreakdown(catCounts) {
  if (!catCounts) return '';
  var total = 0;
  Object.keys(catCounts).forEach(function (k) { total += catCounts[k]; });
  if (total === 0) return '';
  var order = ['客訴', '送樣', '帳款', '版面', '送貨退貨', '案件', '客情', '其他'];
  var html = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">';
  order.forEach(function (cat) {
    var n = catCounts[cat] || 0;
    if (n === 0) return;
    var pct = Math.round(n / total * 100);
    // CA_CAT_COLOR 是本檔案內的常數，不會有戰情室那邊 CAT_COLOR 未定義的問題
    var color = CA_CAT_COLOR[cat] || 'rgba(255,255,255,0.45)';
    html += '<span style="font-size:11px;color:' + color + ';border:1px solid ' + color +
            '40;border-radius:5px;padding:2px 6px">' + cat + ' ' + n + ' (' + pct + '%)</span>';
  });
  return html + '</div>';
}

/** 移植自戰情室 renderContractBadge() */
function caRenderContractBadge(c) {
  if (!c.contractHealth) return '';
  var color = CA_CONTRACT_COLOR[c.contractHealth] || 'rgba(255,255,255,0.45)';
  var html = '<div style="margin-top:6px">' +
    '<span style="background:' + color + '15;border:1px solid ' + color + '30;color:' + color +
    ';padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800">合約：' + caEsc(c.contractHealth) + '</span>';
  if (c.contractBalance !== null && c.contractBalance !== undefined) {
    html += ' <span style="font-size:11px;color:' + (c.contractBalance < 0 ? 'var(--wr-red)' : 'var(--wr-text2)') +
            '">餘額 ' + caFmt(c.contractBalance) + '</span>';
  }
  if (c.contractExpiry) {
    html += ' <span style="font-size:11px;color:var(--wr-text2)">到期 ' + caEsc(c.contractExpiry) + '</span>';
  }
  return html + '</div>';
}

/** 移植自戰情室 renderLowMarginDeals() */
function caRenderLowMarginDeals(deals) {
  if (!deals || deals.length === 0) return '';
  var uid = 'ca-lmd-' + Math.random().toString(36).slice(2, 7);
  var html = '<div style="margin-top:8px">' +
    '<button class="ca-btn" style="color:var(--wr-red);border-color:rgba(239,68,68,0.4)" ' +
    'onclick="caToggleEl(\'' + uid + '\')">⚠ 低毛利案件 ' + deals.length + ' 筆 ▾</button>' +
    '<div id="' + uid + '" style="display:none" class="ca-lmd-wrap">' +
    '<table class="ca-lmd-table">' +
    '<tr><th>日期</th><th>SKU</th><th>案名</th><th style="text-align:right">數量</th>' +
    '<th style="text-align:right">金額</th><th style="text-align:right;color:var(--wr-red)">毛利率</th></tr>';
  deals.forEach(function (d) {
    var col = d.marginPct < 0 ? 'var(--wr-red)' : '#f5a623';
    html += '<tr>' +
      '<td style="color:var(--wr-text2);white-space:nowrap">' + caEsc(d.date) + '</td>' +
      '<td style="white-space:nowrap">' + caEsc(d.sku) + '</td>' +
      '<td style="color:var(--wr-text2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        caEsc(d.note || '-') + '</td>' +
      '<td style="text-align:right;color:var(--wr-text2);white-space:nowrap">' + d.qty + '片</td>' +
      '<td style="text-align:right;white-space:nowrap">' + caFmt(d.amount) + '</td>' +
      '<td style="text-align:right;color:' + col + ';font-weight:800;white-space:nowrap">' + d.marginPct + '%</td>' +
    '</tr>';
  });
  return html + '</table></div></div>';
}

function caToggleEl(id) {

var _caDetailLoaded = false;

function caLoadDetail() {
  if (_caDetailLoaded) return;
  var box = document.getElementById('ca-detail');
  var btn = document.getElementById('ca-detail-btn');
  var name = _caCustomer;
  if (!box || !name) return;
  _caDetailLoaded = true;
  if (btn) btn.style.display = 'none';

  box.innerHTML = '<div class="ca-card">' +
    '<div class="ca-loading-line"><span class="ai-query-spinner"></span><span>讀取版面陳列牆與互動紀錄…</span></div>' +
    '<div class="ca-skel-row ca-skel-head"></div>' +
    '<div class="ca-skel-row w85"></div><div class="ca-skel-row"></div>' +
    '<div class="ca-skel-row w70"></div></div>';

  var cust = (_caCache[name] && _caCache[name].customer) || null;
  // breakdown 已在上方「常銷商品」用掉，這裡不再重複顯示銷售品項分析
  var parts = { wall: undefined, timeline: undefined };

  function done() {
    if (parts.wall === undefined || parts.timeline === undefined) return;
    var html = '';
    if (cust) {
      var pie = caRenderCatPie(cust.catCounts);
      if (pie) {
        html += '<div class="ca-card"><div class="ca-card-title">🤝 互動類型分布</div>' + pie + '</div>';
      }
    }
    html += parts.wall;
    if (parts.timeline) {
      html += '<div class="ca-toggle" onclick="caToggleEl(\'ca-timeline\')">' +
              '<span>📜 互動紀錄明細</span><span>▾</span></div>' +
              '<div id="ca-timeline" style="display:none" class="ca-card">' + parts.timeline + '</div>';
    }
    box.innerHTML = html || '<div class="ca-empty" style="padding:24px 0">這家客戶沒有更多明細</div>';
    caPaintWall();
    caRenderShouldDisplay();
  }

  function fetchPart(key, renderer) {
    google.script.run
      .withSuccessHandler(function (res) {
        try { parts[key] = (res && res.success) ? (renderer(res.data) || '') : ''; }
        catch (e) { parts[key] = ''; }
        done();
      })
      .withFailureHandler(function () { parts[key] = ''; done(); })
      .getCustomerAnalysisDetail(name, key);
  }

  // 版面陳列牆改用手機自己的 getCustomerDisplays（與「版面記錄→陳列牆」同一份資料），
  // 不再走戰情室的 customer-warroom，兩邊才不會各畫一套、各自對不上
  google.script.run
    .withSuccessHandler(function (res) {
      try { parts.wall = caRenderWall(res); } catch (e) { parts.wall = ''; }
      done();
    })
    .withFailureHandler(function () { parts.wall = ''; done(); })
    .getCustomerDisplays(_caCustomer);
  fetchPart('timeline', caRenderTimeline);
}

/** 移植自戰情室 renderCatPie()：conic-gradient 圓餅 + 圖例 */
function caRenderCatPie(catCounts) {
  if (!catCounts) return '';
  var order = ['客訴', '送樣', '帳款', '版面', '送貨退貨', '案件', '客情', '其他'];
  var total = 0;
  order.forEach(function (cat) { total += (catCounts[cat] || 0); });
  if (total === 0) return '';
  var gradParts = [], acc = 0, legend = '';
  order.forEach(function (cat) {
    var n = catCounts[cat] || 0;
    if (n === 0) return;
    var color = CA_CAT_COLOR[cat] || 'rgba(255,255,255,0.45)';
    var pct = n / total * 100;
    gradParts.push(color + ' ' + acc + '% ' + (acc + pct) + '%');
    acc += pct;
    legend += '<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--wr-text2)">' +
      '<span style="width:8px;height:8px;border-radius:2px;background:' + color + ';display:inline-block"></span>' +
      cat + ' ' + n + ' (' + Math.round(n / total * 100) + '%)</div>';
  });
  return '<div style="display:flex;align-items:center;gap:14px">' +
    '<div style="width:80px;height:80px;border-radius:50%;background:conic-gradient(' + gradParts.join(',') + ');flex-shrink:0"></div>' +
    '<div style="display:flex;flex-direction:column;gap:3px">' + legend + '</div>' +
  '</div>';
}

/**
 * 版面陳列牆：直接共用「版面記錄」的 renderAlbum() 與 showGroupDetail()。
 * 這裡刻意不自己畫卡片——先前自製一套的結果就是兩邊要各改一次。
 * 做法：把 getCustomerDisplays 的結果灌進 album 用的同一組 state，
 * 再叫 renderAlbum 畫進本頁的容器；卡片點擊仍走原本的 showGroupDetail，
 * 所以詳情彈窗（產品規格／新批藍框／庫存保留…）完全是同一份程式。
 */
function caRenderWall(res) {
  if (!res || !res.success) return '';
  var items = res.active || [];
  if (!items.length) return '';

  // album 那邊的渲染會讀這些 state，先補齊
  state.selectedCustomer = _caCustomer;
  state.currentCustomer = _caCustomer;
  state.currentDisplays = items;
  state.historyDisplays = res.history || [];

  // 容器先放進 DOM，renderAlbum 才找得到
  return '<div class="ca-card" id="ca-wall-box">' +
    '<div class="ca-card-title"><span>🏪 版面陳列牆</span>' +
      '<span class="ca-sub">' + items.length + ' SKU</span></div>' +
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">' +
      '<span style="font-size:11px;color:var(--wr-text2);flex:1">點卡片開啟產品規格（與版面記錄同一個畫面）</span>' +
      '<span id="ca-sort-slot"></span>' +
    '</div>' +
    '<div class="ca-quick-bar">' +
      [['status','缺貨'],['amount','銷量'],['sample','樣品'],['days','天數']].map(function (o) {
        return '<button class="ca-quick-btn' + (o[0] === 'amount' ? ' on' : '') +
          '" data-v="' + o[0] + '" onclick="caQuickSort(\'' + o[0] + '\')">' + o[1] + '</button>';
      }).join('') +

        '<span style="color:#f5a623">■ 遺忘</span>' +
        '<span style="color:#60a5fa">■ 拿樣未成交</span>' +
        '<span style="color:#a855f7">■ 連樣品都沒拿</span>' +

    '<div id="ca-album-grid" class="album-grid"></div>' +

/** DOM 就緒後才能叫 renderAlbum 畫進去 */
function caPaintWall() {
  var grid = document.getElementById('ca-album-grid');
  if (!grid || typeof renderAlbum !== 'function') return;

  // 排序下拉直接複製版面記錄那顆，選項清單維持只有一份，
  // 以後在 index.html 加排序方式，兩邊會自動都有
  var slot = document.getElementById('ca-sort-slot');

    var src = document.getElementById('album-sort-select');

      var clone = src.cloneNode(true);

      clone.style.marginLeft = '0';

      clone.style.maxWidth = '96px';

  if (!state.inventoryData || !state.inventoryData.length) {
    if (typeof loadInventoryData === 'function') {

  renderAlbum(false, 'ca-album-grid', 'ca-sort-select');

  var periods = [

      '<br><span style="font-size:10px;opacity:0.7">' + caFmt(totals[p.key] || 0) + '</span></button>';
  });

  periods.forEach(function (p, i) {
    var sorted = d.skus.slice()
      .filter(function (x) { return (x[p.key] || 0) > 0; })

    html += '<div class="ca-topsku-pane" data-key="' + p.key + '" style="display:' + (i === 2 ? 'block' : 'none') + '">';
    if (!sorted.length) {
      html += '<div class="ca-dim">此時段無銷售記錄</div>';
    } else {

        '<span class="c-amt">金額</span><span class="c-share">佔比</span></div>';

/**
 * 案件正規化：把同一個案子的不同出貨併在一起。
 * 實際資料裡同一個工地會寫成：
 *   寧波東街22之1號 / 寧波東街22之1號-補 / 寧波東街22之1號-工 /
 *   寧波東街22之1號-工補 / 寧波東街22-1號工破損
 * 「補」＝補貨、「工」＝加工廠、「破損」＝破損補件，都是同一案的後續出貨。
 * 規則：全形轉半形、之→-、去空白，再把結尾的 補/工/破損 這類標記剝掉。
 * 刻意只剝「結尾」的標記，避免把地址本身含這些字的案子誤併。
 */
function caCaseKey(note) {
  var t = String(note == null ? '' : note).trim();
  if (!t) return '';
  t = t.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
       .replace(/[\s　]/g, '')
       .replace(/之/g, '-')
       .replace(/[（(].*?[）)]/g, '')
       // 剝掉「工地:」「案名:」這類前綴標籤，否則同一個地址會因為有沒有加標籤而分成兩組
       .replace(/^(工地|案名|案件|地址|工程)[:：]?/, '');
  // 反覆剝除結尾的補/工/破損標記（可能疊在一起，如「-工補」「工破損」）
  var prev;
  do {
    prev = t;
    t = t.replace(/[-－]?(工補|補工|工破損|破損|補貨|補|工)$/, '');
  } while (t !== prev && t.length > 0);
  return t || String(note).trim();
}

/** 案件標記：把「這筆是補貨還是加工廠」抓出來當小標籤 */
function caCaseTag(note) {
  var t = String(note || '');
  if (/破損/.test(t)) return { label: '破損', color: '#ef4444' };
  if (/工補|補工/.test(t)) return { label: '工補', color: '#a78bfa' };
  if (/補/.test(t)) return { label: '補貨', color: '#f5a623' };
  if (/工/.test(t)) return { label: '加工', color: '#60a5fa' };
  return null;
}

function caRenderSkuTx(el, sku) {
  var all = _caTxCache[_caCustomer] || [];
  var rows = all.filter(function (r) { return String(r.sku) === String(sku); });
  if (!rows.length) { el.innerHTML = '<div class="ca-dim" style="padding:6px 0">查無交易明細</div>'; return; }

  // 依案件分組
  var cases = {}, order = [];
  rows.forEach(function (r) {
    var key = caCaseKey(r.note) || '（無案名）';
    if (!cases[key]) {
      cases[key] = { key: key, rows: [], amt: 0, first: '', last: '', sales: {} };
      order.push(key);
    }
    var c = cases[key];
    c.rows.push(r);
    c.amt += (Number(r.amt) || 0);
    var d = String(r.date || '');
    if (d) {
      if (!c.first || d < c.first) c.first = d;
      if (!c.last || d > c.last) c.last = d;
    }
    if (r.sales) c.sales[r.sales] = true;
  });

  var list = order.map(function (k) { return cases[k]; })
                  .sort(function (a, b) { return b.amt - a.amt; });

  var uid = 'cs-' + Math.random().toString(36).slice(2, 6);
  el.innerHTML = list.map(function (c, i) {
    var boxId = uid + '-' + i;
    c.rows.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    var reps = Object.keys(c.sales).join('、');
    var span = (c.first && c.last && c.first !== c.last)
      ? (c.first.slice(0, 7) + ' ~ ' + c.last.slice(0, 7)) : (c.last || '').slice(0, 7);

    return '<div class="ca-case">' +
      '<div class="ca-case-head" onclick="event.stopPropagation(); caToggleEl(\'' + boxId + '\')">' +
        '<span class="cs-name">' + caEsc(c.key) + '</span>' +
        '<span class="cs-meta">' + c.rows.length + ' 筆・' + caEsc(span) + '</span>' +
        '<span class="cs-rep">' + caEsc(reps) + '</span>' +
        '<span class="cs-amt">' + caFmt(c.amt) + '</span>' +
      '</div>' +
      '<div id="' + boxId + '" style="display:none" class="ca-case-body">' +
        c.rows.map(function (r) {
          var tag = caCaseTag(r.note);
          return '<div class="ca-tx-row">' +
            '<span class="t-date">' + caEsc(r.date) + '</span>' +
            '<span class="t-note">' +
              (tag ? '<span class="cs-tag" style="color:' + tag.color + ';border-color:' + tag.color + '55">' + tag.label + '</span>' : '') +
              caEsc(r.note || '—') + '</span>' +
            '<span class="t-amt">' + caFmt(r.amt) + '</span>' +
          '</div>';
        }).join('') +
      '</div></div>';
  }).join('');
}

/** 年度業績下探：近三年（新到舊），數字在前、長條在後 */
function caFillYearDrill() {
  var d = _caBreakdown;
  var sub = document.getElementById('ca-drill-year-sub');
  var box = document.getElementById('ca-drill-year');
  if (!d || !box) return;
  var years = (d.years || []).slice();
  if (!years.length) { if (sub) sub.innerHTML = '<span class="ca-dim">無年度資料</span>'; return; }

  // 三年平均只取「完整年度」（今年尚未過完，計入會被腰斬的數字拉低）
  var full = years.filter(function (y) { return !y.isPartial; });
  var last3 = full.slice(-3);
  var avg3 = last3.length ? Math.round(last3.reduce(function (a, y) { return a + y.amount; }, 0) / last3.length) : null;
  if (sub) {
    sub.innerHTML = avg3 !== null
      ? '近三年平均 <b style="color:var(--wr-gold)">' + caFmt(avg3) + '</b>'
      : '<span class="ca-dim">完整年度不足三年</span>';
  }

  var show = years.slice(-3).reverse();   // 新的在最上面
  var max = Math.max.apply(null, show.map(function (y) { return y.amount; })) || 1;
  var html = '<div style="font-size:11px;color:var(--wr-text2);margin-bottom:8px">近三年（平均以完整年度計算，不含今年）</div>';
  show.forEach(function (y) {
    var pct = Math.round(y.amount / max * 100);
    // 台股慣例：成長紅、衰退綠；百分比一律取整數不留小數
    var yv = (y.yoyPct === null || y.yoyPct === undefined) ? null : Math.round(y.yoyPct);
    var yc = yv === null ? 'var(--wr-text2)' : (yv > 0 ? 'var(--wr-red)' : (yv < 0 ? 'var(--wr-green)' : 'var(--wr-text2)'));
    var yt = yv === null ? '' : ((yv > 0 ? '↑' : (yv < 0 ? '↓' : '')) + Math.abs(yv) + '%');
    html += '<div class="ca-year-row">' +
      '<div class="ca-year-head">' +
        '<span class="y-year">' + y.year + (y.isPartial ? ' <span class="ca-dim" style="font-size:10px">至今</span>' : '') + '</span>' +
        '<span class="y-amt">' + caFmt(y.amount) + '</span>' +
        '<span class="y-yoy" style="color:' + yc + '">' + yt + '</span>' +
      '</div>' +
      '<div class="b-track"><div class="b-fill" style="width:' + pct + '%"></div></div>' +
    '</div>';
  });
  box.innerHTML = html;
}

/** 當月業績下探：近一年逐月 + 去年同期 YoY */
function caFillMonthDrill() {
  var d = _caBreakdown;
  var sub = document.getElementById('ca-drill-month-sub');
  var box = document.getElementById('ca-drill-month');
  if (!d || !box) return;
  var monthly = d.monthly || {};
  var cy = d.curYear, cm = d.curMonth;
  var cur = monthly['y' + cy] || [];
  var prev = monthly['y' + (cy - 1)] || [];

  var lastYearSame = prev[cm - 1] || 0;
  if (sub) {
    sub.innerHTML = '去年同期 <b>' + caFmt(lastYearSame) + '</b>';
  }

  // 近 12 個月（跨年往回推）
  var rows = [];
  for (var i = 11; i >= 0; i--) {
    var m = cm - i;
    var y = cy;
    if (m <= 0) { m += 12; y -= 1; }
    var a = (monthly['y' + y] || [])[m - 1] || 0;
    var b = (monthly['y' + (y - 1)] || [])[m - 1] || 0;
    rows.push({ label: (y % 100) + '/' + m, amt: a, prev: b });
  }
  var max = Math.max.apply(null, rows.map(function (r) { return Math.max(r.amt, r.prev); })) || 1;

  var html = '<div style="font-size:11px;color:var(--wr-text2);margin-bottom:6px">近 12 個月（金色=當月，灰色=去年同月）</div>';
  rows.forEach(function (r) {
    var yoy = r.prev > 0 ? Math.round((r.amt - r.prev) / r.prev * 100) : null;
    var yc = yoy === null ? 'var(--wr-text2)' : (yoy > 0 ? 'var(--wr-red)' : (yoy < 0 ? 'var(--wr-green)' : 'var(--wr-text2)'));
    var yt = yoy === null ? '—' : ((yoy > 0 ? '↑' : '↓') + Math.abs(yoy) + '%');
    html += '<div class="ca-bar-row">' +
      '<span class="b-label">' + r.label + '</span>' +
      '<div class="b-track">' +
        '<div class="b-fill" style="width:' + Math.round(r.amt / max * 100) + '%"></div>' +
        '<div class="b-fill-prev" style="width:' + Math.round(r.prev / max * 100) + '%"></div>' +
      '</div>' +
      '<span class="b-val">' + caFmt(r.amt) + '</span>' +
      '<span class="b-yoy" style="color:' + yc + '">' + yt + '</span>' +
    '</div>';
  });
  box.innerHTML = html;
}

/** 版面數下探：哪些版面有賣、哪些完全沒賣（資料來自 customer-warroom） */
var _caWallLoaded = false;
function caLoadWallDrill() {
  if (_caWallLoaded) return;
  _caWallLoaded = true;
  var box = document.getElementById('ca-drill-wall');
  if (!box) return;
  google.script.run
    .withSuccessHandler(function (res) {

        return;
      }

    })
    .withFailureHandler(function () {
      box.innerHTML = '<div class="ca-dim" style="padding:8px 0">版面資料讀取失敗</div>';
    })
    .getCustomerAnalysisDetail(_caCustomer, 'warroom');
}

function caRenderWallDrill(box, data) {
  var walls = (data.displays || []).slice();
  if (!walls.length) { box.innerHTML = '<div class="ca-dim" style="padding:8px 0">沒有版面資料</div>'; return; }

  var sold = walls.filter(function (w) { return (w.totalAmt || 0) > 0; })
                  .sort(function (a, b) { return (b.totalAmt || 0) - (a.totalAmt || 0); });
  var dead = walls.filter(function (w) { return (w.totalAmt || 0) <= 0; });
  var max = sold.length ? (sold[0].totalAmt || 1) : 1;

  var html = '<div style="font-size:11px;color:var(--wr-text2);margin-bottom:8px">' +
    '共 ' + walls.length + ' 版，近一年有銷售 ' + sold.length + ' 版、掛零 ' + dead.length + ' 版</div>';

  if (sold.length) {
    html += '<div class="ca-sub-title">有銷售（依金額排序）</div>';
    sold.forEach(function (w) {
      html += '<div class="ca-bar-row">' +
        '<span class="b-label" style="width:88px">' + caEsc(w.series || '未命名') + '</span>' +
        '<div class="b-track"><div class="b-fill" style="width:' + Math.round((w.totalAmt || 0) / max * 100) + '%"></div></div>' +
        '<span class="b-val">' + caFmt(w.totalAmt) + '</span>' +
        '<span class="b-yoy" style="color:var(--wr-text2)">' + (w.totalPing || 0).toFixed(1) + '坪</span>' +
      '</div>';
    });
  }

  if (dead.length) {
    html += '<div class="ca-sub-title" style="color:var(--wr-red)">近一年掛零（' + dead.length + ' 版）</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
      dead.map(function (w) {
        return '<span style="font-size:11px;color:var(--wr-text2);border:1px solid var(--wr-border);' +
          'border-radius:6px;padding:3px 8px">' + caEsc(w.series || '未命名') +
          (w.days !== null && w.days !== undefined ? ' <span class="ca-dim">' + w.days + '天</span>' : '') + '</span>';
      }).join('') + '</div>';
  }

  box.innerHTML = html;
}

// ─────────────────────────────────────────────────────────
// 遺忘產品：近兩年賣過、但近半年完全沒賣
// ─────────────────────────────────────────────────────────

var _caForgottenSkuSet = {};   // 供版面陳列牆標記用

/**
 * 判定條件：
 *  - 近半年金額為 0（breakdown 的 half 欄位）
 *  - 但近兩年（今年或去年）有賣過
 *  - 排除睡美人與不續辦（本來就不打算再賣的，不算「被遺忘」）
 */
function caComputeForgotten() {
  var d = _caBreakdown;
  _caForgottenSkuSet = {};
  if (!d || !d.skus) return [];
  var cy = d.curYear;

  var out = d.skus.filter(function (x) {
    if ((x.half || 0) > 0) return false;                 // 近半年還有賣，不算遺忘
    if (x.isSleeper || x.isDiscontinued) return false;   // 睡美人／不續辦排除
    var recent = (x['y' + cy] || 0) + (x['y' + (cy - 1)] || 0);
    return recent > 0;                                   // 近兩年賣過
  }).map(function (x) {
    var days = null;
    if (x.lastDate) {
      var t = new Date(x.lastDate);
      if (!isNaN(t.getTime())) days = Math.floor((Date.now() - t.getTime()) / 86400000);
    }
    return {
      sku: x.sku, series: x.series || '', size: x.size || '',
      lastDate: x.lastDate || '', days: days,
      recentAmt: (x['y' + cy] || 0) + (x['y' + (cy - 1)] || 0)
    };
  });

  // 依編號／系列／尺寸排列
  out.sort(function (a, b) {
    return String(a.sku).localeCompare(String(b.sku)) ||
           String(a.series).localeCompare(String(b.series), 'zh-TW') ||
           String(a.size).localeCompare(String(b.size));
  });

  out.forEach(function (o) { _caForgottenSkuSet[String(o.sku)] = true; });
  return out;
}

var _caForgottenSort = 'days';   // 'days'（前次銷售由久到近） | 'amount' | 'sku'

window.caSetForgottenSort = function (k) {
  _caForgottenSort = k;
  caRenderForgotten();
};

/**
 * 停售天數色帶（依使用者指定）：
 *   120~200 天 黃　｜　200~300 天 紅　｜　300 天以上 紫
 * 120 天以下不上色。原始需求只寫到「120~180 黃、200~300 紅」，
 * 180~200 這段沒指定，這裡併入黃色讓區間連續、不會有沒顏色的空窗。
 */
function caDaysBand(d) {
  if (d === null || d === undefined) return null;
  if (d >= 300) return { color: '#a855f7', label: '300天+' };
  if (d >= 200) return { color: '#ef4444', label: '200-300天' };
  if (d >= 120) return { color: '#f5a623', label: '120-200天' };
  return null;
}

function caRenderForgotten() {
  var box = document.getElementById('ca-forgotten');
  if (!box) return;
  var list = caComputeForgotten();
  if (!list.length) {
    box.innerHTML = '<div class="ca-card"><div class="ca-card-title">💤 遺忘產品</div>' +
      '<div class="ca-dim">沒有符合的品項（近兩年賣過但近半年掛零）</div></div>';
    return;
  }

  if (_caForgottenSort === 'amount') {
    list.sort(function (a, b) { return (b.recentAmt || 0) - (a.recentAmt || 0); });
  } else if (_caForgottenSort === 'days') {
    // 久沒賣的排前面
    list.sort(function (a, b) { return (b.days === null ? -1 : b.days) - (a.days === null ? -1 : a.days); });
  } else {
    list.sort(function (a, b) { return String(a.sku).localeCompare(String(b.sku)); });
  }

  var sorts = [
    { k: 'days', label: '最久沒賣' },
    { k: 'amount', label: '金額' },
    { k: 'sku', label: '編號' }
  ];

  var show = list.slice(0, 10);
  var html = '<div class="ca-card">' +
    '<div class="ca-card-title"><span>💤 遺忘產品 前 10 名</span>' +
    '<span class="ca-sub">共 ' + list.length + ' 項</span></div>' +
    '<div style="font-size:11px;color:var(--wr-text2);margin-bottom:8px">' +
      '近兩年賣過、近半年完全沒賣（已排除睡美人與不續辦）</div>' +
    '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">' +
      '<span class="ca-sort-label">排序</span>' +
      sorts.map(function (o) {
        return '<button class="ca-btn' + (o.k === _caForgottenSort ? ' on' : '') +
          '" onclick="caSetForgottenSort(\'' + o.k + '\')">' + o.label + '</button>';
      }).join('') +
    '</div>' +
    '<div class="ca-sku-head">' +
      '<span class="c-thumb"></span><span class="c-sku">編號</span><span class="c-series">系列</span>' +
      '<span class="c-size">尺寸</span><span class="c-last">前次銷售</span></div>';

  show.forEach(function (o, i) {
    var band = caDaysBand(o.days);
    var rowId = 'ca-ftx-' + i;
    html += '<div class="ca-sku-row" onclick="caToggleSkuTx(\'' + rowId + '\',\'' + caEsc(o.sku) + '\')"' +
        (band ? ' style="border-left:3px solid ' + band.color + ';padding-left:5px"' : '') + '>' +
      '<span class="c-thumb">' + caThumb(o.sku) + '</span>' +
      '<span class="c-sku">' + caEsc(o.sku) + '</span>' +
      '<span class="c-series">' + caEsc(o.series) + '</span>' +
      '<span class="c-size">' + caEsc(o.size || '—') + '</span>' +
      '<span class="c-last">' + caEsc(o.lastDate || '—') +
        (o.days !== null
          ? '<br><span style="font-size:10px;font-weight:800;color:' +
            (band ? band.color : 'rgba(255,255,255,0.35)') + '">' + o.days + ' 天前</span>'
          : '') +
      '</span></div>' +
      '<div class="ca-sku-tx" id="' + rowId + '" style="display:none"></div>';
  });

  if (list.length > 10) {
    html += '<div class="ca-dim" style="padding:6px 0;font-size:11px">（只顯示前 10 項，共 ' + list.length + ' 項）</div>';
  }

  // 色帶說明
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--wr-text2)">' +
    ['#f5a623 120-200天', '#ef4444 200-300天', '#a855f7 300天以上'].map(function (t) {
      var p = t.split(' ');
      return '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' +
        p[0] + ';margin-right:4px"></span>' + p[1] + '</span>';
    }).join('') + '</div>';

  box.innerHTML = html + '</div>';
}

var _dnCache = null;      // 客戶名 → { photoUrl: [紀錄...] }
var _dnCustomer = '';

/** 由 showGroupDetail 呼叫：帶入這個版面的照片連結與系列 */
window.renderDisplayNotes = function (photoUrl, series) {
  var box = document.getElementById('display-note-list');
  var sec = document.getElementById('display-note-section');
  if (!box || !sec) return;

  var cust = state.selectedCustomer || state.currentCustomer || '';
  // 客戶檢視模式不該看到內部訪問紀錄
  if (state.isClientView) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  sec.dataset.photo = photoUrl || '';
  sec.dataset.series = series || '';

  function paint() {
    var all = (_dnCache && _dnCache[photoUrl || '']) || [];
    if (!all.length) {
      box.innerHTML = '<div style="font-size:12px; opacity:0.35; padding:8px 0;">尚無紀錄，按右上角新增</div>';
      return;
    }
    box.innerHTML = all.map(function (n) {
      // 日期與業務放在備註內容前面，同一行流下去，省空間也好掃讀
      return '<div class="dn-row">' +
        '<span class="dn-time">' + caEsc(n.time) + '</span>' +
        (n.sales ? '<span class="dn-sales">' + caEsc(n.sales) + '</span>' : '') +
        '<span class="dn-text">' + caEsc(n.content) + '</span>' +
      '</div>';
    }).join('');

  if (_dnCache && _dnCustomer === cust) { paint(); return; }
  box.innerHTML = '<div class="ait-loading-box" style="padding:10px 0;"><div class="ait-spinner ait-spinner-sm"></div><div style="font-size:12px;">讀取中…</div></div>';
  google.script.run
    .withSuccessHandler(function (res) {
      _dnCustomer = cust;
      _dnCache = (res && res.success) ? (res.byPhoto || {}) : {};
      paint();

    .withFailureHandler(function () {
      box.innerHTML = '<div style="font-size:12px; color:#f87171; padding:8px 0;">讀取失敗</div>';
    })

window.submitDisplayNote = function () {
  var sec = document.getElementById('display-note-section');
  var input = document.getElementById('dn-input');
  var btn = document.getElementById('dn-save');
  if (!sec || !input) return;

  var text = String(input.value || '').trim();
  if (!text) { input.focus(); return; }

  var photo = sec.dataset.photo || '';
  var series = sec.dataset.series || '';
  var cust = state.selectedCustomer || state.currentCustomer || '';

  if (btn) { btn.disabled = true; btn.textContent = '儲存中…'; }

  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) {
        closeDisplayNoteInput();
        if (typeof showToast === 'function') showToast('已記錄');
        _dnCache = null;
        renderDisplayNotes(photo, series);
      } else {
        if (btn) { btn.disabled = false; btn.textContent = '儲存'; }
        if (typeof showToast === 'function') showToast((res && res.msg) || '寫入失敗');
      }
    })
    .withFailureHandler(function (err) {
      if (btn) { btn.disabled = false; btn.textContent = '儲存'; }
      if (typeof showToast === 'function') showToast('寫入失敗：' + err);
    })
    .addDisplayNote(cust, photo, series, state.currentSales || '', text);
};

/**
 * 組出 SKU 狀態表給共用的 renderAlbum 判斷版面狀態。
 * 銷售面來自 breakdown（half=近半年、total=歷年），樣品面來自 getCustomerSampleInfo。
 * 兩邊都齊了才設定，避免 renderAlbum 拿到半套資料標錯。
 */
function caBuildSkuStatus() {
  if (!_caBreakdown || !_caSample) return false;
  var st = {};
  (_caBreakdown.skus || []).forEach(function (x) {
    var k = String(x.sku || '').trim().toUpperCase().replace(/[\s\-]/g, '');
    if (!k) return;
    st[k] = {
      half: x.half || 0, total: x.total || 0,
      sampled: false, displayed: false,
      lastSale: x.lastDate || '', firstSale: x.firstDate || ''
    };
  });
  var bySku = (_caSample && _caSample.bySku) || {};
  Object.keys(bySku).forEach(function (k) {
    var rec = bySku[k];
    if (!st[k]) st[k] = { half: 0, total: 0, lastSale: '', firstSale: '' };
    st[k].sampled = !!rec.sampleDate;
    st[k].displayed = !!rec.displayDate;
    st[k].sampleDate = rec.sampleDate || '';
    st[k].sampleQty = rec.sampleQty || 0;
    st[k].firstSampleDate = rec.firstSampleDate || '';
  });
  window._caSkuStatus = st;
  return true;
}

/**
 * 拿樣轉換天數：對「有拿樣、之後也真的賣出」的品項，算首次拿樣→首次成交的天數。
 * 有了中位數，「該追誰」就從感覺變成數字：超過常態天數還沒成交的才是該追的。
 */
function caSampleConversion() {
  var st = window._caSkuStatus;
  if (!st) return null;
  var gaps = [];
  Object.keys(st).forEach(function (k) {
    var v = st[k];
    if (!v.firstSampleDate || !v.firstSale) return;
    var a = new Date(v.firstSampleDate), b = new Date(v.firstSale);
    if (isNaN(a.getTime()) || isNaN(b.getTime())) return;
    var d = Math.floor((b - a) / 86400000);
    if (d >= 0 && d < 1095) gaps.push(d);   // 超過三年的視為無關聯，不納入
  });
  if (gaps.length < 3) return null;          // 樣本太少不給結論
  gaps.sort(function (x, y) { return x - y; });
  var mid = Math.floor(gaps.length / 2);
  var median = gaps.length % 2 ? gaps[mid] : Math.round((gaps[mid - 1] + gaps[mid]) / 2);

  // 已拿樣但還沒成交、且已超過常態天數的
  var overdue = [];
  Object.keys(st).forEach(function (k) {
    var v = st[k];
    if (!v.sampleDate || v.total > 0) return;
    var d = Math.floor((Date.now() - new Date(v.sampleDate).getTime()) / 86400000);
    if (d > median) overdue.push({ sku: k, days: d, qty: v.sampleQty || 0 });
  });
  overdue.sort(function (a, b) { return b.days - a.days; });
  return { median: median, count: gaps.length, overdue: overdue };
}

/**
 * 「該上版」清單：這家賣得好、但目前沒有掛在任何一面牆上的品項。
 * 前面幾個功能都在看「上了牆卻沒賣」，這個是反過來——現成的上架機會，
 * 比清理呆版面更直接帶生意。
 */
function caRenderShouldDisplay() {
  var box = document.getElementById('ca-should-display');
  if (!box) return;
  if (!_caBreakdown || !state.currentDisplays) { box.innerHTML = ''; return; }

  // 目前掛在牆上的 SKU
  var onWall = {};
  (state.currentDisplays || []).forEach(function (d) {
    var k = String(d.sku || '').trim().toUpperCase().replace(/[\s\-]/g, '');
    if (k) onWall[k] = true;
  });

  var cy = _caBreakdown.curYear;
  var list = (_caBreakdown.skus || []).filter(function (x) {
    var k = String(x.sku || '').trim().toUpperCase().replace(/[\s\-]/g, '');
    if (!k || onWall[k]) return false;
    if (x.isSleeper || x.isDiscontinued) return false;      // 不打算再賣的不建議上架
    var recent = (x['y' + cy] || 0) + (x['y' + (cy - 1)] || 0);
    return recent > 0 && (x.half || 0) > 0;                 // 近兩年有賣、且近半年還在賣
  }).sort(function (a, b) { return (b.half || 0) - (a.half || 0); });

  if (!list.length) {
    box.innerHTML = '<div class="ca-card"><div class="ca-card-title">📌 該上版</div>' +
      '<div class="ca-dim">賣得好的品項都已經在牆上了</div></div>';
    return;
  }

  var show = list.slice(0, 10);
  var conv = caSampleConversion();
  var html = '<div class="ca-card">' +
    '<div class="ca-card-title"><span>📌 該上版</span>' +
    '<span class="ca-sub">共 ' + list.length + ' 項</span></div>' +
    '<div style="font-size:11px;color:var(--wr-text2);margin-bottom:8px">' +
      '近半年還在賣、但目前沒掛在任何一面牆上（已排除睡美人與不續辦）</div>' +
    '<div class="ca-sku-head">' +
      '<span class="c-thumb"></span><span class="c-sku">編號</span><span class="c-series">系列</span>' +
      '<span class="c-size">尺寸</span><span class="c-amt">近半年</span></div>';
  show.forEach(function (x) {
    html += '<div class="ca-sku-row" style="cursor:default">' +
      '<span class="c-thumb">' + caThumb(x.sku) + '</span>' +
      '<span class="c-sku">' + caEsc(x.sku) + '</span>' +
      '<span class="c-series">' + caEsc(x.series || '') + '</span>' +
      '<span class="c-size">' + caEsc(x.size || '—') + '</span>' +
      '<span class="c-amt">' + caFmt(x.half) + '</span>' +
    '</div>';
  });
  if (list.length > 10) {
    html += '<div class="ca-dim" style="padding:6px 0;font-size:11px">（只顯示前 10 項，共 ' + list.length + ' 項）</div>';
  }

  // 拿樣轉換：把「該追誰」變成數字
  if (conv) {
    html += '<div class="ca-conv">' +
      '<div class="ca-conv-head">🎯 拿樣轉換：這家平均 <b>' + conv.median + ' 天</b> 成交' +
        '<span class="ca-dim">（' + conv.count + ' 個成交樣本的中位數）</span></div>';
    if (conv.overdue.length) {
      html += '<div class="ca-conv-sub">已超過常態天數還沒成交，優先追這 ' +
        Math.min(conv.overdue.length, 5) + ' 項：</div>';
      conv.overdue.slice(0, 5).forEach(function (o) {
        html += '<div class="ca-conv-row"><span>' + caEsc(o.sku) + '</span>' +
          (o.qty ? '<span class="ca-dim">拿 ' + o.qty + ' 片</span>' : '<span></span>') +
          '<span style="color:#f5a623;font-weight:800">' + o.days + ' 天</span></div>';
      });
    } else {
      html += '<div class="ca-conv-sub ca-dim">目前沒有超過常態天數還沒成交的品項</div>';
    }
    html += '</div>';
  }

  box.innerHTML = html + '</div>';
}

/**
 * 客戶健康度分級。戰情室原本只有 growth/decline/warning/dormant/normal，
 * 這裡依 YoY 再細分出「嚴重衰退」與「退步請留意」兩級，讓業務一眼看出輕重。
 * 門檻：≤-50% 嚴重衰退｜-50~-30% 衰退｜-30~-10% 退步請留意｜≥+10% 成長中
 * （-30% 這條沿用戰情室 decline 的定義，其餘為新增分級）
 */
var CA_TIER = [
  { key: 'critical', label: '嚴重衰退', color: '#a855f7', order: 0, blink: true },
  { key: 'mid',      label: '中等退步', color: '#f87171', order: 1 },
  { key: 'slip',     label: '退步',     color: '#f5a623', order: 2 },
  { key: 'dormant',  label: '沉睡',     color: '#94a3b8', order: 3 },
  { key: 'normal',   label: '正常',     color: 'rgba(255,255,255,0.45)', order: 4 },
  { key: 'growth',   label: '成長',     color: '#22c55e', order: 5 },
  { key: 'surge',    label: '大幅成長', color: '#facc15', order: 6 },
  { key: 'unknown',  label: '無資料',   color: 'rgba(255,255,255,0.25)', order: 7 }
];
function caTierByKey(k) {
  for (var i = 0; i < CA_TIER.length; i++) if (CA_TIER[i].key === k) return CA_TIER[i];
  return CA_TIER[7];
}
/**
 * 分級門檻：≤-50% 嚴重衰退｜-50~-30% 中等退步｜-30~-10% 退步
 *          -10~+10% 正常｜+10~+50% 成長｜≥+50% 大幅成長
 * -30% 這條沿用戰情室 decline 的既有定義，其餘為本專案新增。
 */
function caTierOf(a) {
  if (!a) return caTierByKey('unknown');
  if (a.health === 'dormant' || a.health === 'no_sales') return caTierByKey('dormant');
  var y = a.yoyPct;
  if (y === null || y === undefined) return caTierByKey('normal');
  if (y <= -50) return caTierByKey('critical');
  if (y <= -30) return caTierByKey('mid');
  if (y < -10)  return caTierByKey('slip');
  if (y >= 50)  return caTierByKey('surge');
  if (y >= 10)  return caTierByKey('growth');
  return caTierByKey('normal');
}

var _caListSort = 'tier';   // 'tier' | 'grade' | 'amount' | 'name'
var _caTierFilter = '';     // '' = 全部；否則為 CA_TIER 的 key
var _caGradeOff = {};       // 被關掉的分級，例如 { C: true }；空物件 = 全看

window.caToggleGrade = function (g) {
  if (_caGradeOff[g]) delete _caGradeOff[g];
  else _caGradeOff[g] = true;
  caRenderCustomerList();
};

window.caSetTierFilter = function (k) {
  _caTierFilter = (_caTierFilter === k) ? '' : k;
  caRenderCustomerList();
};

window.caSetListSort = function (mode) {
  _caListSort = mode;
  caRenderCustomerList();
};

function caRenderCustomerList() {
  var body = document.getElementById('ca-body');
  if (!body) return;
  var input = document.getElementById('ca-customer-search');
  var kw = input ? String(input.value || '').trim() : '';

  var list = _caCustomerList.filter(function (c) { return c && c.name && !c.hidden; });
  if (kw) list = list.filter(function (c) { return c.name.indexOf(kw) !== -1; });

  if (!list.length) {
    body.innerHTML = '<div class="ca-empty">' + (kw ? '找不到符合的客戶' : '這位業務底下沒有客戶') + '</div>';
    return;
  }

  // 伺服器端已經把健康度 join 好（正規化在那邊做），這裡直接用
  list = list.map(function (c) {
    var a = (c.health || c.yoyPct !== null || c.thisYearAmount !== null) ? c : null;
    return { raw: c, a: a, tier: caTierOf(a) };
  });

  // ⚠️ 兩排籤的筆數都必須用「套用該篩選之前」的清單來算，否則籤會自己消失：
  //   - 分級籤用全量算，不然關掉 C 之後 C 的筆數變 0、籤被過濾掉就再也點不回來
  //   - 狀態籤用「已套分級、未套狀態」的清單算，不然選了某個狀態後其他狀態全消失
  var gradeAll = list.slice();

  var offKeys = Object.keys(_caGradeOff);
  if (offKeys.length) {
    var keptG = list.filter(function (o) { return !_caGradeOff[o.raw.level || '未分級']; });
    if (keptG.length) list = keptG;
  }

  var tierPool = list.slice();

  if (_caTierFilter) {
    var kept = list.filter(function (o) { return o.tier.key === _caTierFilter; });
    if (kept.length) list = kept;   // 篩到空的話不要讓畫面整個空掉
  }

  var gradeOrder = { '特': 0, 'A': 1, 'B': 2, 'C': 3 };
  if (_caListSort === 'tier') {
    list.sort(function (x, y) {
      return (x.tier.order - y.tier.order) ||
             ((x.a && x.a.yoyPct !== null ? x.a.yoyPct : 999) - (y.a && y.a.yoyPct !== null ? y.a.yoyPct : 999));
    });
  } else if (_caListSort === 'grade') {
    list.sort(function (x, y) {
      var gx = gradeOrder[x.raw.level] !== undefined ? gradeOrder[x.raw.level] : 9;
      var gy = gradeOrder[y.raw.level] !== undefined ? gradeOrder[y.raw.level] : 9;
      return (gx - gy) || (x.tier.order - y.tier.order);
    });
  } else if (_caListSort === 'amount') {
    list.sort(function (x, y) {
      return ((y.a ? y.a.thisYearAmount : 0) || 0) - ((x.a ? x.a.thisYearAmount : 0) || 0);
    });
  } else {
    list.sort(function (x, y) { return x.raw.name.localeCompare(y.raw.name, 'zh-TW'); });
  }

  var sorts = [
    { k: 'tier', label: '狀態' }, { k: 'grade', label: '分級' },
    { k: 'amount', label: '年度業績' }, { k: 'name', label: '名稱' }
  ];
  var html = '<div class="ca-sort-bar"><span class="ca-sort-label">排序</span>' +
    sorts.map(function (o) {
      return '<button class="ca-btn' + (o.k === _caListSort ? ' on' : '') +
        '" onclick="caSetListSort(\'' + o.k + '\')">' + o.label + '</button>';
    }).join('') + '</div>';

  // 狀態篩選：點一下只看該狀態，再點一下取消
  var counts = {};
  tierPool.forEach(function (o) { counts[o.tier.key] = (counts[o.tier.key] || 0) + 1; });
  html += '<div class="ca-sort-bar" style="padding-top:0"><span class="ca-sort-label">狀態</span>' +
    CA_TIER.filter(function (t) { return counts[t.key]; }).map(function (t) {
      var on = _caTierFilter === t.key;
      return '<button class="ca-tier-chip' + (on ? ' on' : '') + (t.blink ? ' blink' : '') +
        '" style="color:' + t.color + ';border-color:' + t.color + '55' +
        (on ? ';background:' + t.color + '25' : '') + '" ' +
        'onclick="caSetTierFilter(\'' + t.key + '\')">' + t.label + ' ' + counts[t.key] + '</button>';
    }).join('') + '</div>';

  // 分級篩選：多選，點掉不想看的（例如 C 級本來業績就低，看了礙眼）
  var gradeColorMap = { '特': '#ff2a85', 'A': '#22c55e', 'B': '#3b82f6', 'C': 'rgba(255,255,255,0.5)', '未分級': 'rgba(255,255,255,0.3)' };
  var gCounts = {};
  gradeAll.forEach(function (o) {
    var g = o.raw.level || '未分級';
    gCounts[g] = (gCounts[g] || 0) + 1;
  });
  var gradeKeys = ['特', 'A', 'B', 'C', '未分級'].filter(function (g) { return gCounts[g]; });
  html += '<div class="ca-sort-bar" style="padding-top:0"><span class="ca-sort-label">分級</span>' +
    gradeKeys.map(function (g) {
      var on = !_caGradeOff[g];
      var col = gradeColorMap[g] || 'rgba(255,255,255,0.4)';
      return '<button class="ca-tier-chip' + (on ? ' on' : ' off') +
        '" style="color:' + (on ? col : 'rgba(255,255,255,0.25)') +
        ';border-color:' + (on ? col + '55' : 'rgba(255,255,255,0.12)') +
        (on ? ';background:' + col + '20' : '') + '" ' +
        'onclick="caToggleGrade(\'' + g + '\')">' + g + ' ' + gCounts[g] + '</button>';
    }).join('') + '</div>';

  var gradeColor = { '特': '#ff2a85', 'A': '#22c55e', 'B': '#3b82f6', 'C': 'rgba(255,255,255,0.45)' };
  html += '<div class="ca-cust-list">' + list.map(function (o) {
    var c = o.raw, a = o.a, t = o.tier;
    var gc = gradeColor[c.level] || 'rgba(255,255,255,0.35)';
    var gradeBadge = c.level
      ? '<span style="background:' + gc + '20;color:' + gc + ';border:1px solid ' + gc +
        '40;border-radius:4px;padding:1px 6px;font-size:10.5px;font-weight:800;flex:none">' + caEsc(c.level) + '</span>'
      : '';
    var tierBadge = '<span class="ca-tier-badge' + (t.blink ? ' blink' : '') +
      '" style="background:' + t.color + '15;color:' + t.color + ';border:1px solid ' + t.color +
      '35">' + t.label + '</span>';
    var amtText = a ? (caFmt(a.thisYearAmount) +
      (a.yoyPct !== null && a.yoyPct !== undefined
        ? ' <span style="color:' + (a.yoyPct > 0 ? 'var(--wr-red)' : (a.yoyPct < 0 ? 'var(--wr-green)' : 'var(--wr-text2)')) + '">' +
          (a.yoyPct > 0 ? '▲+' : (a.yoyPct < 0 ? '▼' : '')) + a.yoyPct + '%</span>'
        : '')) : '<span class="ca-dim">無銷售資料</span>';

    return '<div class="ca-cust-item" onclick="caSelectCustomer(this.getAttribute(\'data-name\'))" data-name="' +
      caEsc(c.name) + '">' +
      '<div style="min-width:0;flex:1">' +
        '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + caEsc(c.name) + '</span>' +
          gradeBadge + tierBadge +
        '</div>' +
        '<div style="font-size:11.5px;font-weight:600;color:var(--wr-text2);margin-top:4px">' + amtText + '</div>' +
      '</div></div>';
  }).join('') + '</div>';

  body.innerHTML = html;
}

window.caSelectCustomer = function (name) {
  if (!name) return;
  _caCustomer = name;
  _caMode = 'detail';
  _caDetailLoaded = false;
  _caBreakdown = null;
  _caWallLoaded = false;

  var title = document.getElementById('ca-nav-title');
  var chips = document.getElementById('ca-biz-chips');
  var search = document.getElementById('ca-search-wrap');
  var refresh = document.getElementById('ca-refresh-btn');
  if (title) title.textContent = name;
  if (chips) chips.style.display = 'none';
  if (search) search.style.display = 'none';
  if (refresh) refresh.style.visibility = 'visible';

  loadCustomerAnalysis();
};

function caShowListMode() {
  _caMode = 'list';
  var title = document.getElementById('ca-nav-title');
  var chips = document.getElementById('ca-biz-chips');
  var search = document.getElementById('ca-search-wrap');
  var refresh = document.getElementById('ca-refresh-btn');
  if (title) title.textContent = _caBiz ? ('客戶分析・' + _caBiz) : '客戶分析';
  if (chips) chips.style.display = 'flex';
  if (search) search.style.display = _caBiz ? 'block' : 'none';
  if (refresh) refresh.style.visibility = 'hidden';
}

window.caGoBack = function () {
  if (_caReturnPage) {
    var back = _caReturnPage;
    _caReturnPage = '';
    caShowListMode();
    showPage(back);
    return;
  }
  if (_caMode === 'detail') {
    caShowListMode();
    caRenderCustomerList();
  } else {
    showPage('page-dashboard');
  }
};

window.caRefreshCurrent = function () {
  if (_caMode === 'detail' && _caCustomer) {
    _caDetailLoaded = false;
    loadCustomerAnalysis(true);
  }
};

/** 換客戶時清掉快取 */
function caResetCache() {
  _caCache = {}; _caDetailLoaded = false;
  _caBreakdown = null; _caWallLoaded = false; _caTxCache = {};
}
</script>
