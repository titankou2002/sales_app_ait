  <script>
    var allProducts = [];
    var currentGalleryData = { scenes: [], singles: [], molds: [], intros: [], catalogs: [] };
    var currentSku = '';
    var currentGalleryList = []; // 當前正在瀏覽的圖片清單 (用於左右切換)
    var currentIndex = 0;
    
    window.onload = function() {
      initParticles();
      loadData();
      
      // 🚀 Splash 動畫邏輯
      setTimeout(() => {
        const bar = document.getElementById('staff-progress-bar');
        if (bar) bar.style.width = '100%';
      }, 100);

      setTimeout(() => {
        const splash = document.getElementById('staff-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.style.display = 'none', 1000);
        }
      }, 2500);
    };

    // 🏎️ 粒子引擎 (複製主畫面邏輯)
    function initParticles() {
      const canvas = document.getElementById('staffCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();

      for(let i=0; i<100; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2 + 0.5,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          o: Math.random()
        });
      }

      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = 'rgba(194, 157, 102, 0.5)'; // 金色粒子
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if(p.x<0) p.x=canvas.width; if(p.x>canvas.width) p.x=0;
          if(p.y<0) p.y=canvas.height; if(p.y>canvas.height) p.y=0;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    }

    function loadData() {
      google.script.run.withSuccessHandler(function(res) {
        if (res.success) {
          allProducts = res.data;
          searchProducts();
        }
      }).getAggregatedInventory();
    }

    let timer = null;
    function debounceSearch() {
      if (timer) clearTimeout(timer);
      timer = setTimeout(searchProducts, 200);
    }

    function searchProducts() {
      const q = document.getElementById('staff-search-input').value.trim().toUpperCase();
      const sz = document.getElementById('staff-filter-size').value.trim().toUpperCase();
      const sort = document.getElementById('staff-sort').value;
      const container = document.getElementById('staff-result-list');

      if (!q && !sz) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px 20px; color: rgba(255,255,255,0.2); font-size: 14px;">請輸入產品編號或尺寸進行查詢</div>';
        return;
      }

      let filtered = allProducts.filter(item => {
        if (!item) return false;
        const matchText = !q || (item.sku.toUpperCase().includes(q) || item.sCn.toUpperCase().includes(q));
        const matchSize = !sz || (item.size || "").toUpperCase().replace(/[xX*]/g, '').includes(sz.replace(/[xX*]/g, ''));
        return matchText && matchSize;
      });

      if (sort === 'stock-desc') filtered.sort((a,b) => (b.qty||0)-(a.qty||0));
      else if (sort === 'physical-desc') filtered.sort((a,b) => (b.physical||0)-(a.physical||0));
      else if (sort === 'sku-asc') filtered.sort((a,b) => a.sku.localeCompare(b.sku));

      let html = '';
      filtered.slice(0, 100).forEach(item => {
        const availQty = Math.floor(item.qty || 0);
        const physical = Math.floor(item.physical || 0);
        const reserved = Math.floor(item.reserved || 0);
        const pack = item.pack || '-';
        const weight = Math.ceil(parseFloat(item.weight) || 0);

        let originFlag = '';
        if (item.origin === '西班牙') originFlag = '西班牙';
        else if (item.origin === '義大利') originFlag = '義大利';
        else if (item.origin) originFlag = item.origin;

        html += `
          <div style="background: #111; border: 1px solid #222; border-radius: 20px; padding: 18px; position: relative; margin-bottom: 5px;">
            <div style="display: flex; gap: 20px;">
              <div style="width: 100px; flex-shrink: 0;">
                <div style="border-radius: 12px; overflow: hidden; background: #000; cursor: pointer; position: relative;" onclick="showFullImg(-1, '${item.img}', '${item.sku}')">
                  <img src="${item.img || ''}" style="width: 100%; height: auto; display: block;">
                  ${reserved > 0 ? `
                    <div style="position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 3px 8px; border-radius: 20px; display: flex; align-items: center; gap: 5px; border: 1px solid rgba(255,255,255,0.15);">
                      <span style="font-size: 9px; color: #fff; font-weight: 700; display: flex; align-items: center; gap: 3px;">
                        <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        保留
                      </span>
                      <span style="background: var(--staff-gold); color: #000; width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 900;">${item.reserveCount || 1}</span>
                    </div>
                  ` : ''}
                </div>
                <div style="font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 10px; line-height: 1.6;">
                  <div style="color: rgba(34,197,94,0.6);">${pack}片 | ${weight}kg</div>
                </div>
              </div>
              <div style="flex: 1; min-width: 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                  <div style="font-size: 11px; font-weight: 700; color: #777;">
                    <span style="color: var(--staff-gold); margin-right: 6px;">${item.sCn}</span>
                    <span>${item.size}</span>
                  </div>
                  <div style="background: rgba(194,157,102,0.1); color: var(--staff-gold); font-size: 9px; padding: 3px 8px; border-radius: 20px; border: 1px solid rgba(194,157,102,0.3); cursor: pointer;" onclick="openGallery('${item.sku}')">
                    實景圖
                  </div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                   <div style="color: #fff; font-size: 19px; font-weight: 900; letter-spacing: 1px;">${item.sku}</div>
                   <div style="font-size: 10px; color: rgba(255,255,255,0.4);">${originFlag}</div>
                </div>
                <div style="background: rgba(34,197,94,0.1); border-radius: 10px; padding: 8px 12px; border: 1px solid rgba(34,197,94,0.2); margin-bottom: 8px;">
                   <div style="color: #22c55e; font-size: 16px; font-weight: 800;">可用 ${availQty} 片 | ${item.pyeong} 坪</div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; color: rgba(255,255,255,0.3); font-size: 11px;">
                   <div style="display: flex; gap: 12px;">
                      <span>庫存:<b style="color:#bbb;">${physical}片</b></span>
                      <span>保留:<b style="color:#bbb;">${reserved}片</b></span>
                   </div>
                   <div style="color: var(--staff-gold); cursor: pointer; text-decoration: underline;" onclick="showBatches('${item.sku}')">
                      批號(${(item.batches && item.batches.length) || 0})
                   </div>
                </div>
                ${item.hasArrival ? `
                <div style="margin-top: 8px; background: rgba(0,122,255,0.12); border: 1px solid rgba(0,122,255,0.35); border-radius: 8px; padding: 6px 10px; font-size: 11px; font-weight: 800; color: #007aff;">
                   🔵 預計 ${item.eta || '近期'} 到貨${item.etaQty > 0 ? ' ' + Math.floor(item.etaQty) + ' 片' : ''}
                </div>` : ''}
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function showFullImg(idx, directUrl = null, sku = null) {
      var imgEl = document.getElementById('staff-full-img');
      var videoEl = document.getElementById('staff-full-video');
      
      if (directUrl) {
         currentIndex = -1; 
         imgEl.src = directUrl;
         imgEl.style.display = 'block';
         videoEl.style.display = 'none';
         videoEl.src = '';
         currentSku = sku;
      } else {
         currentIndex = idx;
         var item = currentGalleryList[idx];
         if (item.isVideo) {
           imgEl.style.display = 'none';
           videoEl.style.display = 'block';
           videoEl.src = item.previewUrl;
         } else {
           imgEl.style.display = 'block';
           imgEl.src = item.url;
           videoEl.style.display = 'none';
           videoEl.src = '';
         }
      }
      updateWatermark();
      document.getElementById('staff-image-modal').style.display = 'flex';
    }

    function closeFullImg() { document.getElementById('staff-image-modal').style.display = 'none'; }

    function navGallery(dir) {
      if (currentIndex === -1 || currentGalleryList.length === 0) return;
      currentIndex += dir;
      if (currentIndex < 0) currentIndex = currentGalleryList.length - 1;
      if (currentIndex >= currentGalleryList.length) currentIndex = 0;
      
      var item = currentGalleryList[currentIndex];
      var imgEl = document.getElementById('staff-full-img');
      var videoEl = document.getElementById('staff-full-video');
      
      imgEl.style.transform = 'scale(0.9)';
      setTimeout(function() {
        if (item.isVideo) {
          imgEl.style.display = 'none';
          videoEl.style.display = 'block';
          videoEl.src = item.previewUrl;
        } else {
          imgEl.style.display = 'block';
          imgEl.src = item.url;
          videoEl.style.display = 'none';
          videoEl.src = '';
        }
        imgEl.style.transform = 'scale(1)';
        updateWatermark();
      }, 100);
    }

    function updateWatermark() {
      const showSku = document.getElementById('check-sku').checked;
      const showStock = document.getElementById('check-stock').checked;
      const showPyeong = document.getElementById('check-pyeong').checked;
      const layer = document.getElementById('watermark-layer');
      if (!showSku && !showStock && !showPyeong) { layer.style.display = 'none'; return; }
      const item = allProducts.find(p => p.sku === currentSku);
      if (!item) return;
      document.getElementById('wm-sku').innerText = showSku ? item.sku : '';
      let details = [];
      if (showStock) details.push(Math.floor(item.qty) + ' 片');
      if (showPyeong) details.push(item.pyeong + ' 坪');
      document.getElementById('wm-data').innerText = details.join(' | ');
      layer.style.display = 'block';
    }

    function downloadCurrentImg() {
      const url = document.getElementById('staff-full-img').src;
      const a = document.createElement('a');
      a.href = url.replace('=w1200', '=w0');
      a.download = currentSku + '.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function shareToLine() {
      const url = document.getElementById('staff-full-img').src;
      const item = allProducts.find(p => p.sku === currentSku);
      const text = currentSku + "\n可用庫存：" + Math.floor(item.qty) + "片 | " + item.pyeong + "坪\n圖片連結：" + url.replace('=w1200', '=w0');
      window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text), '_blank');
    }

    function batchAction(type) {
      const selected = Array.from(document.querySelectorAll('.gallery-check:checked')).map(function(cb) { return cb.getAttribute('data-url'); });
      
      if (selected.length === 0) {
        alert('請先勾選想要操作的照片');
        return;
      }

      if (type === 'preview') {
        var list = document.getElementById('staff-album-list');
        var html = '';
        selected.forEach(function(url) {
          html += '<div style="background:#111; border-radius:12px; overflow:hidden; border:1px solid #222;">';
          html += '<img src="' + url.replace('=w1200', '=w0') + '" style="width:100%; height:auto; display:block;">';
          html += '</div>';
        });
        list.innerHTML = html;
        document.getElementById('staff-album-modal').style.display = 'flex';
      } else if (type === 'share') {
        const item = allProducts.find(p => p.sku === currentSku);
        let text = "【" + currentSku + "】精選影像分享\n可用庫存：" + Math.floor(item.qty) + "片 | " + item.pyeong + "坪\n\n";
        selected.forEach((url, i) => { text += "圖片 " + (i+1) + "：" + url.replace('=w1200', '=w0') + "\n"; });
        window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text), '_blank');
      }
    }

    function toggleSelectAll() {
      const cbs = document.querySelectorAll('.gallery-check');
      const allChecked = Array.from(cbs).every(cb => cb.checked);
      cbs.forEach(cb => cb.checked = !allChecked);
    }

    function showBatches(sku) {
      const item = allProducts.find(p => p.sku === sku);
      if (!item || !item.batches) return;
      document.getElementById('staff-batch-title').innerText = sku + " 批號明細";
      let html = '';
      item.batches.forEach(b => {
        html += '<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #222;"><div style="color:#fff; font-weight:700;">' + (b.batch || '無批號') + '</div><div style="color:var(--staff-gold); font-weight:800;">' + b.qty + ' 片 | ' + b.pyeong + ' 坪</div></div>';
      });
      document.getElementById('staff-batch-list').innerHTML = html;
      document.getElementById('staff-batch-modal').style.display = 'flex';
    }

    function openGallery(sku) {
      const item = allProducts.find(p => p.sku === sku);
      if (!item) return;
      currentSku = sku;
      const grid = document.getElementById('staff-gallery-grid');
      const modal = document.getElementById('staff-gallery-modal');
      if (item.folderId) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--staff-gold); font-size:16px;">正在載入雲端影像...</div>';
        modal.style.display = 'flex';
        google.script.run.withSuccessHandler(function(res) {
          if (res) { currentGalleryData = res; switchGalleryTab('scene'); }
          else { grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:#666;">無影像</div>'; }
        }).getFolderImages(item.folderId);
      } else { alert('無雲端資料夾'); }
    }

    function switchGalleryTab(type) {
      ['scene', 'single', 'mold', 'intro'].forEach(t => {
        const el = document.getElementById('tab-' + t);
        el.style.background = (t === type) ? '#222' : '#111';
        el.style.color = (t === type) ? '#fff' : 'rgba(255,255,255,0.4)';
      });
      renderGallery(type);
    }

    function renderGallery(activeType = 'scene') {
      const grid = document.getElementById('staff-gallery-grid');
      const title = document.getElementById('staff-gallery-title');
      let label = '實景展示';
      let source = [];
      if (activeType === 'scene') { label = '實景展示'; source = currentGalleryData.scenes; }
      else if (activeType === 'single') { label = '單片圖庫'; source = currentGalleryData.singles; }
      else if (activeType === 'mold') { label = '模面圖庫'; source = currentGalleryData.molds; }
      else if (activeType === 'intro') { label = '系列介紹'; source = currentGalleryData.intros; }
      title.innerText = currentSku + " " + label;
      let html = '';
      if (activeType === 'intro' && currentGalleryData.catalogs.length > 0) {
        currentGalleryData.catalogs.forEach(cat => {
          html += '<div style="grid-column:1/-1; padding:15px;"><div style="background:var(--staff-gold); color:#000; padding:15px; border-radius:12px; text-align:center; font-weight:900; cursor:pointer;" onclick="window.open(\'' + cat.url + '\', \'_blank\')">開啟電子目錄 (PDF)</div></div>';
        });
      }
      const thisSkuFiles = source.filter(f => f.name.includes(currentSku));
      const otherFiles = source.filter(f => !f.name.includes(currentSku));
      currentGalleryList = [...thisSkuFiles, ...otherFiles];
      if (thisSkuFiles.length > 0) {
        html += '<div style="grid-column:1/-1; padding:15px 10px 10px; color:var(--staff-gold); font-size:12px; font-weight:800;">本編號專屬照片</div>';
        thisSkuFiles.forEach(function(f, idx) {
          html += '<div style="aspect-ratio:1/1; overflow:hidden; background:#111; position:relative;">';
          html += '<input type="checkbox" class="gallery-check" data-url="' + f.url + '" onclick="event.stopPropagation()" style="position:absolute; top:8px; right:8px; z-index:10; width:22px; height:22px; border:2px solid #fff;">';
          if (f.isVideo) {
            html += '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:30px; pointer-events:none; z-index:5; background:rgba(0,0,0,0.2);">▶</div>';
          }
          html += '<img src="' + f.url + '" style="width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;" onclick="showFullImg(' + idx + ')">';
          html += '</div>';
        });
      }
      if (otherFiles.length > 0) {
        html += '<div style="grid-column:1/-1; padding:25px 10px 10px; color:rgba(255,255,255,0.4); font-size:12px; font-weight:800; border-top:1px solid #111; margin-top:10px;">全系列參考照</div>';
        otherFiles.forEach(function(f, idx) {
          var globalIdx = thisSkuFiles.length + idx;
          html += '<div style="aspect-ratio:1/1; overflow:hidden; background:#111; opacity:0.7; position:relative;">';
          html += '<input type="checkbox" class="gallery-check" data-url="' + f.url + '" onclick="event.stopPropagation()" style="position:absolute; top:8px; right:8px; z-index:10; width:22px; height:22px; border:2px solid #fff;">';
          if (f.isVideo) {
            html += '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:30px; pointer-events:none; z-index:5; background:rgba(0,0,0,0.2);">▶</div>';
          }
          html += '<img src="' + f.url + '" style="width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;" onclick="showFullImg(' + globalIdx + ')">';
          html += '</div>';
        });
      }
      if (html === '') html = '<div style="grid-column:1/-1; text-align:center; padding:100px 20px; color:#444;">無資料</div>';
      grid.innerHTML = html;
    }
  </script>
</body>
</html>
