<!-- 🔐 AIT 業務端登入 v2 (2026-09-30)：LINE / Google 登入 + 每次呼叫後端自動帶登入憑證 + 左下角登入者資訊
     帳號共用鈦傳速物流「系統白名單」，後端驗證見 Auth.js / AitGuard.js。
     登入按鈕在 bigt.cc/ait/inventory.html 外殼頁 (Google、LINE 只認登記過的 bigt.cc)，這裡用 postMessage 請外殼登入。
     注意：GAS 部署會截斷字串裡的兩個斜線，網址一律拆開寫。本檔不可有 <? ?> 樣板標籤 (include 只做一次文字取代)。 -->
<style>
  #aitG { position: fixed; inset: 0; z-index: 2147483000; background: rgba(2, 6, 23, .94); display: none; align-items: center; justify-content: center; padding: 20px; font-family: 'Noto Sans TC', -apple-system, sans-serif; }
  #aitG .g-card { background: #0f172a; border: 1px solid #334155; border-radius: 18px; padding: 24px; width: 100%; max-width: 380px; color: #e2e8f0; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); max-height: 92vh; overflow: auto; box-sizing: border-box; }
  #aitG h3 { margin: 0 0 6px; font-size: 20px; color: #fff; }
  #aitG .g-sub { font-size: 13px; color: #94a3b8; margin-bottom: 16px; line-height: 1.6; }
  #aitG .g-msg { font-size: 14px; line-height: 1.7; margin: 8px 0 16px; }
  #aitG .g-err { color: #fca5a5; }
  #aitG label { display: block; font-size: 13px; color: #cbd5e1; margin: 12px 0 6px; }
  #aitG input, #aitG select { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 16px; }
  #aitG .g-btn { width: 100%; padding: 13px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 16px; }
  #aitG .g-primary { background: #2563eb; color: #fff; }
  #aitG .g-ghost { background: transparent; color: #94a3b8; border: 1px solid #475569; margin-top: 10px; }
  #aitG .g-btn:disabled { opacity: .5; }
  #aitG .g-spin { width: 36px; height: 36px; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; margin: 10px auto 16px; animation: aitGspin 0.8s linear infinite; }
  @keyframes aitGspin { to { transform: rotate(360deg); } }
  /* 使用者要求：只顯示姓名，淡灰色、幾乎看不見，放在畫面正下方 (POWERED BY BIG-T 下面) */
  #aitMe { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(2px + env(safe-area-inset-bottom)); z-index: 2147482000; background: none; border: 0; padding: 2px 6px; font: 10px/1.3 -apple-system, 'Noto Sans TC', sans-serif; letter-spacing: 2px; color: rgba(255, 255, 255, .22); cursor: pointer; white-space: nowrap; }
  #aitMe b { font-weight: 400; }
</style>
<script>
  window.AIT = (function () {
    var WRAP_ORIGIN = 'https:' + '/' + '/bigt.cc';
    var KEY = 'aitSessV2';
    var TITLES = ['業務', '行政', '倉管', '主管'];
    var BRANCHES = ['高雅瓷', '安帝嘉', '喜悅納', '漢樺', '鈦傳速'];
    var pageOpenedAt = Date.now();
    var cred = '', provider = 'google', busy = false, pendingCb = null, gateOpts = {}, started = false, meTimer = null;

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
    /* 登入資料存三份：記憶體、這個 iframe 的 localStorage、外殼頁 bigt.cc 的 localStorage。
       iPhone 主畫面 App／LINE 常清掉 iframe (第三方) 的儲存，外殼頁是第一方不會被清 → 每次開啟先向外殼頁拿 */
    var memSess = null;
    function valid(s) { return s && s.token && s.expiresAt > Date.now() + 60000 ? s : null; }
    function load() { var s = null; try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { } return valid(s) || valid(memSess); }
    function toTop(msg) { try { window.top.postMessage(msg, WRAP_ORIGIN); } catch (e) { } }
    function save(s) { memSess = s; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { } toTop({ type: 'ait-session-save', sess: JSON.stringify(s) }); }
    function clear() { memSess = null; try { localStorage.removeItem(KEY); } catch (e) { } toTop({ type: 'ait-session-clear' }); }
    /* 向外殼頁要保存的登入資料 (最多等 1.2 秒；不是從 bigt.cc 開的就直接回 null) */
    function fromTop(done) {
      var fin = false;
      function onMsg(ev) {
        if (ev.origin !== WRAP_ORIGIN || fin) return;
        var d = ev.data || {};
        if (d.type !== 'ait-session') return;
        fin = true; window.removeEventListener('message', onMsg);
        var s = null; try { s = valid(JSON.parse(d.sess || 'null')); } catch (e) { }
        if (s) { memSess = s; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { } }
        done(s);
      }
      window.addEventListener('message', onMsg);
      toTop({ type: 'ait-session-get' });
      setTimeout(function () { if (!fin) { fin = true; window.removeEventListener('message', onMsg); done(null); } }, 1200);
    }
    function token() { var s = load(); return s ? s.token : null; }
    /* APP_CONFIG 是 index.html 用 const 宣告的，不在 window 上 */
    function appParams() { try { return (typeof APP_CONFIG !== 'undefined' && APP_CONFIG && APP_CONFIG.params) || null; } catch (e) { return null; } }

    // ── 每次 google.script.run 自動在最後多帶 {__ait: 登入憑證}；後端外殼 (_aitCall_) 會拿掉再呼叫原函式 ──
    (function shim() {
      if (!window.google || !google.script || !google.script.run || window.__AIT_SHIM__) return;
      function failWrap(fn) {
        return function (err) {
          var m = String((err && err.message) || err || '');
          if (/AUTH_REQUIRED/.test(m)) { try { authFail(m); } catch (e) { } }
          else if (/AUTH_FORBIDDEN/.test(m) && !fn) { try { alert(m.replace(/^.*AUTH_FORBIDDEN：/, '')); } catch (e) { } }
          if (fn) return fn.apply(this, arguments);
          if (!/AUTH_/.test(m)) console.error(err);
        };
      }
      function wrap(runner, hasFail) {
        return new Proxy(runner, {
          get: function (t, p) {
            var v = t[p];
            if (typeof v !== 'function') return v;
            if (p === 'withFailureHandler') return function (fn) { return wrap(v.call(t, failWrap(fn)), true); };
            if (p === 'withSuccessHandler' || p === 'withUserObject') return function () { return wrap(v.apply(t, arguments), hasFail); };
            return function () {
              var a = Array.prototype.slice.call(arguments);
              a.push({ __ait: token() });
              var r = hasFail ? t : t.withFailureHandler(failWrap(null));
              return r[p].apply(r, a);
            };
          }
        });
      }
      var proxied = wrap(google.script.run, false);
      try { Object.defineProperty(google.script, 'run', { configurable: true, get: function () { return proxied; } }); }
      catch (e) { try { google.script.run = proxied; } catch (e2) { } }
      window.__AIT_SHIM__ = (google.script.run === proxied);
    })();

    // ── 登入畫面 ──
    function box() {
      var el = document.getElementById('aitG');
      if (!el) { el = document.createElement('div'); el.id = 'aitG'; document.body.appendChild(el); }
      el.style.display = 'flex';
      return el;
    }
    function closeBox() { var el = document.getElementById('aitG'); if (el) el.style.display = 'none'; }
    function render(html) { box().innerHTML = '<div class="g-card">' + html + '<\/div>'; }
    /* 2026-09-30 拿掉 LINE 登入 (主畫面 App 按 LINE 會跳到 LINE、回不來)；只有在 LINE／FB 等內建瀏覽器裡 (Google 禁止登入) 才用 LINE */
    var IN_APP = /\bLine\/|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|KAKAOTALK/i.test(navigator.userAgent || '');
    var VIA = 'Google'; /* 2026-10-01 使用者要求 LINE 登入全部拿掉；在 LINE 裡開啟時外殼頁會請他改用 Safari／Chrome */
    function loginBtn() { return '<button class="g-btn g-primary" style="background:#2563eb" onclick="AIT.start()">用 Google 登入<\/button>'; }

    function showLogin(msg) {
      render('<h3>高雅瓷業務系統<\/h3><div class="g-sub">請用你登記在系統的 ' + VIA + ' 帳號登入。<br>第一次使用的人登入後填申請，主管核准就能用。<\/div>'
        + (msg ? '<div class="g-msg g-err">' + esc(msg) + '<\/div>' : '') + loginBtn());
    }
    function showError(msg, retry) {
      render('<h3>無法登入<\/h3><div class="g-msg g-err">' + msg + '<\/div>' + (retry === false ? '' : loginBtn()));
    }

    /* 請外殼頁開登入視窗；3 秒內沒回應代表不是從 bigt.cc 開的 */
    function requestCredential() {
      return new Promise(function (resolve, reject) {
        var acked = false;
        function onMsg(ev) {
          if (ev.origin !== WRAP_ORIGIN) return;
          var d = ev.data || {};
          if (d.type === 'tts-google-ack') { acked = true; return; }
          if (d.type === 'tts-google-credential' && d.credential) { window.removeEventListener('message', onMsg); resolve({ credential: d.credential, provider: d.provider === 'line' ? 'line' : 'google' }); }
          if (d.type === 'tts-google-cancel') { window.removeEventListener('message', onMsg); reject(new Error('cancel')); }
        }
        window.addEventListener('message', onMsg);
        try { window.top.postMessage({ type: 'tts-google-login', app: 'ait' }, WRAP_ORIGIN); } catch (e) { }
        setTimeout(function () { if (!acked) { window.removeEventListener('message', onMsg); reject(new Error('not-embedded')); } }, 3000);
      });
    }

    function start() {
      render('<h3>登入<\/h3><div class="g-spin"><\/div><div class="g-sub" style="text-align:center">請在跳出的視窗用 ' + VIA + ' 登入…<\/div>');
      requestCredential().then(continueWith).catch(function (e) {
        if (e && e.message === 'cancel') return showLogin();
        showError('登入只能從 bigt.cc 的網址使用。<br>請改用 bigt.cc/ait/ 開頭的網址開啟。', false);
      });
    }

    function continueWith(c, attempt) {
      attempt = attempt || 0;
      if (busy && !attempt) return;
      busy = true;
      cred = c.credential; provider = c.provider;
      render('<h3>登入中<\/h3><div class="g-spin"><\/div><div class="g-sub" style="text-align:center">正在確認你的帳號…' + (attempt ? '（重試第 ' + attempt + ' 次）' : '') + '<\/div>');
      google.script.run
        .withSuccessHandler(handleLogin)
        .withFailureHandler(function (err) {
          var m = String((err && err.message) || err || '');
          /* 手機 (特別是 LINE 內建瀏覽器) 回應在路上斷掉 → 自動重試，身分證明還有效 */
          if (/NetworkError|HTTP 0|連線失敗/.test(m) && attempt < 2) { setTimeout(function () { continueWith(c, attempt + 1); }, 1500); return; }
          busy = false; showError('系統連線錯誤：' + esc(m));
        })
        .aitLogin(cred, provider);
    }

    function handleLogin(res) {
      busy = false;
      res = res || {};
      if (res.status === 'ok') {
        if (gateOpts.need === 'king' && !res.isKing) return showError('只有主管可以開啟這一頁。<br>你的帳號：' + esc(res.name) + '（' + esc(res.title) + '）', false);
        var s = { token: res.token, name: res.name, title: res.title, branch: res.branch, via: res.via, email: res.email, loginAt: res.loginAt, expiresAt: res.expiresAt, salesKey: res.salesKey, canSwitch: res.canSwitch, isKing: res.isKing };
        save(s);
        closeBox();
        if (pendingCb) { var cb = pendingCb; pendingCb = null; applySession(s); showMe(s); startTracking(); cb(s); }
        else { location.reload(); }
        return;
      }
      if (res.status === 'pending') {
        return render('<h3>申請審核中<\/h3><div class="g-msg">你的帳號申請已送出' + (res.submittedAt ? '（' + esc(res.submittedAt) + '）' : '') + '，<br>等主管在 Telegram 核准後，重新整理頁面就能登入。<\/div>'
          + '<div class="g-sub">登入帳號：' + esc(res.email) + '<\/div>');
      }
      if (res.status === 'need_apply') return showApply(res);
      if (res.status === 'disabled') return showError('你的帳號已停用，請聯繫主管。');
      showError(esc(res.message || '登入失敗'));
    }

    function showApply(res) {
      var opt = function (list) { return '<option value="">請選擇<\/option>' + list.map(function (x) { return '<option>' + x + '<\/option>'; }).join(''); };
      render('<h3>申請帳號<\/h3>'
        + '<div class="g-sub">' + esc(res.email) + ' 還沒有使用權限。<br>填好資料送出後，主管核准就能登入。' + (res.rejected ? '<br><span style="color:#fca5a5">上一次的申請被拒絕了，如有疑問請先聯繫主管。<\/span>' : '') + '<\/div>'
        + '<label>真實姓名<\/label><input id="aitGName" maxlength="20" placeholder="請輸入本名（不是 LINE 暱稱）">'
        + '<label>職位<\/label><select id="aitGTitle">' + opt(TITLES) + '<\/select>'
        + '<label>分公司<\/label><select id="aitGBranch">' + opt(BRANCHES) + '<\/select>'
        + '<label>手機（選填）<\/label><input id="aitGPhone" maxlength="20" inputmode="tel">'
        + '<label>備註（選填）<\/label><input id="aitGNote" maxlength="80">'
        + '<div id="aitGErr" class="g-msg g-err" style="margin:10px 0 0"><\/div>'
        + '<button class="g-btn g-primary" id="aitGSubmit" onclick="AIT.submitApply()">送出申請<\/button>'
        + '<button class="g-btn g-ghost" onclick="AIT.showLogin()">取消<\/button>');
    }

    function submitApply() {
      var v = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
      var form = { name: v('aitGName'), title: v('aitGTitle'), branch: v('aitGBranch'), phone: v('aitGPhone'), note: v('aitGNote') };
      var err = document.getElementById('aitGErr');
      if (!form.name) { err.textContent = '請填寫真實姓名'; return; }
      if (!form.title) { err.textContent = '請選擇職位'; return; }
      if (!form.branch) { err.textContent = '請選擇分公司'; return; }
      var btn = document.getElementById('aitGSubmit'); btn.disabled = true; btn.textContent = '送出中…';
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.status === 'pending') return handleLogin(res);
          btn.disabled = false; btn.textContent = '送出申請';
          err.textContent = (res && res.message) || '送出失敗';
        })
        .withFailureHandler(function (e) { btn.disabled = false; btn.textContent = '送出申請'; err.textContent = '系統連線錯誤：' + ((e && e.message) || e); })
        .aitApply(cred, form, provider);
    }

    /* 整頁跳轉登入 (LINE、手機主畫面 App 的 Google) 回來後，向外殼領取剛帶回的登入結果 */
    function resume() {
      var done = false;
      function onMsg(ev) {
        if (ev.origin !== WRAP_ORIGIN || done) return;
        var d = ev.data || {};
        if (d.type === 'tts-google-credential' && d.credential) { done = true; window.removeEventListener('message', onMsg); continueWith({ credential: d.credential, provider: d.provider === 'line' ? 'line' : 'google' }); }
        else if (d.type === 'tts-google-failed') { done = true; window.removeEventListener('message', onMsg); showError('登入沒有完成，請再試一次。'); }
        else if (d.type === 'tts-google-none') { done = true; window.removeEventListener('message', onMsg); }
      }
      window.addEventListener('message', onMsg);
      try { window.top.postMessage({ type: 'tts-google-pending' }, WRAP_ORIGIN); } catch (e) { }
      setTimeout(function () { window.removeEventListener('message', onMsg); }, 5000);
    }
    /* (LINE 登入已拿掉：外殼頁不再回應，這段只是保留介面) */
    function autoLine() {
      var done = false;
      function onMsg(ev) {
        if (ev.origin !== WRAP_ORIGIN || done) return;
        var d = ev.data || {};
        if (d.type === 'tts-google-credential' && d.provider === 'line' && d.credential) { done = true; window.removeEventListener('message', onMsg); continueWith({ credential: d.credential, provider: 'line' }); }
      }
      window.addEventListener('message', onMsg);
      try { window.top.postMessage({ type: 'tts-line-auto' }, WRAP_ORIGIN); } catch (e) { }
      setTimeout(function () { window.removeEventListener('message', onMsg); }, 15000);
    }

    // ── 登入後：業務一律用自己的身分；主管、行政可以用網址上的 ?sales= 看別人 ──
    function applySession(s) {
      var p = appParams();
      if (!p) return;
      if (!s.canSwitch || !p.sales || String(p.sales).indexOf('CLIENT_') === 0) { p.sales = s.name; p.key = s.salesKey; }
      try { localStorage.setItem('ag_current_sales', p.sales); localStorage.setItem('ag_current_key', p.key || ''); } catch (e) { }
    }

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function fmtTime(ms) { var d = new Date(ms); return pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    function fmtStay(ms) { var m = Math.floor(ms / 60000); return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + (m % 60) + 'm'; }
    function showMe(s) {
      s = s || load();
      if (!s || !document.body) return;
      var el = document.getElementById('aitMe');
      if (!el) {
        el = document.createElement('div'); el.id = 'aitMe'; document.body.appendChild(el);
        el.onclick = function () { if (confirm('要登出「' + (s.name || '') + '」嗎？')) logout(); };
      }
      var paint = function () {
        el.innerHTML = '<b>' + esc(s.name) + '<\/b>'; // 使用者要求：右下角只顯示姓名
      };
      paint();
      clearInterval(meTimer); meTimer = setInterval(paint, 15000);
    }

    function logout() {
      var t = token();
      clear();
      try { localStorage.removeItem('ag_current_sales'); localStorage.removeItem('ag_current_key'); } catch (e) { }
      try { google.script.run.withSuccessHandler(function () { location.reload(); }).withFailureHandler(function () { location.reload(); }).aitLogout(t); } catch (e) { location.reload(); }
    }

    /* 後端說憑證失效 (停用、改身分、過期)：擋住畫面，重新登入 */
    var failing = false;
    function authFail(msg) {
      var cp = appParams() || {};
      if (cp.view === 'client' && !gateOpts.force) return; // 客戶端不顯示登入畫面
      if (failing) return;
      failing = true;
      clear();
      pendingCb = null;
      showLogin(String(msg || '').replace(/^.*AUTH_REQUIRED：/, '') || '請重新登入');
    }

    /* 實際使用時間：畫面開著、而且 2 分鐘內有點擊／滑動／打字才算；每累積 5 分鐘 (或切到背景時) 回報一次 */
    var lastAct = Date.now(), pendMin = 0, tracking = false;
    function flushUsage() {
      if (!pendMin || !load()) return;
      var m = pendMin; pendMin = 0;
      try { google.script.run.withFailureHandler(function () { pendMin += m; }).aitPing(m); } catch (e) { pendMin += m; }
    }
    function startTracking() {
      if (tracking) return;
      tracking = true;
      ['pointerdown', 'keydown', 'touchstart', 'scroll', 'wheel'].forEach(function (ev) {
        document.addEventListener(ev, function () { lastAct = Date.now(); }, { passive: true, capture: true });
      });
      setInterval(function () {
        if (!load()) return;
        if (document.visibilityState === 'visible' && Date.now() - lastAct < 120000) pendMin++;
        if (pendMin >= 5) flushUsage();
      }, 60000);
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushUsage(); });
    }

    /* 頁面入口：已登入就直接開始，沒登入先顯示登入畫面。客戶端 (view=client) 不需要登入 */
    function gate(cb, o) {
      gateOpts = o || {};
      var p = appParams() || {};
      if (!gateOpts.force && p.view === 'client') return cb(null);
      var s = load();
      if (!s && !gateOpts.fromTopTried) { gateOpts.fromTopTried = true; return fromTop(function () { gate(cb, gateOpts); }); }
      if (s && gateOpts.need === 'king' && !s.isKing) { showError('只有主管可以開啟這一頁。<br>你的帳號：' + esc(s.name) + '（' + esc(s.title) + '）<br><br>要換帳號請按下面登入。'); pendingCb = cb; return; }
      if (s) {
        save(s); // 同步一份到外殼頁 (舊版只存在 iframe 裡的人，下次就不用重登)
        applySession(s); showMe(s); startTracking(); cb(s);
        // 背景確認帳號仍有效，順便延長
        google.script.run.withSuccessHandler(function (r) {
          if (!r || !r.valid) return authFail((r && r.message) || '請重新登入');
          if (r.renewed) { s.token = r.renewed; s.expiresAt = r.expiresAt; save(s); }
        }).aitCheck(s.token);
        return;
      }
      pendingCb = cb;
      showLogin();
      if (!started) { started = true; resume(); autoLine(); }
    }

    /* 機密中心：把後端給的整頁 HTML 換上來，並讓裡面的程式照順序執行 */
    function injectPage(html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      document.head.innerHTML = doc.head.innerHTML;
      document.body.innerHTML = doc.body.innerHTML;
      Array.prototype.slice.call(document.querySelectorAll('script')).forEach(function (old) {
        var s = document.createElement('script');
        Array.prototype.slice.call(old.attributes).forEach(function (a) { s.setAttribute(a.name, a.value); });
        if (!old.src) s.textContent = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
