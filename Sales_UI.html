<script>
  /**
   * 📁 通用下探切換 (移至最上方確保全域可用)
   */
  window.toggleBonusSection = function(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const isHidden = el.style.display === 'none';
    el.style.display = isHidden ? 'block' : 'none';
    
    // 如果是日期詳情列，強制使用 flex 佈局
    if (isHidden && id.indexOf('day-') === 0) {
       el.style.display = 'flex';
       el.style.flexDirection = 'column';
    }
  };

  /**
   * ✂️ 縮短客戶名稱 (只取重點字)
   */
  window.shortenCustName = function(name) {
    if (!name) return "--";
    // 移除常見冗餘後綴
    let short = name.replace(/(股份有限公司|有限公司|公司|合夥|工程行|空調|建材行|磁磚行|設計公司|設計|工作室|事務所|行|店)/g, '').trim();
    // 如果剩下太長，通常重點在前面 2-3 個字
    if (short.length > 4) {
       return short.substring(0, 3);
    }
    return short || name.substring(0, 3);
  };

  /**
   * 📊 渲染業績速覽頁面 (已整合配送獎金分頁)
   */
  window.renderSalesOverview = function(data) {
    const container = document.getElementById('page-sales-overview');
    if (!container) return;

    const s = data;
    const formatWan = (v) => v === 0 ? '—' : v.toLocaleString();

    // 🎨 整合型佈局：高雅瓷與安帝嘉個人與客戶雙軌分析
    let html = `
      <div class="navbar">
        <button class="nav-back" onclick="showPage('page-dashboard')">←</button>
        <div class="nav-title">營運數據概覽</div>
        <div style="width:40px;"></div>
      </div>

      <!-- 📊 業績分頁內容 -->
      <div id="subtab-sales-content" style="display: block; padding: 20px 16px 100px;">
        <!-- 原有全員合計卡 -->
        <div class="dash-card company-total-card" onclick="window.openCompanyDetail()"
             style="margin-bottom: 20px; padding: 25px 20px; width: 100%; cursor: pointer; backdrop-filter: blur(20px); border: 2px solid rgba(255,255,255,0.2);">
          <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div style="opacity: 0.6; font-size: 15px; font-weight: 800;">全員合計</div>
            </div>
            <div style="font-size: 11px; opacity: 0.4; font-weight: 800; color:#378ADD;">查看詳情 →</div>
          </div>
          <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 30px;">
            <div style="text-align: center; flex: 1; border-right: 1px solid rgba(255,255,255,0.1);">
              <div style="font-size: 11px; opacity: 0.4; margin-bottom: 8px;">本日 ${s.today.date}</div>
              <div style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px;">${formatWan(s.today.total)}</div>
              <div style="font-size: 10px; opacity: 0.3;">萬</div>
            </div>
            <div style="text-align: center; flex: 1; border-right: 1px solid rgba(255,255,255,0.1);">
              <div style="font-size: 11px; opacity: 0.4; margin-bottom: 8px;">當月累計</div>
              <div style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px;">${formatWan(s.month.total)}</div>
              <div style="font-size: 10px; opacity: 0.3;">萬</div>
            </div>
            <div style="text-align: center; flex: 1;">
              <div style="font-size: 11px; opacity: 0.4; margin-bottom: 8px;">年度累計</div>
              <div style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px;">${formatWan(s.year.total)}</div>
              <div style="font-size: 10px; opacity: 0.3;">萬</div>
            </div>
          </div>

          <!-- 三色進度條 -->
          <div style="width: 100%;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px; font-weight: 800;">
              <span style="opacity: 0.4;">全員年度進度</span>
              <span>${s.achieveRate}%</span>
            </div>
            <div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; display: flex; overflow: hidden; margin-bottom: 12px;">
              ${s.people.map(p => {
                const w = (p.year / s.target.total * 100);
                return `<div style="width: ${w}%; background: ${p.color}; height: 100%;"></div>`;
              }).join('')}
            </div>
            <div style="display: flex; gap: 15px; font-size: 10px; font-weight: 800;">
              ${s.people.map(p => `
                <div style="display: flex; align-items: center; gap: 6px;">
                  <div style="width: 8px; height: 8px; border-radius: 50%; background: ${p.color};"></div>
                  <span style="opacity: 0.6;">${p.name}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <!-- 🚀 客戶數據查詢面板 -->
        <div class="dash-card" style="margin-bottom: 24px; padding: 20px 16px;">
          <div style="font-size: 15px; font-weight: 900; color: #a855f7; margin-bottom: 14px;">👤 客戶數據查詢與分析</div>
          
          <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;">
            <div>
              <label style="font-size: 11px; opacity: 0.6; display: block; margin-bottom: 4px;">選擇客戶 (熱門優先)</label>
              <select id="cust-select-salesui" onchange="window.onSalesUiCustSelectChange()" style="width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; padding: 8px; font-size: 13px; font-weight: 700;">
                <option value="">-- 請選擇客戶 --</option>
              </select>
            </div>
            <div style="display: flex; gap: 8px;">
              <input id="cust-input-salesui" type="text" autocomplete="off" placeholder="搜尋客戶名稱" oninput="window.suggestSalesUiCust(this.value)" onfocus="window.suggestSalesUiCust(this.value)" style="flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; padding: 8px; font-size: 13px; font-weight: 700;" onkeypress="if(event.key==='Enter') window.searchSalesUiCustSales()">
              <button onclick="window.searchSalesUiCustSales()" style="background: #a855f7; border: none; border-radius: 8px; color: #fff; padding: 8px 16px; font-size: 13px; font-weight: 800; cursor: pointer;">🔍 查詢</button>
            </div>
          </div>

          <div id="cust-suggest-salesui" style="display:none; margin:-6px 0 12px; background:#1c1c24; border:1px solid rgba(168,85,247,0.4); border-radius:10px; max-height:240px; overflow-y:auto;"></div>
          <!-- 局部非阻塞載入動畫 -->
          <div id="cust-inline-loader-salesui" style="display: none; text-align: center; padding: 20px;">
            <div style="width: 24px; height: 24px; border: 2px solid rgba(168,85,247,0.3); border-top-color: #a855f7; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px;"></div>
            <div style="font-size: 12px; color: #a855f7; font-weight: 700;">讀取客戶分析數據中...</div>
          </div>

          <!-- 客戶結果區 -->
          <div id="cust-result-container-salesui" style="display: none; margin-top: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
              <div id="cust-header-title-salesui" style="font-size: 14px; font-weight: 900; color: #fff;">客戶分析</div>
              <div style="display: flex; gap: 4px;">
                <button id="tf-1y-salesui" onclick="window.switchSalesUiCustTimeFilter('1y')" style="background: rgba(168,85,247,0.2); border: 1px solid #a855f7; border-radius: 6px; color: #fff; padding: 4px 8px; font-size: 11px; font-weight: 800; cursor: pointer;">最近一年</button>
                <button id="tf-6m-salesui" onclick="window.switchSalesUiCustTimeFilter('6m')" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: rgba(255,255,255,0.6); padding: 4px 8px; font-size: 11px; font-weight: 800; cursor: pointer;">最近半年</button>
                <button id="tf-1m-salesui" onclick="window.switchSalesUiCustTimeFilter('1m')" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: rgba(255,255,255,0.6); padding: 4px 8px; font-size: 11px; font-weight: 800; cursor: pointer;">上個月</button>
              </div>
            </div>

            <!-- 卡片三連發 (純數值不折行) -->
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px;">
              <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 8px; text-align: center;">
                <div style="font-size: 10px; opacity: 0.5; font-weight: 700;" id="cust-card-t1-salesui">今年 (萬)</div>
                <div style="font-size: 18px; font-weight: 900; color: #a855f7; margin-top: 4px;" id="cust-amt1-salesui">0</div>
              </div>
              <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 8px; text-align: center;">
                <div style="font-size: 10px; opacity: 0.5; font-weight: 700;" id="cust-card-t2-salesui">去年 (萬)</div>
                <div style="font-size: 18px; font-weight: 900; color: #60a5fa; margin-top: 4px;" id="cust-amt2-salesui">0</div>
              </div>
              <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 8px; text-align: center;">
                <div style="font-size: 10px; opacity: 0.5; font-weight: 700;">YoY</div>
                <div style="font-size: 18px; font-weight: 900; margin-top: 4px;" id="cust-yoy-salesui">--</div>
              </div>
            </div>

            <!-- 月度對照表 (最新月份置頂) -->
            <div style="background: rgba(0,0,0,0.2); border-radius: 10px; padding: 12px; margin-bottom: 14px; overflow-x: auto;">
              <div style="font-size: 12px; font-weight: 800; color: #a855f7; margin-bottom: 8px;" id="cust-monthly-t-salesui">🗓️ 月度對照表</div>
              <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                <thead>
                  <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); text-align: left;">
                    <th style="padding: 6px;">月份</th>
                    <th style="padding: 6px;">今年 (萬)</th>
                    <th style="padding: 6px;">去年 (萬)</th>
                    <th style="padding: 6px;">YoY</th>
                  </tr>
                </thead>
                <tbody id="cust-monthly-tbody-salesui"></tbody>
              </table>
            </div>

            <!-- 購買明細表 (拿掉排名與品名) -->
            <div style="background: rgba(0,0,0,0.2); border-radius: 10px; padding: 12px; overflow-x: auto;">
              <div style="font-size: 12px; font-weight: 800; color: #a855f7; margin-bottom: 8px;" id="cust-items-t-salesui">📦 購買產品系列明細</div>
              <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                <thead>
                  <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); text-align: left;">
                    <th style="padding: 6px;">系列</th>
                    <th style="padding: 6px;">編號</th>
                    <th style="padding: 6px;">坪數</th>
                    <th style="padding: 6px;">金額 (萬)</th>
                    <th style="padding: 6px;">佔比</th>
                    <th style="padding: 6px;">最後交易</th>
                  </tr>
                </thead>
                <tbody id="cust-items-tbody-salesui"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- 個人業績卡片區 -->
        <div id="sales-people-list" style="display: flex; flex-direction: column; gap: 16px;">
          ${s.people.map(p => `
            <div class="person-card" data-person="${p.name}" 
                 style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); 
                        border-radius: 20px; padding: 18px; cursor: pointer; transition: all 0.2s;">
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                  <div style="width: 42px; height: 42px; border-radius: 50%; background: ${p.color}44; 
                               border: 1px solid ${p.color}aa; display: flex; align-items: center; justify-content: center;
                               font-weight: 900; color: ${p.color};">
                    ${p.name.charAt(0)}
                  </div>
                  <div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <div style="font-size: 18px; font-weight: 900;">${p.name}</div>
                      <div style="background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.2); border-radius: 4px; padding: 1px 6px; display: flex; align-items: center; gap: 3px;">
                        <div style="width: 4px; height: 4px; background: #a855f7; border-radius: 50%;"></div>
                        <span style="font-size: 9px; font-weight: 800; color: #a855f7;">睡美人 ${p.sleeper.month} 萬</span>
                      </div>
                    </div>
                  </div>
                </div>
                <div style="text-align: right;">
                  <div style="font-size: 10px; opacity: 0.4; font-weight: 800; margin-bottom: 2px;">年度達成率</div>
                  <div style="font-size: 15px; font-weight: 800; color: #fff;">${Math.round(p.year/p.target * 100)}%</div>
                </div>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 18px;">
                <div style="background: rgba(255,255,255,0.04); padding: 12px 6px; border-radius: 12px; text-align: center;">
                  <div style="font-size: 10px; opacity: 0.3; margin-bottom: 6px;">本日 ${s.today.date}</div>
                  <div style="font-size: 16px; font-weight: 900; opacity: ${p.day === 0 ? '0.2' : '1'};">${formatWan(p.day)}</div>
                  <div style="font-size: 9px; opacity: 0.2;">萬</div>
                </div>
                <div style="background: rgba(255,255,255,0.04); padding: 12px 6px; border-radius: 12px; text-align: center;">
                  <div style="font-size: 10px; opacity: 0.3; margin-bottom: 6px;">當月累計</div>
                  <div style="font-size: 16px; font-weight: 900; color: ${p.color};">${formatWan(p.month)}</div>
                  <div style="font-size: 9px; opacity: 0.2;">萬</div>
                </div>
                <div style="background: rgba(255,255,255,0.04); padding: 12px 6px; border-radius: 12px; text-align: center;">
                  <div style="font-size: 10px; opacity: 0.3; margin-bottom: 6px;">年度累計</div>
                  <div style="font-size: 16px; font-weight: 900;">${formatWan(p.year)}</div>
                  <div style="font-size: 9px; opacity: 0.2;">萬</div>
                </div>
              </div>

              <div style="height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; position: relative;">
                <div style="width: ${Math.min(100, Math.round(p.year/p.target*100))}%; height: 100%; background: ${p.color}; border-radius: 2px;"></div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- 🚚 配送獎金分頁內容 (維持大底深色風格) -->
      <div id="subtab-delivery-content" style="display: none; padding: 20px 16px 100px;">
        <div id="delivery-bonus-container" style="text-align: center; color: rgba(255,255,255,0.4); font-size: 16px; padding: 50px 0;">
           📊 正在精算配送獎金...
        </div>
      </div>
    `;
    
    container.innerHTML = html;

    // 🏆 事件綁定：個人卡片點擊
    container.querySelectorAll('#subtab-sales-content .person-card').forEach(el => {
      el.addEventListener('click', function() {
        const name = this.getAttribute('data-person');
        window.openPersonDetail(name);
      });
    });

    // 🟣 睡美人卡片點擊 → 下探客戶/系列明細
    container.querySelectorAll('#subtab-sales-content .sleeper-person-card').forEach(el => {
      el.addEventListener('click', function() {
        window.toggleSleeperDetail(this.getAttribute('data-person'));
      });
    });
  };

  /**
   * 🟣 睡美人明細下探：第一層先看每月業績，點月份再展開該月客戶/系列明細
   */
  let _sleeperDetailOpenFor = null;
  window.toggleSleeperDetail = function(name) {
    const panel = document.getElementById('sleeper-detail-panel');
    if (!panel || !state.salesOverviewData) return;

    // 再次點同一人 → 收合
    if (_sleeperDetailOpenFor === name) {
      panel.style.display = 'none';
      _sleeperDetailOpenFor = null;
      document.querySelectorAll('.sleeper-person-card').forEach(el => el.style.borderColor = '');
      return;
    }
    _sleeperDetailOpenFor = name;
    document.querySelectorAll('.sleeper-person-card').forEach(el => {
      el.style.borderColor = (el.getAttribute('data-person') === name) ? '#a855f7' : '';
    });

    window.renderSleeperMonthList(name);
    panel.style.display = 'block';
  };

  window.renderSleeperMonthList = function(name) {
    const panel = document.getElementById('sleeper-detail-panel');
    const p = state.salesOverviewData.people.find(x => x.name === name);
    const months = (p && p.sleeper && p.sleeper.months) || [];

    if (!months.length) {
      panel.innerHTML = `<div style="text-align:center; opacity:0.4; font-size:13px; padding:10px 0;">${name} 目前無睡美人銷售明細</div>`;
      return;
    }
    panel.innerHTML = `
      <div style="font-size: 12px; font-weight: 800; opacity: 0.5; margin-bottom: 10px;">${name} · 各月睡美人業績（點月份看明細）</div>
      <div style="display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto;">
        ${months.map(m => `
          <div onclick="window.renderSleeperMonthItems('${name}', ${m.month})"
               style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 10px 12px; cursor: pointer;">
            <div style="font-size: 13px; font-weight: 800;">${m.month} 月</div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="font-size: 15px; font-weight: 900; color: #a855f7;">${m.amt} <span style="font-size: 10px; opacity: 0.5;">萬</span></div>
              <div style="opacity: 0.3; font-size: 12px;">›</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  };

  window.renderSleeperMonthItems = function(name, monthNum) {
    const panel = document.getElementById('sleeper-detail-panel');
    const p = state.salesOverviewData.people.find(x => x.name === name);
    const months = (p && p.sleeper && p.sleeper.months) || [];
    const md = months.find(m => m.month === monthNum);
    const items = (md && md.items) || [];

    panel.innerHTML = `
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; cursor: pointer;" onclick="window.renderSleeperMonthList('${name}')">
        <div style="font-size: 13px; opacity: 0.5;">‹ 返回月份</div>
        <div style="font-size: 12px; font-weight: 800; opacity: 0.5;">${name} · ${monthNum}月睡美人明細（${items.length} 筆）</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto;">
        ${items.length ? items.map(it => `
          <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 8px 10px;">
            <div>
              <div style="font-size: 13px; font-weight: 800;">${it.customer}</div>
              <div style="font-size: 10px; opacity: 0.45;">${it.series || '—'} · ${it.code}</div>
            </div>
            <div style="font-size: 14px; font-weight: 900; color: #a855f7;">${it.amt} <span style="font-size: 10px; opacity: 0.5;">萬</span></div>
          </div>
        `).join('') : `<div style="text-align:center; opacity:0.4; font-size:13px; padding:10px 0;">無明細</div>`}
      </div>
    `;
  };

  /**
   * 🎯 儲存睡美人年度目標
   */
  window.saveSleeperTarget = function() {
    const input = document.getElementById('sleeper-target-input');
    if (!input) return;
    const val = parseFloat(input.value);
    if (!val || val <= 0) { showToast('請輸入有效的目標金額'); return; }
    showToast('儲存中...');
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) { showToast('儲存失敗：' + (res ? res.msg : '未知錯誤')); return; }
        showToast('目標已更新為 ' + val + ' 萬');
        // 重新抓最新資料並重繪整頁
        google.script.run
          .withSuccessHandler(function(res2) {
            if (res2 && res2.success) {
              state.salesOverviewData = res2.data;
              state.salesOverviewLoaded = true;
              renderSalesOverview(res2.data);
            }
          })
          .getSalesOverview();
      })
      .withFailureHandler(function(err) { showToast('儲存失敗：' + err); })
      .setSleeperAnnualTarget(val);
  };

  /**
   * 🔄 子分頁切換處理
   */
  window.switchSalesSubTab = function(tabName) {
    const btnSales = document.getElementById('tab-btn-sales');
    const btnDeliv = document.getElementById('tab-btn-delivery');
    const boxSales = document.getElementById('subtab-sales-content');
    const boxDeliv = document.getElementById('subtab-delivery-content');
    
    if (!btnSales || !btnDeliv || !boxSales || !boxDeliv) return;

    if (tabName === 'sales') {
      btnSales.style.background = 'rgba(255,255,255,0.1)';
      btnSales.style.color = '#fff';
      btnDeliv.style.background = 'transparent';
      btnDeliv.style.color = 'rgba(255,255,255,0.5)';
      boxSales.style.display = 'block';
      boxDeliv.style.display = 'none';
    } else {
      btnDeliv.style.background = 'rgba(255,255,255,0.1)';

  /** 客戶名稱合併規則（與後端 mergeCustomer 一致） */
  window.aitMergeCust = function(name) {
    var s = String(name || '').trim();
    var fixed = [['漢樺','波爾泰','漢樺'],['大永','新大永','大永'],['錦義','睿敏','錦義'],['滿財','東春','滿財'],['傅邦','盛邦','傅邦'],['喬翌','伊特','伊特'],['太爾','信義星','信義星'],['鼎康','鼎晨','鼎晨'],['高頓','馬來高','馬來高'],['鏷城','璞城','鏷城'],['今冠','金冠','金冠'],['琮達','琮威','琮威']];
    for (var i = 0; i < fixed.length; i++) if (s.indexOf(fixed[i][0]) !== -1 || s.indexOf(fixed[i][1]) !== -1) return fixed[i][2];
    var ex = ['夏綠蒂','德思特尼','百事得','百達富麗','鑫東聖','海格斯','信義星','好仕齊','新睦豐','富利鴻','金豪益'];
    for (var j = 0; j < ex.length; j++) if (s.indexOf(ex[j]) !== -1) return ex[j];
    var suf = ['企業','建材','國際','磁磚','工程','股份有限公司','有限公司','公司','實業','精品'];
    for (var k = 0; k < suf.length; k++) { var ix = s.indexOf(suf[k]); if (ix !== -1) { s = s.substring(0, ix); break; } }
    return s.slice(0, 2);
  };

  /** 輸入關鍵字即時帶出符合的客戶（依合併規則合併同一客戶，依業績大到小；原始名稱含關鍵字或合併名含關鍵字皆算） */
  window.suggestSalesUiCust = function(q) {
    var box = document.getElementById('cust-suggest-salesui');
    if (!box) return;
    q = String(q || '').trim();
    var list = (window.currentSalesUiPerfData && window.currentSalesUiPerfData.customerList) || [];
    if (!q) { box.style.display = 'none'; return; }
    if (!list.length) {
      box.innerHTML = '<div style="padding:10px 12px; font-size:12px; opacity:0.6;">客戶清單讀取中，稍後再輸入一次…</div>';
      box.style.display = 'block';
      if (!window._suggestLoading) { window._suggestLoading = true; window.loadSalesUiCustPerformance(''); setTimeout(function(){ window._suggestLoading = false; }, 8000); }
      return;
    }
    var seen = {}, out = [];
    list.forEach(function(raw) {           // list 已依業績由大到小
      if (raw.indexOf(q) === -1 && window.aitMergeCust(raw).indexOf(q) === -1) return;
      var m = window.aitMergeCust(raw) || raw;
      if (seen[m]) { seen[m].n++; return; }
      seen[m] = { name: m, n: 1 };
      out.push(seen[m]);
    });
    if (!out.length) { box.innerHTML = '<div style="padding:10px 12px; font-size:12px; opacity:0.5;">找不到符合的客戶</div>'; box.style.display = 'block'; return; }
    box.innerHTML = out.slice(0, 12).map(function(o) {
      return '<div data-n="' + encodeURIComponent(o.name) + '" onclick="window.pickSalesUiCust(this)" style="padding:10px 12px; font-size:14px; font-weight:700; border-bottom:1px solid rgba(255,255,255,0.06); cursor:pointer; display:flex; justify-content:space-between;">' +
        '<span>' + o.name.replace(/</g, '&lt;') + '</span>' + (o.n > 1 ? '<span style="font-size:11px; opacity:0.5;">合併 ' + o.n + ' 個名稱</span>' : '') + '</div>';
    }).join('');
    box.style.display = 'block';
  };
  window.pickSalesUiCust = function(el) {
    var name = decodeURIComponent(el.getAttribute('data-n'));
    document.getElementById('cust-input-salesui').value = name;
    document.getElementById('cust-suggest-salesui').style.display = 'none';
    window.openFullCustomerAnalysis(name);
  };

  /** 日期顯示成 10/3/2026（月/日/年，不補零） */
  window.fmtMDY = function(s) {
    if (!s) return '-';
    var m = String(s).match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    return m ? (parseInt(m[2], 10) + '/' + parseInt(m[3], 10) + '/' + m[1]) : String(s);
  };

  window.renderSalesUiCustomerAnalysis = function(ca) {
    var container = document.getElementById('cust-result-container-salesui');
    if (!ca || !ca.timeWindows) {
      container.style.display = 'none';
      return;
    }
    container.style.display = 'block';

    var range = window.activeSalesUiTimeRange || '1y';
    var win = ca.timeWindows[range] || ca.timeWindows['1y'];

    if (ca.lastMonthLabel) {
      var btn1m = document.getElementById('tf-1m-salesui');
      if (btn1m) btn1m.innerText = ca.lastMonthLabel;
    }

    const fmtWanNum = function(v) {
      var num = Number(v || 0);
      if (!isFinite(num) || num === 0) return '0';
      var wan = num / 10000;
      var absWan = Math.abs(wan);
      if (absWan < 1) return (Math.round(wan * 10) / 10).toFixed(1);
      var rounded = Math.round(wan * 10) / 10;
      return (Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1));
    };

    document.getElementById('cust-header-title-salesui').innerText = ca.customerName + ' (' + win.label + ')';
    document.getElementById('cust-amt1-salesui').innerText = fmtWanNum(win.curAmount || 0);
    document.getElementById('cust-amt2-salesui').innerText = fmtWanNum(win.prevAmount || 0);

    var yoy = Math.round(Number(win.yoyPercent || 0));
    var yoyText = yoy >= 0 ? ('+'+yoy+'%') : (yoy+'%');
    document.getElementById('cust-yoy-salesui').innerHTML = yoy >= 0
      ? '<span style="color:#34C759;font-weight:900;">↑ ' + yoyText + '</span>'
      : '<span style="color:#ef4444;font-weight:900;">↓ ' + yoyText + '</span>';

    // 月度對照
    var mBody = document.getElementById('cust-monthly-tbody-salesui');
    var mTrend = win.monthlyTrend || [];
    mBody.innerHTML = mTrend.map(function(m) {
      var curAmt = m.currentAmount || 0;
      var prevAmt = m.previousAmount || 0;
      var yoyVal = prevAmt > 0 ? Math.round(((curAmt - prevAmt) / prevAmt) * 100) : 0;
      var yoyBadge = yoyVal >= 0
        ? '<span style="color:#34C759;font-weight:700;">↑ ' + (yoyVal > 0 ? '+'+yoyVal : yoyVal) + '%</span>'
        : '<span style="color:#ef4444;font-weight:700;">↓ ' + yoyVal + '%</span>';
      return '<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">' +
        '<td style="padding:6px;"><b>' + m.label + '</b></td>' +
        '<td style="padding:6px;">' + fmtWanNum(curAmt) + ' 萬</td>' +
        '<td style="padding:6px;opacity:0.5;">' + (prevAmt ? fmtWanNum(prevAmt) + ' 萬' : '-') + '</td>' +
        '<td style="padding:6px;">' + yoyBadge + '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="4" style="text-align:center;">此區間無紀錄</td></tr>';

    // 品項明細 (拿掉排名與品名)
    var iBody = document.getElementById('cust-items-tbody-salesui');
    var items = win.items || [];
    iBody.innerHTML = items.map(function(it) {
      return '<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">' +
        '<td style="padding:6px;"><span style="background:rgba(168,85,247,0.15);color:#a855f7;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;">' + (it.series || '未分類') + '</span></td>' +
        '<td style="padding:6px;"><b style="color:#a855f7;">' + it.sku + '</b></td>' +
        '<td style="padding:6px;">' + (Math.round((it.totalPings || 0) * 10) / 10) + ' 坪</td>' +
        '<td style="padding:6px;">' + fmtWanNum(it.totalAmount || 0) + ' 萬</td>' +
        '<td style="padding:6px;"><span style="color:#facc15;font-weight:800;">' + it.sharePercent + '%</span></td>' +
        '<td style="padding:6px;opacity:0.5;">' + window.fmtMDY(it.lastTxDate) + '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="6" style="text-align:center;">在「' + win.label + '」區間無銷售紀錄</td></tr>';
  };

  window.loadSalespersonKpi = function(name, monthIdx) {
    const targetName = name || state.currentSales;
    if (!targetName) return;
    const m = (monthIdx !== undefined) ? monthIdx : (window.currentKpiMonth || -1);
    window.currentKpiMonth = m;
    showLoading(true, true);
    google.script.run
      .withSuccessHandler(function(res) {
        showLoading(false);
        if (res.success) renderKpiPage(res.data);
      })
      .getSalespersonKpi(targetName, m);
  };

  window.changeKpiMonth = function(name, monthIdx) {
    window.loadSalespersonKpi(name, monthIdx);
  };
</script>
