<!-- 🚗 外勤管理模組 UI (Field Work UI) -->
<div id="page-fieldwork" class="page" style="display:none; flex-direction:column; height:100vh;">
  <!-- 頂部導航 -->
  <div class="navbar">
    <button class="nav-back" onclick="showPage('page-dashboard')">←</button>
    <div class="nav-title" id="fw-title">智能報表</div>
    <div style="width:40px;"></div>
  </div>

  <!-- 🏷️ Tab 標籤切換（總覽已移除，日誌為預設進入分頁） -->
  <div class="fw-tab-bar">
    <div class="fw-tab active" onclick="switchFwTab('fw-log', this)">日誌</div>
    <div class="fw-tab" onclick="switchFwTab('fw-driving', this)">行駛</div>
    <div class="fw-tab" onclick="switchFwTab('fw-maint', this)">保養</div>
  </div>

  <!-- 📱 內容區域 (滾動) -->
  <div class="fw-content-area" id="fw-scroll-area">

    <!-- 🏠 Tab 0: 總覽 Dashboard（已停用，保留節點避免其他程式碼參照報錯） -->
    <div id="fw-dashboard" class="fw-tab-content" style="display:none !important;">
      <div class="fw-status-card" style="position:relative;">

        <div class="fw-status-header">
          <div id="fw-dash-date">讀取中...</div>
          <div style="width:80px;"></div>
        </div>

        <!-- 💰 業績顯示區塊 -->
        <div class="fw-stats-row">
          <div class="fw-stat-box" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);">
            <div class="fw-stat-label">當月累計業績</div>
            <div class="fw-stat-value" id="fw-dash-month-sales" style="color:#4ade80; font-size:22px;">...</div>
          </div>
          <div class="fw-stat-box" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);">
            <div class="fw-stat-label">年度累計業績</div>
            <div class="fw-stat-value" id="fw-dash-year-sales" style="color:#facc15; font-size:22px;">...</div>
          </div>
        </div>
      </div>

      <!-- 🌟 今日成果摘要 (強化重點) -->
      <div class="fw-summary-card" id="fw-daily-summary-card" style="display:none;">
        <div class="fw-section-title" style="margin-top:0; color:#facc15;">今日成果摘要</div>
        <div class="fw-summary-content" id="fw-daily-summary-text">
          今日已完成 0 家客戶拜訪，主要工作包含送樣與對帳...
        </div>
        <button class="fw-btn-share-mini" onclick="shareDailyReport()">
          <span>分享今日報表至 LINE</span>
        </button>
      </div>

      <!-- 📍 今日工作行程 (取代原本的業績速覽) -->
      <div class="fw-summary-card" style="display:block; border-left: 4px solid #4ade80; padding:15px;">
        <div class="fw-section-title" style="margin-top:0; color:#4ade80; font-size:16px; display:flex; justify-content:space-between; align-items:center;">
          <span>📍 今日工作行程</span>
          <span id="fw-dash-visit-count" style="font-size:12px; opacity:0.6; font-weight:normal;">共 0 筆</span>
        </div>
        <div id="fw-dash-itinerary" style="margin-top:10px;">
          <div style="text-align:center; opacity:0.3; padding:20px; font-size:13px;">今日尚無紀錄</div>
        </div>
      </div>

      <div class="fw-section-title">快捷操作</div>
      <div class="fw-quick-grid">
        <div class="fw-quick-card" onclick="switchFwTab('fw-log', document.querySelectorAll('.fw-tab')[1])">
          <div class="fw-quick-label">紀錄日誌</div>
        </div>
        <div class="fw-quick-card" onclick="switchFwTab('fw-driving', document.querySelectorAll('.fw-tab')[2])">
          <div class="fw-quick-label">行駛里程</div>
        </div>
        <div class="fw-quick-card" onclick="switchFwTab('fw-log', document.querySelectorAll('.fw-tab')[1])">
          <div class="fw-quick-label">歷史回顧</div>
        </div>
      </div>
    </div>


    <!-- Tab 2: 日誌 Log (支援同客戶多任務) -->
    <div id="fw-log" class="fw-tab-content active">
      <div class="fw-form">
        <div class="fw-field fw-field-centered">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <span id="fw-log-stat-sales" class="fw-log-stat-breath" style="display:none; font-size:12px; font-weight:900; color:#fff; white-space:nowrap;">--</span>
            <label style="flex:1; margin:0;">日誌日期</label>
            <span id="fw-log-stat-sleeper" class="fw-log-stat-breath" style="display:none; font-size:12px; font-weight:900; color:#a855f7; white-space:nowrap;">--</span>
          </div>
          <input type="date" id="log-date" style="color-scheme: dark;">
        </div>
        <style>
          @keyframes fwLogStatBreath {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
          }
          .fw-log-stat-breath { animation: fwLogStatBreath 2s ease-in-out infinite; }
        </style>

        <div class="fw-field fw-field-centered">
          <label>客戶名稱</label>
          <input type="text" id="log-customer" list="customer-list" placeholder="選擇客戶或直接輸入">
          <datalist id="customer-list">
            <!-- 由 JS 動態填入 -->
          </datalist>
        </div>

        <!-- 任務清單（支援新增多筆） -->
        <div id="fw-task-list">
          <!-- 由 JS 動態產生，預設一筆 -->
        </div>

        <button class="fw-btn-add-task" onclick="addFwTask()">+ 新增任務</button>
        <button id="btn-submit-worklog" class="fw-btn-primary" onclick="submitFwWorkLog()">儲存工作日誌</button>
      </div>

      <!-- 📅 行程預覽 (Arrow Timeline) -->
      <div class="fw-timeline-header">
        <div class="fw-section-title" style="text-align:center; display:flex; align-items:center; justify-content:center; gap:8px;">
          <span id="fw-log-view-title">今日</span>
          <input type="date" id="fw-log-view-date" onchange="refreshFwTimeline(this.value)" style="background:transparent; border:none; color:#fbbf24; font-size:16px; font-weight:800; cursor:pointer; outline:none; color-scheme: dark; width: auto; padding: 0;">
          <span>行程足跡</span>
        </div>
        <div id="fw-log-timeline" class="fw-timeline-arrow-wrap">
          <div style="text-align:center; opacity:0.3; padding:20px; font-size:12px;">尚無紀錄</div>
        </div>
      </div>

      <!-- 🕒 歷史紀錄區塊 (從回顧遷移至此) -->
      <div class="fw-history-integration" style="margin-top:40px; border-top:1px dashed rgba(255,255,255,0.1); padding-top:30px;">
        <div class="fw-section-title" style="text-align:center; color:#facc15; margin-bottom:20px;">📅 歷史紀錄回顧</div>
        

        <!-- 日曆導航 -->
        <div class="fw-cal-nav">
          <button class="fw-cal-arrow" onclick="fwCalPrevMonth()">&#8249;</button>
          <div class="fw-cal-title" id="fw-cal-month-title"></div>
          <button class="fw-cal-arrow" onclick="fwCalNextMonth()">&#8250;</button>
        </div>
        <!-- 星期標頭 -->
        <div class="fw-cal-weekdays">
          <div>日</div><div>一</div><div>二</div><div>三</div>
          <div>四</div><div>五</div><div>六</div>
        </div>
        <!-- 日曆格子 -->
        <div class="fw-cal-grid" id="fw-cal-grid"></div>

        <!-- 選定日期的日誌 -->
        <div id="fw-history-logs" class="fw-history-logs">
          <div style="text-align:center; opacity:0.35; padding:30px; font-size:13px;">
            點擊日期查看往日日誌
          </div>
        </div>
      </div>
    </div>

    <!-- 🚗 Tab 3: 行駛 Driving -->
    <div id="fw-driving" class="fw-tab-content">
      <div class="fw-form">
        <!-- 🚗 共享設定 (置頂) -->
        <div style="background:rgba(255,255,255,0.05); border-radius:12px; padding:15px; margin-bottom:15px; border:1px solid rgba(255,255,255,0.1);">
          <div class="fw-field">
            <label>車牌號碼</label>
            <input type="text" id="drv-plate-number" list="plate-list" placeholder="選擇或輸入車號">
          </div>
          <div class="fw-field" style="margin-top:10px;">
            <label>紀錄日期</label>
            <input type="date" id="drv-date">
          </div>
        </div>

        <!-- 🚗 區塊一：里程紀錄 -->
        <div style="background:rgba(74,222,128,0.05); border-radius:12px; padding:15px; margin-bottom:15px; border:1px solid rgba(74,222,128,0.2);">
          <div style="font-weight:800; color:#4ade80; font-size:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
            <div style="display:flex; align-items:center;">
              <span style="margin-right:8px;">🚗</span> 里程紀錄
            </div>
            <button type="button" onclick="openDrivingHistory()" style="background:rgba(255,255,255,0.1); border:none; color:#4ade80; font-size:11px; padding:3px 8px; border-radius:6px; cursor:pointer;">📜 歷史紀錄</button>
          </div>
          <div class="fw-row">
            <div class="fw-field">
              <label>開始里程</label>
              <input type="number" id="drv-start-odometer" inputmode="numeric" placeholder="前次里程">
            </div>
            <div class="fw-field">
              <label>結束里程</label>
              <input type="number" id="drv-end-odometer" inputmode="numeric" placeholder="輸入目前里程" oninput="calcDrvDist()">
            </div>
          </div>
          <button class="fw-btn-primary" style="margin-top:15px; background:linear-gradient(135deg, #4ade80 0%, #22c55e 100%);" onclick="submitFwMileage(this)">儲存里程紀錄</button>
        </div>

        <!-- ⛽ 區塊二：加油紀錄 -->
        <div style="background:rgba(251,191,36,0.05); border-radius:12px; padding:15px; border:1px solid rgba(251,191,36,0.2);">
          <div style="font-weight:800; color:#fbbf24; font-size:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
            <div style="display:flex; align-items:center;">
              <span style="margin-right:8px;">⛽</span> 加油紀錄
            </div>
            <button type="button" onclick="openFuelHistory()" style="background:rgba(255,255,255,0.1); border:none; color:#fbbf24; font-size:11px; padding:3px 8px; border-radius:6px; cursor:pointer;">📜 歷史紀錄</button>
          </div>
          <div class="fw-row">
            <div class="fw-field">
              <label>加油金額</label>
              <input type="number" id="drv-fuel-amount" inputmode="numeric" placeholder="NT$">
            </div>
            <div class="fw-field">
              <label>加油公升</label>
              <input type="number" id="drv-fuel-liters" step="0.01" inputmode="decimal" placeholder="0.00">
            </div>
          </div>
          <button class="fw-btn-primary" style="margin-top:15px; background:linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);" onclick="submitFwFuel(this)">儲存加油紀錄</button>
        </div>
      </div>
    </div>

    <!-- 🛣️ 行駛歷史彈窗 -->
    <div id="modal-driving-history" class="fw-modal" style="display:none;">
      <div class="fw-modal-content">
        <div class="fw-modal-header">
          <div class="fw-modal-title" style="color:#facc15; font-weight:800;">🛣️ 近期行駛紀錄</div>
          <button class="fw-modal-close" onclick="document.getElementById('modal-driving-history').style.display='none'">&times;</button>
        </div>
        <div id="driving-history-list" style="max-height:65vh; overflow-y:auto; padding:15px;">
           <!-- 內容由 JS 生成 -->
        </div>
      </div>
    </div>

    <!-- ⛽ 加油歷史彈窗 -->
    <div id="modal-fuel-history" class="fw-modal" style="display:none;">
      <div class="fw-modal-content">
        <div class="fw-modal-header">
          <div class="fw-modal-title" style="color:#fbbf24; font-weight:800;">⛽ 近期加油紀錄</div>
          <button class="fw-modal-close" onclick="document.getElementById('modal-fuel-history').style.display='none'">&times;</button>
        </div>
        <div id="fuel-history-list" style="max-height:65vh; overflow-y:auto; padding:15px;">
           <!-- 內容由 JS 生成 -->
        </div>
      </div>
    </div>

    <!-- 🔧 Tab 4: 保養 Maintenance -->
    <div id="fw-maint" class="fw-tab-content">
      <div class="fw-form">
        <!-- 第一排：車牌 (全寬置頂) -->
        <div class="fw-field">
          <label>車牌號碼</label>
          <input type="text" id="maint-plate-number" list="plate-list" placeholder="輸入或選擇車號" onchange="loadMaintenanceTabData()">
        </div>

        <!-- 第二排：日期 (獨立一行) -->
        <div class="fw-field">
          <label>保養日期</label>
          <input type="date" id="maint-date">
        </div>

        <!-- 第三排：金額 (獨立一行) -->
        <div class="fw-field" style="margin-top:15px;">
          <label>保養金額 (必填)</label>
          <input type="number" id="maint-amount" inputmode="numeric" placeholder="請輸入保養總金額" required>
        </div>

        <!-- 第三排：目前里程、下次里程 (一左一右) -->
        <div class="fw-row" style="margin-top:10px;">
          <div class="fw-field">
            <label>目前里程</label>
            <input type="number" id="maint-mileage" inputmode="numeric" placeholder="目前里程">
          </div>
          <div class="fw-field">
            <label>下次里程</label>
            <input type="number" id="maint-next-mileage" inputmode="numeric" placeholder="預計里程">
          </div>
        </div>

        <div class="fw-field">
          <label>保養項目勾選</label>
          <div id="fw-maint-grid" class="fw-maint-grid">
            <!-- 由 JS 動態生成項目 -->
          </div>
          <input type="text" id="maint-custom" placeholder="自訂保養項目 (選填)" style="margin-top:10px;">
        </div>

        <div class="fw-field">
          <label>單據照片 (最多3張)</label>
          <div class="fw-photo-upload-row">
            <div class="fw-photo-slot" onclick="clickMaintPhoto(0)">
              <img id="maint-img-0" style="display:none">
              <span id="maint-txt-0">UP</span>
            </div>
            <div class="fw-photo-slot" onclick="clickMaintPhoto(1)">
              <img id="maint-img-1" style="display:none">
              <span id="maint-txt-1">UP</span>
            </div>
            <div class="fw-photo-slot" onclick="clickMaintPhoto(2)">
              <img id="maint-img-2" style="display:none">
              <span id="maint-txt-2">UP</span>
            </div>
          </div>
          <input type="file" id="maint-file-0" accept="image/*" hidden onchange="handleMaintFile(this, 0)">
          <input type="file" id="maint-file-1" accept="image/*" hidden onchange="handleMaintFile(this, 1)">
          <input type="file" id="maint-file-2" accept="image/*" hidden onchange="handleMaintFile(this, 2)">
        </div>

        <div class="fw-field">
          <label>下次保養注意事項</label>
          <textarea id="maint-note" rows="2" placeholder="請輸入下次保養需注意的事項..."></textarea>
        </div>
        
        <button class="fw-btn fw-btn-outline" onclick="openMaintHistory()" style="margin-top:10px;">查看保養歷史</button>
        <button class="fw-btn-primary" onclick="submitFwMaintenance()">儲存保養紀錄</button>
      </div>
    </div>

    <!-- 📋 保養歷史彈窗 -->
    <div id="modal-maint-history" class="fw-modal" style="display:none;">
      <div class="fw-modal-content">
        <div class="fw-modal-header">
          <div class="fw-modal-title">🚗 保養歷史紀錄</div>
          <button class="fw-modal-close" onclick="document.getElementById('modal-maint-history').style.display='none'">&times;</button>
        </div>
        <div id="maint-history-list" style="max-height:60vh; overflow-y:auto; padding:15px 0;">
           <!-- 歷史內容由 JS 生成 -->
        </div>
      </div>
    </div>



    <datalist id="plate-list"></datalist>

  </div>
</div>

<!-- 🎭 載入中遮罩 -->
<div id="fw-loading" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:30000; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
  <div style="width:40px; height:40px; border:3px solid rgba(255,255,255,0.3); border-top-color:#facc15; border-radius:50%; animation: fw-spin 1s linear infinite;"></div>
  <div id="fw-loading-text" style="color:#fff; font-size:14px; margin-top:15px; font-weight:700;">處理中...</div>
</div>

<style>
  @keyframes fw-spin { to { transform: rotate(360deg); } }
</style>

<!-- 🎭 高級 Action Sheet 容器 -->
<div id="fw-action-sheet" class="fw-action-sheet" onclick="closeFwActionSheet()">
  <div class="fw-action-content" onclick="event.stopPropagation()">
    <div id="fw-action-title" class="fw-action-title">請選擇操作</div>
    <div id="fw-action-btns">
       <!-- 由 JS 生成按鈕 -->
    </div>
    <div class="fw-action-btn cancel" onclick="closeFwActionSheet()">取消</div>
  </div>
</div>

<style>
  /* 📄 報表表格樣式 */
  .fw-report-table {
    width: 100%; border-collapse: collapse; background: #fff; color: #333;
    font-size: 13px; text-align: center;
  }
  .fw-report-table th { background: #f4f4f4; padding: 12px; border: 1px solid #ddd; font-weight: 800; }
  .fw-report-table td { padding: 10px; border: 1px solid #ddd; }
  .fw-report-table tr:nth-child(even) { background: #fafafa; }
  .report-wide { max-width: 900px !important; width: 95% !important; }
  
  .text-red { color: #ff4d4d; font-weight: 800; }
  .badge-trip { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 11px; }

  /* 彈窗基礎樣式 */
  .fw-modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); z-index: 10000; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(5px);
  }
  .fw-modal-content {
    background: #1a1a1a; width: 90%; max-width: 500px; border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1); overflow: hidden;
    animation: slideUp 0.3s ease-out;
  }
  .fw-modal-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
  .fw-modal-header .title { font-size: 18px; font-weight: 800; color: #facc15; }
  .fw-modal-header .close { background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; opacity: 0.5; }
  .fw-modal-body { padding: 20px; max-height: 70vh; overflow-y: auto; }
  .fw-modal-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* 💎 高級感 Action Sheet (替代 Prompt) */
  .fw-action-sheet {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.4); z-index: 20000; display: none;
    align-items: flex-end; backdrop-filter: blur(4px);
  }
  .fw-action-content {
    background: #1c1c1e; width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px 0 20px; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    max-height: 85vh; display: flex; flex-direction: column;
  }
  .fw-action-title {
    text-align: center; color: rgba(255,255,255,0.4); font-size: 13px;
    margin-bottom: 15px; padding: 0 20px; flex-shrink: 0;
  }
  #fw-action-btns {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 10px;
  }
  .fw-action-btn {
    width: 90%; margin: 8px auto; padding: 18px; border-radius: 14px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; font-size: 16px; font-weight: 700; text-align: center;
    cursor: pointer; transition: all 0.2s;
  }
  .fw-action-btn:active { background: rgba(255,255,255,0.15); transform: scale(0.98); }
  .fw-action-btn.danger { color: #ff453a; }
  .fw-action-btn.cancel { background: none; border: none; margin-top: 5px; opacity: 0.6; flex-shrink: 0; }

  /* 👁️ 全知視角專屬樣式 */
  .fw-omni-container { display: flex; flex-direction: column; gap: 20px; margin-top: 10px; }
  .fw-omni-user-card {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 15px;
  }
  .fw-omni-user-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 10px;
  }
  .fw-omni-user-name { font-size: 16px; font-weight: 800; color: #facc15; }
  .fw-omni-log-list { display: flex; flex-direction: column; gap: 8px; }
  .fw-omni-log-item {
    font-size: 13px; display: flex; gap: 8px; align-items: flex-start;
    background: rgba(255,255,255,0.03); padding: 10px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .fw-omni-log-time { font-family: monospace; color: rgba(255,255,255,0.5); font-size: 11px; margin-top: 2px; }
  .fw-omni-log-content { flex: 1; }
