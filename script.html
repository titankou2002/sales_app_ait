  function normalizeSkuKey(value) {
    return String(value || '')
      .toUpperCase()
      .replace(/[\s\-－—–_＿\/\\()\uFEFF\u00A0]/g, '')
      .trim();
  }

  /**
   * 📸 讀取照片 GPS 資訊 (使用 EXIF.js)
   */
  function processImageGps(file, callback) {
    if (!window.EXIF) {
      console.warn("EXIF library not loaded");
      callback(null);
      return;
    }
    try {
      EXIF.getData(file, function() {
        try {
          var lat = EXIF.getTag(this, "GPSLatitude");
          var latRef = EXIF.getTag(this, "GPSLatitudeRef");
          var lng = EXIF.getTag(this, "GPSLongitude");
          var lngRef = EXIF.getTag(this, "GPSLongitudeRef");

          if (lat && latRef && lng && lngRef) {
            var convertDMSToDD = function(dms, ref) {
              if (!dms || dms.length < 3) return null;
              var d = typeof dms[0] === 'object' ? (dms[0].numerator / dms[0].denominator) : dms[0];
              var m = typeof dms[1] === 'object' ? (dms[1].numerator / dms[1].denominator) : dms[1];
              var s = typeof dms[2] === 'object' ? (dms[2].numerator / dms[2].denominator) : dms[2];
              var dd = d + m / 60.0 + s / 3600.0;
              if (ref === "S" || ref === "W") {
                dd = -dd;
              }
              return dd;
            };

            var latDD = convertDMSToDD(lat, latRef);
            var lngDD = convertDMSToDD(lng, lngRef);

            if (latDD !== null && lngDD !== null && !isNaN(latDD) && !isNaN(lngDD)) {
              callback({ lat: latDD, lng: lngDD });
              return;
            }
          }
        } catch (e) {
          console.error("Error parsing EXIF GPS data:", e);
        }
        callback(null);
      });
    } catch (err) {
      console.error("EXIF.getData failed:", err);
      callback(null);
    }
  }

  /**
   * 📍 更新新增版面時的 GPS 狀態與 UI 提示
   */
  function updateGpsStatus(type, message) {

      }
    }
  }

  /**
   * 🚀 載入動畫 (Canvas 粒子引擎 V2.0)
   */
  var particleEngine = {
    canvas: null,
    ctx: null,
    particles: [],
    logoPoints: [],
    isGathering: false,
    animationId: null,

    init: function () {
      this.canvas = document.getElementById('particleCanvas');
      if (!this.canvas) return;
      this.ctx = this.canvas.getContext('2d');
      this.resize();
      window.addEventListener('resize', () => this.resize());
      this.generateLogoPoints();
      this.generateParticles();
      this.animate();
    },

    resize: function () {
      this.canvas.width = window.innerWidth;
      this.canvas.height = window.innerHeight;
      this.generateLogoPoints();
    },

    generateLogoPoints: function () {
      const points = [];
      const cx = this.canvas.width / 2;
      const cy = this.canvas.height / 2 - 30;
      const s = 1.0; // 縮小整體比例以適應手機
      const tColor = '#e21b7a'; // 品牌桃紅色

      const drawLine = (x, y1, y2, color) => {
        for (let y = y1; y <= y2; y += 3) points.push({ x: cx + x, y: cy + y, c: color });
      };

      const drawHLine = (x1, x2, y, color) => {
        for (let x = x1; x <= x2; x += 3) points.push({ x: cx + x, y: cy + y, c: color });
      };

      const drawCircle = (x, y, r, startAngle, endAngle, color) => {
        for (let a = startAngle; a < endAngle; a += 0.23) {
          points.push({ x: cx + x + Math.cos(a) * r, y: cy + y + Math.sin(a) * r, c: color });
        }
      };

      // T 的大橫槓
      drawHLine(-145 * s, 145 * s, -25 * s, tColor);
      // T 的中心豎線
      drawLine(0, -25 * s, 40 * s, tColor);

      // 左側字母 e (正常方向)
      drawCircle(-118 * s, 18 * s, 16 * s, 0.2 * Math.PI, 1.8 * Math.PI, 'white');
      drawHLine(-118 * s, -102 * s, 18 * s, 'white');

      drawLine(-75 * s, -10 * s, 40 * s, 'white'); // l

      drawLine(-42 * s, 0, 40 * s, 'white'); // i
      points.push({ x: cx - 42 * s, y: cy - 12 * s, c: 'white' }); // i dot

      // 右側字母 i l e
      drawLine(42 * s, 0, 40 * s, 'white'); // i
      points.push({ x: cx + 42 * s, y: cy - 12 * s, c: 'white' }); // i dot

      drawLine(75 * s, -10 * s, 40 * s, 'white'); // l

      // 最後一個 e (鏡像方向)
      drawCircle(118 * s, 18 * s, 16 * s, -0.8 * Math.PI, 0.8 * Math.PI, 'white');
      drawHLine(102 * s, 118 * s, 18 * s, 'white');

      this.logoPoints = points;
    },

    generateParticles: function () {
      const count = 300;
      this.particles = [];
      for (let i = 0; i < count; i++) {
        const p = {
          x: Math.random() * this.canvas.width,
          y: Math.random() * this.canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          size: 1.5 + Math.random(),
          opacity: 0.3 + Math.random() * 0.4,
          targetX: 0,
          targetY: 0,
          color: 'white',
          progress: 0,
          isGathering: i < this.logoPoints.length
        };

        if (p.isGathering) {
          const lp = this.logoPoints[i];
          p.targetX = lp.x;
          p.targetY = lp.y;
          p.color = lp.c;
          p.startX = p.x;
          p.startY = p.y;
        }
        this.particles.push(p);
      }
    },

    setGathering: function (val) {
      if (val === this.isGathering) return;
      this.isGathering = val;
      if (val) {
        // 開始匯聚：紀錄當前點作為起點
        this.particles.forEach(p => {
          p.startX = p.x;
          p.startY = p.y;
          p.progress = 0;
        });
      }
    },

    animate: function () {
      this.ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
      this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

      this.particles.forEach(p => {
        if (this.isGathering && p.isGathering) {
          if (p.progress < 1) p.progress += 0.006; // 慢速匯聚
          const t = 1 - Math.pow(1 - p.progress, 3); // Ease out
          p.x = p.startX + (p.targetX - p.startX) * t;
          p.y = p.startY + (p.targetY - p.startY) * t;
          p.opacity = Math.min(1, 0.4 + t * 0.6);
        } else {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;
        }

        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        this.ctx.fillStyle = p.color === 'white'
          ? `rgba(255, 255, 255, ${p.opacity * 0.7})`
          : p.color.replace(')', `, ${p.opacity * 0.9})`).replace('rgb', 'rgba');
        // 🚀 根據需求移除白影 (Shadow)
        this.ctx.shadowBlur = 0;
        this.ctx.fill();
      });

      this.animationId = requestAnimationFrame(() => this.animate());
    }
  };

  /**
   * 📢 系統提示 (Toast)
   */
  function showToast(msg, type = 'success') {
    const toast = document.createElement('div');
    toast.className = 'toast-message';
    if (type === 'error') {
      toast.style.background = '#f2f2f7';
      toast.style.color = '#000';
      toast.style.boxShadow = '0 10px 40px rgba(0,0,0,0.4)';
      toast.style.borderRadius = '16px';
      toast.style.padding = '18px 25px';
      toast.style.width = '280px';
      toast.style.textAlign = 'left';
      toast.style.lineHeight = '1.4';
      toast.innerHTML = '<span style="font-size:24px; margin-right:12px; float:left;">❌</span>';
      var msgDiv = document.createElement('div');
      msgDiv.style.cssText = 'font-weight:900;font-size:15px;';
      msgDiv.textContent = msg;
      toast.appendChild(msgDiv);
    } else {
      toast.textContent = '✅ ' + msg;
    }
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add('active'), 50);
    setTimeout(() => {
      toast.classList.remove('active');
      setTimeout(() => { if(toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }, 3000);
  }

    overlay.style.display = 'flex';

  /**
   * 🚨 統一伺服器錯誤處理
   */
  window.handleGASFailure = function(err) {
    if (typeof showLoading === 'function') showLoading(false);
    const msg = (err && err.message) ? err.message : String(err);
    console.error("GAS Error:", err);
    alert("⚠️ 系統通訊異常\n\n錯誤資訊：" + msg + "\n\n若持續發生，請檢查網路或聯繫管理員。");
  };

  /**
   * 🐞 全域 JS 錯誤捕捉
   */
  window.onerror = function(msg, url, lineNo, columnNo, error) {
    console.error("Runtime Error:", msg, lineNo);
    alert("⚡ 程式執行出錯\n\n" + msg + "\n(行: " + lineNo + ")");
    return false;
  };

  var _loadingTimer = null;

  function showLoading(show, gatherLogo, statusMsg) {
    var overlay = document.getElementById('loading-overlay');
    if (!overlay) return;
    var bar = document.getElementById('loading-progress-bar');
    var statusEl = document.getElementById('loading-status-text');
    var titleEl = overlay.querySelector('.loading-text');

    if (show) {
      overlay.style.display = 'flex';
      overlay.style.backgroundColor = gatherLogo ? '#000' : 'rgba(0,0,0,0.5)';
      if (titleEl) titleEl.textContent = 'LOADING';
      if (statusEl) statusEl.textContent = statusMsg || '';
      particleEngine.setGathering(!!gatherLogo);
      _startProgressAnim(bar);
    } else {
      if (bar) { bar.style.transition = 'width 0.2s'; bar.style.width = '100%'; }
      setTimeout(function() {
        overlay.style.display = 'none';
        if (bar) { bar.style.transition = 'none'; bar.style.width = '0%'; }
        if (titleEl) titleEl.textContent = 'LOADING';
        if (statusEl) statusEl.textContent = '';
        _stopProgressAnim();
        if (particleEngine.animationId) cancelAnimationFrame(particleEngine.animationId);
      }, 300);
    }
  }

  function showLoadingWithStatus(statusMsg) {
    showLoading(true, false, statusMsg);
  }

  function _startProgressAnim(bar) {
    _stopProgressAnim();
    if (!bar) return;
    var progress = 0;
    bar.style.transition = 'width 0.4s ease';
    bar.style.width = '0%';
    _loadingTimer = setInterval(function() {
      var remaining = 90 - progress;
      progress += remaining * 0.08;
      bar.style.width = Math.min(progress, 90) + '%';
    }, 300);
  }

  function _stopProgressAnim() {
    if (_loadingTimer) { clearInterval(_loadingTimer); _loadingTimer = null; }
  }

  // ─── 統一星空粒子引擎 ──────────────────────────────────
  function initParticleCanvas(canvasId) {
    var canvas = document.getElementById(canvasId);
    if (!canvas || canvas.dataset.running === 'true') return;
    canvas.dataset.running = 'true';
    var ctx = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    var particles = [];
    for (var i = 0; i < 150; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        size: (1.5 + Math.random() * 1.5) * 0.8,
        baseOpacity: 0.2 + Math.random() * 0.4,
        flash: 0,
        flashSpeed: 0.01 + Math.random() * 0.02
      });
    }

    function animate() {
      const page = canvas.closest('.page');
      if (!page || !page.classList.contains('active')) {
        requestAnimationFrame(animate);
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function(p) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        if (p.flash > 0) p.flash -= 0.04; 
        else if (Math.random() > 0.9995) p.flash = 1;
        var opacity = p.baseOpacity + Math.sin(Date.now() * p.flashSpeed) * 0.15 + p.flash * 0.6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 + p.flash * 2), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + opacity + ')';
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();
  }

  // 門戶導向函式
  window.openAlbumModule = function() { 
    state.currentFlow = 'album';
    if (state.currentSales) {
      selectSales(state.currentSales);
    } else {
      showPage('sales-page'); 
    }
  };
  window.openLogisticsModule = function() { showToast('系統建置中...'); };

  function init() {
    edgeSwipe.init(); 
    
    const params = APP_CONFIG.params || {};
    const isClientFlow = (params.view === 'client' || params.customer || params.clientName);
    
    if (isClientFlow) {
      // 🚀 對齊客戶端身分，確保分享連結進入 (deep link) 也可正常反查真實名稱與扣減次數
      const targetClientName = params.clientName || params.customer;
      if (targetClientName) {
        window.clientState = window.clientState || { userId: '', userName: '', userCompany: '', isAuthorized: false };
        const info = (window.APP_CONFIG && APP_CONFIG.clientInfo) ? APP_CONFIG.clientInfo : { name: targetClientName, company: "訪客客戶", level: "LEVEL 2" };
        window.clientState.userId = 'DIRECT_' + (info.name || targetClientName);
        window.clientState.userName = info.name || targetClientName;
        window.clientState.userCompany = info.company || '訪客客戶';
        window.clientState.level = info.level || 'LEVEL 2';
        window.clientState.isAuthorized = true;
        
        try {
          localStorage.setItem('AIT_CLIENT_USER_ID', window.clientState.userId);
          localStorage.setItem('AIT_CLIENT_USER_NAME', window.clientState.userName);
          localStorage.setItem('AIT_CLIENT_USER_COMPANY', window.clientState.userCompany);
          localStorage.setItem('AIT_CLIENT_LEVEL', window.clientState.level);
        } catch(e){}
        
        // 異步向後端獲取詳細白名單身分 (為 LOG 工作表作準備的備用 fallback)
        google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.success && res.isAuthorized) {
              window.clientState.userName = res.name;
              window.clientState.userCompany = res.company;
              window.clientState.level = res.level;
              window.clientState.isAuthorized = true;
              try {
                localStorage.setItem('AIT_CLIENT_USER_ID', window.clientState.userId);
                localStorage.setItem('AIT_CLIENT_USER_NAME', window.clientState.userName);
                localStorage.setItem('AIT_CLIENT_USER_COMPANY', window.clientState.userCompany);
                localStorage.setItem('AIT_CLIENT_LEVEL', window.clientState.level);
              } catch(e){}
            }
          })
          .verifyClientDirectAccess(targetClientName, params.key || '');
      }
      
      // 🚀 外部客戶/訪客查詢：放行進入，但功能受限（必須輸入坪數且無具體庫存）
      _startAppFlow();
      loadInventoryData();
      return;
    }
    
    // 🚀 全局業務金鑰強校驗：內部員工沒金鑰的 100% 擋在大門外！
    let sales = params.sales || '';
    let key = params.key || '';
    
    // 如果 URL 沒帶，從 LocalStorage 讀取
    if (!sales || !key) {
      try {
        sales = localStorage.getItem('ag_current_sales') || '';
        key = localStorage.getItem('ag_current_key') || '';
      } catch(e){}
    }

    // 🚀 沒有金鑰 ➡️ 瞬間解鎖攔截，休想進入系統任何分頁！
    if (!sales || !key) {
      lockSystem("偵測到未授權存取。請使用您的專屬直達連結登入。");
      return;
    }

    // 顯示連接中動畫
    const pb = document.getElementById('progressBar');
    const pt = document.getElementById('progressText');
    if (pb) pb.style.width = '45%';
    if (pt) pt.innerText = 'VERIFYING SECURITY KEY...';

    // 呼叫後端異步比對金鑰狀態
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          // 🚀 驗證成功：業務身分核對通過！
          state.currentSales = sales;
          try {
            localStorage.setItem('ag_current_sales', sales);
            localStorage.setItem('ag_current_key', key);
          } catch(e){}
          
          const disp = document.getElementById('sales-name-display');
          if (disp) disp.innerText = sales;
          if (typeof checkDeliveryBadge === 'function') checkDeliveryBadge(sales);

          // 🌟 完美分流：
          // 如果 URL 帶有 view=inventory，我們就帶他去「庫存頁面」鎖定使用！
          // 如果 URL 沒有帶 view=inventory，我們就帶他去「業務 APP 主選單首頁（Dashboard）」！
          if (params.view === 'inventory') {
            _startAppFlow();
          } else {
            runSplashScreen();
          }
          loadInventoryData();
          loadStockoutSubtitleAlert();
        } else {
          // 🚀 驗證失敗 ➡️ 直接封鎖並清除快取
          try {
            localStorage.removeItem('ag_current_sales');
            localStorage.removeItem('ag_current_key');
          } catch(e){}
          lockSystem("您的安全金鑰已失效，或已被系統管理員註銷停用。");
        }
      })
      .withFailureHandler(function(err) {
        lockSystem("系統連線異常，無法驗證您的身分。請檢查網路後重試。");
      })
      .verifySalesKey(sales, key);
  }

  function lockSystem(reasonText) {
    // 隱藏 Splash 載入頁
    const splash = document.getElementById('splash-page');
    if (splash) splash.style.display = 'none';
    
    // 隱藏 Loading
    showLoading(false);
    
    // 顯示全局「存取遭拒」磨砂警告層
    const mask = document.getElementById('global-access-denied-mask');
    if (mask) {
      mask.style.display = 'flex';
      // 更新詳細原因
      const pEl = mask.querySelector('p');
      if (pEl && reasonText) {
        pEl.innerText = reasonText;
      }
    }
    console.error("🔒 系統已安全鎖定：", reasonText);
  }

  function _startAppFlow() {
    const params = APP_CONFIG.params || {};
    
    // 🚀 獨立單獨查庫存入口 (無須 LINE 驗證)
    if (params.view === 'inventory') {
      const splash = document.getElementById('splash-page');
      if (splash) splash.style.display = 'none';
      
      // 💻 展開至滿版寬度 (解除 600px 手機寬度限制)
      const container = document.querySelector('.app-container');
      if (container) container.classList.add('full-width');
      
      // 自動將當前業務身分寫入 state.currentSales 並更新 UI
      if (params.sales) {
        state.currentSales = params.sales;
        try {
          localStorage.setItem('ag_current_sales', params.sales);
        } catch(e){}
        const nameEl = document.getElementById('sales-name-display');
        if (nameEl) nameEl.innerText = params.sales;

  function loadInventoryData() {
    // 🚀 快取優先 (Cache-First) 策略
    if (!state.isInventoryLoaded) {
      try {
        const localCached = localStorage.getItem('ag_inventory_cache');
        if (localCached) {
          const parsed = JSON.parse(localCached);
          if (parsed && parsed.length > 0) {
            state.inventoryData = parsed;
            // 標記已經有基礎資料可用（避免 UI 顯示為空），但背後仍去抓最新的
            console.log('⚡ 已從 LocalStorage 瞬間載入庫存快取 (' + parsed.length + ' 筆)');
            
            // 若此時正看著陳列牆，先用舊快取渲染，達成 0 秒瞬間載入
            if (document.getElementById('page-album') && document.getElementById('page-album').classList.contains('active')) {
              renderAlbum();
              renderHistory();
            }
          }
        }
      } catch(e) {
        console.warn('讀取本地庫存快取失敗:', e);
      }
    }

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          state.inventoryData = res.data;
          state.isInventoryLoaded = true;
          
          // 🚀 將最新資料同步回寫至 LocalStorage
          try {
            localStorage.setItem('ag_inventory_cache', JSON.stringify(res.data));
          } catch(e) {}
          
          // 🚀 關鍵修正：若已開啟客戶陳列牆，在背景載入完成時自動重新渲染，以套用正確的缺貨框顏色
          if (document.getElementById('page-album') && document.getElementById('page-album').classList.contains('active')) {

        }
      })
      .getAggregatedInventory();
  }

  /**
   * 👈 手勢管理：修復 Apps Script 無法滑動返回的遺憾
   */
  var edgeSwipe = {
    startX: 0,
    startTime: 0,
    active: false,
    init: function() {
      document.addEventListener('touchstart', (e) => {
        this.startX = e.touches[0].clientX;
        this.startTime = Date.now();
        // 只有從螢幕左邊緣 (40px 內) 開始的滑動才有效
        this.active = (this.startX < 40);
      }, {passive: true});

      document.addEventListener('touchend', (e) => {
        if (!this.active) return;
        
        // 🚀 修正：如果是客戶端模式，禁止右滑返回主後台
        if (APP_CONFIG.params.view === 'client') return;

        const endX = e.changedTouches[0].clientX;
        const duration = Date.now() - this.startTime;
        const dist = endX - this.startX;

        // 判斷邏輯：向右滑動至少 70px，且時間在 300ms 內 (快滑)
        if (dist > 70 && duration < 300) {
          this.triggerBack();
        }
        this.active = false;
      }, {passive: true});
    },
    triggerBack: function() {
      // 尋找當前活動頁面中的返回按鈕並觸發點擊
      const activePage = document.querySelector('.page.active');
      if (activePage) {
        const backBtn = activePage.querySelector('.nav-back');
        if (backBtn) {
          backBtn.click();
          console.log('🚀 手勢觸發：返回上一頁');
        } else {
          // 如果沒有返回按鈕，嘗試回主畫面
          showPage('page-dashboard');
        }
      }
    }
  };

  /**
   * 🟡 階段 2：客戶邏輯 (4 欄網格)
   */
  function renderCustomerList(data) {
    var grid = document.getElementById('customer-grid');
    grid.innerHTML = '';

    var visible = data.filter(function(c) { return !c.hidden; });
    var hiddenList = data.filter(function(c) { return c.hidden; });

    // 依等級分組：特 → A → B → C → 未分級
    var levelOrder = ['特', 'A', 'B', 'C'];
    var levelLabel = { '特': '特級', 'A': 'A級', 'B': 'B級', 'C': 'C級', '': '未分級' };
    var groups = {};
    visible.forEach(function(c) {
      var lv = String(c.level || '').trim();
      var key = levelOrder.indexOf(lv) !== -1 ? lv : '';
      (groups[key] = groups[key] || []).push(c);
    });

    function makeItem(c, isHidden) {
      var item = document.createElement('div');
      item.className = 'customer-item';
      item.style.position = 'relative';
      if (isHidden) item.style.opacity = '0.5';
      item.innerHTML = '<div class="customer-name">' + c.name + '</div>';

      // 👁 顯示/隱藏切換鈕
      var eye = document.createElement('div');
      eye.innerText = isHidden ? '＋' : '－';
      eye.title = isHidden ? '恢復顯示' : '隱藏此客戶';
      eye.style.cssText = 'position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%;' +
        'background:rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.3); color:rgba(255,255,255,0.7);' +
        'font-size:14px; font-weight:900; display:flex; align-items:center; justify-content:center; z-index:5;';
      eye.onclick = function(e) {
        e.stopPropagation();
        toggleCustomerVisibility(c.name, isHidden);
      };
      item.appendChild(eye);

      item.onclick = function () { selectCustomer(c.name); };
      return item;
    }

    function addHeader(text) {
      var h = document.createElement('div');
      h.style.cssText = 'grid-column:1 / -1; font-size:12px; font-weight:900; letter-spacing:3px; color:rgba(250,204,21,0.75); margin:6px 0 -4px; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:4px;';
      h.innerText = text;
      grid.appendChild(h);
    }

    levelOrder.concat(['']).forEach(function(lv) {
      var list = groups[lv];
      if (!list || !list.length) return;
      addHeader(levelLabel[lv] + '（' + list.length + '）');
      list.forEach(function(c) { grid.appendChild(makeItem(c, false)); });
    });

    // 🙈 未顯示版面區（預設收合）
    if (hiddenList.length) {
      var det = document.createElement('details');
      det.style.cssText = 'grid-column:1 / -1; margin-top:16px; border:1px solid rgba(255,255,255,0.12); border-radius:12px; background:rgba(255,255,255,0.03);';
      var sum = document.createElement('summary');
      sum.style.cssText = 'padding:10px 14px; cursor:pointer; font-size:13px; font-weight:800; color:rgba(255,255,255,0.5); letter-spacing:2px; list-style:none;';
      sum.innerText = '🙈 未顯示版面（' + hiddenList.length + '）';
      det.appendChild(sum);
      var inner = document.createElement('div');
      inner.style.cssText = 'display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; padding:12px;';
      hiddenList.forEach(function(c) { inner.appendChild(makeItem(c, true)); });
      det.appendChild(inner);
      grid.appendChild(det);
    }
  }

  /**
   * 🔴 階段 3：相簿邏輯
   */
  /**
   * 🔴 階段 3：相簿邏輯 (分組與銷售排序版)
   */
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function renderAlbum(isHistory = false) {
    var targetGridId = isHistory ? 'history-grid' : 'album-grid';
    var grid = document.getElementById(targetGridId);
    if (!grid) return;

    var displayData = isHistory ? state.historyDisplays : state.currentDisplays;

    if (!displayData || displayData.length === 0) {
      grid.innerHTML = isHistory ? '' : '<div style="grid-column:span 2; padding:60px 20px; text-align:center; color:var(--gray-600);">' +
        '<div style="font-size:48px; margin-bottom:15px;">🌑</div>' +
        '<div style="font-weight:700;">此客戶暫無陳列資料</div></div>';
      return;
    }

    // 1. 按圖片分組
    var groups = {};
    displayData.forEach(function (d) {
      var key = d.photoUrl || 'no-photo';
      if (!groups[key]) {
        groups[key] = {
          photoUrl: d.photoUrl,
          items: [],
          totalSalesAmt: 0,
          totalSalesQty: 0,
          totalFrequency: 0,
          series: d.series,
          skuList: []
        };
      }
      groups[key].items.push(d);
      // 🔥 使用該客戶專屬的銷售數據進行聚合
      groups[key].totalSalesAmt += (d.customerSalesAmt || 0);
      groups[key].totalSalesQty += (d.customerSalesQty || 0);
      groups[key].totalFrequency += (d.frequency || 0);
      groups[key].totalReservedQty = (groups[key].totalReservedQty || 0) + (d.customerReservedQty || 0);

      if (d.customerReservedSummary) {
        if (!groups[key].reservedSummaryList) groups[key].reservedSummaryList = [];
        groups[key].reservedSummaryList.push(d.customerReservedSummary);
      }

      groups[key].skuList.push(d.sku);
    });

    // 2. 轉換為陣列並進行智慧排序
    var sortedGroups = Object.values(groups);
    var albumSortSelect = document.getElementById('album-sort-select');
    var albumSortMethod = albumSortSelect ? albumSortSelect.value : 'amount';

    sortedGroups.sort(function (a, b) {
      if (albumSortMethod === 'pyeong') return b.totalSalesQty - a.totalSalesQty;
      if (albumSortMethod === 'amount') return b.totalSalesAmt - a.totalSalesAmt;
      if (albumSortMethod === 'days') return (b.items[0].daysOnDisplay || 0) - (a.items[0].daysOnDisplay || 0);
      if (albumSortMethod === 'status') {
        var getWorst = function (g) { return Math.min.apply(null, g.items.map(function (i) { return i.stockLevel || 3; })); };
        var res = getWorst(a) - getWorst(b);
        if (res !== 0) return res;
        return b.totalSalesAmt - a.totalSalesAmt;
      }
      if (albumSortMethod === 'frequency') return b.totalFrequency - a.totalFrequency;
      if (albumSortMethod === 'update') {
        const dateA = a.items[0].lastUpdate ? new Date(a.items[0].lastUpdate).getTime() : 0;
        const dateB = b.items[0].lastUpdate ? new Date(b.items[0].lastUpdate).getTime() : 0;
        return dateB - dateA;
      }
      return b.totalSalesAmt - a.totalSalesAmt; // 預設金額
    });

    // 3. 預載入圖片優化效能
    if (sortedGroups.length > 0) preloadImages(sortedGroups);

    var html = '';
    sortedGroups.forEach(function (group, gIdx) {
      // 找出該組的銷冠
      var champion = group.items.reduce(function (prev, current) {
        return (prev.salesAmt > current.salesAmt) ? prev : current;
      });
      group.championSku = champion.sku;
      group.champPct = Math.round((champion.salesAmt / group.totalSalesAmt) * 100);

      // 🚦 庫存燈號標準邏輯 (2025 第二版: 1紅, 2橘, 3黃, 4綠)
      var itemsWithInv = group.items.map(function(li) {
        var skuKey = li.sku.replace(/[\s\-]/g,'').toUpperCase();
        var inv = state.inventoryData.find(function(d){ 
          return d.sku.replace(/[\s\-]/g,'').toUpperCase() === skuKey; 
        });
        if (!inv) {
          console.warn("⚠️ 庫存匹配未找到 (用後端預設):", li.sku, "skuKey:", skuKey, "後備等級:", li.stockLevel);
          // 🚀 將後端 3 燈等級對齊 2025 新標準 (後端 1 -> 新 1紅, 後端 2 -> 新 2橘/黃, 後端 3 -> 新 4綠)
          var translatedLevel = 4;
          if (li.stockLevel === 1) translatedLevel = 1;
          else if (li.stockLevel === 2) translatedLevel = 2;
          else if (li.stockLevel === 3) translatedLevel = 4;
          return { level: translatedLevel, hasArrival: false, pyeong: 999 };
        }
        return inv;
      });
      
      var worstLevel = 4;
      if (itemsWithInv.length > 0) {
        worstLevel = Math.min.apply(null, itemsWithInv.map(function(i) { return i.level; }));
      }
      var anyArrival = itemsWithInv.some(function(i) { return i.hasArrival; });
      
      // 🚀 對齊客戶三色燈框要求：
      // - 完全沒貨 (Level 1) -> 紅色框 (border-red)
      // - 快缺貨 (Level 2 & 3) -> 黃色框 (border-yellow)
      // - 沒缺貨 (Level 4) -> 綠色框 (border-green)
      var borderClass = worstLevel === 1 ? 'border-red' 
                      : (worstLevel === 2 || worstLevel === 3) ? 'border-yellow' 
                      : 'border-green';
      
      // 如果有到貨則疊加藍色閃爍
      if (anyArrival) borderClass += ' arrival-blue-pulse';

      var imgUrl = (group.photoUrl && group.photoUrl !== "")
        ? group.photoUrl
        : 'https://placehold.co/800x800/1a1a1a/ffffff?text=Loading...';

      // 🚀 格式化日期：2024/04/28 15:18 -> 24/4/28
      var rawDate = group.items[0].lastUpdate || '—';
      var shortDate = rawDate;
      if (rawDate !== '—') {
        var datePart = rawDate.split(' ')[0]; // 取日期部分
        var parts = datePart.split('/');
        if (parts.length === 3) {
          shortDate = parts[0].substring(2) + '/' + parseInt(parts[1]) + '/' + parseInt(parts[2]);
        }
      }

      var durationStr = formatDaysToDuration(group.items[0].daysOnDisplay);

      html += '<div class="album-item ' + borderClass + '" onclick="showGroupDetail(' + gIdx + ', ' + isHistory + ')">' +
        '<img src="' + imgUrl + '" class="album-thumb" ' +
        'onerror="this.onerror=null; this.src=\'https://placehold.co/800x800/1a1a1a/666?text=載入失敗\'" ' +
        'loading="lazy">' +

        // 🔝 頂部標籤組 (左上: 金額/坪數, 右上: 系列名稱)
        '<div class="card-top-badges">' +
          (state.isClientView ? '' :
            '<div class="mini-stat">' +
            Math.round(group.totalSalesAmt / 10000) + '萬 / ' + Math.round(group.totalSalesQty) + '坪' +
            '</div>') +
          (group.totalReservedQty > 0 ? 
            '<div class="mini-stat" style="background:rgba(234,179,8,0.35); color:#facc15; border-color:rgba(234,179,8,0.5); margin-top:4px; cursor:pointer;" ' +
            'onclick="event.stopPropagation(); showReserveInfo(\'' + encodeURIComponent(JSON.stringify(group.reservedSummaryList || [])) + '\')">' +
            '保留 ' + group.totalReservedQty + ' 片</div>' : '') +
        '</div>' +
        
        '<div style="position:absolute; top:12px; right:12px; z-index:5; text-align:right;">' +
          '<div style="font-size:15px; font-weight:900; color:#fff; text-shadow:0 0 10px rgba(0,0,0,0.8);">' + escapeHtml(group.series || '未命名') + '</div>' +
        '</div>' +

        // 🧊 玻璃化底部遮罩 (強制採用 Row 佈局，讓日期與天數分居左右底部)
        '<div class="card-glass-overlay" style="display:flex; flex-direction:row; justify-content:space-between; align-items:flex-end; padding:8px 12px; background:linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);">' +
          '<div>' +
            '<div class="date-badge" style="color:#facc15; font-weight:800; font-size:12px; margin-bottom:2px;">' + shortDate + '</div>' +
          '</div>' +
          '<div style="font-size:13px; font-weight:900; color:rgba(255,255,255,0.9); letter-spacing:1px; text-shadow:0 0 10px rgba(0,0,0,0.8); margin-bottom:2px;">' + 
            durationStr + '</div>' +
        '</div>' +
        '</div>';
    });

    // 存儲排序後的組到 state 供詳情使用
    if (isHistory) state.sortedHistoryGroups = sortedGroups;
    else state.sortedGroups = sortedGroups; 
    
    grid.innerHTML = html;
  }

  /**
   * 📦 動態渲染品項列表
   */
  function renderSkuDetailList(isHistory = false) {
    var list = document.getElementById('sku-detail-list');
    var group = isHistory ? state.sortedHistoryGroups[state.currentGIdx] : state.sortedGroups[state.currentGIdx];
    if (!list || !group) return;

    var listContainer = document.getElementById('sku-detail-list');
    var listHtml = "";

    var sortEl = document.getElementById('sku-sort-select');
    var sortMethod = sortEl ? sortEl.value : 'stock';
    var items = group.items.slice();

    // 排序
    if (sortMethod === 'sales') {
      items.sort(function(a, b) { return (b.salesAmt || 0) - (a.salesAmt || 0); });
    } else if (sortMethod === 'stock') {
      items.sort(function(a, b) { return (a.stockLevel || 3) - (b.stockLevel || 3); });
    } else if (sortMethod === 'id') {
      items.sort(function(a, b) { return a.sku.localeCompare(b.sku); });
    }

    items.forEach(function(item) {
      // ✅ 從 inventoryData 撈即時庫存（不依賴後端回傳的 currentPyeong）
      var invItem = null;
      if (state.inventoryData && state.inventoryData.length > 0) {
        var skuKey = normalizeSkuKey(item.sku);
        invItem = state.inventoryData.find(function(d) {
          return normalizeSkuKey(d.sku) === skuKey;
        });
      }

      // 庫存數字：優先用即時資料，沒有才用後端回傳值
      var stockP  = invItem ? parseFloat(invItem.pyeong) : parseFloat(item.currentPyeong || 0);
      var stockQ  = invItem ? parseFloat(invItem.qty)    : parseFloat(item.currentStock  || 0);
      var level   = invItem ? invItem.level  : (item.stockLevel || (stockP < 1 ? 1 : 4));
      
      // 🚀 最終保險：如果算出來是 0 坪或負數，強制給予等級 1 (紅)
      if (stockP < 1) level = 1;

      // 銷售數字
      var salesP  = Math.round(item.salesQty || 0);

      // 批號與片數（版面上架清單的記錄）
      var batchDisplay = item.batch ? item.batch : '—';
      var qtyDisplay   = item.originalQty || 1;

      // 單磚圖：優先用 inventoryData 的圖（品質較好）
      var singleImg    = (invItem && invItem.img) ? invItem.img : (item.singleImg || '');
      var hasSingleImg = singleImg && singleImg.trim() !== '';

      // 燈號樣式 (2025 第二版)
      var oosClass = '';
      if (level === 1) oosClass = 'oos-red';
      else if (level === 2) oosClass = 'oos-orange';
      else if (level === 3) oosClass = 'oos-yellow';
      
      if (invItem && invItem.hasArrival) oosClass += ' arrival-blue-pulse';

      // 縮圖
      var imgHtml = hasSingleImg
        ? '<img src="' + singleImg + '" class="sku-row-thumb" onerror="this.src=\'https://placehold.co/200x200/1a1a1a/666?text=ERR\'">'
        : '<div class="sku-row-thumb" style="background:rgba(255,255,255,0.02); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.1); font-size:10px;">無圖</div>';

      var onClickHtml = state.isClientView ? '' : ' onclick="enterEditMode()"';

      listHtml +=
        '<div class="sku-row ' + oosClass + '"' + onClickHtml + '>' +
          imgHtml +
          '<div class="sku-row-content">' +

            // 編號 + 片數批號
            '<div class="sku-row-top" style="display:flex; justify-content:space-between; align-items:center;">' +
              '<div class="sku-row-id">' + item.sku +
                '<span style="font-size:11px; color:rgba(255,255,255,0.4); margin-left:8px;">' +
                  qtyDisplay + '片 ' + batchDisplay + (item.spec ? ' (' + item.spec + ')' : '') +
                '</span>' +
              '</div>' +
              (state.isClientView ? '' :
                '<button onclick="event.stopPropagation(); closeDetail(); switchAlbumTab(\'reserved\'); setTimeout(function(){ openAddReservationModal(\'' + item.sku.replace(/'/g, "\\'") + '\') }, 150);" ' +
                'style="background:var(--ait-gold-soft); color:var(--ait-gold); border:1px solid rgba(194,157,102,0.4); border-radius:6px; font-size:11px; font-weight:800; padding:2px 8px; cursor:pointer; z-index:10;">' +
                '📝 保留</button>'
              ) +
            '</div>' +

            // 庫存 + 銷售
            '<div style="display:flex; justify-content:space-between; margin-top:6px;">' +
              (state.isClientView ? '' :
                '<div style="font-size:13px; font-weight:700; color:#facc15;">現貨 ' + Math.round(stockP) + ' 坪</div>'
              ) +
              '<div style="font-size:13px; font-weight:700; color:#34c759;">售出 ' + salesP + ' 坪</div>' +
            '</div>' +

            // 🚀 總庫存 & 保留展示
            (state.isClientView || !invItem ? '' :
              '<div style="font-size:11px; color:rgba(255,255,255,0.3); margin-top:4px; font-weight:600;">' +
                '總庫存 ' + (invItem.physical || 0) + ' 片 ┃ 總保留 ' + (invItem.reserved || 0) + ' 片' +
              '</div>' +
              (item.customerReservedQty > 0 ? 
                '<div style="font-size:11px; color:#facc15; margin-top:4px; font-weight:900; background:rgba(234,179,8,0.1); padding:4px 8px; border-radius:6px; border:1px solid rgba(234,179,8,0.2);">' +
                  '此客戶已保留 ' + item.customerReservedQty + ' 片 (' + item.customerReservedCases + ')' +

            (level === 1 ?

              'padding:4px 8px; border-radius:6px; font-size:12px; font-weight:800; color:#007aff;">🔵 預計 ' + (invItem.eta || '近期') + ' 到貨' + (invItem.etaQty > 0 ? ' ' + Math.floor(invItem.etaQty) + ' 片' : '') + '</div>'
            : '') +

          '</div>' +
        '</div>';
    });

    listContainer.innerHTML = listHtml;
  };

  /**
   * ⏳ 輔助：將天數轉換為幾年幾個月
   */
  function formatDaysToDuration(days) {
    if (!days || days < 0) return "0M";
    var years = Math.floor(days / 365);
    var remainingDays = days % 365;
    var months = Math.floor(remainingDays / 30);

    var result = "";
    if (years > 0) result += years + "Y";
    if (months > 0 || (years === 0 && months === 0)) result += (months || 0) + "M";
    else if (months > 0) result += months + "M";

    // 確保 1Y3M 格式
    if (years > 0 && months > 0) return years + "Y" + months + "M";
    if (years > 0) return years + "Y";
    return (months || 0) + "M";
  }

  function extractId(url) {
    if (!url || typeof url !== 'string') return '';

    // 優先匹配純 ID (28-50 字元)
    const idMatch = url.match(/[-\w]{28,50}/);
    if (idMatch) return idMatch[0];

    const patterns = [
      /\/d\/([a-zA-Z0-9_-]{25,})/,
      /id=([a-zA-Z0-9_-]{25,})/,
      /\/file\/d\/([a-zA-Z0-9_-]{25,})/
    ];
    for (const pattern of patterns) {
      const match = url.match(pattern);
      if (match) return match[1];
    }
    return '';
  }

  (function () {
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, false);

    window.addEventListener('touchend', e => {
      let touchEndX = e.changedTouches[0].screenX;
      let touchEndY = e.changedTouches[0].screenY;

      // 判斷是否為左向右滑動, 且垂直位移不大
      if (touchEndX - touchStartX > 100 && Math.abs(touchEndY - touchStartY) < 50) {
        // 只有從螢幕邊緣附近開始才算
        if (touchStartX < 50) {
          handleSwipeBack();
        }
      }
    }, false);

        closeDetail();

        window.switchToPage('page-select-customer');

  window.handleInventorySearch = function() {
    const qInput = document.getElementById('staff-search-input');
    const szInput = document.getElementById('staff-filter-size');
    const minPValue = document.getElementById('staff-filter-pyeong').value;
    const minQValue = document.getElementById('staff-filter-qty').value;
    const q = (qInput ? qInput.value : '').trim().toUpperCase();
    const sz = (szInput ? szInput.value : '').trim().toUpperCase().replace(/[xX*]/g, '');
    const minP = parseFloat(minPValue || 0);
    const minQ = parseFloat(minQValue || 0);
    const sort = document.getElementById('staff-sort').value;
    const list = document.getElementById('staff-result-list');

    // 處理清除按鈕顯示
    const clearQ = document.getElementById('clear-q');
    const clearSz = document.getElementById('clear-sz');
    if (clearQ) clearQ.style.display = q ? 'block' : 'none';
    if (clearSz) clearSz.style.display = sz ? 'block' : 'none';

    if (!q && !sz && minP <= 0 && minQ <= 0) {
      list.innerHTML = `
        <div style="grid-column:1/-1; text-align:center; padding:80px 20px;">
          <div style="font-size:40px; margin-bottom:15px; opacity:0.3;">🔍</div>
          <div style="color:var(--staff-gold); font-size:15px; font-weight:600;">系統已就緒</div>
          <div style="color:rgba(255,255,255,0.4); font-size:12px; margin-top:8px;">請輸入編號或系列開始查詢</div>
        </div>`;
      return;
    }

    if (!state.isInventoryLoaded) {
      list.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:#fff;">資料載入中，請稍候...</div>`;
      return;
    }

    // ⚡ 本機極速過濾模式
    let filtered = state.inventoryData.filter(p => {
      // A. 字串關鍵字比對 (SKU, 漢樺 SKU, 中文系列)
      let matchQ = !q;
      if (q) {
        const skuUp = (p.sku || "").toUpperCase();
        const hSkuUp = (p.hSku || "").toUpperCase();
        const seriesUp = (p.sCn || "").toUpperCase();
        const seriesEnUp = (p.sEn || "").toUpperCase();
        matchQ = skuUp.includes(q) || seriesUp.includes(q) || seriesEnUp.includes(q) || hSkuUp.includes(q);
      }

      // B. 尺寸比對
      let matchSz = !sz;
      if (sz) {
        const pSize = (p.size || "").toUpperCase().replace(/[xX*]/g, '');
        matchSz = pSize.includes(sz);
      }

      // C. 數量與坪數低標過濾
      let matchStock = true;
      if (minP > 0) matchStock = matchStock && (p.pyeong >= minP);
      if (minQ > 0) matchStock = matchStock && (p.qty >= minQ);

      return matchQ && matchSz && matchStock;
    });

    // 排序邏輯
    if (sort === 'stock-desc') {
      filtered.sort((a, b) => (b.qty || 0) - (a.qty || 0));
    } else if (sort === 'sku-asc') {
      filtered.sort((a, b) => (a.sku || "").localeCompare(b.sku || ""));
    } else if (sort === 'series-asc') {
      filtered.sort((a, b) => (a.sCn || "").localeCompare(b.sCn || ""));
    }

    // 限制最多顯示 120 筆以保證渲染效能
    const finalData = filtered.slice(0, 120);

    if (finalData.length === 0) {
      list.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:rgba(255,255,255,0.4);">查無符合條件的產品</div>`;
      return;
    }

    let html = '';
    finalData.forEach(p => {
      // 🚀 智慧三色庫存燈號對齊 UI 標準
      let stockColor = '#00cc66'; // Green
      let borderClass = 'border-green';
      let lampClass = 'lamp-green';
      let lampText = '充足';

      if (p.level === 1) {
        stockColor = '#ff4d4d'; // Red
        borderClass = 'border-red';
        lampClass = 'lamp-red';
        lampText = '極缺';
      } else if (p.level === 2 || p.level === 3) {
        stockColor = '#ffcc00'; // Yellow
        borderClass = 'border-yellow';
        lampClass = 'lamp-yellow';
        lampText = '緊張';
      }

      if (p.hasArrival) borderClass += ' arrival-blue-pulse';

      // 預留標籤 HTML (直接在圖片容器內渲染)
      let imgHtml = p.img
        ? `<div class="product-img-container" style="position:relative; width:110px; height:74px; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid rgba(255,255,255,0.05); flex-shrink: 0;">

                <span>實存:<span style="color:#eee; margin-left:2px;">${Math.floor(p.physical)}片</span></span>

  // ─── 影像庫模組 ──────────────────────────────────────────

  var currentSku = '';

  var currentGalleryList = [];

  window.openGallery = function(sku) {
    const item = state.inventoryData.find(p => p.sku === sku);
    if (!item) { showToast("找不到該商品資料"); return; }

    currentSku = sku;
    currentIndex = -1;
    currentGalleryList = [];

    const mainGrid = document.getElementById('staff-gallery-grid-main');
    const subGrid = document.getElementById('staff-gallery-grid-sub');
    if (mainGrid) mainGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--staff-gold); font-size:11px; letter-spacing:2px;">載入雲端影像庫中...</div>';
    if (subGrid) subGrid.innerHTML = '';

    document.getElementById('staff-gallery-modal').style.display = 'flex';

    // 1. 整理基礎的圖片陣列 (單片圖、scenes)
    const baseGallery = {
      scenes: [],
      videos: [],
      singles: [],
      molds: [],
      intros: [],
      catalogs: []
    };

    if (item.img) {
      baseGallery.singles.push({ name: sku + "_單片", url: item.img.replace('=w400', '=w1200'), isVideo: false });
    }
    if (item.scenes && item.scenes.length > 0) {
      item.scenes.forEach((sUrl, idx) => {
        baseGallery.scenes.push({ name: sku + "_實景" + (idx+1), url: sUrl, isVideo: false });
      });
    }

    currentGalleryData = baseGallery;

    if (item.folderId) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res) {
            // 合併後端抓取的分類影像
            ['scenes', 'singles', 'molds', 'intros'].forEach(cat => {
              if (res[cat]) {
                res[cat].forEach(file => {
                  const exists = baseGallery[cat].some(existFile => existFile.url === file.url);
                  if (!exists) {
                    baseGallery[cat].push({ name: file.name, url: file.url, isVideo: file.isVideo || false });
                  }
                });
              }
            });
            if (res.catalogs) baseGallery.catalogs = res.catalogs;
          }
          _updateGalleryTabs();
        })
        .withFailureHandler(function() {
          _updateGalleryTabs();
        })
        .getFolderImages(item.folderId);
    } else {
      _updateGalleryTabs();
    }
  };

  function _updateGalleryTabs() {
    const tabs = { scene: 'scenes', video: 'videos', single: 'singles', mold: 'molds', intro: 'intros' };
    let firstTab = '';
    
    // 如果有影片，或者專屬場景照有 .mp4 格式的檔案
    currentGalleryData.videos = currentGalleryData.scenes.filter(f => f.url.toLowerCase().endsWith('.mp4') || f.isVideo);
    currentGalleryData.scenes = currentGalleryData.scenes.filter(f => !f.url.toLowerCase().endsWith('.mp4') && !f.isVideo);

    for (let t in tabs) {
      const el = document.getElementById('tab-' + t);
      const count = currentGalleryData[tabs[t]].length;
      const catalogCount = (t === 'intro') ? currentGalleryData.catalogs.length : 0;
      
      if (count > 0 || catalogCount > 0) {
        if (el) el.style.display = 'flex';
        if (!firstTab) firstTab = t;
      } else {
        if (el) el.style.display = 'none';
      }
    }
    
    switchGalleryTab(firstTab || 'scene');
  }

  window.switchGalleryTab = function(type) {
    ['scene', 'video', 'single', 'mold', 'intro'].forEach(t => {
      const el = document.getElementById('tab-' + t);
      if (el) el.classList.toggle('active', t === type);
    });
    renderGalleryTab(type);
  };

  function renderGalleryTab(activeType) {
    const mainGrid = document.getElementById('staff-gallery-grid-main');
    const subGrid = document.getElementById('staff-gallery-grid-sub');
    const mainHeader = document.getElementById('header-main');
    const subHeader = document.getElementById('header-sub');

    let source = [];
    let typeName = "實景照";
    if (activeType === 'scene') { source = currentGalleryData.scenes; typeName = "實景照"; }
    else if (activeType === 'video') { source = currentGalleryData.videos; typeName = "影片"; }
    else if (activeType === 'single') { source = currentGalleryData.singles; typeName = "單片圖"; }
    else if (activeType === 'mold') { source = currentGalleryData.molds; typeName = "模面圖"; }
    else if (activeType === 'intro') { source = currentGalleryData.intros; typeName = "介紹/目錄"; }

    const cleanCurrent = currentSku.replace(/[\s\-\_]/g, '').toUpperCase();
    
    // 分流「本商品」與「同系列商品」
    let thisSkuFiles = source.filter(f => {
      const cleanName = (f.name || '').replace(/[\s\-\_]/g, '').toUpperCase();
      return cleanName.includes(cleanCurrent);
    });
    let otherFiles = source.filter(f => {
      const cleanName = (f.name || '').replace(/[\s\-\_]/g, '').toUpperCase();
      return !cleanName.includes(cleanCurrent);
    });

    if (activeType === 'single' && thisSkuFiles.length > 1) {
      thisSkuFiles = [thisSkuFiles[0]];
    }

    currentGalleryList = [...thisSkuFiles, ...otherFiles];

    let mainHtml = '';
    
    // 如果是介紹分頁，額外繪製電子目錄
    if (activeType === 'intro' && currentGalleryData.catalogs.length > 0) {
      currentGalleryData.catalogs.forEach(cat => {
        mainHtml += `
          <div style="grid-column:1/-1; padding:15px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:12px; margin: 10px; box-sizing: border-box; text-align: left;">
            <div style="color:#fff; font-weight:700; margin-bottom:10px; font-size:13px;">電子目錄: ${cat.name}</div>
            <div style="display:flex; gap:10px;">
              <button style="flex:1; background:var(--staff-gold); color:#000; border:none; padding:10px; border-radius:8px; font-weight:700; cursor:pointer;" onclick="window.open('${cat.url}', '_blank')">開啟 PDF</button>
              <button style="flex:1; background:rgba(255,255,255,0.1); color:#fff; border:none; padding:10px; border-radius:8px; font-weight:700; cursor:pointer;" onclick="window.open('${cat.downloadUrl}', '_blank')">下載檔案</button>
            </div>
          </div>`;
      });
    }

    thisSkuFiles.forEach((f, idx) => { mainHtml += renderImgItem(f, idx); });
    mainGrid.innerHTML = mainHtml || (activeType !== 'intro' ? '<div style="grid-column:1/-1; text-align:center; padding:30px; opacity:0.3; font-size:11px; color:#fff;">尚無專屬影像</div>' : '');
    mainHeader.innerHTML = `<span>專屬${typeName} (${thisSkuFiles.length})</span>`;

    let subHtml = '';
    otherFiles.forEach((f, idx) => { subHtml += renderImgItem(f, thisSkuFiles.length + idx); });
    subGrid.innerHTML = subHtml;
    subHeader.innerHTML = `<span>同系列${typeName} (${otherFiles.length})</span>`;
    subHeader.style.display = otherFiles.length > 0 ? 'flex' : 'none';

    mainHeader.classList.remove('collapsed'); mainGrid.style.maxHeight = '2000px';
    subHeader.classList.remove('collapsed'); subGrid.style.maxHeight = '2000px';
  }

  window.toggleSection = function(headerId, gridId) {
    const header = document.getElementById(headerId);
    const grid = document.getElementById(gridId);
    if (!header || !grid) return;
    const isCollapsed = header.classList.toggle('collapsed');
    grid.style.maxHeight = isCollapsed ? '0px' : '2000px';
  };

  function renderImgItem(f, idx) {
    return `
      <div style="aspect-ratio:1/1; overflow:hidden; background:#111; position:relative; border: 0.5px solid rgba(255,255,255,0.05); box-sizing: border-box;">
        <input type="checkbox" class="gallery-check" data-url="${f.url}" style="position:absolute; top:6px; right:6px; z-index:10; width:18px; height:18px; accent-color:var(--staff-gold); cursor:pointer;">
        ${f.isVideo ? '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:30px; pointer-events:none; z-index:5;">▶</div>' : ''}
        <img src="${f.url}" style="width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;" onclick="showFullImg(${idx})">
      </div>`;
  }

  // ─── 單張大圖與浮水印模組 ─────────────────────────────────

  window.showFullImg = function(idx, directUrl = null, sku = null) {
    const imgEl = document.getElementById('staff-full-img');
    const videoEl = document.getElementById('staff-full-video');
    const bottomArea = document.getElementById('image-modal-bottom');

    if (!imgEl || !videoEl) return;

    if (directUrl) {
      currentIndex = -1;
      currentSku = sku || '';
      imgEl.src = directUrl;
      imgEl.style.display = 'block';
      videoEl.style.display = 'none';
      videoEl.src = '';
    } else {
      currentIndex = idx;
      const item = currentGalleryList[idx];
      if (!item) return;
      
      if (item.url.toLowerCase().endsWith('.mp4') || item.isVideo) {
        imgEl.style.display = 'none';
        videoEl.style.display = 'block';
        videoEl.src = item.url;
      } else {
        imgEl.style.display = 'block';
        imgEl.src = item.url;
        videoEl.style.display = 'none';
        videoEl.src = '';
      }
    }

    updateWatermark();
    document.getElementById('staff-image-modal').style.display = 'flex';

  window.closeFullImg = function() {
    const modal = document.getElementById('staff-image-modal');
    const videoEl = document.getElementById('staff-full-video');
    if (modal) modal.style.display = 'none';
    if (videoEl) videoEl.src = ''; // 停止播放影片
  };

  window.navGallery = function(dir) {
    if (currentIndex === -1 || currentGalleryList.length === 0) return;
    currentIndex = (currentIndex + dir + currentGalleryList.length) % currentGalleryList.length;
    showFullImg(currentIndex);
  };

  window.updateWatermark = function() {
    const layer = document.getElementById('watermark-layer');
    const sSku = document.getElementById('check-sku').checked;
    const sQty = document.getElementById('check-stock').checked;
    const sP = document.getElementById('check-pyeong').checked;
    
    if (!layer) return;

    if (!sSku && !sQty && !sP) {
      layer.style.display = 'none';
      return;
    }

    const p = state.inventoryData.find(x => x.sku === currentSku);
    if (!p) {
      layer.style.display = 'none';
      return;
    }

    const wmSkuEl = document.getElementById('wm-sku');
    const wmDataEl = document.getElementById('wm-data');
    if (wmSkuEl) wmSkuEl.innerText = sSku ? p.sku : '';
    
    let dataText = '';
    let details = [];
    if (sQty) details.push('可用 ' + Math.floor(p.qty) + ' 片');
    if (sP) details.push(p.pyeong + ' 坪');
    if (details.length > 0) dataText = details.join(' ┃ ');

    if (wmDataEl) wmDataEl.innerText = dataText;
    layer.style.display = 'block';
  };

  // 下載或導出圖檔
  window.downloadOriginalImg = function() {

    if (url) {
      window.open(url, '_blank');
    }
  };

  // 單張分享至 LINE (秒級免驗證)
  window.shareSingleToLine = function() {
    const imgEl = document.getElementById('staff-full-img');
    if (!imgEl || imgEl.style.display === 'none') {
      showToast("影片不支援圖片分享");
      return;
    }

    const p = state.inventoryData.find(x => x.sku === currentSku);
    const showSku = document.getElementById('check-sku').checked;
    const showStock = document.getElementById('check-stock').checked;
    const showPyeong = document.getElementById('check-pyeong').checked;

      if (showPyeong) details.push(p.pyeong + "坪");

    window.open('https://line.me/R/msg/text/?' + encodeURIComponent(textWithLink), '_blank');

  window.batchAction = function(type) {
    const checkboxes = document.querySelectorAll('.gallery-check:checked');
    const selectedUrls = Array.from(checkboxes).map(cb => cb.getAttribute('data-url'));

    if (selectedUrls.length === 0) {
      showToast('請先勾選想要操作的照片');
      return;
    }

    if (type === 'preview') {
      const albumList = document.getElementById('staff-album-list');
      if (albumList) {
        albumList.innerHTML = selectedUrls.map(url => `
          <div style="margin-bottom:15px; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            <img src="${url.replace('=w400', '=w1200')}" style="width:100%; display:block;">
          </div>
        `).join('');
      }
      document.getElementById('staff-album-modal').style.display = 'flex';
    } else if (type === 'share') {
      let text = "【" + currentSku + "】精選影像分享\n\n";
      text += selectedUrls.map((url, i) => "圖" + (i + 1) + ": " + url.replace('=w400', '=w1200')).join("\n");
      
      _copyToClipboard(selectedUrls.join('\n'));
      window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text), '_blank');
    }

  // ─── 保留單查詢模組 ───────────────────────────────────────

  var reserveData = [];

  window.showReservations = function() {
    const nameEl = document.getElementById('reserve-title-text');

    const rList = document.getElementById('reserveList');

          reserveData = res.groups || [];
          renderReservations();
          
          // 渲染業務篩選清單
          const bizSet = new Set();
          reserveData.forEach(g => { if(g.biz) bizSet.add(g.biz); });

              </label>
            `).join('');

        }
      })
      .withFailureHandler(function(err) {
        if (rList) rList.innerHTML = `<div style="padding: 40px; text-align: center; color:#ff4d4d;">請求錯誤: ${err.toString()}</div>`;

    }
  };

  window.renderReservations = function() {
    const list = document.getElementById('reserveList');
    const sortVal = document.getElementById('reserve-sort-type').value;
    
    // 獲取已勾選的業務人員篩選
    const checkedBiz = Array.from(document.querySelectorAll('.biz-filter-cb:checked')).map(cb => cb.value);

    let filteredGroups = JSON.parse(JSON.stringify(reserveData));

    // 業務人員篩選
    if (checkedBiz.length > 0) {
      filteredGroups = filteredGroups.filter(g => checkedBiz.includes(g.biz));
    }

  function loadStockoutSubtitleAlert() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success || !res.msgs || !res.msgs.length) return;
        const msgs = res.msgs;
        const splashSubtitle = document.getElementById('ait-subtitle-splash');
        const dashSubtitle = document.getElementById('ait-subtitle-dashboard');
        let idx = 0;

        const show = function() {
          const item = msgs[idx % msgs.length];
          const text = (typeof item === 'string') ? item : item.text;
          const severe = (typeof item === 'object') && item.severe;
          [splashSubtitle, dashSubtitle].forEach(function(el) {
            if (!el) return;
            el.style.transition = 'opacity 0.5s ease';
            el.style.opacity = '0';
            setTimeout(function() {
              el.innerText = text;
              el.classList.add('breathing');
              el.style.color = severe ? '#ff6b6b' : '';
              el.style.opacity = '';
            }, 500);
          });
          idx++;
        };

        show();
        if (_stockoutTimer) clearInterval(_stockoutTimer);
        if (msgs.length > 1) _stockoutTimer = setInterval(show, 4000);
      })
      .getLatestStockoutEntries();
  }

    _renderJpg: function(g, fields, callback) {
      if (!g.photoUrl) { callback(null); return; }
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        var c = document.createElement('canvas');
        var ctx = c.getContext('2d');
        var infoH = 100;
        c.width = img.width;
        c.height = img.height + infoH;
        ctx.drawImage(img, 0, 0);
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, img.height, c.width, infoH);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px sans-serif';
        var y = img.height + 24;
        if (fields.series) { ctx.fillText('🏷️ ' + (g.series || '未命名'), 15, y); y += 26; }
        if (fields.sku) {
          ctx.font = '15px sans-serif';
          ctx.fillStyle = '#ccc';
          var s = g.items.map(function(it){ return it.sku; }).join(', ');
          ctx.fillText('🔢 ' + (s.length > 50 ? s.substring(0,50)+'...' : s), 15, y);
          y += 24;
        }
        if (fields.sales) {
          ctx.font = '16px sans-serif';
          ctx.fillStyle = '#facc15';
          ctx.fillText('💰 ' + Math.round(g.totalSalesAmt/10000) + '萬 / ' + Math.round(g.totalSalesQty) + '坪', 15, y);
          y += 22;
        }
        if (fields.date) {
          ctx.font = '14px sans-serif'; ctx.fillStyle = '#aaa';
          ctx.fillText('📅 ' + (g.items[0].installDate || g.items[0].lastUpdate || '—'), 15, y);
          y += 20;
        }
        if (fields.freq) {
          ctx.font = '14px sans-serif'; ctx.fillStyle = '#aaa';
          ctx.fillText('📊 ' + (g.totalFrequency || 0) + ' 次', 15, y);
        }
        c.toBlob(function(blob) { callback(blob); }, 'image/jpeg', 0.92);
      };
      img.onerror = function() { callback(null); };
      img.src = g.photoUrl;
    },
    toDownload: function() {
      var groups = state.sortedGroups || [];
      if (!groups.length) { showToast('沒有資料', 'error'); return; }
      showLoading(true, false, '正在生成 JPG...');
      var idx = 0;
      var el = document.getElementById('expSeries');
      if (!el) { showLoading(false); return; }
      var fields = {
        series: el.checked,
        sku: document.getElementById('expSku').checked,
        sales: document.getElementById('expSales').checked,
        date: document.getElementById('expDate').checked,
        freq: document.getElementById('expFreq').checked
      };
      function next() {
        if (idx >= groups.length) {
          showLoading(false);
          showToast('✅ JPG 已下載');
          var m = document.getElementById('batchExportModal');
          if (m) m.remove();
          return;
        }
        var g = groups[idx++];
        batchExport._renderJpg(g, fields, function(blob) {
          if (!blob) { next(); return; }
          var a = document.createElement('a');
          a.download = (g.series || '未命名').replace(/[\/?<>\\:*|" ]/g,'_') + '.jpg';

          a.href = url;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function() { URL.revokeObjectURL(url); next(); }, 500);
        });
      }
      next();
    },
    toEmail: function() {

      if (!groups.length) { showToast('沒有資料', 'error'); return; }
      var el = document.getElementById('expSeries');

        sales: document.getElementById('expSales').checked,
        date: document.getElementById('expDate').checked, freq: document.getElementById('expFreq').checked
      };
      showLoading(true, false, '正在生成 JPG...');

        if (idx >= groups.length) {
          if (results.length === 0) { showLoading(false); showToast('生成失敗', 'error'); return; }
          showLoadingWithStatus('正在寄送 Email...');
          google.script.run
            .withSuccessHandler(function(res) {
              showLoading(false);

              state.currentSales || '',

            );

        var g = groups[idx++];
        batchExport._renderJpg(g, fields, function(blob) {
          if (blob) {
            var reader = new FileReader();
            reader.onload = function() {
              var base64 = reader.result.split(',')[1];
              results.push({ data: base64, name: (g.series || '未命名').replace(/[\/?<>\\:*|" ]/g,'_') });
              next();
            };
            reader.readAsDataURL(blob);
          } else {
            next();
          }
        });
      }
      next();
    },
    toLine: function() {
      var groups = state.sortedGroups || [];
      if (!groups.length) { showToast('沒有資料', 'error'); return; }
      var el = document.getElementById('expSeries');
      if (!el) return;

        date: document.getElementById('expDate').checked, freq: document.getElementById('expFreq').checked
      };
      showLoading(true, false, '正在生成 JPG...');
      var idx = 0, blobs = [];
      function next() {
        if (idx >= groups.length) {
          showLoading(false);
          var m = document.getElementById('batchExportModal');
          if (m) m.remove();
          if (blobs.length === 0) { showToast('生成失敗', 'error'); return; }
          // 嘗試 navigator.share
          if (navigator.share && navigator.canShare) {
            var files = blobs.map(function(b, i) { return new File([b], '版面_' + (i+1) + '.jpg', {type:'image/jpeg'}); });
            if (navigator.canShare({files: files})) {
              navigator.share({files: files, title: '版面資料 - ' + (state.selectedCustomer || '')}).catch(function(){});
              return;
            }
          }
          // fallback: LINE URL
          var text = '📦 版面資料 - ' + (state.selectedCustomer || '') + '\n';
          groups.forEach(function(g, i) {
            text += '\n【' + (i+1) + '】' + (g.series || '未命名') + '\n';
            if (g.photoUrl) text += g.photoUrl + '\n';
          });
          // 行動用 line://，桌面用 https://
          if (/iPad|iPhone|iPod|Android/i.test(navigator.userAgent)) {
            window.open('line://msg/text/' + encodeURIComponent(text));
          } else {
            window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text));
          }
          showToast('💬 LINE 已開啟');
          return;
        }
        var g = groups[idx++];
        batchExport._renderJpg(g, fields, function(blob) {
          if (blob) blobs.push(blob);
          next();
        });
      }
      next();
    }
  };
</script>
