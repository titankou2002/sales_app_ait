  function normalizeSkuKey(value) {
    return String(value || '')
      .toUpperCase()
      .replace(/[\s\-－—–_＿\/\\()\uFEFF\u00A0]/g, '')
      .trim();
  }

  /**
   * 📸 讀取照片 GPS 資訊 (使用 EXIF.js)
   */
  function processImageGps(file, callback) {
    if (!window.EXIF) {
      console.warn("EXIF library not loaded");
      callback(null);
      return;
    }
    try {
      EXIF.getData(file, function() {
        try {
          var lat = EXIF.getTag(this, "GPSLatitude");
          var latRef = EXIF.getTag(this, "GPSLatitudeRef");
          var lng = EXIF.getTag(this, "GPSLongitude");
          var lngRef = EXIF.getTag(this, "GPSLongitudeRef");

          if (lat && latRef && lng && lngRef) {
            var convertDMSToDD = function(dms, ref) {
              if (!dms || dms.length < 3) return null;
              var d = typeof dms[0] === 'object' ? (dms[0].numerator / dms[0].denominator) : dms[0];
              var m = typeof dms[1] === 'object' ? (dms[1].numerator / dms[1].denominator) : dms[1];
              var s = typeof dms[2] === 'object' ? (dms[2].numerator / dms[2].denominator) : dms[2];
              var dd = d + m / 60.0 + s / 3600.0;
              if (ref === "S" || ref === "W") {
                dd = -dd;
              }
              return dd;
            };

            var latDD = convertDMSToDD(lat, latRef);
            var lngDD = convertDMSToDD(lng, lngRef);

            if (latDD !== null && lngDD !== null && !isNaN(latDD) && !isNaN(lngDD)) {
              callback({ lat: latDD, lng: lngDD });
              return;
            }
          }
        } catch (e) {
          console.error("Error parsing EXIF GPS data:", e);
        }
        callback(null);
      });
    } catch (err) {
      console.error("EXIF.getData failed:", err);
      callback(null);
    }
  }

  /**
   * 📍 更新新增版面時的 GPS 狀態與 UI 提示
   */
  function updateGpsStatus(type, message) {
    console.log("GPS Status:", type, message);
    var badge = document.getElementById('photo-gps-badge');
    if (!badge) return;
    badge.innerText = message;
    if (type === 'none') {
      badge.style.display = 'none';
    } else {
      badge.style.display = 'block';
      if (type === 'loading') {
        badge.style.background = 'rgba(234,179,8,0.9)'; // yellow
      } else if (type === 'photo') {
        badge.style.background = 'rgba(6,199,85,0.9)'; // green
      } else if (type === 'phone') {
        badge.style.background = 'rgba(0,122,255,0.9)'; // blue
      }
    }
  }

  /**
   * 🚀 載入動畫 (Canvas 粒子引擎 V2.0)
   */
  var particleEngine = {
    canvas: null,
    ctx: null,
    particles: [],
    logoPoints: [],
    isGathering: false,
    animationId: null,

    init: function () {
      this.canvas = document.getElementById('particleCanvas');
      if (!this.canvas) return;
      this.ctx = this.canvas.getContext('2d');
      this.resize();
      window.addEventListener('resize', () => this.resize());
      this.generateLogoPoints();
      this.generateParticles();
      this.animate();
    },

    resize: function () {
      this.canvas.width = window.innerWidth;
      this.canvas.height = window.innerHeight;
      this.generateLogoPoints();
    },

    generateLogoPoints: function () {
      const points = [];
      const cx = this.canvas.width / 2;
      const cy = this.canvas.height / 2 - 30;
      const s = 1.0; // 縮小整體比例以適應手機
      const tColor = '#e21b7a'; // 品牌桃紅色

      const drawLine = (x, y1, y2, color) => {
        for (let y = y1; y <= y2; y += 3) points.push({ x: cx + x, y: cy + y, c: color });
      };

      const drawHLine = (x1, x2, y, color) => {
        for (let x = x1; x <= x2; x += 3) points.push({ x: cx + x, y: cy + y, c: color });
      };

      const drawCircle = (x, y, r, startAngle, endAngle, color) => {
        for (let a = startAngle; a < endAngle; a += 0.23) {
          points.push({ x: cx + x + Math.cos(a) * r, y: cy + y + Math.sin(a) * r, c: color });
        }
      };

      // T 的大橫槓
      drawHLine(-145 * s, 145 * s, -25 * s, tColor);
      // T 的中心豎線
      drawLine(0, -25 * s, 40 * s, tColor);

      // 左側字母 e (正常方向)
      drawCircle(-118 * s, 18 * s, 16 * s, 0.2 * Math.PI, 1.8 * Math.PI, 'white');
      drawHLine(-118 * s, -102 * s, 18 * s, 'white');

      drawLine(-75 * s, -10 * s, 40 * s, 'white'); // l

      drawLine(-42 * s, 0, 40 * s, 'white'); // i
      points.push({ x: cx - 42 * s, y: cy - 12 * s, c: 'white' }); // i dot

      // 右側字母 i l e
      drawLine(42 * s, 0, 40 * s, 'white'); // i
      points.push({ x: cx + 42 * s, y: cy - 12 * s, c: 'white' }); // i dot

      drawLine(75 * s, -10 * s, 40 * s, 'white'); // l

      // 最後一個 e (鏡像方向)
      drawCircle(118 * s, 18 * s, 16 * s, -0.8 * Math.PI, 0.8 * Math.PI, 'white');
      drawHLine(102 * s, 118 * s, 18 * s, 'white');

      this.logoPoints = points;
    },

    generateParticles: function () {
      const count = 300;
      this.particles = [];
      for (let i = 0; i < count; i++) {
        const p = {
          x: Math.random() * this.canvas.width,
          y: Math.random() * this.canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          size: 1.5 + Math.random(),
          opacity: 0.3 + Math.random() * 0.4,
          targetX: 0,
          targetY: 0,
          color: 'white',
          progress: 0,
          isGathering: i < this.logoPoints.length
        };

        if (p.isGathering) {
          const lp = this.logoPoints[i];
          p.targetX = lp.x;
          p.targetY = lp.y;
          p.color = lp.c;
          p.startX = p.x;
          p.startY = p.y;
        }
        this.particles.push(p);
      }
    },

    setGathering: function (val) {
      if (val === this.isGathering) return;
      this.isGathering = val;
      if (val) {
        // 開始匯聚：紀錄當前點作為起點
        this.particles.forEach(p => {
          p.startX = p.x;
          p.startY = p.y;
          p.progress = 0;
        });
      }
    },

    animate: function () {
      this.ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
      this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

      this.particles.forEach(p => {
        if (this.isGathering && p.isGathering) {
          if (p.progress < 1) p.progress += 0.006; // 慢速匯聚
          const t = 1 - Math.pow(1 - p.progress, 3); // Ease out
          p.x = p.startX + (p.targetX - p.startX) * t;
          p.y = p.startY + (p.targetY - p.startY) * t;
          p.opacity = Math.min(1, 0.4 + t * 0.6);
        } else {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;
        }

        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        this.ctx.fillStyle = p.color === 'white'
          ? `rgba(255, 255, 255, ${p.opacity * 0.7})`
          : p.color.replace(')', `, ${p.opacity * 0.9})`).replace('rgb', 'rgba');
        // 🚀 根據需求移除白影 (Shadow)
        this.ctx.shadowBlur = 0;
        this.ctx.fill();
      });

      this.animationId = requestAnimationFrame(() => this.animate());
    }
  };

  /**
   * 📢 系統提示 (Toast)
   */
  function showToast(msg, type = 'success') {
    const toast = document.createElement('div');
    toast.className = 'toast-message';
    if (type === 'error') {
      toast.style.background = '#f2f2f7';
      toast.style.color = '#000';
      toast.style.boxShadow = '0 10px 40px rgba(0,0,0,0.4)';
      toast.style.borderRadius = '16px';
      toast.style.padding = '18px 25px';
      toast.style.width = '280px';
      toast.style.textAlign = 'left';
      toast.style.lineHeight = '1.4';
      toast.innerHTML = '<span style="font-size:24px; margin-right:12px; float:left;">❌</span>';
      var msgDiv = document.createElement('div');
      msgDiv.style.cssText = 'font-weight:900;font-size:15px;';
      msgDiv.textContent = msg;
      toast.appendChild(msgDiv);
    } else {
      toast.textContent = '✅ ' + msg;
    }
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add('active'), 50);
    setTimeout(() => {
      toast.classList.remove('active');
      setTimeout(() => { if(toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }, 3000);
  }

  /**
   * 📋 顯示保留細項彈窗 (多行顯示)
   */

      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;backdrop-filter:blur(6px);';
      overlay.innerHTML = '<div style="background:#1e293b;border-radius:20px;padding:20px;max-width:320px;width:100%;border:1px solid rgba(255,255,255,0.1);box-shadow:0 25px 50px rgba(0,0,0,0.5);">' +
        '<div style="font-size:14px;font-weight:800;color:#facc15;margin-bottom:14px;">📋 保留細項</div>' +
        '<div id="reserve-info-body" style="font-size:13px;line-height:1.8;color:rgba(255,255,255,0.85);"></div>' +
        '<button onclick="document.getElementById(\'reserve-info-overlay\').style.display=\'none\';" style="margin-top:16px;width:100%;height:42px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;">關閉</button>' +
        '</div>';
      overlay.onclick = function(e) { if(e.target === overlay) overlay.style.display = 'none'; };
      document.body.appendChild(overlay);
    }
    var body = document.getElementById('reserve-info-body');
    if (body) body.innerHTML = items.map(function(s){ return '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);">• ' + s + '</div>'; }).join('');
    overlay.style.display = 'flex';
  };

  /**
   * 🚨 統一伺服器錯誤處理
   */
  window.handleGASFailure = function(err) {
    if (typeof showLoading === 'function') showLoading(false);
    const msg = (err && err.message) ? err.message : String(err);
    console.error("GAS Error:", err);
    alert("⚠️ 系統通訊異常\n\n錯誤資訊：" + msg + "\n\n若持續發生，請檢查網路或聯繫管理員。");
  };

  /**
   * 🐞 全域 JS 錯誤捕捉
   */
  window.onerror = function(msg, url, lineNo, columnNo, error) {
    console.error("Runtime Error:", msg, lineNo);
    alert("⚡ 程式執行出錯\n\n" + msg + "\n(行: " + lineNo + ")");
    return false;
  };

  var _loadingTimer = null;

  function showLoading(show, gatherLogo, statusMsg) {
    var overlay = document.getElementById('loading-overlay');
    if (!overlay) return;
    var bar = document.getElementById('loading-progress-bar');
    var statusEl = document.getElementById('loading-status-text');
    var titleEl = overlay.querySelector('.loading-text');

    if (show) {
      overlay.style.display = 'flex';
      overlay.style.backgroundColor = gatherLogo ? '#000' : 'rgba(0,0,0,0.5)';
      if (titleEl) titleEl.textContent = 'LOADING';
      if (statusEl) statusEl.textContent = statusMsg || '';
      particleEngine.setGathering(!!gatherLogo);
      _startProgressAnim(bar);
    } else {
      if (bar) { bar.style.transition = 'width 0.2s'; bar.style.width = '100%'; }
      setTimeout(function() {
        overlay.style.display = 'none';
        if (bar) { bar.style.transition = 'none'; bar.style.width = '0%'; }
        if (titleEl) titleEl.textContent = 'LOADING';
        if (statusEl) statusEl.textContent = '';
        _stopProgressAnim();
        if (particleEngine.animationId) cancelAnimationFrame(particleEngine.animationId);
      }, 300);
    }
  }

  function showLoadingWithStatus(statusMsg) {
    showLoading(true, false, statusMsg);
  }

  function _startProgressAnim(bar) {
    _stopProgressAnim();
    if (!bar) return;
    var progress = 0;
    bar.style.transition = 'width 0.4s ease';
    bar.style.width = '0%';
    _loadingTimer = setInterval(function() {
      var remaining = 90 - progress;
      progress += remaining * 0.08;
      bar.style.width = Math.min(progress, 90) + '%';
    }, 300);
  }

  function _stopProgressAnim() {
    if (_loadingTimer) { clearInterval(_loadingTimer); _loadingTimer = null; }
  }

  // ─── 統一星空粒子引擎 ──────────────────────────────────
  function initParticleCanvas(canvasId) {
    var canvas = document.getElementById(canvasId);
    if (!canvas || canvas.dataset.running === 'true') return;
    canvas.dataset.running = 'true';
    var ctx = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    var particles = [];
    for (var i = 0; i < 150; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        size: (1.5 + Math.random() * 1.5) * 0.8,
        baseOpacity: 0.2 + Math.random() * 0.4,
        flash: 0,
        flashSpeed: 0.01 + Math.random() * 0.02
      });
    }

    function animate() {
      const page = canvas.closest('.page');
      if (!page || !page.classList.contains('active')) {
        requestAnimationFrame(animate);
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function(p) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        if (p.flash > 0) p.flash -= 0.04; 
        else if (Math.random() > 0.9995) p.flash = 1;
        var opacity = p.baseOpacity + Math.sin(Date.now() * p.flashSpeed) * 0.15 + p.flash * 0.6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 + p.flash * 2), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + opacity + ')';
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();
  }

  // 門戶導向函式
  window.openAlbumModule = function() { 
    state.currentFlow = 'album';
    if (state.currentSales) {
      selectSales(state.currentSales);
    } else {
      showPage('sales-page'); 
    }
  };
  window.openLogisticsModule = function() { showToast('系統建置中...'); };

  function init() {
    edgeSwipe.init(); 
    
    const params = APP_CONFIG.params || {};
    const isClientFlow = (params.view === 'client' || params.customer || params.clientName);
    
    if (isClientFlow) {
      // 🚀 對齊客戶端身分，確保分享連結進入 (deep link) 也可正常反查真實名稱與扣減次數
      const targetClientName = params.clientName || params.customer;
      const isClientPortal = params.view === 'client';
      if (targetClientName) {
        window.clientState = window.clientState || { userId: '', userName: '', userCompany: '', isAuthorized: false };
        const info = (window.APP_CONFIG && APP_CONFIG.clientInfo) ? APP_CONFIG.clientInfo : { name: targetClientName, company: "訪客客戶", level: "LEVEL 2" };
        window.clientState.userId = 'DIRECT_' + (info.name || targetClientName);
        window.clientState.userName = info.name || targetClientName;
        window.clientState.userCompany = info.company || '訪客客戶';
        window.clientState.level = info.level || 'LEVEL 2';
        window.clientState.isAuthorized = true;
        
        try {
          localStorage.setItem('AIT_CLIENT_USER_ID', window.clientState.userId);
          localStorage.setItem('AIT_CLIENT_USER_NAME', window.clientState.userName);
          localStorage.setItem('AIT_CLIENT_USER_COMPANY', window.clientState.userCompany);
          localStorage.setItem('AIT_CLIENT_LEVEL', window.clientState.level);
        } catch(e){}
        
        // 🚀 效能優化：客戶端門戶 (=view client) 的權威身分驗證與產品資料由 initClientPortal()
        //    內的 verifyClientDirectAccess 一次完成，這裡的背景 RPC 只會讓同一包資料重複抓取，
        //    所以只保留給「業務 deep-link 看待客戶版面」的流程使用。
        if (!isClientPortal) {
          // 異步向後端獲取詳細白名單身分 (為 LOG 工作表作準備的備用 fallback)
          google.script.run
            .withSuccessHandler(function (res) {
              if (res && res.success && res.isAuthorized) {
                window.clientState.userName = res.name;
                window.clientState.userCompany = res.company;
                window.clientState.level = res.level;
                window.clientState.isAuthorized = true;
                try {
                  localStorage.setItem('AIT_CLIENT_USER_ID', window.clientState.userId);
                  localStorage.setItem('AIT_CLIENT_USER_NAME', window.clientState.userName);
                  localStorage.setItem('AIT_CLIENT_USER_COMPANY', window.clientState.userCompany);
                  localStorage.setItem('AIT_CLIENT_LEVEL', window.clientState.level);
                } catch(e){}
              }
            })
            .verifyClientDirectAccess(targetClientName, params.key || '');
        }
      }
      
      // 🚀 外部客戶/訪客查詢：放行進入，但功能受限（必須輸入坪數且無具體庫存）
      _startAppFlow();
      // 🚀 效能優化：客戶端門戶畫面完全由 window.allProducts 驅動（initClientPortal 載入），
      //    不依賴 state.inventoryData，這裡再跑 loadInventoryData() 只是白抓一整包庫存，故跳過。
      if (!isClientPortal) {
        loadInventoryData();
      }
      return;
    }
    
    // 🚀 全局業務金鑰強校驗：內部員工沒金鑰的 100% 擋在大門外！
    let sales = params.sales || '';
    let key = params.key || '';
    
    // 如果 URL 沒帶，從 LocalStorage 讀取
    if (!sales || !key) {
      try {
        sales = localStorage.getItem('ag_current_sales') || '';
        key = localStorage.getItem('ag_current_key') || '';
      } catch(e){}
    }

    // 🚀 沒有金鑰 ➡️ 瞬間解鎖攔截，休想進入系統任何分頁！
    if (!sales || !key) {
      lockSystem("偵測到未授權存取。請使用您的專屬直達連結登入。");
      return;
    }

    // 🚀 極速秒進（Optimistic Instant Launch）：
    // 若已有金鑰，無需在門口等待 RPC 網路往返！
    // 立即預填身份、觸發過場與背景資料載入，同時在背景併發校驗金鑰！
    state.currentSales = sales;
    const disp = document.getElementById('sales-name-display');
    if (disp) disp.innerText = sales;
    if (typeof checkDeliveryBadge === 'function') checkDeliveryBadge(sales);

    if (params.view === 'inventory') {
      _startAppFlow();
    } else {
      runSplashScreen();
    }

    loadInventoryData();
    loadStockoutSubtitleAlert();
    loadLayoutActivities();
    setTimeout(function () { if (typeof warmupCustomerData_ === 'function') warmupCustomerData_(state.currentSales); }, 2500);
    if (typeof loadSalesOverview === 'function') loadSalesOverview();

    _runVerifySalesKey(sales, key, params, 0);
  }

  // 🚀 背景金鑰驗證：驗證通過更新 LocalStorage；若已被後端註銷停用，才將頁面鎖定。
  function _runVerifySalesKey(sales, key, params, attempt) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          state.currentSales = sales;
          try {
            localStorage.setItem('ag_current_sales', sales);
            localStorage.setItem('ag_current_key', key);
          } catch(e){}
        } else {
          try {
            localStorage.removeItem('ag_current_sales');
            localStorage.removeItem('ag_current_key');
          } catch(e){}
          lockSystem("您的安全金鑰已失效，或已被系統管理員註銷停用。");
        }
      })
      .withFailureHandler(function(err) {
        if (attempt < 2) {
          setTimeout(function() { _runVerifySalesKey(sales, key, params, attempt + 1); }, 1200 * (attempt + 1));
          return;
        }
      })
      .verifySalesKey(sales, key);
  }

  function lockSystem(reasonText, opts) {
    opts = opts || {};
    // 隱藏 Splash 載入頁
    const splash = document.getElementById('splash-page');
    if (splash) splash.style.display = 'none';

    // 隱藏 Loading
    showLoading(false);

    // 顯示全局「存取遭拒」磨砂警告層
    const mask = document.getElementById('global-access-denied-mask');
    if (mask) {
      mask.style.display = 'flex';

      const pEl = mask.querySelector('p');
      if (pEl && reasonText) {
        pEl.innerText = reasonText;

      // 🚀 網路/連線類失敗（可能只是暫時的）：標題別再嚇人地寫「金鑰無效」，並提供重試按鈕，
      // 讓業務不用整個關掉重開連結，一鍵就能再試一次。
      const titleEl = document.getElementById('access-denied-title');
      if (titleEl) {
        titleEl.innerText = opts.retryable ? '存取暫時失敗：連線異常' : '存取遭拒：安全金鑰無效';
      }
      const retryBtn = document.getElementById('access-denied-retry-btn');
      if (retryBtn) {
        retryBtn.style.display = opts.retryable ? 'inline-block' : 'none';
      }
    }
    console.error("🔒 系統已安全鎖定：", reasonText);
  }

  function loadSalesList() {
    const grid = document.getElementById('salesSelection');
    if (!grid) return;

    // 🚀 秒顯：先渲染上次抓過的名單（localStorage），背景再抓最新，不必等 RPC
    let localList = null;
    try { localList = JSON.parse(localStorage.getItem('ag_sales_list_cache') || 'null'); } catch (e) {}
    if (localList && Array.isArray(localList) && localList.length) {
      renderSalesButtons_(grid, localList);
    } else {
      grid.innerHTML = '<div style="color:white; font-size: 20px; font-weight: 700; text-align:center; padding:40px; width:100%; letter-spacing: 4px;">正在讀取雲端名單...</div>';
    }

    google.script.run.withSuccessHandler(function(res) {
      if (res && res.success && res.data && res.data.length) {
        try { localStorage.setItem('ag_sales_list_cache', JSON.stringify(res.data)); } catch(e){}
        renderSalesButtons_(grid, res.data);
        setTimeout(prewarmCustomerLists_, 4000);   // 🔥 開機後背景預熱各業務客戶清單
      } else {
        // 已有秒顯名單就保留，不再蓋成錯誤訊息
        if (!grid.querySelector('.btn-sales-premium')) {
          grid.textContent = '載入失敗: ' + ((res && res.msg) || '未知錯誤');
          grid.style.cssText = 'color:white; opacity:0.5; text-align:center; padding:20px; width:100%;';

  function renderSalesButtons_(grid, list) {

  function runSplashScreen() {
    const pb = document.getElementById('progressBar');
    const pt = document.getElementById('progressText');
    const steps = [
      { p: 35, t: '系統連線中...' },
      { p: 75, t: '載入系統元件...' },
      { p: 100, t: '準備就緒' }
    ];
    let step = 0;
    const interval = setInterval(() => {
      if (step < steps.length) {
        if (pb) pb.style.width = steps[step].p + '%';
        if (pt) pt.innerText = steps[step].t;
        step++;
      } else {
        clearInterval(interval);
        // 🚀 效能優化：極速過場，停留時間縮短至 60ms
        setTimeout(showSalesSelection, 60);
      }
    }, 70);

  function loadInventoryData() {
    if (state.inventoryFetching) return; // 已經有一包在抓了，不重複下載
    // 🚀 快取優先 (Cache-First) 策略
    if (!state.isInventoryLoaded) {
      try {
        const localCached = localStorage.getItem('ag_inventory_cache');
        if (localCached) {
          const parsed = JSON.parse(localCached);
          if (parsed && parsed.length > 0) {
            state.inventoryData = parsed;
            // 標記已經有基礎資料可用（避免 UI 顯示為空），但背後仍去抓最新的
            console.log('⚡ 已從 LocalStorage 瞬間載入庫存快取 (' + parsed.length + ' 筆)');
            
            // 若此時正看著陳列牆，先用舊快取渲染，達成 0 秒瞬間載入
            if (document.getElementById('page-album') && document.getElementById('page-album').classList.contains('active')) {
              renderAlbum();
              renderHistory();
            }
          }
        }
      } catch(e) {
        console.warn('讀取本地庫存快取失敗:', e);
      }
    }

    // 🚀 效能優化：第一次進場（無本地快取可秒顯）時先把「輕量版庫存」抓回來秒繪陳列牆，
    //    完整包（含 scenes/batches 圖片明細、數 MB）由底下的 getAggregatedInventory 背景接手，
    //    到齊後覆蓋並寫回 localStorage。light=true 表示細圖/批號尚未就緒，相關互動會提示載入中。
    if (!state.inventoryData || state.inventoryData.length === 0) {
      google.script.run
        .withSuccessHandler(function (lres) {
          if (lres && lres.success && lres.data && lres.data.length) {
            state.inventoryData = lres.data;
            state.inventoryLoadFailed = false;
            console.log('⚡ 輕量版庫存先行秒繪 (' + lres.data.length + ' 筆, scenes/batches 待完整包)');
            if (document.getElementById('page-album') && document.getElementById('page-album').classList.contains('active')) {
              renderAlbum();
              renderHistory();
            }
          }
        })
        .withFailureHandler(function () {})
        .getInventoryLightData();
    }

    state.inventoryFetching = true;
    google.script.run
      .withSuccessHandler(function(res) {
        state.inventoryFetching = false;
        clearTimeout(state.inventoryLoadTimeoutTimer);
        if (res && res.success) {
          state.inventoryData = res.data;
          state.isInventoryLoaded = true;
          state.inventoryLoadedAt = Date.now();
          state.inventoryLoadFailed = false;

          // 🚀 將最新資料同步回寫至 LocalStorage
          try {
            localStorage.setItem('ag_inventory_cache', JSON.stringify(res.data));
          } catch(e) {}

          // 🚀 關鍵修正：若已開啟客戶陳列牆，在背景載入完成時自動重新渲染，以套用正確的缺貨框顏色
          if (document.getElementById('page-album') && document.getElementById('page-album').classList.contains('active')) {
            renderAlbum();
            renderHistory();
          }

          // 若在客制庫存查詢頁，自動執行查詢
          if (document.getElementById('page-inventory') && document.getElementById('page-inventory').classList.contains('active')) {
            handleInventorySearch();
          }
        } else {
          state.inventoryLoadFailed = true;
          showToast('資料載入失敗: ' + (res.msg || '未知原因'));
          if (document.getElementById('page-inventory') && document.getElementById('page-inventory').classList.contains('active')) {
            handleInventorySearch();
          }
        }
      })
      .withFailureHandler(function(err) {
        // 🐛 [修正] 原本完全沒有失敗處理：伺服器端一出錯或逾時就整個沒反應，
        //    isInventoryLoaded 永遠是 false，畫面卡死在「資料載入中」看不出發生什麼事。
        state.inventoryFetching = false;
        clearTimeout(state.inventoryLoadTimeoutTimer);
        state.inventoryLoadFailed = true;
        console.error('庫存資料載入失敗:', err);
        if (document.getElementById('page-inventory') && document.getElementById('page-inventory').classList.contains('active')) {
          handleInventorySearch();
        } else {
          showToast('庫存資料載入失敗，請稍後再試');
        }
      })
      .getAggregatedInventory();
  }

  /**
   * 👈 手勢管理：修復 Apps Script 無法滑動返回的遺憾
   */
  var edgeSwipe = {
    startX: 0,
    startTime: 0,
    active: false,
    init: function() {
      document.addEventListener('touchstart', (e) => {
        this.startX = e.touches[0].clientX;
        this.startTime = Date.now();
        // 只有從螢幕左邊緣 (40px 內) 開始的滑動才有效
        this.active = (this.startX < 40);
      }, {passive: true});

      document.addEventListener('touchend', (e) => {
        if (!this.active) return;
        
        // 🚀 修正：如果是客戶端模式，禁止右滑返回主後台
        if (APP_CONFIG.params.view === 'client') return;

        const endX = e.changedTouches[0].clientX;
        const duration = Date.now() - this.startTime;
        const dist = endX - this.startX;

        // 判斷邏輯：向右滑動至少 70px，且時間在 300ms 內 (快滑)
        if (dist > 70 && duration < 300) {
          this.triggerBack();
        }
        this.active = false;
      }, {passive: true});
    },
    triggerBack: function() {
      // 尋找當前活動頁面中的返回按鈕並觸發點擊
      const activePage = document.querySelector('.page.active');
      if (activePage) {
        const backBtn = activePage.querySelector('.nav-back');
        if (backBtn) {
          backBtn.click();
          console.log('🚀 手勢觸發：返回上一頁');
        } else {
          // 如果沒有返回按鈕，嘗試回主畫面
          showPage('page-dashboard');
        }
      }
    }
  };

  /**
   * 🗺️ 全域導航監聽 (修復返回鍵失效)
   */
  document.addEventListener('click', function(e) {
    const btn = e.target.closest('.nav-back');
    if (!btn) return;

    if (target) {

    // 🚀 保留日誌秒進：App 打開幾秒後已在背景載好 (loadReserveFrame_)，按進去直接顯示；
    //    30 分鐘內不重載，超過或換了登入、帶了篩選才重新載入。
    if (pageId === 'page-reserve') loadReserveFrame_(true);

  /**
   * 載入保留日誌 iframe。show=true：使用者按進來 (還沒載好就顯示讀取動畫)；show=false：背景預先載入。
   * 帶上版面神器的登入憑證 (保留系統用它確認是誰)；window.__RSV_EXTRA__ 是要套用的篩選 (例如 &tab=reserve&q=客戶)，用一次就清掉。
   */
  window.loadReserveFrame_ = function (show) {
    const f = document.querySelector('#page-reserve iframe');
    if (!f || !f.getAttribute('data-base-src')) return;
    const aitTok = (window.AIT && AIT.token && AIT.token()) || '';
    if (!aitTok && !show) return; // 背景預載一定要有登入憑證
    const extra = show ? (window.__RSV_EXTRA__ || '') : '';
    if (show) window.__RSV_EXTRA__ = '';
    const rl = document.getElementById('reserve-loading');
    const rlText = document.getElementById('reserve-loading-text');
    const rlSub = document.getElementById('reserve-loading-sub');
    const loadedAt = Number(f.getAttribute('data-loaded-at') || 0);
    const reuse = loadedAt && Date.now() - loadedAt < 30 * 60 * 1000 && f.getAttribute('data-tok') === aitTok && !extra;
    const showSpinner = function () {
      if (!rl || !show) return;
      rl.style.display = 'flex';
      if (rlText) rlText.textContent = '正在打開保留日誌…';
      if (rlSub) rlSub.textContent = '第一次打開約需 5～10 秒';
      clearTimeout(window.__rlSlowTimer);
      window.__rlSlowTimer = setTimeout(function () {
        if (rl.style.display !== 'none' && rlText) { rlText.textContent = '網路較慢，還在載入…'; if (rlSub) rlSub.textContent = '請再稍等一下'; }
      }, 15000);
    };
    if (reuse) {
      if (f.getAttribute('data-ready') === '1') { if (rl) rl.style.display = 'none'; }
      else showSpinner(); // 背景還在載，載好會自動收起
      return;
    }
    f.setAttribute('data-loaded-at', String(Date.now()));
    f.setAttribute('data-tok', aitTok);
    f.setAttribute('data-ready', '0');
    showSpinner();
    f.onload = function () {
      f.setAttribute('data-ready', '1');
      if (rl) rl.style.display = 'none';
      clearTimeout(window.__rlSlowTimer);
    };
    f.src = f.getAttribute('data-base-src') + '?view=reserve&r=' + Date.now() + (aitTok ? '&t=' + encodeURIComponent(aitTok) : '') + extra;
  };

  // 📦 開保留日誌並套用篩選 (query 例如 'tab=reserve&q=客戶')；只放行保留日誌認得的篩選參數
  window.openReserveWithFilter = function (query) {
    var allow = ['tab', 'rep', 'kpi', 'deposit', 'updated', 'shipped', 'sort', 'dir', 'q', 'branch'];
    var extra = '';
    try {
      new URLSearchParams(String(query || '')).forEach(function (v, k) {
        if (allow.indexOf(k) !== -1) extra += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(v);
      });
    } catch (e) { }
    window.__RSV_EXTRA__ = extra;
    showPage('page-reserve');
  };

  /**
   * 👤 業務姓名快速切換：點姓名展開名單 → 點人秒切（客戶清單已預熱，直接顯示，背景再校正）
   */
  state.custListCache = state.custListCache || {};
  var _prewarmRunning = false;
  function getSalesNamesForSwitch_() {
    var list = [];
    try { list = JSON.parse(localStorage.getItem('ag_sales_list_cache') || '[]') || []; } catch (e) {}
    return Array.isArray(list) ? list : [];
  }
  /**
   * 🔥 客戶版面預取：進首頁後背景先讀「客戶清單」，再依等級（特→A→B→C）逐一預取版面資料，
   * 填進 state.custLayoutCache。之後點客戶就是秒開（selectCustomer 本來就會先用快取秒顯）。
   * 一次只跑一個請求；使用者自己點客戶讀取時會暫停，不跟使用者搶伺服器。
   */
  var _layoutPrefetchToken = 0;
  window.warmupCustomerData_ = function (sales) {
    if (!sales) return;
    var cached = state.custListCache[sales];
    if (cached) { prefetchLayouts_(sales, cached); return; }
    google.script.run.withSuccessHandler(function (res) {
      if (res && res.success) {
        state.custListCache[sales] = res.data;
        prefetchLayouts_(sales, res.data);
      }
    }).getCustomerList(sales);
  };
  function prefetchLayouts_(sales, list) {
    var token = ++_layoutPrefetchToken;
    var order = { '特': 0, 'A': 1, 'B': 2, 'C': 3 };
    var queue = (list || []).filter(function (c) { return !c.hidden && c.name && !state.custLayoutCache[c.name]; })
      .sort(function (a, b) {
        var la = order[String(a.level || '').trim()], lb = order[String(b.level || '').trim()];
        return (la === undefined ? 9 : la) - (lb === undefined ? 9 : lb);
      }).slice(0, 20).map(function (c) { return c.name; });
    (function next() {
      if (token !== _layoutPrefetchToken || state.currentSales !== sales) return;   // 已換人或有新一輪
      if (!queue.length) return;
      if (state.userFetching) { setTimeout(next, 800); return; }                    // 使用者正在讀，讓路
      var name = queue.shift();
      if (state.custLayoutCache[name]) { next(); return; }
      google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.success && !state.custLayoutCache[name]) state.custLayoutCache[name] = { active: r.active, history: r.history, ts: Date.now() };
          setTimeout(next, 150);
        })
        .withFailureHandler(function () { setTimeout(next, 500); })
        .getCustomerDisplays(name);
    })();
  }

  /** 確保本機有業務名單（直達連結不會經過業務選擇頁，名單可能是空的） */
  function ensureSalesNames_(cb) {
    if (getSalesNamesForSwitch_().length) { cb && cb(); return; }
    google.script.run.withSuccessHandler(function (res) {
      if (res && res.success && res.data && res.data.length) {
        try { localStorage.setItem('ag_sales_list_cache', JSON.stringify(res.data)); } catch (e) {}
      }
      cb && cb();
    }).withFailureHandler(function () { cb && cb(); }).getSalesList(true);
  }
  /** 🔥 預熱：依序在背景讀取每位業務的客戶清單，之後切換就是秒開 */
  function prewarmCustomerLists_() {
    if (_prewarmRunning) return;
    var names = getSalesNamesForSwitch_().filter(function (n) { return !state.custListCache[n]; });
    if (!names.length) return;
    _prewarmRunning = true;
    var i = 0;
    (function next() {
      if (i >= names.length) { _prewarmRunning = false; return; }
      var n = names[i++];
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) state.custListCache[n] = res.data;
          setTimeout(next, 300);
        })
        .withFailureHandler(function () { setTimeout(next, 300); })
        .getCustomerList(n);
    })();
  }
  function closeSalesQuickMenu_() {
    var m = document.getElementById('sales-quick-menu'), b = document.getElementById('sales-switch-btn');
    if (m) m.style.display = 'none';
    if (b) b.classList.remove('open');
  }

    if (m.style.display !== 'none') { closeSalesQuickMenu_(); return; }

      m.style.display = 'block'; if (b) b.classList.add('open');

    m.innerHTML = names.map(function (n) {
      var cur = (n === state.currentSales);
      return '<div class="ait-name-item' + (cur ? ' current' : '') + '" role="option" data-n="' + encodeURIComponent(n) + '" onclick="quickSwitchSales(this)"><span>' + n.replace(/</g, '&lt;') + '</span>' + (cur ? check : '') + '</div>';
    }).join('');

  window.quickSwitchSales = function (el) {
    var name = decodeURIComponent(el.getAttribute('data-n'));
    if (name === state.currentSales) { closeSalesQuickMenu_(); return; }
    el.classList.add('picked');            // 綠色確認回饋

    state.currentSales = name;
    try { localStorage.setItem('ag_current_sales', name); } catch (e) {}

      if (g) g.innerHTML = '<div class="ait-loading-box" style="padding:40px 0;grid-column:1/-1;"><div class="ait-spinner ait-spinner-sm"></div><div>載入客戶中...</div></div>';
    }
    warmupCustomerData_(name);
    // 背景校正（資料有變才重畫，避免閃爍）
    google.script.run.withSuccessHandler(function (res) {
      if (!res || !res.success) return;
      var changed = JSON.stringify(res.data) !== JSON.stringify(state.custListCache[name]);
      state.custListCache[name] = res.data;
      if (changed && state.currentSales === name) {
        state.allCustomers = res.data;
        var q = document.getElementById('customerSearch');

  /**
   * 🟡 階段 2：客戶邏輯 (4 欄網格)
   */
  function renderCustomerList(data) {
    var grid = document.getElementById('customer-grid');
    grid.innerHTML = '';

    var visible = data.filter(function(c) { return !c.hidden; });
    var hiddenList = data.filter(function(c) { return c.hidden; });

    // 依等級分組：特 → A → B → C → 未分級
    var levelOrder = ['特', 'A', 'B', 'C'];
    var levelLabel = { '特': '特級', 'A': 'A級', 'B': 'B級', 'C': 'C級', '': '未分級' };
    var groups = {};
    visible.forEach(function(c) {
      var lv = String(c.level || '').trim();
      var key = levelOrder.indexOf(lv) !== -1 ? lv : '';
      (groups[key] = groups[key] || []).push(c);
    });

    function makeItem(c, isHidden) {
      var item = document.createElement('div');
      item.className = 'customer-item';
      item.style.position = 'relative';
      if (isHidden) item.style.opacity = '0.5';
      item.innerHTML = '<div class="customer-name">' + c.name + '</div>';

      // 👁 顯示/隱藏切換鈕
      var eye = document.createElement('div');
      eye.innerText = isHidden ? '＋' : '－';
      eye.title = isHidden ? '恢復顯示' : '隱藏此客戶';
      eye.style.cssText = 'position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%;' +
        'background:rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.3); color:rgba(255,255,255,0.7);' +
        'font-size:14px; font-weight:900; display:flex; align-items:center; justify-content:center; z-index:5;';
      eye.onclick = function(e) {
        e.stopPropagation();
        toggleCustomerVisibility(c.name, isHidden);
      };
      item.appendChild(eye);

      item.onclick = function () { selectCustomer(c.name); };
      return item;
    }

    function addHeader(text) {
      var h = document.createElement('div');
      h.style.cssText = 'grid-column:1 / -1; font-size:12px; font-weight:900; letter-spacing:3px; color:rgba(250,204,21,0.75); margin:6px 0 -4px; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:4px;';
      h.innerText = text;
      grid.appendChild(h);
    }

    levelOrder.concat(['']).forEach(function(lv) {
      var list = groups[lv];
      if (!list || !list.length) return;
      addHeader(levelLabel[lv] + '（' + list.length + '）');
      list.forEach(function(c) { grid.appendChild(makeItem(c, false)); });
    });

    // 🙈 未顯示版面區（預設收合）
    if (hiddenList.length) {
      var det = document.createElement('details');
      det.style.cssText = 'grid-column:1 / -1; margin-top:16px; border:1px solid rgba(255,255,255,0.12); border-radius:12px; background:rgba(255,255,255,0.03);';
      var sum = document.createElement('summary');
      sum.style.cssText = 'padding:10px 14px; cursor:pointer; font-size:13px; font-weight:800; color:rgba(255,255,255,0.5); letter-spacing:2px; list-style:none;';
      sum.innerText = '🙈 未顯示版面（' + hiddenList.length + '）';
      det.appendChild(sum);
      var inner = document.createElement('div');
      inner.style.cssText = 'display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; padding:12px;';
      hiddenList.forEach(function(c) { inner.appendChild(makeItem(c, true)); });
      det.appendChild(inner);
      grid.appendChild(det);
    }
  }

  function selectCustomer(customerName, callback) {

    // 🚀 秒顯：同一個 session 已開過的客戶直接先渲染舊版面（不轉圈），背景 RPC 回來再更新

          showToast('伺服器回傳錯誤: ' + (response.msg || '未知'), 'error');

  // 🚀 套用（或秒顯重複套用）特定客戶的版面資料；isRefresh 只是語意標記，不需額外行為
  function applyCustomerDisplay_(customerName, active, history, callback) {

    state.currentDisplays = active;

    state.currentIndex = 0;

    if (typeof resetCustomerTabs === 'function') resetCustomerTabs(); // 🚀 重置 Tab

  /**
   * 🔴 階段 3：相簿邏輯
   */
  /**
   * 🔴 階段 3：相簿邏輯 (分組與銷售排序版)
   */
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  /**
   * @param {boolean} isHistory 是否渲染歷史（下架）清單
   * @param {string}  [gridIdOverride] 指定要畫進哪個容器。
   * @param {string}  [sortSelectId] 指定要讀哪個排序下拉（預設 album-sort-select）。
   *        客戶分析頁用這個參數共用同一份渲染與同一個詳情彈窗，
   *        避免兩邊各寫一套卡片、改一邊忘了另一邊。
   */
  /**
   * 🏷 版面銷售狀態：曾賣過但半年沒賣＝遺忘；沒賣過但拿過樣＝拿樣未成交；
   * 沒賣過也沒拿過樣＝連樣品都沒拿（紫框閃爍，代表這面牆完全沒被推過）。
   * 資料由客戶分析頁灌進 window._caSkuStatus；沒有資料時整段跳過不影響原本畫面。
   */
  function getWallStatus(group) {
    var st = window._caSkuStatus;
    if (!st) return null;
    var soldRecent = 0, soldEver = 0, sampled = 0, displayed = 0;
    var newestSample = null, lastSale = null;
    group.items.forEach(function (it) {
      var k = String(it.sku || '').trim().toUpperCase().replace(/[\s\-]/g, '');
      var v = st[k];
      if (!v) return;
      if (v.half > 0) soldRecent++;
      if (v.total > 0) soldEver++;
      if (v.sampled) {
        sampled++;
        if (!newestSample || v.sampleDate > newestSample) newestSample = v.sampleDate;
      }
      if (v.displayed) displayed++;
      if (v.lastSale && (!lastSale || v.lastSale > lastSale)) lastSale = v.lastSale;
    });

    if (soldRecent > 0) return null;                     // 半年內有賣，不標

    var daysOf = function (d) {
      if (!d) return null;
      var t = new Date(d);
      return isNaN(t.getTime()) ? null : Math.floor((Date.now() - t.getTime()) / 86400000);
    };

    if (soldEver > 0) {
      var dl = daysOf(lastSale);
      return { label: '遺忘' + (dl !== null ? '・' + dl + '天' : ''), color: '#f5a623' };
    }
    if (sampled > 0) {
      var dsmp = daysOf(newestSample);
      // 拿樣三個月沒下單跟兩年沒下單是完全不同的處境，天數一定要標出來
      return { label: '拿樣未成交' + (dsmp !== null ? '・' + dsmp + '天' : ''), color: '#60a5fa' };
    }
    if (displayed > 0) {
      return { label: '僅門市陳列', color: '#94a3b8' };
    }
    // 連樣品都沒拿：只有「上架夠久」才閃紫框。
    // 新上架的版面本來就還沒開始推，全部閃只會變成雜訊、反而失去警示作用。
    var onDisplay = (group.items[0] && group.items[0].daysOnDisplay) || 0;
    return {
      label: '連樣品都沒拿' + (onDisplay ? '・上架' + Math.round(onDisplay / 30) + '個月' : ''),
      color: '#a855f7',
      blink: onDisplay > 365
    };
  }

  // 沒有照片（或照片載入失敗）時顯示的占位：相機斜線圖示＋「尚未上傳照片」，不再顯示容易誤會的 Loading
  window.AIT_NOPHOTO_HTML = '<div class="album-thumb album-nophoto"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/><path d="M3 3l18 18"/></svg><span>尚未上傳照片</span></div>';

  function renderAlbum(isHistory = false, gridIdOverride, sortSelectId) {
    var targetGridId = gridIdOverride || (isHistory ? 'history-grid' : 'album-grid');
    var grid = document.getElementById(targetGridId);
    if (!grid) return;

    var displayData = isHistory ? state.historyDisplays : state.currentDisplays;

    if (!displayData || displayData.length === 0) {
      grid.innerHTML = isHistory ? '' : '<div style="grid-column:span 2; padding:60px 20px; text-align:center; color:var(--gray-600);">' +
        '<div style="font-size:48px; margin-bottom:15px;">🌑</div>' +
        '<div style="font-weight:700;">此客戶暫無陳列資料</div></div>';
      return;
    }

    // 1. 按圖片分組
    var groups = {};
    displayData.forEach(function (d) {
      var key = d.photoUrl || 'no-photo';
      if (!groups[key]) {
        groups[key] = {
          photoUrl: d.photoUrl,
          photoUrls: (d.photoUrls && d.photoUrls.length) ? d.photoUrls : (d.photoUrl ? [d.photoUrl] : []),
          photoCount: (d.photoUrls && d.photoUrls.length) ? d.photoUrls.length : (d.photoUrl ? 1 : 0),
          items: [],
          totalSalesAmt: 0,
          totalSalesQty: 0,
          totalFrequency: 0,
          series: d.series, // 🚀 保留原始單一值，給編輯模式(整組改系列)等「本來就只能設一個值」的地方用
          seriesSet: {},
          skuList: []
        };
      }
      groups[key].items.push(d);
      if (d.series) groups[key].seriesSet[d.series] = true; // 🚀 累積這張照片裡實際出現過的所有系列（可能不只一個，例如用「新增品項」加了別系列的編號進來）
      // 🔥 使用該客戶專屬的銷售數據進行聚合
      groups[key].totalSalesAmt += (d.customerSalesAmt || 0);
      groups[key].totalSalesQty += (d.customerSalesQty || 0);
      groups[key].totalFrequency += (d.frequency || 0);
      if (d.lastSaleMs && d.lastSaleMs > (groups[key].lastSaleMs || 0)) groups[key].lastSaleMs = d.lastSaleMs;   // 整面牆最後一次有賣
      if (d.firstSaleMs && (!groups[key].firstSaleMs || d.firstSaleMs < groups[key].firstSaleMs)) groups[key].firstSaleMs = d.firstSaleMs;
      groups[key].totalReservedQty = (groups[key].totalReservedQty || 0) + (d.customerReservedQty || 0);

      if (d.customerReservedSummary) {
        if (!groups[key].reservedSummaryList) groups[key].reservedSummaryList = [];
        groups[key].reservedSummaryList.push(d.customerReservedSummary);
      }

      groups[key].skuList.push(d.sku);
    });

    // 🚀 每個群組算出「系列標籤」：只有一個系列就顯示那個名稱；混了好幾個系列（同一張照片放了不同系列
    // 的編號）就用頓號全部列出來，不再只顯示第一筆遇到的系列、蓋掉其他系列的存在
    Object.keys(groups).forEach(function (key) {
      var names = Object.keys(groups[key].seriesSet);
      groups[key].seriesLabel = names.length > 0 ? names.join('、') : (groups[key].series || '未命名');
    });

    // 2. 轉換為陣列並進行智慧排序
    var sortedGroups = Object.values(groups);
    var albumSortSelect = document.getElementById(sortSelectId || 'album-sort-select');
    var albumSortMethod = albumSortSelect ? albumSortSelect.value : 'amount';

    sortedGroups.sort(function (a, b) {
      if (albumSortMethod === 'pyeong') return b.totalSalesQty - a.totalSalesQty;
      if (albumSortMethod === 'amount') return b.totalSalesAmt - a.totalSalesAmt;
      if (albumSortMethod === 'stale') {
        // 最久沒賣排最前；從沒賣過的排在「有賣過」的後面（它們不是遺忘，是還沒開始賣）
        var sa = a.lastSaleMs || 0, sb = b.lastSaleMs || 0;
        if (!sa && !sb) return b.totalSalesAmt - a.totalSalesAmt;
        if (!sa) return 1;
        if (!sb) return -1;
        return sa - sb;
      }
      if (albumSortMethod === 'days') return (b.items[0].daysOnDisplay || 0) - (a.items[0].daysOnDisplay || 0);
      if (albumSortMethod === 'status') {
        var getWorst = function (g) { return Math.min.apply(null, g.items.map(function (i) { return i.stockLevel || 3; })); };
        var res = getWorst(a) - getWorst(b);
        if (res !== 0) return res;
        return b.totalSalesAmt - a.totalSalesAmt;
      }
      // 按樣品：連樣品都沒拿的排最前，其次拿樣未成交、遺忘，最後才是正常有賣的
      if (albumSortMethod === 'sample') {
        var rank = function (g) {
          var w = getWallStatus(g);
          if (!w) return 3;
          if (w.label.indexOf('連樣品都沒拿') === 0) return 0;
          if (w.label.indexOf('拿樣未成交') === 0) return 1;
          if (w.label === '僅門市陳列') return 2;
          return 3;
        };
        var ra = rank(a), rb = rank(b);
        if (ra !== rb) return ra - rb;
        return b.totalSalesAmt - a.totalSalesAmt;
      }
      if (albumSortMethod === 'frequency') return b.totalFrequency - a.totalFrequency;
      if (albumSortMethod === 'update') {
        const dateA = a.items[0].lastUpdate ? new Date(a.items[0].lastUpdate).getTime() : 0;
        const dateB = b.items[0].lastUpdate ? new Date(b.items[0].lastUpdate).getTime() : 0;
        return dateB - dateA;
      }
      return b.totalSalesAmt - a.totalSalesAmt; // 預設金額
    });

    // 3. 預載入圖片優化效能
    if (sortedGroups.length > 0) preloadImages(sortedGroups);

    var html = '';
    sortedGroups.forEach(function (group, gIdx) {
      // 找出該組的銷冠
      var champion = group.items.reduce(function (prev, current) {
        return (prev.salesAmt > current.salesAmt) ? prev : current;
      });
      group.championSku = champion.sku;
      group.champPct = Math.round((champion.salesAmt / group.totalSalesAmt) * 100);

      // 🚦 庫存燈號標準邏輯 (2025 第二版: 1紅, 2橘, 3黃, 4綠)
      var itemsWithInv = group.items.map(function(li) {
        var skuKey = li.sku.replace(/[\s\-]/g,'').toUpperCase();
        var inv = state.inventoryData.find(function(d){ 
          return d.sku.replace(/[\s\-]/g,'').toUpperCase() === skuKey; 
        });
        if (!inv) {
          console.warn("⚠️ 庫存匹配未找到 (用後端預設):", li.sku, "skuKey:", skuKey, "後備等級:", li.stockLevel);
          // 🚀 將後端 3 燈等級對齊 2025 新標準 (後端 1 -> 新 1紅, 後端 2 -> 新 2橘/黃, 後端 3 -> 新 4綠)
          var translatedLevel = 4;
          if (li.stockLevel === 1) translatedLevel = 1;
          else if (li.stockLevel === 2) translatedLevel = 2;
          else if (li.stockLevel === 3) translatedLevel = 4;
          return { level: translatedLevel, hasArrival: false, pyeong: 999 };
        }
        return inv;
      });
      
      var worstLevel = 4;
      if (itemsWithInv.length > 0) {
        worstLevel = Math.min.apply(null, itemsWithInv.map(function(i) { return i.level; }));
      }
      var anyArrival = itemsWithInv.some(function(i) { return i.hasArrival; });
      
      // 🚀 對齊客戶三色燈框要求：
      // - 完全沒貨 (Level 1) -> 紅色框 (border-red)
      // - 快缺貨 (Level 2 & 3) -> 黃色框 (border-yellow)
      // - 沒缺貨 (Level 4) -> 綠色框 (border-green)
      var borderClass = worstLevel === 1 ? 'border-red' 
                      : (worstLevel === 2 || worstLevel === 3) ? 'border-yellow' 
                      : 'border-green';
      
      // 如果有到貨則疊加藍色閃爍
      if (anyArrival) borderClass += ' arrival-blue-pulse';

      var hasPhoto = !!(group.photoUrl && group.photoUrl !== "");
      var imgUrl = hasPhoto ? group.photoUrl : '';

      // 🚀 格式化日期：2024/04/28 15:18 -> 24/4/28
      var rawDate = group.items[0].lastUpdate || '—';
      var shortDate = rawDate;
      if (rawDate !== '—') {
        var datePart = rawDate.split(' ')[0]; // 取日期部分
        var parts = datePart.split('/');
        if (parts.length === 3) {
          shortDate = parts[0].substring(2) + '/' + parseInt(parts[1]) + '/' + parseInt(parts[2]);
        }
      }

      var durationStr = formatDaysToDuration(group.items[0].daysOnDisplay);

      // 📊 卡片資料：最後銷售、坪效、銷冠、缺貨款數
      var nowMs = Date.now();
      var saleDays = group.lastSaleMs ? Math.floor((nowMs - group.lastSaleMs) / 86400000) : null;
      var hasSales = group.totalSalesAmt > 0;
      var saleColor = saleDays === null ? '#94a3b8' : saleDays <= 90 ? '#4ade80' : saleDays <= 180 ? '#facc15' : '#f87171';
      // 有銷售金額卻讀不到日期 ≠ 未曾銷售（避免跟「銷冠」互相矛盾）
      var saleText = saleDays === null ? (hasSales ? '有銷售・日期不明' : '未曾銷售') : '賣 ' + agoText_(saleDays);
      var onDispDays = group.items[0].daysOnDisplay;
      var perMonth = (onDispDays !== null && onDispDays !== undefined && !isNaN(onDispDays))
        ? Math.round(group.totalSalesAmt / 10000 / Math.max(1, onDispDays / 30) * 10) / 10 : null;
      // 缺貨簡碼：RT61243-S → 43-S、RN612100 → 100
      var shortCodes = [];
      itemsWithInv.forEach(function (inv, ii) {
        if (inv.level !== 1) return;
        var raw = String((group.items[ii] && group.items[ii].sku) || '');
        var mm = raw.match(/^[A-Za-z]*(\d+)(.*)$/);
        // 數字部分：6碼取尾3、5碼取尾2（＝不取前3碼）；4碼取尾2；3碼以下全取
        var dg = mm ? mm[1] : '';
        var keep = dg.length >= 6 ? 3 : dg.length === 5 ? 2 : dg.length === 4 ? 2 : dg.length;
        shortCodes.push(mm ? (dg.slice(dg.length - keep) + mm[2]) : raw);
      });
      var shortCount = shortCodes.length;
      var shortTxt = shortCodes.slice(0, 4).join('、') + (shortCodes.length > 4 ? '…等' + shortCodes.length + '款' : '');
      var champTxt = (group.totalSalesAmt > 0) ? ('銷冠 ' + escapeHtml(group.championSku) + ' ' + group.champPct + '%') : '';

      var wallStatus = getWallStatus(group);
      if (wallStatus && wallStatus.blink) borderClass += ' wall-never-pulse';

      html += '<div class="album-item ' + borderClass + '" onclick="showGroupDetail(' + gIdx + ', ' + isHistory + ')">' +
        (wallStatus
          ? '<div class="wall-status-tag" style="color:' + wallStatus.color +
            ';border-color:' + wallStatus.color + '66;background:' + wallStatus.color + '22">' +
            wallStatus.label + '</div>'
          : '') +
        (group.photoCount > 1
          ? '<div class="album-photo-count">🖼 ' + group.photoCount + ' 張</div>' : '') +
        (hasPhoto
          ? '<img src="' + imgUrl + '" class="album-thumb" ' +
            'onerror="this.onerror=null; this.outerHTML=window.AIT_NOPHOTO_HTML" loading="lazy">'
          : window.AIT_NOPHOTO_HTML) +

        // 🔝 頂部標籤組 (左上: 金額/坪數, 右上: 系列名稱)
        '<div class="card-top-badges">' +
          (state.isClientView ? '' :
            '<div class="mini-stat">' +
            Math.round(group.totalSalesAmt / 10000) + '萬 / ' + Math.round(group.totalSalesQty) + '坪' +
            '</div>') +
          (group.totalReservedQty > 0 ? 
            '<div class="mini-stat" style="background:rgba(234,179,8,0.35); color:#facc15; border-color:rgba(234,179,8,0.5); margin-top:4px; cursor:pointer;" ' +
            'onclick="event.stopPropagation(); showReserveInfo(\'' + encodeURIComponent(JSON.stringify(group.reservedSummaryList || [])) + '\')">' +
            '保留 ' + group.totalReservedQty + ' 片</div>' : '') +
        '</div>' +
        
        '<div style="position:absolute; top:12px; right:12px; z-index:5; text-align:right;">' +
          '<div style="font-size:15px; font-weight:900; color:#fff; text-shadow:0 0 10px rgba(0,0,0,0.8);">' + escapeHtml(group.seriesLabel || group.series || '未命名') + '</div>' +
        '</div>' +

        // 🧊 玻璃化底部遮罩 (強制採用 Row 佈局，讓日期與天數分居左右底部)
        '<div class="card-glass-overlay" style="display:flex; flex-direction:row; justify-content:space-between; align-items:flex-end; padding:8px 12px; background:linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);">' +
          (state.isClientView
            ? '<div class="date-badge" style="color:#facc15; font-weight:800; font-size:12px;">' + shortDate + '</div>' +
              '<div style="font-size:13px; font-weight:900; color:rgba(255,255,255,0.9);">' + durationStr + '</div>'
            : '<div style="width:100%; display:flex; flex-direction:column; gap:3px; text-shadow:0 0 8px rgba(0,0,0,0.9);">' +
                '<div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:900;">' +
                  '<span style="color:' + saleColor + ';"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' + saleColor + ';margin-right:5px;"></span>' + saleText + '</span>' +
                  '<span style="color:rgba(255,255,255,0.9);">上架 ' + durationStr + '</span>' +
                '</div>' +
                ((champTxt || perMonth !== null)
                  ? '<div style="display:flex; justify-content:space-between; font-size:10.5px; font-weight:700; color:rgba(255,255,255,0.7);">' +
                      '<span>' + champTxt + '</span>' +
                      '<span>' + (perMonth !== null && group.totalSalesAmt > 0 ? perMonth + '萬/月' : '') + '</span></div>'
                  : '') +
                (shortCount > 0 ? '<div style="font-size:10.5px; font-weight:800; color:#fca5a5;">缺貨 ' + escapeHtml(shortTxt) + '</div>' : '') +
              '</div>') +
        '</div>' +
        '</div>';
    });

    // 存儲排序後的組到 state 供詳情使用
    if (isHistory) state.sortedHistoryGroups = sortedGroups;
    else state.sortedGroups = sortedGroups; 
    
    grid.innerHTML = html;
  }

  /**
   * 🖼️ 輔助：圖片預載入引擎
   * 🚀 效能優化：原本把「整面陳列牆所有客群組」的封面圖一口氣全部 new Image() 預載，
   *    一來跟 tag 上的 loading="lazy" 互相抵銷、二來會在手機上瞬間塞爆頻寬阻塞首圖解析。
   *    改成只預載首屏附近的前 N 張（畫面一定看得見），其餘交給 lazy loading 邊滾邊載。
   */
  function preloadImages(groups) {
    const MAX_PRELOAD = 12;
    groups.slice(0, MAX_PRELOAD).forEach(function (g) {

        const img = new Image();
        img.src = g.photoUrl;

  function formatSkuListSmart(items, championSku) {

    var oosItems = items.filter(function (i) { return i.stockLevel === 1; });

    if (oosItems.length > 0) {
      return '<span style="color:rgba(255,255,255,0.5)">缺貨:</span> ' + oosItems.map(function (i) {

        return '<span class="oos" style="color:#ff3b30; font-weight:800;">' + i.sku + '</span>';
      }).join('、');
    }

    // 如果沒有缺貨，顯示前兩個完整編號
    return items.slice(0, 2).map(function (i) {

    }).join('、') + (items.length > 2 ? '...' : '');
  }

  function copyToClipboard(text, successMsg) {

      navigator.share({
        title: '高雅瓷 - 版面查庫存',
        url: text
      }).catch(err => console.log('Share failed', err));
    } else {

  /**
   * 📦 動態渲染品項列表
   */
  function renderSkuDetailList(isHistory = false) {
    var list = document.getElementById('sku-detail-list');
    var group = isHistory ? state.sortedHistoryGroups[state.currentGIdx] : state.sortedGroups[state.currentGIdx];
    if (!list || !group) return;

    var listContainer = document.getElementById('sku-detail-list');
    var listHtml = "";

    var sortEl = document.getElementById('sku-sort-select');
    var sortMethod = sortEl ? sortEl.value : 'stock';
    var items = group.items.slice();

    // 排序
    if (sortMethod === 'sales') {
      items.sort(function(a, b) { return (b.salesAmt || 0) - (a.salesAmt || 0); });
    } else if (sortMethod === 'stock') {
      items.sort(function(a, b) { return (a.stockLevel || 3) - (b.stockLevel || 3); });
    } else if (sortMethod === 'id') {
      items.sort(function(a, b) { return a.sku.localeCompare(b.sku); });
    }

    items.forEach(function(item) {
      // ✅ 從 inventoryData 撈即時庫存（不依賴後端回傳的 currentPyeong）
      var invItem = null;
      if (state.inventoryData && state.inventoryData.length > 0) {
        var skuKey = normalizeSkuKey(item.sku);
        invItem = state.inventoryData.find(function(d) {
          return normalizeSkuKey(d.sku) === skuKey;
        });
      }

      // 庫存數字：優先用即時資料，沒有才用後端回傳值
      var stockP  = invItem ? parseFloat(invItem.pyeong) : parseFloat(item.currentPyeong || 0);
      var stockQ  = invItem ? parseFloat(invItem.qty)    : parseFloat(item.currentStock  || 0);
      var level   = invItem ? invItem.level  : (item.stockLevel || (stockP < 1 ? 1 : 4));
      
      // 🚀 最終保險：如果算出來是 0 坪或負數，強制給予等級 1 (紅)
      if (stockP < 1) level = 1;

      // 銷售數字
      var salesP  = Math.round(item.salesQty || 0);

      // 批號與片數（版面上架清單的記錄）
      var batchDisplay = item.batch ? item.batch : '—';
      var qtyDisplay   = item.originalQty || 1;

      // 單磚圖：優先用 inventoryData 的圖（品質較好）
      var singleImg    = (invItem && invItem.img) ? invItem.img : (item.singleImg || '');
      var hasSingleImg = singleImg && singleImg.trim() !== '';

      // 燈號樣式 (2025 第二版)
      var oosClass = '';
      if (level === 1) oosClass = 'oos-red';
      else if (level === 2) oosClass = 'oos-orange';
      else if (level === 3) oosClass = 'oos-yellow';
      
      if (invItem && invItem.hasArrival) oosClass += ' arrival-blue-pulse';

      // 縮圖
      var imgHtml = hasSingleImg
        ? '<img src="' + singleImg + '" class="sku-row-thumb" onerror="this.src=\'https://placehold.co/200x200/1a1a1a/666?text=ERR\'">'
        : '<div class="sku-row-thumb" style="background:rgba(255,255,255,0.02); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.1); font-size:10px;">無圖</div>';

      // 🚀 卡片上直接編輯片數/批號＋刪除，不用再點整張卡片跳轉去編輯模式（那個是給批次改系列/尺寸用的）
      listHtml +=
        '<div class="sku-row ' + oosClass + '">' +
          imgHtml +
          '<div class="sku-row-content">' +

            // 編號（一般模式可直接改，改完縮圖會用新編號重新對照庫存圖）+ 片數批號（可直接編輯）+ 刪除

  /**
   * 🚀 卡片上直接修改片數/批號：整組（同一張照片）品項一起送回後端覆寫，
   * 沿用既有的 updateDisplayBatch()（跟「編輯內容」批次儲存同一支函式，行為一致）。
   */
  window.quickSaveItemField = function (inputEl, field) {
    var group = state.sortedGroups[state.currentGIdx];
    if (!group) return;
    var sku = inputEl.dataset.sku;
    var item = group.items.find(function (i) { return i.sku === sku; });
    if (!item) return;

    if (field === 'qty') {
      var qtyNum = parseInt(inputEl.value, 10) || 1;
      inputEl.value = qtyNum;
      item.originalQty = qtyNum;
    } else if (field === 'batch') {
      item.batch = inputEl.value.trim();
    }

    var payloadItems = group.items.map(function (i) {
      return { sku: i.sku, qty: i.originalQty || 1, batch: i.batch || '', size: i.size || '', spec: i.spec || '' };
    });

    inputEl.disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        inputEl.disabled = false;
        if (res && res.success) {
          showToast('✅ 已更新');
        } else {
          showToast('❌ 更新失敗: ' + ((res && res.msg) || '未知錯誤'));
        }
      })
      .withFailureHandler(function (err) {
        inputEl.disabled = false;
        showToast('❌ 連線失敗: ' + (err && err.message ? err.message : err));
      })
      .updateDisplayBatch(state.selectedCustomer, group.photoUrl, payloadItems, null, null, state.currentSales);
  };

  /**
   * 🚀 卡片上直接修改產品編號：改完整組重繪，縮圖會用新編號重新對照 state.inventoryData
   * 找對應的單磚圖（跟片數/批號同一支後端 updateDisplayBatch()，只是這裡連 sku 本身都能改）。
   */
  window.quickSaveSkuField = function (inputEl) {
    var group = state.sortedGroups[state.currentGIdx];
    if (!group) return;
    var oldSku = inputEl.dataset.oldSku;
    var newSku = inputEl.value.trim().toUpperCase();

    if (!newSku) {
      showToast('⚠️ 編號不能空白');
      renderSkuDetailList();
      return;
    }
    if (newSku === oldSku) return;
    if (group.items.some(function (i) { return i.sku === newSku; })) {
      showToast('⚠️ 這個版面已經有編號「' + newSku + '」了，不能重複');
      renderSkuDetailList();
      return;
    }

    var item = group.items.find(function (i) { return i.sku === oldSku; });
    if (!item) return;
    item.sku = newSku;

    // 🚀 直接整組重繪：縮圖／片數批號輸入框的 data-sku／刪除按鈕，全部跟著新編號一起校正，
    // 不用手動一個個修補 DOM（renderSkuDetailList 本來就會用最新的 item.sku 重新查庫存圖）
    renderSkuDetailList();

    var payloadItems = group.items.map(function (i) {
      return { sku: i.sku, qty: i.originalQty || 1, batch: i.batch || '', size: i.size || '', spec: i.spec || '' };
    });

    showToast('儲存中...');
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) {
          showToast('✅ 編號已更新');
        } else {
          showToast('❌ 更新失敗: ' + ((res && res.msg) || '未知錯誤'));
        }
      })
      .withFailureHandler(function (err) {
        showToast('❌ 連線失敗: ' + (err && err.message ? err.message : err));
      })
      .updateDisplayBatch(state.selectedCustomer, group.photoUrl, payloadItems, null, null, state.currentSales);
  };

  /**
   * 🚀 卡片上直接刪除單一編號（同一張照片其餘品項不動）。至少要留一個編號，
   * 若是最後一個請引導使用「刪除照片」整版刪除。
   */
  window.quickDeleteItem = function (sku) {
    var group = state.sortedGroups[state.currentGIdx];
    if (!group) return;
    if (group.items.length <= 1) {
      showToast('⚠️ 這是版面裡最後一個編號了，要移除請用下方「刪除照片」整版刪除');
      return;
    }
    if (!confirm('確定要從這個版面移除編號「' + sku + '」嗎？')) return;

    showLoadingWithStatus('正在移除...');
    google.script.run
      .withSuccessHandler(function (res) {
        showLoading(false);
        if (res && res.success) {
          group.items = group.items.filter(function (i) { return i.sku !== sku; });
          showToast('✅ 已移除');
          renderSkuDetailList();
        } else {
          showToast('❌ 移除失敗: ' + ((res && res.msg) || '未知錯誤'));
        }
      })
      .withFailureHandler(function (err) {
        showLoading(false);
        showToast('❌ 連線失敗: ' + (err && err.message ? err.message : err));
      })
      .deleteDisplayBatchPermanent(state.selectedCustomer, [sku], group.photoUrl);
  };

  window.confirmQuickAddItems = function () {
    var group = state.sortedGroups[state.currentGIdx];
    if (!group) return;
    var block = document.getElementById('series-block-quickadd');
    if (!block) return;
    var seriesInput = block.querySelector('.sb-series-input');
    var series = (seriesInput && seriesInput.value ? seriesInput.value : '').trim();

    var checkedRows = Array.prototype.slice.call(block.querySelectorAll('.autofill-item-row'))
      .filter(function (row) { return row.querySelector('input[type="checkbox"]').checked; });

    var newItems = [];
    checkedRows.forEach(function (row) {
      var qtyInput = row.querySelector('.autofill-item-qty');
      var batchInput = row.querySelector('.autofill-item-batch');
      var qty = Number(qtyInput && qtyInput.value ? qtyInput.value : 0) || 0;
      if (qty <= 0) return;
      var sku = (row.dataset.sku || '').toUpperCase();
      if (group.items.some(function (i) { return i.sku === sku; })) return; // 已經在這個版面裡了，跳過避免重複
      newItems.push({
        sku: sku,
        qty: qty,
        batch: batchInput && batchInput.value ? batchInput.value.trim() : '',
        size: row.dataset.size || ''
      });
    });

    if (newItems.length === 0) {
      showToast('⚠️ 請至少勾選一個品項並填入片數');
      return;
    }

    var payloadItems = group.items.map(function (i) {
      return { sku: i.sku, qty: i.originalQty || 1, batch: i.batch || '', size: i.size || '', spec: i.spec || '' };
    }).concat(newItems);

    showLoadingWithStatus('正在新增品項...');
    google.script.run
      .withSuccessHandler(function (res) {

          showToast('✨ 已新增 ' + newItems.length + ' 個品項');
          toggleQuickAddPanel();
          // 🚀 原本這裡呼叫 selectCustomer() 整頁重載——會導覽離開目前打開的詳情彈窗，
          // 使用者看不到剛新增的品項，要重新點進來才看得到。改成只重抓這個客戶的資料，
          // 但只更新「目前正在看的這一組」並原地重繪，不離開彈窗、不用整頁重來。
          refreshCurrentGroupFromServer(function () { showLoading(false); });
        } else {
          showLoading(false);
          showToast('❌ 新增失敗: ' + ((res && res.msg) || '未知錯誤'));
        }
      })
      .withFailureHandler(function (err) {

        showToast('❌ 連線失敗: ' + (err && err.message ? err.message : err));

  /**
   * 🚀 只重抓「目前正在看的這一組版面」的最新資料並原地重繪，不離開詳情彈窗、不整頁重來。
   * 用在「新增品項」這類需要拿到後端完整計算欄位（庫存/銷售/圖片等新品項本身沒有的資訊）
   * 才能正確渲染卡片的情境；跟 quickSaveItemField/quickDeleteItem 那種純樂觀本地更新不同，
   * 這裡真的需要問一次後端，但只更新這一組、不影響使用者正在看的畫面位置。
   */
  window.refreshCurrentGroupFromServer = function (callback) {
    var group = state.sortedGroups[state.currentGIdx];
    if (!group) { if (callback) callback(); return; }
    var photoKey = group.photoUrl || 'no-photo';

    google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.success) {
          state.currentDisplays = response.active;
          state.historyDisplays = response.history;

          var matchedItems = (response.active || []).filter(function (d) {
            return (d.photoUrl || 'no-photo') === photoKey;
          });
          if (matchedItems.length > 0) {
            var seriesSet = {};
            var totalSalesAmt = 0, totalSalesQty = 0, totalFrequency = 0, totalReservedQty = 0;
            var skuList = [];
            matchedItems.forEach(function (d) {
              if (d.series) seriesSet[d.series] = true;
              totalSalesAmt += (d.customerSalesAmt || 0);
              totalSalesQty += (d.customerSalesQty || 0);
              totalFrequency += (d.frequency || 0);
              totalReservedQty += (d.customerReservedQty || 0);
              skuList.push(d.sku);
            });
            var names = Object.keys(seriesSet);
            group.items = matchedItems;
            group.series = matchedItems[0].series;
            group.seriesLabel = names.length > 0 ? names.join('、') : (group.series || '未命名');
            group.totalSalesAmt = totalSalesAmt;
            group.totalSalesQty = totalSalesQty;
            group.totalFrequency = totalFrequency;
            group.totalReservedQty = totalReservedQty;
            group.skuList = skuList;

            renderSkuDetailList();
            var seriesEl = document.getElementById('detail-series');
            if (seriesEl) seriesEl.innerText = group.seriesLabel || group.series || '';
          }
        }
        if (callback) callback();
      })
      .withFailureHandler(function () {
        if (callback) callback(); // 重抓失敗至少讓 loading 收起來，不要卡住；使用者的本地畫面還是舊資料，但不影響已經送出成功的存檔
      })
      .getCustomerDisplays(state.selectedCustomer);
  };

  /**
   * ⏳ 輔助：將天數轉換為幾年幾個月
   */
  // 距今天數 → 口語（天／週／個月／年）
  function agoText_(d) {
    if (d <= 0) return '今天';
    if (d < 14) return d + '天前';
    if (d < 60) return Math.floor(d / 7) + '週前';
    if (d < 365) return Math.floor(d / 30) + '個月前';
    var y = Math.floor(d / 365), m = Math.floor((d % 365) / 30);
    return y + '年' + (m ? m + '個月' : '') + '前';
  }

  function formatDaysToDuration(days) {
    if (days === null || days === undefined || isNaN(days)) return "—";   // 上架日期未知，不要誤顯示成 0M
    if (days < 0) return "0M";
    var years = Math.floor(days / 365);
    var remainingDays = days % 365;
    var months = Math.floor(remainingDays / 30);

    var result = "";
    if (years > 0) result += years + "Y";
    if (months > 0 || (years === 0 && months === 0)) result += (months || 0) + "M";
    else if (months > 0) result += months + "M";

    // 確保 1Y3M 格式
    if (years > 0 && months > 0) return years + "Y" + months + "M";
    if (years > 0) return years + "Y";
    return (months || 0) + "M";
  }

  };

  window.saveLayoutEdit = function () {
    var group = state.sortedGroups[state.currentGIdx];
    var series = document.getElementById('edit-series-input').value.trim();
    var size = document.getElementById('edit-size-input').value.trim();

    if (!series) { showToast('⚠️ 請填寫系列名稱'); return; }
    if (!size) { showToast('⚠️ 請填寫產品尺寸'); return; }

    var validItems = state.editItems.filter(function (i) { return i.sku.trim() !== ""; });
    if (validItems.length === 0) {
      showToast('⚠️ 請填寫有效的編號');
      return;
    }

    // 將全局欄位套用到所有品項
    validItems.forEach(function(i) {
      i.series = series;
      i.size = size;
    });

    // 將執行存檔的邏輯獨立，方便 GPS 讀取後調用
    var doSave = function (gpsData) {
      showLoadingWithStatus('正在儲存資料...');
      google.script.run
        .withSuccessHandler(function (res) {
          showLoading(false);
          if (res.success) {
            group.items = validItems.map(function (vi, idx) {
              var oldItem = group.items[idx] || group.items[0];
              return Object.assign({}, oldItem, {
                sku: vi.sku,
                batch: vi.batch,
                originalQty: vi.qty,
                series: series,
                size: size,
                spec: vi.spec
              });
            });
            group.series = series;
            if (res.finalPhotoUrl) group.photoUrl = res.finalPhotoUrl;

            showToast("✨ 資料已更新！", "success");
            state.newGpsData = null;
            state.newPhotoData = null;
            exitEditMode();
            renderAlbum();
          } else {
            showToast("❌ 存檔失敗: " + res.msg);
          }
        })
        .withFailureHandler(function (err) {
          showLoading(false);
          showToast("❌ 連線失敗: " + err.message);
        })
        .updateDisplayBatch(state.selectedCustomer, group.photoUrl, validItems, state.newPhotoData, gpsData, state.currentSales);
    };

    // 📍 優先順序：1. 照片提取的 GPS (newGpsData) > 2. 手機當前 GPS (如果勾選或有新照片)
    if (state.newGpsData) {
      doSave(state.newGpsData);
    } else if (state.newPhotoData && navigator.geolocation) {
      showLoading(true, true, '正在取得定位...');
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          doSave({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        },
        function (err) {
          console.warn("GPS ERROR, ignoring location update...", err);
          doSave(null);
        },
        { timeout: 5000 }
      );
    } else {
      doSave(null);
    }
  };

  function extractId(url) {
    if (!url || typeof url !== 'string') return '';

    // 優先匹配純 ID (28-50 字元)
    const idMatch = url.match(/[-\w]{28,50}/);
    if (idMatch) return idMatch[0];

    const patterns = [
      /\/d\/([a-zA-Z0-9_-]{25,})/,
      /id=([a-zA-Z0-9_-]{25,})/,
      /\/file\/d\/([a-zA-Z0-9_-]{25,})/
    ];
    for (const pattern of patterns) {
      const match = url.match(pattern);
      if (match) return match[1];
    }
    return '';
  }

  /**
   * 📱 左側右滑返回功能
   */
  (function () {
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, false);

    window.addEventListener('touchend', e => {
      let touchEndX = e.changedTouches[0].screenX;
      let touchEndY = e.changedTouches[0].screenY;
      let dx = touchEndX - touchStartX;
      let dy = touchEndY - touchStartY;

      if (Math.abs(dy) >= 50) return; // 垂直位移太大就不當水平滑動處理，避免跟捲動衝突

      // 🚀 詳情彈窗開著時，非邊緣的左右滑動用來切換上一版／下一版；
      // 只有從螢幕最左邊邊緣開始的右滑，才維持原本「關閉返回」的行為，兩者才不會打架。
      var modal = document.getElementById('detail-modal');
      if (modal && modal.style.display === 'flex' && touchStartX >= 50) {
        if (dx < -80) { window.switchDetailGroup(1); }
        else if (dx > 80) { window.switchDetailGroup(-1); }
        return;
      }

      // 判斷是否為左向右滑動, 且垂直位移不大
      if (dx > 100 && touchStartX < 50) {
        // 只有從螢幕邊緣附近開始才算
        handleSwipeBack();
      }
    }, false);

    function handleSwipeBack() {
      if (document.getElementById('detail-modal').style.display === 'flex') {
        closeDetail();
      } else if (document.getElementById('page-album').classList.contains('active')) {
        window.switchToPage('page-select-customer');
      } else if (document.getElementById('page-select-customer').classList.contains('active')) {
        window.switchToPage('sales-page');
      }
    }
  })();
