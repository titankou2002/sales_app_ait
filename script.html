  /**
   * 🚀 判斷輸入的字數是否足夠開始搜尋，避免太短、太籠統的字就觸發查詢（浪費請求、結果又一堆不相關）：
   * 純中文要 2 字以上（很多系列名稱本身就是 2 字，如「冰岩」「馬約」，不能要求超過 2 字）、
   * 純數字要超過 4 碼、純英文要超過 2 碼；混合英數字（常見於編號，如 RC612109）用比較寬鬆但
   * 一樣有意義的門檻（超過 3 碼）。
   */
  function _seriesQueryMeetsThreshold(q) {
    if (!q) return false;
    var hasHan = /[一-龥]/.test(q);
    var hasDigit = /[0-9]/.test(q);
    var hasAlpha = /[A-Za-z]/.test(q);
    if (hasHan && !hasDigit && !hasAlpha) return q.length >= 2;
    if (hasDigit && !hasHan && !hasAlpha) return q.length > 4;
    if (hasAlpha && !hasHan && !hasDigit) return q.length > 2;
    return q.length > 3; // 混合英數字（編號）
  }

  /**
   * 🚀 系列名稱輸入框「邊打邊搜」：字數達門檻後就查符合的系列名稱（或含此段編號的品項所屬系列），
   * 渲染成下拉建議清單。
   */
  var _seriesInputDebounce = {};
  var _seriesSuggestToken = {};
  window.handleSeriesInput = function (id) {
    var block = document.getElementById('series-block-' + id);
    if (!block) return;
    var input = block.querySelector('.sb-series-input');
    var q = input && input.value ? input.value.trim() : '';
    var suggestEl = document.getElementById('series-suggest-' + id);
    var spinnerEl = document.getElementById('series-search-spinner-' + id);
    if (!suggestEl) return;

    // 🚀 已經選定並帶出一個系列之後，如果又回來改輸入框的字，代表要重新搜尋別的系列了——
    // 立刻清掉舊的自動帶入結果，不要讓「正在打新的字，畫面卻還顯示舊系列的清單」這種混淆狀態出現。
    if (block.dataset.confirmedSeries && q !== block.dataset.confirmedSeries) {
      var staleStatusEl = document.getElementById('autofill-status-' + id);
      var staleGroupsEl = document.getElementById('autofill-groups-' + id);
      if (staleStatusEl) { staleStatusEl.textContent = ''; staleStatusEl.className = 'autofill-status'; }
      if (staleGroupsEl) staleGroupsEl.innerHTML = '';
      delete block.dataset.confirmedSeries;
    }

    clearTimeout(_seriesInputDebounce[id]);
    _seriesSuggestToken[id] = (_seriesSuggestToken[id] || 0) + 1; // 讓還沒回來的舊查詢作廢

    if (!q || !_seriesQueryMeetsThreshold(q)) {
      suggestEl.innerHTML = ''; suggestEl.style.display = 'none';
      if (spinnerEl) spinnerEl.style.display = 'none';
      return;
    }

    if (spinnerEl) spinnerEl.style.display = 'block';
    var myToken = _seriesSuggestToken[id];
    _seriesInputDebounce[id] = setTimeout(function () {
      google.script.run
        .withSuccessHandler(function (res) {
          if (_seriesSuggestToken[id] !== myToken) return; // 已經有更新的查詢在跑，這筆回應作廢（避免舊回應把清單蓋掉/閃現又消失）
          var stillSuggestEl = document.getElementById('series-suggest-' + id);
          var stillSpinnerEl = document.getElementById('series-search-spinner-' + id);
          if (stillSpinnerEl) stillSpinnerEl.style.display = 'none';
          if (!stillSuggestEl) return;
          if (!res || !res.success || !res.names || !res.names.length) {
            stillSuggestEl.innerHTML = '';
            stillSuggestEl.style.display = 'none';
            return;
          }
          stillSuggestEl.innerHTML = res.names.map(function (name) {
            // 用 mousedown（不是 click）：要搶在 input 的 blur 事件之前先觸發，才不會被 blur 隱藏清單卡住
            // 🚀 id 一律加引號當字串傳——快速新增面板用的是 'quickadd' 這種字串 id，
            // 之前沒加引號會被當成裸的 JS 變數名稱去解析，拋 ReferenceError（id 是數字時剛好沒事，才沒早點發現）
            return '<div class="series-suggest-item" onmousedown="selectSeriesSuggestion(\'' + id + '\', \'' + name.replace(/'/g, "\\'") + '\')">' + escapeHtml(name) + '</div>';
          }).join('');
          stillSuggestEl.style.display = 'block';
        })
        .withFailureHandler(function () {
          if (_seriesSuggestToken[id] !== myToken) return;
          var stillSpinnerEl = document.getElementById('series-search-spinner-' + id);
          if (stillSpinnerEl) stillSpinnerEl.style.display = 'none';
        })
        .getSeriesNameSuggestions(q);
    }, 250);
  };

  window.selectSeriesSuggestion = function (id, name) {
    var block = document.getElementById('series-block-' + id);
    if (!block) return;
    var input = block.querySelector('.sb-series-input');
    if (input) input.value = name;
    hideSeriesSuggestions(id);
    fetchSeriesAutofill(id);
  };

  window.hideSeriesSuggestions = function (id) {
    // 延遲一點點再隱藏：讓 onmousedown 選建議項目的事件先觸發完成
    setTimeout(function () {
      var suggestEl = document.getElementById('series-suggest-' + id);
      if (suggestEl) suggestEl.style.display = 'none';
    }, 150);
  };

  /**
   * 🚀 系列名稱輸入完成(失焦，或點選建議清單)後，向後端查該系列既有編號，依尺寸分組渲染成勾選清單。
   */
  var _seriesFetchToken = {};
  window.fetchSeriesAutofill = function (id) {
    var block = document.getElementById('series-block-' + id);
    if (!block) return;
    var input = block.querySelector('.sb-series-input');
    var series = input && input.value ? input.value.trim() : '';
    var statusEl = document.getElementById('autofill-status-' + id);
    var groupsEl = document.getElementById('autofill-groups-' + id);
    if (!groupsEl) return;

    if (!series) {
      groupsEl.innerHTML = '';
      if (statusEl) { statusEl.textContent = ''; statusEl.className = 'autofill-status'; }
      delete block.dataset.confirmedSeries;
      return;
    }

    // 🚀 字數不夠門檻就不查（避免太短、太籠統的字送出查詢，既浪費請求又容易配到不相關的系列）
    if (!_seriesQueryMeetsThreshold(series)) {
      groupsEl.innerHTML = '';
      if (statusEl) { statusEl.textContent = '請輸入更完整的系列名稱或編號（中文2字/數字5碼/英文3碼以上）再查詢'; statusEl.className = 'autofill-status notfound'; }
      delete block.dataset.confirmedSeries;
      return;
    }

    // 🚀 用遞增的 token 擋掉「舊查詢比新查詢晚回來、把畫面蓋回舊結果」的競態問題：
    // 使用者快速改字連續觸發查詢時，只有最後一次的回應會真的被渲染。
    var myToken = (_seriesFetchToken[id] = (_seriesFetchToken[id] || 0) + 1);

    var spinnerEl = document.getElementById('series-search-spinner-' + id);
    if (spinnerEl) spinnerEl.style.display = 'block';
    if (statusEl) { statusEl.textContent = '正在查詢「' + series + '」的既有編號...'; statusEl.className = 'autofill-status'; }

    google.script.run
      .withSuccessHandler(function (res) {
        if (_seriesFetchToken[id] !== myToken) return; // 已經有更新的查詢在跑，這筆回應作廢
        // 使用者可能在查詢期間已經移除這個區塊
        var stillGroupsEl = document.getElementById('autofill-groups-' + id);
        var stillStatusEl = document.getElementById('autofill-status-' + id);
        var stillBlock = document.getElementById('series-block-' + id);
        var stillSpinnerEl = document.getElementById('series-search-spinner-' + id);
        if (stillSpinnerEl) stillSpinnerEl.style.display = 'none';
        if (!stillGroupsEl || !stillStatusEl) return;

        if (!res || !res.success) {
          stillStatusEl.textContent = '查詢失敗，可手動新增品項';
          stillStatusEl.className = 'autofill-status notfound';
          stillGroupsEl.innerHTML = '';
          return;
        }
        if (!res.seriesFound || !res.sizes || !res.sizes.length) {
          stillStatusEl.textContent = '⚠️ 查無「' + series + '」系列的既有編號（可能是新品或名稱不同），請手動新增';
          stillStatusEl.className = 'autofill-status notfound';
          stillGroupsEl.innerHTML = '';
          return;
        }

        if (stillBlock) stillBlock.dataset.confirmedSeries = series; // 記錄目前畫面顯示的是哪個系列，供 handleSeriesInput 判斷是否該清空
        var totalCount = res.sizes.reduce(function (s, g) { return s + g.items.length; }, 0);
        stillStatusEl.textContent = '✅ 已帶入「' + res.matchedSeriesName + '」共 ' + totalCount + ' 個編號，勾選並填入片數即可';
        stillStatusEl.className = 'autofill-status found';
        stillGroupsEl.innerHTML = res.sizes.map(function (g) {
          return '<div class="autofill-size-group">' +
            '<div class="autofill-size-label">' + escapeHtml(g.size) + '（' + g.items.length + '）</div>' +
            g.items.map(function (it) { return buildAutofillItemRowHtml(id, it, g.size); }).join('') +
          '</div>';
        }).join('');
      })
      .withFailureHandler(function (err) {
        if (_seriesFetchToken[id] !== myToken) return;
        var stillStatusEl = document.getElementById('autofill-status-' + id);
        var stillSpinnerEl = document.getElementById('series-search-spinner-' + id);
        if (stillSpinnerEl) stillSpinnerEl.style.display = 'none';
        if (!stillStatusEl) return;
        stillStatusEl.textContent = '查詢失敗：' + (err && err.message ? err.message : err);
        stillStatusEl.className = 'autofill-status notfound';
      })
      .getSeriesSkuOptions(series);
  };

  function buildAutofillItemRowHtml(blockId, it, sizeVal) {
    var imgHtml = it.img
      ? '<img src="' + it.img + '" onerror="this.parentElement.innerHTML=\'<span>NO IMG</span>\'">'
      : '<span>NO IMG</span>';
    // 🚀 批號可選也可自打：如果這個編號在庫存裡有查到現成批號，用 <datalist> 做成下拉可選＋仍可自行輸入，預設自動帶入第一批號
    var defaultBatch = (it.batches && it.batches.length) ? it.batches[0] : '';
    var batchListId = 'batch-opts-' + blockId + '-' + it.sku.replace(/[^A-Za-z0-9]/g, '');
    var batchOptionsHtml = (it.batches && it.batches.length)
      ? '<datalist id="' + batchListId + '">' + it.batches.map(function (b) { return '<option value="' + escapeHtml(b) + '">'; }).join('') + '</datalist>'
      : '';
    return '<div class="autofill-item-row" data-sku="' + escapeHtml(it.sku) + '" data-size="' + escapeHtml(sizeVal || '') + '" data-default-batch="' + escapeHtml(defaultBatch) + '">' +
      '<input type="checkbox" onchange="toggleAutofillRow(this)">' +
      '<div class="autofill-item-thumb">' + imgHtml + '</div>' +
      '<div class="autofill-item-info">' +
        '<div class="autofill-item-sku">' + escapeHtml(it.sku) + '</div>' +
        (it.color ? '<div class="autofill-item-color">' + escapeHtml(it.color) + '</div>' : '') +
      '</div>' +
      '<input type="text" class="autofill-item-qty" placeholder="片數" inputmode="numeric" pattern="[0-9]*" oninput="onAutofillInput(this)">' +
      '<input type="text" class="autofill-item-batch" placeholder="批號"' + (defaultBatch ? ' value="' + escapeHtml(defaultBatch) + '"' : '') + (batchOptionsHtml ? ' list="' + batchListId + '"' : '') + ' oninput="onAutofillInput(this)">' +
      batchOptionsHtml +
    '</div>';
  }

  window.toggleAutofillRow = function (cb) {
    var row = cb.closest('.autofill-item-row');
    if (row) {
      row.classList.toggle('checked', cb.checked);
      if (cb.checked) {
        var qtyInput = row.querySelector('.autofill-item-qty');
        if (qtyInput && !qtyInput.value) qtyInput.value = '1';
        var batchInput = row.querySelector('.autofill-item-batch');
        if (batchInput && !batchInput.value && row.dataset.defaultBatch) {
          batchInput.value = row.dataset.defaultBatch;
        }
      }
    }
  };

  window.onAutofillInput = function (inputEl) {
    var row = inputEl.closest('.autofill-item-row');
    if (!row) return;
    var cb = row.querySelector('input[type="checkbox"]');
    if (cb && !cb.checked) {
      cb.checked = true;
      row.classList.add('checked');
    }
  };

  window.addNewAddRow = function (blockId) {
    var container = blockId ? document.getElementById('add-sku-list-' + blockId) : null;
    if (!container) {
      // 相容：若沒傳 blockId，退回抓目前唯一/最後一個系列區塊
      var lists = document.querySelectorAll('[id^="add-sku-list-"]');
      container = lists.length ? lists[lists.length - 1] : null;
    }
    if (!container) return;
    var div = document.createElement('div');
    div.className = 'edit-row-premium';
    div.innerHTML = '<input type="text" class="edit-sku-input" placeholder="編號" inputmode="text">' +
      '<input type="text" class="edit-qty-input" placeholder="片數" inputmode="numeric" pattern="[0-9]*" value="1">' +
      '<button class="btn-remove-premium" onclick="this.parentElement.remove()">×</button>';
    container.appendChild(div);
  };

  window.triggerAddPhoto = function (slot) {
    document.getElementById(slot === 1 ? 'add-photo-input-2' : 'add-photo-input').click();
  };

  window.handleAddPhoto = function (input, slot) {
    if (input.files && input.files[0]) {
      var file = input.files[0];
      var isSecond = (slot === 1);
      
      // 🚀 嘗試從 EXIF 提取 GPS（只用第一張；第二張是同一面牆的另一半，定位相同）
      if (!isSecond) {
      updateGpsStatus('loading', '正在讀取照片定位...');
      processImageGps(file, function(gps) {
        if (gps) {
          addState.gpsPos = gps;
          updateGpsStatus('photo', '📍 已成功讀取照片定位');
          showToast('✨ 已從照片成功讀取定位資訊', 'success');
        } else {
          // 如果照片沒定位，且目前也沒手機定位，則嘗試手機定位
          if (!addState.gpsPos) {
            updateGpsStatus('none', '💡 照片無定位，嘗試使用手機定位...');
            navigator.geolocation.getCurrentPosition(function(pos) {
              addState.gpsPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
              updateGpsStatus('phone', '📍 已改用手機即時定位');
            });
          } else {
             // 保留原有的手機定位提示
             updateGpsStatus('phone', '📍 照片無定位，沿用手機定位');
          }
        }
      });
      }

      var reader = new FileReader();
      reader.onload = function (e) {
        var base64 = e.target.result.split(',')[1];
        var data = { base64: base64, mimeType: file.type, name: file.name };
        if (isSecond) {
          addState.imageData2 = data;
          document.getElementById('add-photo-preview-2').innerHTML = '<img src="' + e.target.result + '">';
        } else {
          addState.imageData = data;
          document.getElementById('add-photo-preview').innerHTML = '<img src="' + e.target.result + '">';
        }
      };
      reader.readAsDataURL(file);
    }
  };

  window.saveNewLayoutEntry = function () {
    var customerName = state.selectedCustomer || state.currentCustomer || '';

    if (!customerName) {
      showToast('⚠️ 請先選擇客戶');
      return;
    }
    if (!addState.imageData) {
      showToast('⚠️ 請先拍攝或選擇版面照片');
      return;
    }

    // 🚀 依序彙整每個「系列區塊」：自動帶入(勾選+有填片數)的品項 ＋ 手動新增的品項，
    //    每個品項各自帶自己所屬的 series/size（支援一次記錄多系列版面）。
    var blocks = Array.prototype.slice.call(document.querySelectorAll('#add-series-blocks .series-block'));
    if (blocks.length === 0) {
      showToast('⚠️ 請至少新增一個系列');
      return;
    }

    var items = [];
    var firstSeries = '', firstSize = '';

    for (var bi = 0; bi < blocks.length; bi++) {
      var block = blocks[bi];
      var seriesInput = block.querySelector('.sb-series-input');
      var sizeInput = block.querySelector('.sb-size-input');
      var series = (seriesInput && seriesInput.value ? seriesInput.value : '').trim();
      var blockSize = (sizeInput && sizeInput.value ? sizeInput.value : '').trim();

      var checkedRows = Array.prototype.slice.call(block.querySelectorAll('.autofill-item-row'))
        .filter(function (row) { return row.querySelector('input[type="checkbox"]').checked; });
      var manualRows = Array.prototype.slice.call(block.querySelectorAll('.edit-row-premium'));

      if (checkedRows.length === 0 && manualRows.length === 0) continue; // 這個區塊沒填東西，跳過

      if (!series) {
        showToast('⚠️ 有系列區塊填了品項卻沒填系列名稱，請確認');
        return;
      }
      if (manualRows.length > 0 && !blockSize) {
        showToast('⚠️「' + series + '」有手動新增的品項，請填寫產品尺寸');
        return;
      }

      checkedRows.forEach(function (row) {
        var qtyInput = row.querySelector('.autofill-item-qty');
        var batchInput = row.querySelector('.autofill-item-batch');
        var qty = Number(qtyInput && qtyInput.value ? qtyInput.value : 0) || 0;
        if (qty <= 0) return; // 勾選了但沒填片數，不算數
        items.push({
          sku: (row.dataset.sku || '').toUpperCase(),
          qty: qty,
          batch: batchInput && batchInput.value ? batchInput.value.trim() : '',
          series: series,
          size: row.dataset.size || blockSize || ''
        });
      });

      manualRows.forEach(function (row) {
        var skuInput = row.querySelector('.edit-sku-input');
        var qtyInput = row.querySelector('.edit-qty-input');
        var sku = (skuInput && skuInput.value ? skuInput.value : '').trim().toUpperCase();
        if (!sku) return;
        items.push({
          sku: sku,
          qty: Number(qtyInput && qtyInput.value ? qtyInput.value : 1) || 1,
          series: series,
          size: blockSize
        });
      });

      if (!firstSeries) { firstSeries = series; firstSize = blockSize; }
    }

    if (items.length === 0) {
      showToast('⚠️ 請至少勾選一個自動帶入的品項並填入片數，或手動新增一個產品編號');
      return;
    }

    var submitBtn = document.querySelector('#add-modal .btn-save-full');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.dataset.originalText = submitBtn.dataset.originalText || submitBtn.innerText;
      submitBtn.innerText = '存檔中...';
    }

    var payload = {
      customerName: customerName,
      salesperson: state.currentSales || '',
      series: firstSeries, // 相容舊版共用欄位（後端拿去當照片檔名等 fallback 用），實際歸戶看每個 item 自己的 series
      size: firstSize,
      items: items,
      image: addState.imageData,
      images: [addState.imageData, addState.imageData2].filter(Boolean),
      gps: document.getElementById('add-gps-sync').checked ? addState.gpsPos : null
    };

    showLoading(true, false, '正在上傳新版面...');
    google.script.run
      .withSuccessHandler(function (res) {
        showLoading(false);
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = submitBtn.dataset.originalText || '🚀 提交紀錄並存檔';
        }

        if (res && res.success) {
          closeAddModal();
          showToast('✨ 新版面已存檔，請點擊 🔄 重新整理', 'success');
          if (typeof selectCustomer === 'function') {
            selectCustomer(customerName);
          }
        } else {
          showToast('❌ 存檔失敗: ' + ((res && res.msg) || '未知錯誤'));
        }
      })
      .withFailureHandler(function (err) {
        showLoading(false);
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = submitBtn.dataset.originalText || '🚀 提交紀錄並存檔';
        }
        showToast('❌ 程式執行出錯: ' + (err && err.message ? err.message : err));
      })
      .saveNewLayout(payload);
  };

  // ─── 庫存查詢與影像模組 (AIT 旗艦版) ─────────────────────────

  var searchDebounceTimer = null;
  window.debounceSearch = function() {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(function() {
      handleInventorySearch();
    }, 300);
  };

  window.openInventoryPage = function() {
    showPage('page-inventory');
    
    // 初始化業務名片入口資訊
    const nameEl = document.getElementById('staff-name');
    const compEl = document.getElementById('staff-company');
    if (nameEl) nameEl.innerText = state.currentSales || "業務人員";
    if (compEl) compEl.innerText = state.currentSales ? state.currentSales : "專屬";

    // 完整包是數 MB：5 分鐘內已載入過就不重抓；沒載入過才抓（會先用本機快取／輕量版秒開）
    if (!(state.isInventoryLoaded && Date.now() - (state.inventoryLoadedAt || 0) < 5 * 60 * 1000)) {
      loadInventoryData();
    }
    handleInventorySearch(); // 立刻換掉畫面上的佔位文字：有資料→系統已就緒；沒資料→讀取動畫
  };

  window.clearInput = function(id) {
    const el = document.getElementById(id);
    if (el) {
      el.value = '';
      el.dispatchEvent(new Event('input'));
    }
  };

  window.handleInventorySearch = function() {
    const qInput = document.getElementById('staff-search-input');
    const szInput = document.getElementById('staff-filter-size');
    const minPValue = document.getElementById('staff-filter-pyeong').value;
    const minQValue = document.getElementById('staff-filter-qty').value;
    const q = (qInput ? qInput.value : '').trim().toUpperCase();
    const sz = (szInput ? szInput.value : '').trim().toUpperCase().replace(/[xX*]/g, '');
    const minP = parseFloat(minPValue || 0);
    const minQ = parseFloat(minQValue || 0);
    const sort = document.getElementById('staff-sort').value;
    const list = document.getElementById('staff-result-list');

    // 處理清除按鈕顯示
    const clearQ = document.getElementById('clear-q');
    const clearSz = document.getElementById('clear-sz');
    if (clearQ) clearQ.style.display = q ? 'block' : 'none';
    if (clearSz) clearSz.style.display = sz ? 'block' : 'none';

    // 有資料可用＝完整包已到，或至少有本機快取／輕量版（秒開，不必等完整包）
    const hasInvData = state.isInventoryLoaded || (state.inventoryData && state.inventoryData.length > 0);

    if (!hasInvData) {
      if (state.inventoryLoadFailed) {
        list.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:60px 20px;">
            <div style="font-size:32px; margin-bottom:10px; opacity:0.6;">⚠️</div>
            <div style="color:#ff6b6b; font-size:14px; font-weight:700; margin-bottom:16px;">資料載入失敗或逾時，請重試</div>
            <button onclick="state.inventoryLoadFailed=false; loadInventoryData();" style="background:rgba(194,157,102,0.15); border:1px solid var(--staff-gold); color:var(--staff-gold); padding:8px 22px; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer;">重新載入</button>
          </div>`;
        return;
      }
      list.innerHTML = `
        <div class="ait-loading-box" style="grid-column:1/-1; padding:70px 16px;">
          <div class="ait-spinner"></div>
          <div>載入庫存資料中…</div>
        </div>`;
      // ⏱️ 逾時保護：15 秒還沒載入完成就顯示「重新載入」按鈕，避免無限期卡在讀取畫面沒有任何反應
      clearTimeout(state.inventoryLoadTimeoutTimer);
      state.inventoryLoadTimeoutTimer = setTimeout(function() {
        if (!state.isInventoryLoaded && !(state.inventoryData && state.inventoryData.length > 0)) {
          state.inventoryLoadFailed = true;
          handleInventorySearch();
        }
      }, 15000);
      return;
    }

    if (!q && !sz && minP <= 0 && minQ <= 0) {
      list.innerHTML = `
        <div style="grid-column:1/-1; text-align:center; padding:80px 20px;">
          <div style="font-size:40px; margin-bottom:15px; opacity:0.3;">🔍</div>
          <div style="color:var(--staff-gold); font-size:15px; font-weight:600;">系統已就緒</div>
          <div style="color:rgba(255,255,255,0.4); font-size:12px; margin-top:8px;">請輸入編號或系列開始查詢</div>
        </div>`;
      return;
    }

    // ⚡ 本機極速過濾模式
    let filtered = state.inventoryData.filter(p => {
      // A. 字串關鍵字比對 (SKU, 漢樺 SKU, 中文系列)
      let matchQ = !q;
      if (q) {
        const skuUp = (p.sku || "").toUpperCase();
        const hSkuUp = (p.hSku || "").toUpperCase();
        const seriesUp = (p.sCn || "").toUpperCase();
        const seriesEnUp = (p.sEn || "").toUpperCase();
        matchQ = skuUp.includes(q) || seriesUp.includes(q) || seriesEnUp.includes(q) || hSkuUp.includes(q);
      }

      // B. 尺寸比對
      let matchSz = !sz;
      if (sz) {
        const pSize = (p.size || "").toUpperCase().replace(/[xX*]/g, '');
        matchSz = pSize.includes(sz);
      }

      // C. 數量與坪數低標過濾
      let matchStock = true;
      if (minP > 0) matchStock = matchStock && (p.pyeong >= minP);
      if (minQ > 0) matchStock = matchStock && (p.qty >= minQ);

      return matchQ && matchSz && matchStock;
    });

    // 排序邏輯
    if (sort === 'stock-desc') {
      filtered.sort((a, b) => (b.qty || 0) - (a.qty || 0));

      filtered.sort((a, b) => (a.sku || "").localeCompare(b.sku || ""));

    // 限制最多顯示 120 筆以保證渲染效能

      // 預留標籤 HTML (直接在圖片容器內渲染)
      let imgHtml = p.img

             <img src="${p.img}" style="width: 100%; height: 100%; object-fit: cover; cursor: pointer;" onclick="event.stopPropagation(); showFullImg(-1, '${p.img.replace('=w400', '=w1200')}', '${p.sku}')" onerror="this.style.display='none'">
             <div id="reserve-badge-${p.sku}" style="position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.85); backdrop-filter:blur(5px); padding:2px 6px; border-radius:12px; display:${p.reserved > 0 ? 'flex' : 'none'}; align-items:center; gap:3px; border:1px solid rgba(212, 175, 55, 0.4); z-index:10; cursor:pointer;" onclick="event.stopPropagation(); showSkuReserve('${p.sku}')">
                <span style="font-size:8px; color:#fff; font-weight:700;">保留</span>
                <span style="background:var(--staff-gold); color:#000; width:12px; height:12px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:900;">${p.reserveCount || 1}</span>
             </div>
           </div>`
        : `<div style="position:relative; width:110px; height:74px; border-radius: 12px; overflow: hidden; background: #000; border: 1px dashed rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.2); font-size:11px; flex-shrink: 0; box-sizing:border-box;">
             無圖
             <div id="reserve-badge-${p.sku}" style="position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.85); backdrop-filter:blur(5px); padding:2px 6px; border-radius:12px; display:${p.reserved > 0 ? 'flex' : 'none'}; align-items:center; gap:3px; border:1px solid rgba(212, 175, 55, 0.4); z-index:10; cursor:pointer;" onclick="event.stopPropagation(); showSkuReserve('${p.sku}')">
                <span style="font-size:8px; color:#fff; font-weight:700;">保留</span>
                <span style="background:var(--staff-gold); color:#000; width:12px; height:12px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:900;">${p.reserveCount || 1}</span>
             </div>
           </div>`;

      // 實景圖按鈕 HTML
      let galleryBtnHtml = '';
      if (p.folderId || (p.scenes && p.scenes.length > 0)) {
        galleryBtnHtml = `
          <button onclick="event.stopPropagation(); openGallery('${p.sku}')"
            style="background:none; color:var(--staff-gold); font-size:10px; padding:4px 10px; border-radius:20px; border:1px solid rgba(194,157,102,0.4); cursor:pointer; font-weight:700; display:flex; align-items:center; gap:3px;">
            實景圖
          </button>
        `;
      }

      // 批號標籤
      let batchTagHtml = '';
      if (p.batches && p.batches.length > 0) {
        batchTagHtml = `
          <div onclick="event.stopPropagation(); openBatchModal('${p.sku}')" class="batch-link" style="text-decoration: underline; color:var(--staff-gold); font-weight:700; font-size:11px; cursor:pointer;">
            批號(${p.batches.length})
          </div>
        `;
      }

      html += `
        <div class="product-card ${borderClass}" onclick="openBatchModal('${p.sku}')" style="display: flex; gap: 15px; align-items: stretch; padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; margin-bottom: 15px; position: relative;">
          <div style="flex: 0 0 110px; display: flex; flex-direction: column; justify-content: space-between;">
            ${imgHtml}
            <div style="font-size:12px; color:#4ade80; font-weight:700; text-align:left; margin-top:10px;">
              ${p.pack ? p.pack + '片' : ''} ${p.weight ? ' ┃ ' + p.weight + 'kg' : ''}
            </div>
          </div>

          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div style="min-width: 0; flex: 1; text-align: left;">
                <div style="font-size:13px; color:var(--staff-gold); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                  尺寸: ${p.size || '未知規格'}
                </div>
                <div style="font-size:24px; font-weight:900; color:#fff; margin-top:2px; letter-spacing:1px; line-height:1.1; display:flex; align-items:center; gap:6px;">
                  <span>${p.sku}</span>
                  <span class="lamp-tag ${lampClass}">${lampText}</span>
                </div>
              </div>
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0;">
                ${galleryBtnHtml}
              </div>
            </div>
            
            <div style="background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.25); padding:6px 10px; border-radius:12px; color:${stockColor}; font-weight:900; font-size:16px; margin:6px 0; text-align:center; white-space:nowrap; letter-spacing:0.5px;">
              可用 ${Math.floor(p.qty)} 片 ┃ ${p.pyeong} 坪
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
              <div style="font-size:11px; color:rgba(255,255,255,0.4); font-weight:700; display:flex; gap:8px;">
                <span>實存:<span style="color:#eee; margin-left:2px;">${Math.floor(p.physical)}片</span></span>
                <span>保留:<span style="color:#eee; margin-left:2px;">${Math.floor(p.reserved)}片</span></span>
              </div>
              ${batchTagHtml}
            </div>

            ${p.hasArrival ? `
            <div style="margin-top:8px; background:rgba(0,122,255,0.12); border:1px solid rgba(0,122,255,0.35); border-radius:8px; padding:5px 10px; font-size:11px; font-weight:800; color:#007aff; text-align:center;">
              ✨ 新批 ${p.etaShort || p.eta || '近期'} 到${p.etaQty > 0 ? ' ' + Math.floor(p.etaQty) + '片' : ''}${p.etaPing > 0 ? '/' + p.etaPing + '坪' : ''}
            </div>` : ''}
          </div>
        </div>
      `;

    list.innerHTML = html;

    // 📝 智慧過濾查詢背景防震日誌寫入 (2.5秒停止輸入後自動同步)

      if (window.logSearchDebounceTimer) clearTimeout(window.logSearchDebounceTimer);
      window.logSearchDebounceTimer = setTimeout(function() {
        google.script.run.logSalespersonSearch(state.currentSales, q, sz, minP, minQ);

  // ─── 影像庫模組 ──────────────────────────────────────────

  var currentSku = '';
  var currentGalleryData = null;
  var currentGalleryList = [];
  var currentIndex = -1;

  window.openGallery = function(sku) {
    const item = state.inventoryData.find(p => p.sku === sku);
    if (!item) { showToast("找不到該商品資料"); return; }

    currentSku = sku;
    currentIndex = -1;
    currentGalleryList = [];

    const mainGrid = document.getElementById('staff-gallery-grid-main');
    const subGrid = document.getElementById('staff-gallery-grid-sub');
    if (mainGrid) mainGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--staff-gold); font-size:11px; letter-spacing:2px;">載入雲端影像庫中...</div>';
    if (subGrid) subGrid.innerHTML = '';

    document.getElementById('staff-gallery-modal').style.display = 'flex';

    // 1. 整理基礎的圖片陣列 (單片圖、scenes)
    const baseGallery = {
      scenes: [],
      videos: [],
      singles: [],
      molds: [],
      intros: [],
      catalogs: []
    };

    if (item.img) {
      baseGallery.singles.push({ name: sku + "_單片", url: item.img.replace('=w400', '=w1200'), isVideo: false });
    }
    if (item.scenes && item.scenes.length > 0) {
      item.scenes.forEach((sUrl, idx) => {
        baseGallery.scenes.push({ name: sku + "_實景" + (idx+1), url: sUrl, isVideo: false });
      });
    }

    currentGalleryData = baseGallery;

    if (item.folderId) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res) {
            // 合併後端抓取的分類影像
            ['scenes', 'singles', 'molds', 'intros'].forEach(cat => {
              if (res[cat]) {
                res[cat].forEach(file => {
                  const exists = baseGallery[cat].some(existFile => existFile.url === file.url);
                  if (!exists) {
                    baseGallery[cat].push({ name: file.name, url: file.url, isVideo: file.isVideo || false });
                  }
                });
              }
            });
            if (res.catalogs) baseGallery.catalogs = res.catalogs;
          }
          _updateGalleryTabs();
        })
        .withFailureHandler(function() {
          _updateGalleryTabs();
        })
        .getFolderImages(item.folderId);
    } else {
      _updateGalleryTabs();
    }
  };

  function _updateGalleryTabs() {
    const tabs = { scene: 'scenes', video: 'videos', single: 'singles', mold: 'molds', intro: 'intros' };
    let firstTab = '';
    
    // 如果有影片，或者專屬場景照有 .mp4 格式的檔案
    currentGalleryData.videos = currentGalleryData.scenes.filter(f => f.url.toLowerCase().endsWith('.mp4') || f.isVideo);
    currentGalleryData.scenes = currentGalleryData.scenes.filter(f => !f.url.toLowerCase().endsWith('.mp4') && !f.isVideo);

    for (let t in tabs) {
      const el = document.getElementById('tab-' + t);
      const count = currentGalleryData[tabs[t]].length;
      const catalogCount = (t === 'intro') ? currentGalleryData.catalogs.length : 0;
      
      if (count > 0 || catalogCount > 0) {
        if (el) el.style.display = 'flex';
        if (!firstTab) firstTab = t;
      } else {
        if (el) el.style.display = 'none';
      }
    }
    
    switchGalleryTab(firstTab || 'scene');
  }

  window.switchGalleryTab = function(type) {
    ['scene', 'video', 'single', 'mold', 'intro'].forEach(t => {
      const el = document.getElementById('tab-' + t);
      if (el) el.classList.toggle('active', t === type);
    });
    renderGalleryTab(type);
  };

  function renderGalleryTab(activeType) {
    const mainGrid = document.getElementById('staff-gallery-grid-main');
    const subGrid = document.getElementById('staff-gallery-grid-sub');
    const mainHeader = document.getElementById('header-main');
    const subHeader = document.getElementById('header-sub');

    let source = [];
    let typeName = "實景照";
    if (activeType === 'scene') { source = currentGalleryData.scenes; typeName = "實景照"; }
    else if (activeType === 'video') { source = currentGalleryData.videos; typeName = "影片"; }
    else if (activeType === 'single') { source = currentGalleryData.singles; typeName = "單片圖"; }
    else if (activeType === 'mold') { source = currentGalleryData.molds; typeName = "模面圖"; }
    else if (activeType === 'intro') { source = currentGalleryData.intros; typeName = "介紹/目錄"; }

    const cleanCurrent = currentSku.replace(/[\s\-\_]/g, '').toUpperCase();
    
    // 分流「本商品」與「同系列商品」
    let thisSkuFiles = source.filter(f => {
      const cleanName = (f.name || '').replace(/[\s\-\_]/g, '').toUpperCase();
      return cleanName.includes(cleanCurrent);
    });
    let otherFiles = source.filter(f => {
      const cleanName = (f.name || '').replace(/[\s\-\_]/g, '').toUpperCase();
      return !cleanName.includes(cleanCurrent);
    });

    if (activeType === 'single' && thisSkuFiles.length > 1) {
      thisSkuFiles = [thisSkuFiles[0]];
    }

    currentGalleryList = [...thisSkuFiles, ...otherFiles];

    let mainHtml = '';
    
    // 如果是介紹分頁，額外繪製電子目錄
    if (activeType === 'intro' && currentGalleryData.catalogs.length > 0) {
      currentGalleryData.catalogs.forEach(cat => {
        mainHtml += `
          <div style="grid-column:1/-1; padding:15px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:12px; margin: 10px; box-sizing: border-box; text-align: left;">
            <div style="color:#fff; font-weight:700; margin-bottom:10px; font-size:13px;">電子目錄: ${cat.name}</div>
            <div style="display:flex; gap:10px;">
              <button style="flex:1; background:var(--staff-gold); color:#000; border:none; padding:10px; border-radius:8px; font-weight:700; cursor:pointer;" onclick="window.open('${cat.url}', '_blank')">開啟 PDF</button>
              <button style="flex:1; background:rgba(255,255,255,0.1); color:#fff; border:none; padding:10px; border-radius:8px; font-weight:700; cursor:pointer;" onclick="window.open('${cat.downloadUrl}', '_blank')">下載檔案</button>
            </div>
          </div>`;
      });
    }

    thisSkuFiles.forEach((f, idx) => { mainHtml += renderImgItem(f, idx); });
    mainGrid.innerHTML = mainHtml || (activeType !== 'intro' ? '<div style="grid-column:1/-1; text-align:center; padding:30px; opacity:0.3; font-size:11px; color:#fff;">尚無專屬影像</div>' : '');
    mainHeader.innerHTML = `<span>專屬${typeName} (${thisSkuFiles.length})</span>`;

    let subHtml = '';
    otherFiles.forEach((f, idx) => { subHtml += renderImgItem(f, thisSkuFiles.length + idx); });
    subGrid.innerHTML = subHtml;
    subHeader.innerHTML = `<span>同系列${typeName} (${otherFiles.length})</span>`;
    subHeader.style.display = otherFiles.length > 0 ? 'flex' : 'none';

    mainHeader.classList.remove('collapsed'); mainGrid.style.maxHeight = '2000px';
    subHeader.classList.remove('collapsed'); subGrid.style.maxHeight = '2000px';
  }

  window.toggleSection = function(headerId, gridId) {
    const header = document.getElementById(headerId);
    const grid = document.getElementById(gridId);
    if (!header || !grid) return;
    const isCollapsed = header.classList.toggle('collapsed');
    grid.style.maxHeight = isCollapsed ? '0px' : '2000px';
  };

  function renderImgItem(f, idx) {
    return `
      <div style="aspect-ratio:1/1; overflow:hidden; background:#111; position:relative; border: 0.5px solid rgba(255,255,255,0.05); box-sizing: border-box;">
        <input type="checkbox" class="gallery-check" data-url="${f.url}" style="position:absolute; top:6px; right:6px; z-index:10; width:18px; height:18px; accent-color:var(--staff-gold); cursor:pointer;">
        ${f.isVideo ? '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:30px; pointer-events:none; z-index:5;">▶</div>' : ''}
        <img src="${f.url}" style="width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;" onclick="showFullImg(${idx})">
      </div>`;
  }

  // ─── 單張大圖與浮水印模組 ─────────────────────────────────

  window.showFullImg = function(idx, directUrl = null, sku = null) {
    const imgEl = document.getElementById('staff-full-img');
    const videoEl = document.getElementById('staff-full-video');
    const bottomArea = document.getElementById('image-modal-bottom');

    if (!imgEl || !videoEl) return;

    if (directUrl) {
      currentIndex = -1;
      currentSku = sku || '';
      imgEl.src = directUrl;
      imgEl.style.display = 'block';
      videoEl.style.display = 'none';
      videoEl.src = '';
    } else {
      currentIndex = idx;
      const item = currentGalleryList[idx];
      if (!item) return;
      
      if (item.url.toLowerCase().endsWith('.mp4') || item.isVideo) {
        imgEl.style.display = 'none';
        videoEl.style.display = 'block';
        videoEl.src = item.url;
      } else {
        imgEl.style.display = 'block';
        imgEl.src = item.url;
        videoEl.style.display = 'none';
        videoEl.src = '';
      }
    }

    updateWatermark();
    document.getElementById('staff-image-modal').style.display = 'flex';
  };

  window.closeFullImg = function() {
    const modal = document.getElementById('staff-image-modal');
    const videoEl = document.getElementById('staff-full-video');
    if (modal) modal.style.display = 'none';
    if (videoEl) videoEl.src = ''; // 停止播放影片
  };

  window.navGallery = function(dir) {
    if (currentIndex === -1 || currentGalleryList.length === 0) return;
    currentIndex = (currentIndex + dir + currentGalleryList.length) % currentGalleryList.length;
    showFullImg(currentIndex);
  };

  window.updateWatermark = function() {
    const layer = document.getElementById('watermark-layer');
    const sSku = document.getElementById('check-sku').checked;
    const sQty = document.getElementById('check-stock').checked;
    const sP = document.getElementById('check-pyeong').checked;
    
    if (!layer) return;

    if (!sSku && !sQty && !sP) {
      layer.style.display = 'none';
      return;
    }

    const p = state.inventoryData.find(x => x.sku === currentSku);
    if (!p) {
      layer.style.display = 'none';
      return;
    }

    const wmSkuEl = document.getElementById('wm-sku');
    const wmDataEl = document.getElementById('wm-data');
    if (wmSkuEl) wmSkuEl.innerText = sSku ? p.sku : '';
    
    let dataText = '';
    let details = [];
    if (sQty) details.push('可用 ' + Math.floor(p.qty) + ' 片');
    if (sP) details.push(p.pyeong + ' 坪');
    if (details.length > 0) dataText = details.join(' ┃ ');

    if (wmDataEl) wmDataEl.innerText = dataText;
    layer.style.display = 'block';
  };

  // 下載或導出圖檔
  window.downloadOriginalImg = function() {
    const url = document.getElementById('staff-full-img').src;
    if (url) {
      window.open(url, '_blank');
    }
  };

  // 單張分享至 LINE (秒級免驗證)
  window.shareSingleToLine = function() {
    const imgEl = document.getElementById('staff-full-img');
    if (!imgEl || imgEl.style.display === 'none') {
      showToast("影片不支援圖片分享");
      return;
    }

    const p = state.inventoryData.find(x => x.sku === currentSku);
    const showSku = document.getElementById('check-sku').checked;
    const showStock = document.getElementById('check-stock').checked;
    const showPyeong = document.getElementById('check-pyeong').checked;

    let text = (showSku ? "【" + currentSku + "】" : "") + "精選影像分享\n";
    let details = [];
    if (p) {
      if (showStock) details.push("可用庫存：" + Math.floor(p.qty) + "片");
      if (showPyeong) details.push(p.pyeong + "坪");
    }
    if (details.length > 0) text += details.join(" ┃ ") + "\n";
    const textWithLink = text + "圖片連結：" + imgEl.src;

    window.open('https://line.me/R/msg/text/?' + encodeURIComponent(textWithLink), '_blank');

  // ─── 影像批次操作模組 ─────────────────────────────────────

  window.batchAction = function(type) {
    const checkboxes = document.querySelectorAll('.gallery-check:checked');
    const selectedUrls = Array.from(checkboxes).map(cb => cb.getAttribute('data-url'));

    if (selectedUrls.length === 0) {
      showToast('請先勾選想要操作的照片');
      return;
    }

    if (type === 'preview') {
      const albumList = document.getElementById('staff-album-list');
      if (albumList) {
        albumList.innerHTML = selectedUrls.map(url => `
          <div style="margin-bottom:15px; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            <img src="${url.replace('=w400', '=w1200')}" style="width:100%; display:block;">
          </div>
        `).join('');
      }
      document.getElementById('staff-album-modal').style.display = 'flex';
    } else if (type === 'share') {
      let text = "【" + currentSku + "】精選影像分享\n\n";
      text += selectedUrls.map((url, i) => "圖" + (i + 1) + ": " + url.replace('=w400', '=w1200')).join("\n");
      
      _copyToClipboard(selectedUrls.join('\n'));
      window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text), '_blank');
    }
  };

  // ─── 保留單查詢模組 ───────────────────────────────────────

  var reserveData = [];

  window.showReservations = function() {
    const nameEl = document.getElementById('reserve-title-text');
    if (nameEl) nameEl.innerText = (state.currentSales ? state.currentSales + ' ' : '') + '專屬保留單';

    const rList = document.getElementById('reserveList');
    if (rList) rList.innerHTML = '<div style="padding: 40px; text-align: center; opacity: 0.5; color:#fff;">正在讀取保留單...</div>';

    document.getElementById('reserveModal').style.display = 'flex';

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          reserveData = res.groups || [];
          renderReservations();
          
          // 渲染業務篩選清單
          const bizSet = new Set();
          reserveData.forEach(g => { if(g.biz) bizSet.add(g.biz); });
          const filterList = document.getElementById('biz-checkbox-list');
          if (filterList) {
            filterList.innerHTML = Array.from(bizSet).map(bizName => `
              <label style="display:flex; align-items:center; gap:8px; color:#fff; font-size:12px; cursor:pointer;">

  // 🗞️ 載入最新業務版面更新，跑馬燈輪播與版面記錄提示標籤
  let _layoutActivities = [];
  let _layoutHeadlines = [];
  let _layoutTickerTimer = null;

  function loadLayoutActivities() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) return;
        const nowMs = Date.now();
        const oneWeekMs = 7 * 24 * 3600 * 1000;
        // 🚀 前端雙重保險：過濾超過 1 週（7天）的舊紀錄，並嚴格按時間由新到舊排序（愈新的愈上面）
        _layoutActivities = (res.activities || [])
          .filter(function(a) { return a && a.timestamp && (nowMs - a.timestamp <= oneWeekMs); })
          .sort(function(a, b) { return b.timestamp - a.timestamp; });
        _layoutHeadlines = _layoutActivities.map(function(a) { return a.headline; }).filter(Boolean);

        // 1. 更新首頁版面記錄卡片上的提示符號
        updateLayoutCardBadge({ activities: _layoutActivities, hasNew: res.hasNew });

        // 2. 啟動頂部 POWERED BY 跑馬燈輪播
        if (_layoutHeadlines && _layoutHeadlines.length > 0) {
          startLayoutHeadlineTicker(_layoutHeadlines);
        }
      })
      .withFailureHandler(function(err) {
        console.warn('載入最新版面動態失敗：', err);
      })
      .getLatestLayoutActivities();
  }

  function updateLayoutCardBadge(res) {
    const badgeEl = document.getElementById('layout-badge');
    const badgeText = document.getElementById('layout-badge-text');
    if (!badgeEl) return;

    if (!res || !res.activities || !res.activities.length) {
      badgeEl.style.display = 'none';
      return;
    }

    const lastSeenTs = parseInt(localStorage.getItem('ag_last_seen_layout_ts') || '0', 10);
    const unreadCount = res.activities.filter(function(a) { return a.timestamp > lastSeenTs; }).length;

    if (unreadCount > 0) {
      if (badgeText) badgeText.innerText = unreadCount > 1 ? (unreadCount + ' 筆更新') : 'NEW';
      badgeEl.style.display = 'inline-flex';
    } else if (res.hasNew) {
      if (badgeText) badgeText.innerText = '●';
      badgeEl.style.display = 'inline-flex';
      badgeEl.style.opacity = '0.75';
    } else {
      badgeEl.style.display = 'none';
    }
  }

  function startLayoutHeadlineTicker(headlines) {
    if (!headlines || !headlines.length) return;
    const splashTicker = document.getElementById('ait-powerby-splash');
    const dashTicker = document.getElementById('ait-powerby-dashboard');
    let idx = 0;

    const tick = function() {
      const text = headlines[idx % headlines.length];
      [splashTicker, dashTicker].forEach(function(el) {
        if (!el) return;
        el.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        el.style.opacity = '0';
        el.style.transform = 'translateY(-3px)';
        setTimeout(function() {
          el.innerText = text;
          el.style.opacity = '0.95';
          el.style.transform = 'translateY(0)';
        }, 400);
      });
      idx++;
    };

    tick();
    if (_layoutTickerTimer) clearInterval(_layoutTickerTimer);
    if (headlines.length > 1) {
      _layoutTickerTimer = setInterval(tick, 4000);
    }
  }

  function formatClientLayoutDetail(raw) {
    if (!raw) return '';
    let s = String(raw).trim();
    if (!s) return '';
    if (!s.startsWith('{') && !s.startsWith('[')) return s;
    try {
      let parsed = JSON.parse(s);
      if (Array.isArray(parsed)) {
        if (parsed.length === 1 && typeof parsed[0] === 'object' && parsed[0] !== null) {
          parsed = parsed[0];
        } else if (parsed.length > 1 && typeof parsed[0] === 'string') {
          return parsed.slice(1).map(function(x) { return Array.isArray(x) ? x.join('、') : String(x); }).join(' ｜ ');
        }
      }
      if (typeof parsed === 'object' && parsed !== null) {
        let parts = [];
        if (parsed.series) parts.push('系列 ' + parsed.series);
        if (parsed.size) parts.push('尺寸 ' + parsed.size);
        if (Array.isArray(parsed.items) && parsed.items.length > 0) {
          let skus = parsed.items.map(function(it) {
            if (typeof it === 'string') return it;
            if (it && typeof it === 'object') {
              let code = it.sku || it.code || it.productCode || '';
              let q = (it.qty != null ? it.qty : it.quantity);
              return code + (q != null ? '×' + q : '');
            }
            return '';
          }).filter(Boolean);
          if (skus.length > 0) {
            parts.push(skus.slice(0, 8).join('、') + (skus.length > 8 ? ' 等 ' + skus.length + ' 項' : ''));
          }
        }
        if (parsed.mode) parts.push('展示方式 ' + parsed.mode);
        if (parsed.note) parts.push('備註：' + parsed.note);
        if (parts.length > 0) return parts.join(' ｜ ');
      }
    } catch (e) {}
    return s;
  }

    _renderJpg: function(g, fields, callback) {
      if (!g.photoUrl) { callback(null); return; }
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        var c = document.createElement('canvas');
        var ctx = c.getContext('2d');
        var infoH = 100;
        c.width = img.width;
        c.height = img.height + infoH;
        ctx.drawImage(img, 0, 0);
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, img.height, c.width, infoH);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px sans-serif';
        var y = img.height + 24;
        if (fields.series) { ctx.fillText('🏷️ ' + (g.seriesLabel || g.series || '未命名'), 15, y); y += 26; }
        if (fields.sku) {
          ctx.font = '15px sans-serif';
          ctx.fillStyle = '#ccc';
          var s = g.items.map(function(it){ return it.sku; }).join(', ');
          ctx.fillText('🔢 ' + (s.length > 50 ? s.substring(0,50)+'...' : s), 15, y);
          y += 24;
        }
        if (fields.sales) {
          ctx.font = '16px sans-serif';
          ctx.fillStyle = '#facc15';
          ctx.fillText('💰 ' + Math.round(g.totalSalesAmt/10000) + '萬 / ' + Math.round(g.totalSalesQty) + '坪', 15, y);
          y += 22;
        }
        if (fields.date) {
          ctx.font = '14px sans-serif'; ctx.fillStyle = '#aaa';
          ctx.fillText('📅 ' + (g.items[0].installDate || g.items[0].lastUpdate || '—'), 15, y);
          y += 20;
        }
        if (fields.freq) {
          ctx.font = '14px sans-serif'; ctx.fillStyle = '#aaa';
          ctx.fillText('📊 ' + (g.totalFrequency || 0) + ' 次', 15, y);
        }
        c.toBlob(function(blob) { callback(blob); }, 'image/jpeg', 0.92);
      };
      img.onerror = function() { callback(null); };
      img.src = g.photoUrl;
    },
    toDownload: function() {
      var groups = state.sortedGroups || [];
      if (!groups.length) { showToast('沒有資料', 'error'); return; }
      showLoading(true, false, '正在生成 JPG...');
      var idx = 0;
      var el = document.getElementById('expSeries');
      if (!el) { showLoading(false); return; }
      var fields = {
        series: el.checked,
        sku: document.getElementById('expSku').checked,
        sales: document.getElementById('expSales').checked,
        date: document.getElementById('expDate').checked,
        freq: document.getElementById('expFreq').checked
      };
      function next() {
        if (idx >= groups.length) {
          showLoading(false);
          showToast('✅ JPG 已下載');
          var m = document.getElementById('batchExportModal');
          if (m) m.remove();
          return;
        }
        var g = groups[idx++];
        batchExport._renderJpg(g, fields, function(blob) {
          if (!blob) { next(); return; }
          var a = document.createElement('a');
          a.download = (g.seriesLabel || g.series || '未命名').replace(/[\/?<>\\:*|" ]/g,'_') + '.jpg';
          var url = URL.createObjectURL(blob);
          a.href = url;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function() { URL.revokeObjectURL(url); next(); }, 500);
        });
      }
      next();
    },
    toEmail: function() {
      var groups = state.sortedGroups || [];
      if (!groups.length) { showToast('沒有資料', 'error'); return; }
      var el = document.getElementById('expSeries');
      if (!el) return;
      var fields = {
        series: el.checked, sku: document.getElementById('expSku').checked,
        sales: document.getElementById('expSales').checked,
        date: document.getElementById('expDate').checked, freq: document.getElementById('expFreq').checked
      };
      showLoading(true, false, '正在生成 JPG...');
      var idx = 0, results = [];
      function next() {
        if (idx >= groups.length) {
          if (results.length === 0) { showLoading(false); showToast('生成失敗', 'error'); return; }
          showLoadingWithStatus('正在寄送 Email...');
          google.script.run
            .withSuccessHandler(function(res) {
              showLoading(false);
              var m = document.getElementById('batchExportModal');
              if (m) m.remove();
              if (res.success) showToast('📧 ' + res.msg);
              else showToast('❌ ' + (res.msg || '寄送失敗'));
            })
            .withFailureHandler(function(err) {
              showLoading(false);
              showToast('❌ 系統錯誤: ' + err.message);
            })
            .sendLayoutReport(
              document.getElementById('expEmail').value || '',
              state.selectedCustomer || '',
              state.currentSales || '',
              JSON.stringify(results)
            );
          return;
        }
        var g = groups[idx++];
        batchExport._renderJpg(g, fields, function(blob) {
          if (blob) {
            var reader = new FileReader();
            reader.onload = function() {
              var base64 = reader.result.split(',')[1];
              results.push({ data: base64, name: (g.seriesLabel || g.series || '未命名').replace(/[\/?<>\\:*|" ]/g,'_') });
              next();
            };
            reader.readAsDataURL(blob);
          } else {
            next();
          }
        });
      }
      next();
    },
    toLine: function() {
      var groups = state.sortedGroups || [];
      if (!groups.length) { showToast('沒有資料', 'error'); return; }
      var el = document.getElementById('expSeries');
      if (!el) return;
      var fields = {
        series: el.checked, sku: document.getElementById('expSku').checked,
        sales: document.getElementById('expSales').checked,
        date: document.getElementById('expDate').checked, freq: document.getElementById('expFreq').checked
      };
      showLoading(true, false, '正在生成 JPG...');
      var idx = 0, blobs = [];
      function next() {
        if (idx >= groups.length) {
          showLoading(false);
          var m = document.getElementById('batchExportModal');
          if (m) m.remove();
          if (blobs.length === 0) { showToast('生成失敗', 'error'); return; }
          // 嘗試 navigator.share
          if (navigator.share && navigator.canShare) {
            var files = blobs.map(function(b, i) { return new File([b], '版面_' + (i+1) + '.jpg', {type:'image/jpeg'}); });
            if (navigator.canShare({files: files})) {
              navigator.share({files: files, title: '版面資料 - ' + (state.selectedCustomer || '')}).catch(function(){});
              return;
            }
          }
          // fallback: LINE URL
          var text = '📦 版面資料 - ' + (state.selectedCustomer || '') + '\n';
          groups.forEach(function(g, i) {
            text += '\n【' + (i+1) + '】' + (g.seriesLabel || g.series || '未命名') + '\n';
            if (g.photoUrl) text += g.photoUrl + '\n';
          });
          // 行動用 line://，桌面用 https://
          if (/iPad|iPhone|iPod|Android/i.test(navigator.userAgent)) {
            window.open('line://msg/text/' + encodeURIComponent(text));
          } else {
            window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text));
          }
          showToast('💬 LINE 已開啟');
          return;
        }
        var g = groups[idx++];
        batchExport._renderJpg(g, fields, function(blob) {
          if (blob) blobs.push(blob);
          next();
        });
      }
      next();
    }
  };

  // ============================================
  // 🤖 AI 智慧查詢助理
  // ============================================
  var AI_HISTORY_KEY = 'ai_query_history_v1';
  var AI_HISTORY_MAX_DAYS = 30;
  var _aiHistory = []; // 新的在陣列前面 (index 0)，畫面渲染時新的自然排在最上面

  function _aiLoadHistory() {
    try {
      var raw = localStorage.getItem(AI_HISTORY_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      var cutoff = Date.now() - AI_HISTORY_MAX_DAYS * 86400000;
      _aiHistory = arr.filter(function(e) { return e && e.timestamp >= cutoff; });
    } catch (e) {
      _aiHistory = [];
    }
  }

  function _aiSaveHistory() {
    var cutoff = Date.now() - AI_HISTORY_MAX_DAYS * 86400000;
    var pruned = _aiHistory.filter(function(e) { return e && e.timestamp >= cutoff; });
    try {
      localStorage.setItem(AI_HISTORY_KEY, JSON.stringify(pruned));
    } catch (e) {
      // 儲存空間爆了（常見是 QuotaExceededError）：先試著只留最近 20 筆再存一次，救不回來才提示使用者
      try {
        localStorage.setItem(AI_HISTORY_KEY, JSON.stringify(pruned.slice(0, 20)));
        showToast('查詢歷史空間快滿了，已自動清掉較舊的紀錄');
      } catch (e2) {
        showToast('查詢歷史儲存失敗（瀏覽器儲存空間已滿），本次結果暫時不會被記住');
      }
    }
  }

  function openAiQueryModal() {
    var modal = document.getElementById('ai-query-modal');
    modal.style.display = 'flex';
    modal.classList.add('active');
    _aiLoadHistory();
    _aiRenderHistory();
    setTimeout(function() {
      var input = document.getElementById('ai-query-input');
      if (input) input.focus();
    }, 200);
  }

  function closeAiQueryModal() {
    var modal = document.getElementById('ai-query-modal');
    modal.style.display = 'none';
    modal.classList.remove('active');
  }

  var _aiQueryRunning = false;

  // 🚦 每個瀏覽器一組隨機裝置代號，存 localStorage，後端用它做「每分鐘幾次」的頻率限制
  function _aiGetDeviceId() {
    try {
      var id = localStorage.getItem('ai_device_id');
      if (!id) {
        id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem('ai_device_id', id);
      }
      return id;
    } catch (e) {
      return 'nolocalstorage';
    }
  }

  function runAiQuery() {
    if (_aiQueryRunning) return;
    var input = document.getElementById('ai-query-input');
    var question = (input.value || '').trim();
    if (!question) return;

    input.value = ''; // 🚀 送出後立刻清空輸入框

    var entry = {
      id: 'q_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      question: question,
      timestamp: Date.now(),
      pending: true,
      res: null
    };
    _aiHistory.unshift(entry); // 新的放最前面 → 畫面上自然顯示在最上面
    _aiSendQuery(entry, '');
  }

  // 送出一筆查詢（供正常送出與「超額後輸入密碼重試」共用）
  function _aiSendQuery(entry, password) {
    entry.pending = true;
    _aiRenderHistory(); // 立刻換成轉圈動畫，不要讓密碼輸入框停留到回應回來
    _aiQueryRunning = true;
    google.script.run
      .withSuccessHandler(function(res) {
        _aiQueryRunning = false;
        entry.pending = false;
        entry.res = res;
        _aiSaveHistory();
        _aiRenderHistory();
      })
      .withFailureHandler(function(err) {
        _aiQueryRunning = false;
        entry.pending = false;
        entry.res = { success: false, msg: (err && err.message) ? err.message : String(err) };
        _aiSaveHistory();
        _aiRenderHistory();
      })
      .aiAssistantAsk(entry.question, _aiGetDeviceId(), password || '');
  }

  // 「超過每分鐘限額」畫面上輸入密碼後按下重試
  window._aiRetryWithPassword = function(entryId) {
    var entry = _aiHistory.find(function(e) { return e.id === entryId; });
    if (!entry) return;
    var input = document.getElementById('ai-pw-' + entryId);
    var password = input ? input.value.trim() : '';
    if (!password) return;
    _aiSendQuery(entry, password);
  };

  // ============================================
  // 🎤 AI 查詢：語音輸入 (Web Speech API)
  // ============================================
  var _aiVoiceRecognition = null;
  var _aiVoiceListening = false;

  function toggleAiVoiceInput() {
    var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionCtor) {
      showToast('此瀏覽器不支援語音輸入，請直接打字');
      return;
    }

    if (_aiVoiceListening) {
      if (_aiVoiceRecognition) _aiVoiceRecognition.stop();
      return;
    }

    var micBtn = document.getElementById('ai-query-mic-btn');
    var input = document.getElementById('ai-query-input');

    _aiVoiceRecognition = new SpeechRecognitionCtor();
    _aiVoiceRecognition.lang = 'zh-TW';
    _aiVoiceRecognition.interimResults = false;
    _aiVoiceRecognition.maxAlternatives = 1;

    _aiVoiceRecognition.onstart = function() {
      _aiVoiceListening = true;
      if (micBtn) { micBtn.classList.add('listening'); micBtn.textContent = '⏺️'; }
      if (input) input.placeholder = '🎙️ 聽你說話中…';
    };

    _aiVoiceRecognition.onresult = function(event) {
      var transcript = event.results[0][0].transcript || '';
      if (input) input.value = transcript;
    };

    _aiVoiceRecognition.onerror = function() {
      showToast('語音辨識失敗，請再試一次');
    };

    _aiVoiceRecognition.onend = function() {
      _aiVoiceListening = false;
      if (micBtn) { micBtn.classList.remove('listening'); micBtn.textContent = '🎤'; }
      if (input) input.placeholder = '輸入你想查的東西，或點🎤說話…';
    };

    _aiVoiceRecognition.start();
  }

  function _aiEsc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var AI_CARD_DISPLAY_LIMIT = 40;

  function _aiFormatTime(ts) {
    var d = new Date(ts);
    var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // 🃏 卡片渲染：客戶名(或編號)最大最醒目，其次是重點數字(保留天數/金額/坪數)，其餘是輔助小字
  function _aiRenderCards(cards) {
    var shown = cards.slice(0, AI_CARD_DISPLAY_LIMIT);
    var html = '<div style="display:flex; flex-direction:column; gap:8px;">' +
      shown.map(function(c) {
        return (
          '<div style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:12px 14px;">' +
            '<div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px;">' +
              '<div style="flex:1; min-width:0; font-size:16px; font-weight:900; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + _aiEsc(c.headline) + '</div>' +
              (c.highlight ? '<div style="flex-shrink:0; font-size:13px; font-weight:800; color:#6ee7a0;">' + _aiEsc(c.highlight) + '</div>' : '') +
            '</div>' +
            (c.sub ? '<div style="font-size:12px; opacity:0.6; margin-top:3px;">' + _aiEsc(c.sub) + '</div>' : '') +
            (c.meta ? '<div style="font-size:11.5px; opacity:0.45; margin-top:4px;">' + _aiEsc(c.meta) + '</div>' : '') +
            (c.extra ? '<div style="font-size:11px; opacity:0.35; margin-top:2px;">' + _aiEsc(c.extra) + '</div>' : '') +
          '</div>'
        );
      }).join('') +
    '</div>';
    if (cards.length > AI_CARD_DISPLAY_LIMIT) {
      html += '<div style="text-align:center; font-size:11px; opacity:0.4; margin-top:8px;">還有 ' + (cards.length - AI_CARD_DISPLAY_LIMIT) + ' 筆未顯示，請縮小查詢範圍看更精確的結果</div>';
    }
    return html;
  }

  function _aiRenderSection(sec) {
    var html = '<div style="margin-bottom:16px; border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:14px; background:rgba(255,255,255,0.03);">';
    html += '<div style="font-size:14px; font-weight:800; color:#38bdf8; margin-bottom:8px;">🔎 ' + _aiEsc(sec.title || '') + '</div>';

    if (sec.error) {
      html += '<div style="color:#f87171; font-size:12px;">⚠️ ' + _aiEsc(sec.error) + '</div>';
    } else {
      if (sec.summary) html += '<div style="font-size:12px; opacity:0.6; margin-bottom:10px;">' + _aiEsc(sec.summary) + '</div>';
      if (sec.cards && sec.cards.length) {
        html += _aiRenderCards(sec.cards);
      } else {
        html += '<div style="font-size:12px; opacity:0.4;">沒有符合條件的資料</div>';
      }
    }
    html += '</div>';
    return html;
  }

  // 一筆歷史紀錄（一次問答）的完整渲染，含問題文字/時間戳/狀態
  function _aiRenderEntry(entry) {
    var head = '<div style="font-size:11px; opacity:0.35; margin-bottom:4px;">' + _aiFormatTime(entry.timestamp) + '</div>' +
      '<div style="font-size:13px; font-weight:700; color:rgba(255,255,255,0.85); margin-bottom:10px;">你問了：「' + _aiEsc(entry.question) + '」</div>';

    var body;
    if (entry.pending) {
      body = '<div style="text-align:center; opacity:0.6; padding:24px 0; font-size:13px;">' +
        '<div class="ai-query-spinner"></div>' +
        '<div style="margin-top:12px;">🤔 AI 查詢中，請稍候…</div>' +
      '</div>';
    } else if (entry.res && entry.res.needsPassword) {
      body =
        '<div style="color:#fbbf24; padding:4px 0 10px; font-size:13px;">⏱️ ' + _aiEsc(entry.res.msg || '查詢太頻繁了') + '</div>' +
        '<div style="display:flex; gap:8px;">' +
          '<input id="ai-pw-' + entry.id + '" type="password" inputmode="numeric" placeholder="輸入密碼繼續查詢"' +
            ' style="flex:1; min-width:0; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); border-radius:10px; color:#fff; padding:9px 12px; font-size:13px; outline:none;"' +
            ' onkeydown="if(event.key===\'Enter\'){ window._aiRetryWithPassword(\'' + entry.id + '\'); }">' +
          '<button onclick="window._aiRetryWithPassword(\'' + entry.id + '\')"' +
            ' style="background:#fbbf24; color:#000; font-weight:900; border:none; border-radius:10px; padding:0 16px; font-size:13px; cursor:pointer; flex-shrink:0;">繼續</button>' +
        '</div>';
    } else if (!entry.res || !entry.res.success) {
      var msg = (entry.res && entry.res.msg) ? entry.res.msg : '查詢失敗，請再試一次';
      var extra = (entry.res && entry.res.needsApiKey)
        ? '<div style="margin-top:8px; font-size:11px; opacity:0.5;">（管理者設定路徑：Apps Script 專案 → 專案設定 → 指令碼屬性 → 新增 GEMINI_API_KEY 或 ANTHROPIC_API_KEY）</div>'
        : '';
      body = '<div style="color:#f87171; padding:4px 0 8px; font-size:13px;">❌ ' + _aiEsc(msg) + '</div>' + extra;
    } else {
      body = (entry.res.sections || []).map(_aiRenderSection).join('');
    }

    return '<div style="padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.06);">' + head + body + '</div>';
  }

  // 渲染整份歷史（陣列本身已是新→舊排序，直接照順序渲染即可，最新自然在最上面）
  function _aiRenderHistory() {
    var box = document.getElementById('ai-query-results');
    if (!_aiHistory.length) {
      box.innerHTML = '<div style="text-align:center; opacity:0.3; padding:40px 0; font-size:13px;">在下方輸入問題，按送出開始查詢</div>';
      return;
    }
    box.innerHTML = _aiHistory.map(_aiRenderEntry).join('');
  }
</script>
