<!-- 💎 客戶端專屬查詢介面 (星空旗艦版 - 完美對齊啟動畫面) -->
<div id="page-client-view" class="page" style="background: transparent; display: none;">
  <!-- ✨ 星空粒子背景 -->
  <canvas id="clientCanvas" class="dashboard-particles" style="pointer-events: none;"></canvas>

  <!-- 🏠 頂部 Header (100% 鏡像啟動畫面) -->
  <div style="padding: 80px 20px 40px; text-align: center; position: relative; z-index: 10;">
    <!-- 官方 T 字 Logo -->
    <div style="margin-bottom: 20px;">
      <svg style="width: 80px; height: 80px; fill: #fff;" viewBox="0 0 512 512">
        <path
          d="M244.837 442H167.334V213.34H65V70H244.837V442ZM350.745 320.275H350.934V442H263.648V368.055H264.255L286.222 347.442V412.422H325.35V320.275L350.745 298.601V320.275ZM363.785 253.258L264.049 343.323L264.044 172.055L363.785 253.258ZM448 213.34H347.923L312.734 179.211H426.932V104.129H263.648V70H448V213.34Z" />
      </svg>
    </div>

    <!-- A.I.T 文字 -->
    <div
      style="font-size: 36px; font-weight: 900; color: #fff; letter-spacing: 12px; margin-bottom: 15px; margin-right: -12px;">
      A.I.T</div>

    <!-- 副標題 -->
    <div
      style="font-size: 9px; color: rgba(255,255,255,0.6); letter-spacing: 2px; font-weight: 300; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
      AUTOMATED INTELLIGENCE TILESYSTEM</div>

    <!-- Powered By -->
    <div style="font-size: 8px; color: rgba(255,255,255,0.3); letter-spacing: 1px;">POWERED BY BIG-T</div>
  </div>

  <!-- 🔍 頂部搜尋與過濾區 (對齊卡片寬度與質感) -->
  <div
    style="padding: 15px 0; background: transparent; position: sticky; top: 0; z-index: 100;">
    <div style="max-width: 800px; margin: 0 auto; padding: 15px 20px; background: #111; border: 1px solid #222; border-radius: 20px; backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
      <!-- 第一行：主搜尋與尺寸 -->
      <div style="display: flex; gap: 12px; margin-bottom: 12px;">
        <div style="flex: 1.5;">
          <div
            style="font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 6px; font-weight: 700; letter-spacing: 1px;">
            產品編號 / 系列搜尋</div>
          <div style="position: relative;">
            <input type="text" id="client-search-input" placeholder="ex. RT61243-S or 冰岩" style="width: 100%; height: 48px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
                          padding: 0 15px; color: #fff; font-size: 14px; outline: none;"
              oninput="window.debounceSearchClientProducts()">
          </div>
        </div>
        <div style="flex: 1;">
          <div
            style="font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 6px; font-weight: 700; letter-spacing: 1px;">
            依尺寸搜尋</div>
          <input type="text" id="filter-size" placeholder="ex. 60x120" style="width: 100%; height: 48px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
                        padding: 0 10px; color: #fff; font-size: 14px; outline: none; text-align: center;"
            oninput="window.debounceSearchClientProducts()">
        </div>
      </div>

      <!-- 第二行：需求與排序 -->
      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <div style="font-size: 10px; color: rgba(255,255,255,0.4); margin-bottom: 4px; font-weight: 600;">需求片數</div>
          <input type="number" id="client-required-qty" placeholder="片數" style="width: 100%; height: 40px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; 
                        text-align: center; color: #fff; font-size: 13px; outline: none;"
            oninput="window.debounceSearchClientProducts()">
        </div>
        <div style="flex: 1;">
          <div style="font-size: 10px; color: rgba(255,255,255,0.4); margin-bottom: 4px; font-weight: 600;">需求坪數</div>
          <input type="number" id="client-required-pyeong" placeholder="坪數" style="width: 100%; height: 40px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; 
                        text-align: center; color: #fff; font-size: 13px; outline: none;"
            oninput="window.debounceSearchClientProducts()">
        </div>
        <div style="flex: 1.2;">
          <div style="font-size: 10px; color: rgba(255,255,255,0.4); margin-bottom: 4px; font-weight: 600;">排序方式</div>
          <select id="filter-sort" style="width: 100%; height: 40px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; 
                         color: #fff; font-size: 13px; outline: none; padding: 0 10px; appearance: none;"
            onchange="window.searchClientProducts()">
            <option value="default">預設排序</option>
            <option value="stock-desc">庫存多至少</option>
            <option value="sku-asc">型號 A-Z</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- 📜 結果呈現區 -->
  <div id="client-result-list" style="padding: 0 20px 120px; max-width: 800px; margin: 0 auto; position: relative; z-index: 10;">
    <!-- 搜尋結果會在此動態生成 -->
  </div>
</div>

<!-- 🖼️ 圖片放大 Modal -->
<div id="client-image-modal"
  style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:10000; align-items:center; justify-content:center; flex-direction:column; backdrop-filter: blur(10px);">
  <div
    style="position:absolute; top:30px; right:30px; color:#fff; font-size:40px; cursor:pointer; line-height:1; opacity:0.6;"
    onclick="this.parentElement.style.display='none'">×</div>
  <img id="client-full-img" src=""
    style="max-width:90%; max-height:80%; object-fit:contain; border-radius:15px; box-shadow: 0 30px 60px rgba(0,0,0,0.8);">
  <div id="client-img-sku" style="margin-top:25px; color:#facc15; font-size:22px; font-weight:900; letter-spacing:1px;">
  </div>
</div>
