<script>
  /**
   * 🚗 外勤管理模組邏輯 (Field Work Logic)
   */
  var fwState = {
    currentSales: '',
    currentLocation: null,
    carMapping: {},
    plateList: [],
    watchId: null,
    timerId: null,
    summary: null
  };

  /**
   * 📊 使用頻率統計（客戶名稱／工作概況：越常選越排前面，各業務各自獨立記憶於本機）
   */
  function fwFreqKey(kind) {
    return 'fw_freq_' + kind + '_' + String(state.currentSales || '').trim();
  }
  function fwBumpFreq(kind, label) {
    if (!label) return;
    try {
      const key = fwFreqKey(kind);
      const map = JSON.parse(localStorage.getItem(key) || '{}');
      map[label] = (map[label] || 0) + 1;
      localStorage.setItem(key, JSON.stringify(map));
    } catch (e) {}
  }
  function fwSortByFreq(kind, items) {
    try {
      const map = JSON.parse(localStorage.getItem(fwFreqKey(kind)) || '{}');
      return items
        .map((x, i) => ({ x, i, f: map[x] || 0 }))
        .sort((a, b) => (b.f - a.f) || (a.i - b.i))
        .map(d => d.x);
    } catch (e) {
      return items;
    }
  }

  /**
   * 🌀 顯示/隱藏外勤模組載入遮罩
   */
  window.showFwLoading = function (show, text = '處理中...') {
    const overlay = document.getElementById('fw-loading');
    const textEl = document.getElementById('fw-loading-text');
    if (overlay) {
      overlay.style.display = show ? 'flex' : 'none';
      if (textEl) textEl.innerText = text;
    }
  };

  /**
   * 🚀 開啟智能報表模組
   */
  window.openFieldWorkModule = function () {
    if (!state.currentSales) {
      state.currentFlow = 'fieldwork';
      showPage('sales-page');
      // 移除 Toast 提示，靖默跳轉即可
      return;
    }

    showPage('page-fieldwork');
    initFwClock();
    startGpsTracking();
    getFwCustomers();
    initFwTaskList(); // 預設任務清單
    initFwSettings();
    loadFwLogStatsBar();

    // 📅 日誌為預設進入分頁，比照 switchFwTab('fw-log') 初始化
    const todayStr = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0') + '-' + String(new Date().getDate()).padStart(2, '0');
    if (document.getElementById('log-date')) document.getElementById('log-date').value = todayStr;
    refreshFwTimeline(todayStr);
    if (typeof fwCalRender === 'function') fwCalRender();
  };

  /**
   * 💰 載入日誌頁上方的「本日/當月業績 + 睡美人業績」提示條
   */
  window.loadFwLogStatsBar = function () {
    const salesEl = document.getElementById('fw-log-stat-sales');
    const sleeperEl = document.getElementById('fw-log-stat-sleeper');
    if (!salesEl || !sleeperEl || !state.currentSales) return;
    const name = String(state.currentSales).trim();

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) return;
        const p = (res.data.people || []).find(x => x.name === name);
        if (!p) return; // 名單裡沒有這個人（例如非業務身分），不顯示提示

        salesEl.innerText = `${p.day}萬 / ${p.month}萬`;
        sleeperEl.innerText = `睡：${(p.sleeper && p.sleeper.month) || 0}萬`;
        salesEl.style.display = 'inline';
        sleeperEl.style.display = 'inline';
      })
      .withFailureHandler(function () { /* 靜默失敗，不影響日誌填寫 */ })
      .getSalesOverview();
  };

  /**
   * ⚙️ 載入系統設定
   */
  window.initFwSettings = function () {
    google.script.run
      .withFailureHandler(function (err) {
        console.error("載入設定失敗:", err);
      })
      .withSuccessHandler(function (res) {
        if (res.success) {
          fwState.carMapping = res.carMapping;
          fwState.plateList = res.plateList;

          // 更新 Datalist
          const dl = document.getElementById('plate-list');
          if (dl) {
            dl.innerHTML = fwState.plateList.map(p => `<option value="${p}">`).join('');
          }

          // 如果已經登入，嘗試帶入車號
          autoFillPlate();

          // 🚀 強制相容：如果目前是在保養分頁，當設定載入完成且帶入車號後，自動重新加載保養數據，避免異步賽跑導致空白
          const maintPlateVal = document.getElementById('maint-plate-number') ? document.getElementById('maint-plate-number').value : '';
          if (maintPlateVal) {
            loadMaintenanceTabData();
          }
        }
      })
      .getFwSettings();
  };

  /**
   * 🚗 自動帶入車號
   */
  window.autoFillPlate = function () {
    if (!state.currentSales) return;
    const salesName = state.currentSales.trim();
    const defaultPlate = fwState.carMapping[salesName];

    if (defaultPlate) {
      const drvPlate = document.getElementById('drv-plate-number');
      const maintPlate = document.getElementById('maint-plate-number');
      // 🚀 強制填入預設車號
      if (drvPlate) drvPlate.value = defaultPlate;
      if (maintPlate) maintPlate.value = defaultPlate;
    }
  };

  function initFwClock() {
    if (fwState.timerId) clearInterval(fwState.timerId);
    const timeEl = document.getElementById('fw-current-time');
    const dateEl = document.getElementById('fw-current-date');
    const update = () => {
      const now = new Date();
      if (timeEl) timeEl.innerText = now.toTimeString().split(' ')[0];
      if (dateEl) dateEl.innerText = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
    };
    update();
    fwState.timerId = setInterval(update, 1000);
  }

  function startGpsTracking() {
    const indicator = document.getElementById('fw-gps-status');
    if (!navigator.geolocation) {
      if (indicator) indicator.innerHTML = '瀏覽器不支援 GPS';
      return;
    }

    const gpsOptions = {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 30000
    };

    const handleGpsError = (err) => {
      const codeMap = {
        1: '權限被拒絕，請確認手機設定已允許 LINE 或瀏覽器取用定位',
        2: '位置資訊不可用 (請確認 GPS 已開啟)',
        3: '定位逾時 (請確認定位訊號良好)'
      };
      const msg = codeMap[err && err.code] || 'GPS 定位失敗';
      if (indicator) {
        indicator.innerHTML = `<span class="dot" style="background:#ff4d4d"></span> ${msg}`;
      }
      console.warn('GPS error:', err);

      // 🖥️ 自動偵測桌面裝置：GPS 失敗時若非行動裝置，自動開啟出差模式
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (!isMobile) {
        const tripToggle = document.getElementById('fw-trip-mode');
        if (tripToggle && !tripToggle.checked) {
          tripToggle.checked = true;
          if (indicator) {
            indicator.innerHTML = '<span class="dot" style="background:#f5a623"></span> 桌面模式・自動切換出差打卡';
          }
        }
      }
    };

    navigator.geolocation.getCurrentPosition((pos) => updateGpsDisplay(pos), handleGpsError, gpsOptions);

    if (fwState.watchId) navigator.geolocation.clearWatch(fwState.watchId);
    fwState.watchId = navigator.geolocation.watchPosition((pos) => updateGpsDisplay(pos), handleGpsError, gpsOptions);
  }

  function updateGpsDisplay(pos) {
    fwState.currentLocation = pos.coords;
    const indicator = document.getElementById('fw-gps-status');
    if (indicator) indicator.innerHTML = '<span class="dot" style="background:#4ade80"></span> GPS 已就緒';

    const latlngEl = document.getElementById('fw-current-latlng');
    const accEl = document.getElementById('fw-current-accuracy');

    if (latlngEl) {
      latlngEl.innerText = pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5);
    }
    if (accEl) {
      accEl.innerText = '精度 ' + Math.round(pos.coords.accuracy) + 'm';
    }
  }

  /**
   * 🔄 切換 Tab
   */
  window.switchFwTab = function (tabId, el) {
    document.querySelectorAll('.fw-tab').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');

    document.querySelectorAll('.fw-tab-content').forEach(c => c.classList.remove('active'));
    const target = document.getElementById(tabId);
    if (target) target.classList.add('active');

    if (tabId === 'fw-dashboard') refreshFwDashboard();
    if (tabId === 'fw-log') {
      getFwCustomers();

      // 🚀 初始化日誌日期
      const todayStr = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0') + '-' + String(new Date().getDate()).padStart(2, '0');
      if (document.getElementById('log-date')) document.getElementById('log-date').value = todayStr;
      if (document.getElementById('fw-log-view-date')) {
        const viewDate = document.getElementById('fw-log-view-date');
        viewDate.value = todayStr;
        refreshFwTimeline(todayStr);
      } else {
        refreshFwTimeline();
      }

      initFwTaskList();
      fwCalRender(); // 🚀 同步初始化日曆
    }
    if (tabId === 'fw-driving') {
      loadDrivingTabData();
      autoFillPlate();
    }
    if (tabId === 'fw-maint') {
      autoFillPlate();
      loadMaintenanceTabData();
    }
    if (tabId === 'fw-omniscient') {
      const isAuth = document.getElementById('fw-omni-real-content').style.display === 'block';
      if (isAuth) refreshOmniscientView();
    }
  };

  /**
   * 🚗 自動填寫預設車牌
   */
  window.autoFillPlate = function () {
    if (!state.currentSales) return;
    // 🚀 從後端傳回的 fwState.carMapping 中精確匹配 (加上 trim 避免前後空格導致配對失敗)
    const salesName = String(state.currentSales).trim();
    const defaultPlate = fwState.carMapping[salesName];
    if (defaultPlate) {
      const drvPlate = document.getElementById('drv-plate-number');
      const maintPlate = document.getElementById('maint-plate-number');
      if (drvPlate) drvPlate.value = defaultPlate;
      if (maintPlate) maintPlate.value = defaultPlate;
    }
  };

  /**
   * 🆔 設備 ID
   */
  function getFwDeviceId() {
    let id = localStorage.getItem('ait_device_id');
    if (!id) {
      id = 'DEV_' + Math.random().toString(36).substr(2, 9).toUpperCase() + '_' + Date.now();
      localStorage.setItem('ait_device_id', id);
    }
    return id;
  }

  /**
   * 🚀 打卡處理
   */
  window.handlePunch = function (type) {
    var isTrip = document.getElementById('fw-trip-mode') ? document.getElementById('fw-trip-mode').checked : false;
    var coords = fwState.currentLocation;

    var performPunch = function (actualCoords) {
      var payload = {
        employeeName: state.currentSales,
        deviceId: getFwDeviceId(),
        type: type,
        isBusinessTrip: isTrip,
        location: {
          latitude: actualCoords.latitude,
          longitude: actualCoords.longitude,
          accuracy: actualCoords.accuracy
        }
      };

      showLoading(true, true);
      google.script.run
        .withSuccessHandler(function (res) {
          showLoading(false);
          if (res.success) {
            showToast(`${type === 'checkin' ? '上班' : '下班'}成功！${res.distance ? '(距離 ' + res.distance + 'm)' : ''}`);
            if (res.punchStatus === '遲到') showToast('注意：本次打卡紀錄為「遲到」');
            refreshPunchStatus();
            refreshFwDashboard();
          } else {
            alert(res.msg);
          }
        })
        .saveAttendance(payload);
    };

    if (coords) {
      performPunch(coords);
      return;
    }

    // 🖥️ 自動偵測桌面裝置：若非行動裝置且無座標，自動切換出差模式
    var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (!isTrip && !isMobile) {
      var tripToggle = document.getElementById('fw-trip-mode');
      if (tripToggle) tripToggle.checked = true;
      isTrip = true; // 立即生效
    }

    if (isTrip) {
      // 出差打卡模式下若定位不可用，使用預設公司位置作為備用座標
      coords = {
        latitude: 25.0004864,
        longitude: 121.0339143,
        accuracy: 999
      };
      performPunch(coords);
    } else {
      // 🚀 關鍵修復：主動使用用戶點擊手勢觸發一次 GPS 定位獲取
      showLoading(true, '正在取得 GPS 定位...');
      
      var gpsOptions = {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 10000
      };

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          showLoading(false);
          updateGpsDisplay(pos);
          performPunch(pos.coords);
        },
        function (err) {
          showLoading(false);
          var codeMap = {
            1: '權限被拒絕，請至手機設定確認已允許 LINE 或瀏覽器使用定位服務。',
            2: '無法取得位置，請確認 GPS 已開啟且訊號良好。',
            3: '定位逾時，請移動至收訊較佳處重試。'
          };
          var errMsg = codeMap[err && err.code] || 'GPS 定位失敗';
          showToast('⚠️ ' + errMsg);
          console.warn("Manual GPS retrieval failed:", err);
        },
        gpsOptions
      );
    }
  };

  function refreshPunchStatus() {
    if (!state.currentSales) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (res.success) {
          const inTimeEl = document.getElementById('fw-in-time');
          const outTimeEl = document.getElementById('fw-out-time');
          if (inTimeEl) inTimeEl.innerText = res.checkin || '--:--';
          if (outTimeEl) outTimeEl.innerText = res.checkout || '--:--';

          const inStatus = document.getElementById('fw-in-status');
          const inBtn = document.getElementById('btn-punch-in');
          const statusTag = document.getElementById('fw-punch-status');

          if (res.checkin && inStatus) {
            inStatus.innerText = res.checkinStatus || '正常';
            inStatus.className = 'punch-status-tag ' + (res.checkinStatus === '遲到' ? 'status-late' : 'status-normal');
            if (res.checkinStatus === '遲到' && inBtn) inBtn.classList.add('late');
          } else if (inStatus) {
            inStatus.innerText = '';
            if (inBtn) inBtn.classList.remove('late');
          }

          // 總覽頁面同步
          const dashStatus = document.getElementById('fw-dash-status-text');
          if (dashStatus) {
            dashStatus.innerText = res.punchIn ? '上班中' : '未上班';
            dashStatus.style.color = res.punchIn ? '#4ade80' : '#f87171';
          }

          if (statusTag) {
            if (res.checkout) {
              statusTag.innerText = '已下班';
              statusTag.style.background = 'rgba(0,0,0,0.3)';
            } else if (res.checkin) {
              statusTag.innerText = '工作中';
              statusTag.style.background = 'rgba(74, 222, 128, 0.3)';
            } else {
              statusTag.innerText = '未上班';
              statusTag.style.background = 'rgba(255,255,255,0.2)';
            }
          }
        }
      })
      .getTodayStatus(state.currentSales);
  }

  /**
   * 👥 取得客戶清單
   */
  function getFwCustomers() {
    if (!state.currentSales) return;
    google.script.run
      .withSuccessHandler(function (list) {
        const dl = document.getElementById('customer-list');
        if (!dl) return;

        // 🚀 新增回公司選項（固定置頂），其餘客戶依選取頻率排序
        let options = ['回公司(永安)'];
        if (list && list.length > 0) {
          options = options.concat(fwSortByFreq('cust', list));
        }

        dl.innerHTML = options.map(c => `<option value="${c}">`).join('');
      })
      .getSalesCustomers(state.currentSales);
  }

  /**
   * 📅 重新整理今日行程預覽
   */
  // ✂️ 行程足跡摘要簡化：系統配送「樣品結案」→送樣、「配送完工」→送貨；空字串維持空（不顯示括號）
  function fwSimplifySummary(summary) {
    var s = String(summary == null ? '' : summary).trim();
    if (!s) return '';
    if (s.indexOf('樣品結案') !== -1) return '送樣';
    if (s.indexOf('配送完工') !== -1) return '送貨';
    return s;
  }

  function refreshFwTimeline(dateStr) {
    if (!state.currentSales) return;
    const container = document.getElementById('fw-log-timeline');

    // 如果沒有傳入日期，則抓取 UI 上的日期，若 UI 也沒有則用今日
    const today = new Date();
    const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

    const targetDate = dateStr || (document.getElementById('fw-log-view-date') ? document.getElementById('fw-log-view-date').value : todayStr);

    // 更新 UI 上的標題 (如果是今日則顯示「今日」，否則顯示「日期」)
    const viewTitle = document.getElementById('fw-log-view-title');
    if (viewTitle) viewTitle.innerText = (targetDate === todayStr) ? '今日' : '';

    const viewDateInput = document.getElementById('fw-log-view-date');
    if (viewDateInput && viewDateInput.value !== targetDate) viewDateInput.value = targetDate;

    google.script.run
      .withSuccessHandler(function (res) {
        if (res.success && res.logs.length > 0) {
          // Arrow format: 客戶(任務) → 客戶(任務)
          let html = '';
          res.logs.forEach((log, idx) => {
            const isBack = (log.customer === '回公司(永安)');
            const tlSum = isBack ? '' : fwSimplifySummary(log.summary);
            html += `<div class="fw-tl-chip" onclick="clickFwLog('${log.id}', '${log.time}', '${log.customer}', '${log.summary}', \`${log.detail || ''}\`)">
            <span class="tl-customer">${log.customer}</span>
            ${tlSum ? `<span class="tl-task">(${tlSum})</span>` : ''}
          </div>`;
            if (idx < res.logs.length - 1) {
              html += `<div class="fw-tl-arrow">→</div>`;
            }
          });
          container.innerHTML = html;
        } else {
          container.innerHTML = '<div style="text-align:center;opacity:0.3;padding:20px;font-size:12px;">該日尚無紀錄</div>';
        }
      })
      .getWorkLogHistory(state.currentSales, targetDate);
  }

  /**
   * 📋 初始化任務清單（預設一筆）
   */
  function initFwTaskList() {
    const list = document.getElementById('fw-task-list');
    if (!list) return;
    list.innerHTML = '';
    addFwTask();
  }

  /**
   * ➕ 新增任務卡片
   */
  window.addFwTask = function () {
    const list = document.getElementById('fw-task-list');
    if (!list) return;
    const idx = list.children.length;
    const div = document.createElement('div');
    div.className = 'fw-task-item';
    div.dataset.mode = 'onsite';
    div.innerHTML = `
    <div class="fw-task-header">
      <span class="fw-task-label">任務 ${idx + 1}</span>
      <button class="fw-task-delete" onclick="removeFwTask(this)" ${idx === 0 ? 'style="display:none"' : ''}>×</button>
    </div>
    <div class="fw-mode-tabs">
      <button type="button" class="fw-mode-tab active" onclick="fwSetTaskMode(this,'onsite')">實體</button>
      <button type="button" class="fw-mode-tab mode-online" onclick="fwSetTaskMode(this,'online')">線上</button>
    </div>
    <div class="fw-field">
      <label>工作概況</label>
      <input type="text" class="task-result" placeholder="點擊選擇任務..." readonly onclick="pickWorkSummary(this)">
    </div>
    <div class="fw-field">
      <label>詳細說明</label>
      <textarea class="task-content" rows="2" placeholder="請描述洽談細節或後續追蹤..."></textarea>
    </div>
    <div class="fw-field fw-online-photo-section" style="display:none;">
      <label>線上對話截圖 (LINE)</label>
      <input type="file" accept="image/*" multiple style="display:none;" onchange="handleFwOnlinePhotoSelect(this)">
      <button type="button" class="fw-btn-online-photo" onclick="this.previousElementSibling.click()">📷 上傳LINE截圖</button>
      <div class="fw-online-photo-preview"></div>
    </div>
  `;
    list.appendChild(div);
    // 第一筆以外展示删除鈕
    list.querySelectorAll('.fw-task-delete').forEach((btn, i) => {
      btn.style.display = i === 0 && list.children.length === 1 ? 'none' : 'flex';
    });
  };

  /**
   * ➖ 刪除指定任務卡片
   */
  window.removeFwTask = function (btn) {
    const item = btn.closest('.fw-task-item');
    if (item) item.remove();
    // 重新編號
    document.querySelectorAll('#fw-task-list .fw-task-label').forEach((el, i) => {
      el.innerText = `任務 ${i + 1}`;
    });
    // 動態控制第一筆刪除鈕顯示
    const items = document.querySelectorAll('#fw-task-list .fw-task-item');
    items.forEach((it, i) => {
      const d = it.querySelector('.fw-task-delete');
      if (d) d.style.display = i === 0 && items.length === 1 ? 'none' : 'flex';
    });
  };

  /**
   * 📝 提交工作日誌（支援同客戶多任務）
   */
  window.submitFwWorkLog = function () {
    const customerInput = document.getElementById('log-customer');
    const customer = customerInput ? customerInput.value.trim() : "";
    if (!customer) { showToast('請輸入客戶名稱'); return; }

    const isBackToCompany = (customer === '回公司(永安)');
    const taskItems = document.querySelectorAll('#fw-task-list .fw-task-item');
    if (taskItems.length === 0) { showToast('請新增至少一筆任務'); return; }

    const tasks = [];
    taskItems.forEach(item => {
      let result = item.querySelector('.task-result').value.trim();
      const content = item.querySelector('.task-content').value.trim();
      if (isBackToCompany && !result) { result = '回公司'; }
      // 不再強制檢查 result 是否為必填
      tasks.push({ result, content, onlinePhotoUrls: item._onlinePhotoUrls || [] });
    });

    // 📊 累積使用頻率（依實際存檔為準，下次選單自動把常用的排前面）

  /**
   * 🖼️ 圖片壓縮（最長邊 1200px, JPEG 0.7），與其他照片上傳功能同一套邏輯
   */
  function fwCompressImageFile_(file, callback) {
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        const maxDim = 1200;
        if (width > height) {
          if (width > maxDim) { height *= maxDim / width; width = maxDim; }
        } else {
          if (height > maxDim) { width *= maxDim / height; height = maxDim; }
        }
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  /**
   * 📷 選取線上任務的 LINE 截圖：壓縮後逐張上傳到 Drive，成功才存進該任務卡片的網址清單
   */
  window.handleFwOnlinePhotoSelect = function (input) {
    const item = input.closest('.fw-task-item');
    if (!item) return;
    const files = Array.from(input.files || []);
    if (!files.length) return;
    const previewBox = item.querySelector('.fw-online-photo-preview');
    if (!item._onlinePhotoUrls) item._onlinePhotoUrls = [];

    files.forEach(file => {
      const chip = document.createElement('div');
      chip.className = 'fw-online-photo-chip';
      chip.innerHTML = '<div class="fw-online-photo-loading">上傳中</div>';
      if (previewBox) previewBox.appendChild(chip);

      fwCompressImageFile_(file, function (dataUrl) {
        const base64 = dataUrl.split(',')[1];
        google.script.run
          .withFailureHandler(function () {
            chip.innerHTML = '<div class="fw-online-photo-fail">上傳失敗</div>';
          })
          .withSuccessHandler(function (res) {
            if (res && res.success) {
              item._onlinePhotoUrls.push(res.url);
              chip.innerHTML = `<img src="${dataUrl}" class="fw-online-photo-thumb">` +
                `<span class="fw-online-photo-remove" onclick="fwRemoveOnlinePhoto(this, '${res.url}')">×</span>`;
            } else {
              chip.innerHTML = '<div class="fw-online-photo-fail">上傳失敗</div>';
            }
          })
          .uploadFwOnlinePhoto(base64, 'image/jpeg');
      });
    });
    input.value = ''; // 清空，允許重複選取同一張
  };

  /**
   * 🗑️ 移除已上傳的線上截圖（僅從本次表單移除，不影響已存檔的紀錄）

  window.fwRemoveOnlinePhoto = function (el, url) {
    const item = el.closest('.fw-task-item');
    if (item && item._onlinePhotoUrls) {

  };

    const dateStr = yesterday.getFullYear() + '-' + String(yesterday.getMonth() + 1).padStart(2, '0') + '-' + String(yesterday.getDate()).padStart(2, '0');

      .withSuccessHandler(function (res) {

  function fwCalRender() {

    const title = document.getElementById('fw-cal-month-title');

    google.script.run

        }
      })

  function fwCalDrawGrid(logDates) {
    const grid = document.getElementById('fw-cal-grid');
    if (!grid) return;
    const today = new Date();
    const y = fwCalState.year, m = fwCalState.month;
    const firstDay = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    let html = '';
    for (let i = 0; i < firstDay; i++) html += `<div class="fw-cal-day empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isToday = today.getFullYear() === y && today.getMonth() === m && today.getDate() === d;
      const hasLog = logDates.has(dateStr);
      let cls = 'fw-cal-day';
      if (isToday) cls += ' today';
      if (hasLog) cls += ' has-log';
      html += `<div class="${cls}" onclick="fwCalSelectDate('${dateStr}',this)">${d}${hasLog ? '<div class="fw-cal-dot"></div>' : ''}</div>`;
    }
    grid.innerHTML = html;
  }

    fwCalState.month--;
    if (fwCalState.month < 0) { fwCalState.month = 11; fwCalState.year--; }

  window.fwCalNextMonth = function () {
    fwCalState.month++;
    if (fwCalState.month > 11) { fwCalState.month = 0; fwCalState.year++; }
    fwCalRender();
  };

  function renderAdminVisitRanking() {
    const box = document.getElementById('admin-visit-ranking-content');
    if (!adminVisitData || !adminVisitData.length) {
      box.innerHTML = renderAdminVisitSortBar() + '<div style="text-align:center; opacity:0.35; padding:40px 0; font-size:13px;">此業務目前尚無到訪紀錄</div>';
      return;
    }
    const sorted = adminVisitData.slice().sort((a, b) => {
      const dir = adminVisitSortDir === 'desc' ? -1 : 1;
      const av = a[adminVisitSortField] || 0, bv = b[adminVisitSortField] || 0;
      return (av - bv) * dir;
    });
    adminVisitRenderedList = sorted;
    const maxCount = Math.max.apply(null, sorted.map(c => c.visitCount)) || 1;

    box.innerHTML = renderAdminVisitSortBar() + sorted.map((c, i) => {
      const barPct = Math.max(4, Math.round(c.visitCount / maxCount * 100));
      const statsLine = Object.keys(c.tagCounts || {})
        .filter(t => c.tagCounts[t] > 0)
        .map(t => `<span style="color:${FW_TAG_COLORS_FRONT_[t]}; font-weight:800;">${FW_TAG_LABELS_[t]} ${c.tagCounts[t]}次</span>`)
        .join('<span style="opacity:0.25;"> · </span>');

      // ⚠️ 超過 30 天沒到訪才顯示提醒
      const stale = c.daysSince !== null && c.daysSince > 30;
      const staleTag = stale
        ? `<div style="font-size:11.5px; font-weight:800; color:#f87171; background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.3); border-radius:8px; padding:3px 8px;">${c.lastVisitDisplay} ${c.daysSince}天</div>`
        : '';

      // 📅 每月一排的逐日格子（只計工作日，週末拿掉騰出空間）：格子依當天活動類型上色，可點擊看明細
      const dayGridHtml = (() => {
        const oneYearAgo = new Date(Date.now() - 365 * 86400000);
        const visitedDays = {}; // 'yyyy-MM' -> Map(day number -> {di, color})
        (c.dates || []).forEach((d, di) => {
          const dt = new Date(d.date);
          if (dt < oneYearAgo) return;
          const key = d.date.slice(0, 7);
          const day = parseInt(d.date.slice(8, 10), 10);
          const color = (d.badges && d.badges.length) ? d.badges[0].color : '#facc15';
          if (!visitedDays[key]) visitedDays[key] = new Map();
          visitedDays[key].set(day, { di, color });
        });
        const monthKeys = Object.keys(visitedDays).sort();
        if (!monthKeys.length) return '';
        return `
        <div style="margin-bottom:12px;">
          <div style="font-size:11px; opacity:0.4; margin-bottom:6px; letter-spacing:1px;">近一年逐日到訪（點格子看當天明細）</div>
          <div style="display:flex; flex-direction:column; gap:5px;">
            ${monthKeys.map(key => {
              const map = visitedDays[key];
              const y = parseInt(key.slice(0, 4), 10), m = parseInt(key.slice(5, 7), 10);
              const monthLabel = m + '月';
              const daysInMonth = new Date(y, m, 0).getDate();
              const cells = [];
              for (let d = 1; d <= daysInMonth; d++) {
                const dow = new Date(y, m - 1, d).getDay();
                if (dow === 0 || dow === 6) continue; // 拿掉假日，格子可以放寬
                const hitInfo = map.get(d);
                const hit = !!hitInfo;
                cells.push(`<span title="${monthLabel}${d}日"${hit ? ` onclick="event.stopPropagation(); adminVisitToggleDate(${i}, ${hitInfo.di})"` : ''}
                  style="width:11px; height:11px; border-radius:3px; background:${hit ? hitInfo.color : 'rgba(255,255,255,0.08)'}; ${hit ? 'cursor:pointer;' : ''}"></span>`);
              }
              return `
              <div style="display:flex; align-items:center; gap:6px;">
                <div style="width:24px; font-size:10.5px; opacity:0.5; flex-shrink:0;">${monthLabel}</div>
                <div style="display:flex; flex-wrap:wrap; gap:3px; flex:1;">${cells.join('')}</div>
                <div style="width:26px; font-size:10.5px; font-weight:800; color:#facc15; text-align:right; flex-shrink:0;">${map.size}次</div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      })();

      return `
      <div class="admin-visit-cust-card" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:14px 16px; margin-bottom:10px;">
        <div style="position:relative; border-radius:10px; overflow:hidden; margin:-6px -8px; padding:6px 8px;">
        <div style="position:absolute; left:0; top:0; bottom:0; width:${barPct}%; background:linear-gradient(90deg, rgba(250,204,21,0.16), rgba(250,204,21,0.03)); z-index:0; border-radius:10px;"></div>
        <div style="position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; cursor:pointer;" onclick="adminVisitToggleCust(${i})">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:26px; height:26px; border-radius:50%; background:${i === 0 ? 'rgba(250,204,21,0.2)' : 'rgba(255,255,255,0.08)'}; color:${i === 0 ? '#facc15' : 'rgba(255,255,255,0.5)'}; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900;">${i + 1}</div>
            <div style="font-size:16px; font-weight:800; color:#fff;">${c.name}</div>
            ${(c.salesYear !== undefined) ? `<div style="font-size:11.5px; font-weight:700; opacity:0.75; white-space:nowrap;">今日${c.salesToday}萬・當月${c.salesMonth}萬・年度${c.salesYear}萬</div>` : ''}
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            ${staleTag}
            <div style="font-size:13px; font-weight:900; color:#facc15; background:rgba(250,204,21,0.1); border:1px solid rgba(250,204,21,0.25); border-radius:8px; padding:4px 10px;">${c.visitCount} 次到訪</div>
            <div id="admin-visit-arrow-${i}" style="opacity:0.4; font-size:12px; transition:transform 0.2s;">▾</div>
          </div>
        </div>
        </div>
        <div id="admin-visit-dates-${i}" style="display:none; margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.08);">
          ${dayGridHtml}
          ${statsLine ? `<div style="font-size:12px; margin-bottom:10px;">${statsLine}</div>` : ''}
          <div id="admin-visit-detail-${i}" style="display:none; margin-top:10px;"></div>

  /** 處理照片選擇 (增加壓縮邏輯) */
  window.handleMaintFile = function (input, idx) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    const reader = new FileReader();

    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        // 限制最大長邊為 1024px
        const maxDim = 1024;
        if (width > height) {
          if (width > maxDim) { height *= maxDim / width; width = maxDim; }
        } else {
          if (height > maxDim) { width *= maxDim / height; height = maxDim; }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // 壓縮為 JPEG，品質 0.7
        const compressedData = canvas.toDataURL('image/jpeg', 0.7);

        document.getElementById(`maint-img-${idx}`).src = compressedData;
        document.getElementById(`maint-img-${idx}`).style.display = 'block';
        document.getElementById(`maint-txt-${idx}`).style.display = 'none';

        fwMaintPhotos[idx] = {
          contents: compressedData,
          mimeType: 'image/jpeg',
          name: file.name
        };
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  /** 提交保養紀錄 */
  window.submitFwMaintenance = function () {
    const date = document.getElementById('maint-date').value;
    const mileage = document.getElementById('maint-mileage').value;
    const nextMileage = document.getElementById('maint-next-mileage').value;
    const note = document.getElementById('maint-note').value;
    const plate = document.getElementById('maint-plate-number').value;
    const amount = document.getElementById('maint-amount').value;

    const checkedItems = [];
    document.querySelectorAll('input[name="maint-item"]:checked').forEach(cb => {
      checkedItems.push(cb.value);
    });

    const customItem = document.getElementById('maint-custom').value.trim();
    if (customItem) checkedItems.push(customItem);

    if (!date) { showToast('請選擇保養日期'); return; }
    if (!plate) { showToast('請填寫車牌號碼'); return; }
    if (!mileage) { showToast('請填寫目前里程'); return; }
    if (!amount) { showToast('請填寫保養金額'); return; }
    if (checkedItems.length === 0 && !note) { showToast('請至少勾選一項保養項目或填寫備註'); return; }

    showLoading(true, true);
    google.script.run
      .withFailureHandler(function (err) {
        showLoading(false);
        showToast('❌ 儲存失敗，請稍後再試');
      })
      .withSuccessHandler(function (res) {
        showLoading(false);
        if (res.success) {
          showToast('保養紀錄已儲存');
          // 重置表單
          document.getElementById('maint-mileage').value = '';
          document.getElementById('maint-next-mileage').value = '';
          document.getElementById('maint-amount').value = '';
          document.getElementById('maint-note').value = '';
          document.getElementById('maint-custom').value = '';
          fwMaintPhotos = [null, null, null];
          for (let i = 0; i < 3; i++) {
            document.getElementById(`maint-img-${i}`).style.display = 'none';
            document.getElementById(`maint-txt-${i}`).style.display = 'block';
          }
          switchFwTab('fw-log', document.querySelectorAll('.fw-tab')[0]);
        } else {
          alert('儲存失敗: ' + res.msg);
        }
      })
      .saveMaintenanceRecord({
        employeeName: state.currentSales,
        plateNumber: plate,
        mileage: mileage,
        nextMileage: nextMileage,
        items: checkedItems.join('、'),
        amount: amount,
        note: note,
        photos: fwMaintPhotos
      });
  };

  /**
   * 🗓️ 開啟打卡歷史彈窗
   */
  window.openAttendanceHistory = function () {
    const modal = document.getElementById('modal-attendance-history');
    modal.style.display = 'block';
    const list = document.getElementById('attendance-history-list');
    list.innerHTML = '<div style="text-align:center; padding:20px; opacity:0.5;">載入中...</div>';

    google.script.run
      .withSuccessHandler(function (res) {
        if (res.success) {
          if (!res.list || res.list.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding:30px; opacity:0.5;">本月尚無打卡紀錄</div>';
            return;
          }

          let html = '';
          res.list.forEach(item => {
            const isLate = item.status === '遲到';
            const isOut = item.type.includes('下班');
            const statusColor = isOut ? '#94a3b8' : (isLate ? '#f87171' : '#4ade80');

            html += `
            <div style="background:rgba(255,255,255,0.05); padding:12px; border-radius:8px; margin-bottom:10px; border-left:4px solid ${statusColor};">
              <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                <span style="font-weight:bold;">${item.date} ${item.type}</span>
                <span style="font-size:12px; color:${statusColor}">${item.status || ''}</span>
              </div>
              <div style="font-size:16px; color:#fff; font-family:monospace; margin-bottom:4px;">
                ${item.time}
              </div>
              <div style="font-size:12px; opacity:0.6;">
                ${item.remark || ''}
              </div>
            </div>
          `;
          });
          list.innerHTML = html;
        }
      })
      .getAttendanceReport(state.currentSales);
  };




  /**
   * 🔐 驗證全知視角密碼
   */
  window.verifyOmniPwd = function () {
    const pwdInput = document.getElementById('fw-omni-pwd');
    const pwd = pwdInput.value;
    // 🚀 預設管理員密碼：3220
    if (pwd === '3220') {
      document.getElementById('fw-omni-auth').style.display = 'none';
      document.getElementById('fw-omni-real-content').style.display = 'block';
      refreshOmniscientView();
    } else {
      showToast('🔐 密碼錯誤', 'error');
      pwdInput.value = '';
      pwdInput.focus();
    }
  };

  /**
   * 👁️ 刷新全知視角 (一次看三/多個業務日誌)
   */
  window.refreshOmniscientView = function (dateStr) {
    const container = document.getElementById('fw-omni-container');
    const dateInput = document.getElementById('fw-omni-date');

    const now = new Date();
    const yesterday = new Date(now.getTime() - 24 * 60 * 60 * 1000);
    const yStr = yesterday.getFullYear() + '-' + String(yesterday.getMonth() + 1).padStart(2, '0') + '-' + String(yesterday.getDate()).padStart(2, '0');
    const targetDate = dateStr || yStr;

    if (dateInput) dateInput.value = targetDate;

    showFwLoading(true, '正在啟動全知視角...');

    google.script.run
      .withFailureHandler(function (err) {
        showFwLoading(false);
        container.innerHTML = `<div style="text-align:center; color:#ff4d4d; padding:20px;">讀取逾時或連線中斷，請點擊日期重試</div>`;
      })
      .withSuccessHandler(function (res) {
        showFwLoading(false);
        if (res.success) {
          let html = '';
          res.results.forEach(user => {
            const isActive = user.logs && user.logs.length > 0;
            html += `
            <div class="fw-omni-user-card">
              <div class="fw-omni-user-header">
                <div class="fw-omni-user-name">
                  ${user.name}
                </div>
                <div class="fw-omni-user-status" style="background:${isActive ? 'rgba(74,222,128,0.1)' : 'rgba(255,255,255,0.05)'}; color:${isActive ? '#4ade80' : 'rgba(255,255,255,0.4)'}">
                  ${isActive ? '工作中' : '待機中'}
                </div>
              </div>

              <!-- 📊 數據面板 (3欄) -->
              <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px;">
                <div style="background:rgba(0,0,0,0.3); padding:12px 8px; border-radius:16px; text-align:center; border:1px solid rgba(255,255,255,0.05);">
                  <div style="font-size:10px; opacity:0.4; margin-bottom:4px; font-weight:700;">今日拜訪</div>
                  <div style="font-size:18px; font-weight:900; color:#fff;">${user.stats.visitCount}</div>
                </div>
                <div style="background:rgba(0,0,0,0.3); padding:12px 8px; border-radius:16px; text-align:center; border:1px solid rgba(255,255,255,0.05);">
                  <div style="font-size:10px; opacity:0.4; margin-bottom:4px; font-weight:700;">里程 (km)</div>
                  <div style="font-size:18px; font-weight:900; color:#fff;">${user.stats.distance}</div>
                </div>
                <div style="background:rgba(0,0,0,0.3); padding:12px 8px; border-radius:16px; text-align:center; border:1px solid rgba(255,255,255,0.05);">
                  <div style="font-size:10px; opacity:0.4; margin-bottom:4px; font-weight:700;">上班時間</div>
                  <div style="font-size:18px; font-weight:900; color:#4ade80;">${user.stats.checkin}</div>
                </div>
              </div>
              
              <div style="font-size:11px; font-weight:800; color:#facc15; margin-bottom:10px; opacity:0.8;">今日行程摘要</div>
              <div class="fw-omni-log-list">
                ${user.logs.length > 0 ? user.logs.map(log => `
                  <div class="fw-omni-log-item">
                    <div class="fw-omni-log-time">${log.time}</div>
                    <div class="fw-omni-log-content">
                      <div class="fw-omni-log-customer">${log.customer}</div>
                      <div class="fw-omni-log-summary">${log.summary}</div>
                      ${log.detail ? `<div style="font-size:11px; opacity:0.4; margin-top:4px; padding-top:4px; border-top:1px dashed rgba(255,255,255,0.05);">${log.detail.replace(/\n/g, '<br>')}</div>` : ''}
                    </div>
                  </div>
                `).join('') : '<div style="text-align:center; opacity:0.2; font-size:12px; padding:30px; border:1px dashed rgba(255,255,255,0.1); border-radius:16px;">今日尚無日誌</div>'}
              </div>

              <div style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.05); padding-top:20px;">
                <button class="btn-glass-sm" onclick="loadSalesHistory('${user.name}')">
                  📜 查看 <span>最近 5 日</span> 拜訪歷史
                </button>
              </div>
            </div>
          `;
          });
          container.innerHTML = html;
        } else {
          container.innerHTML = `<div style="text-align:center; color:#ff4d4d; padding:20px;">${res.msg}</div>`;
        }
      })
      .getOmniscientLogs(targetDate);
  };
</script>
